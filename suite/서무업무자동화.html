dge(id,val){\n  const t = tripDB.find(x=>x.id===id);\n  t.lodgeOverride = (val==='' || val==null) ? null : (parseFloat(val)||0);\n  saveTrips(); refreshCalcAndDocViews();\n}\nfunction updDocText(id, field, val){\n  const t = tripDB.find(x=>x.id===id);\n  t[field] = val;\n  saveTrips(); refreshCalcAndDocViews();\n}\nfunction resetDocOverrides(id){\n  const t = tripDB.find(x=>x.id===id);\n  t.dailyOverride=null; t.mealOverride=null; t.mealFeeOverride=null; t.transOverride=null; t.lodgeOverride=null;\n  saveTrips(); refreshCalcAndDocViews();\n  toast('기본값으로 되돌렸습니다.');\n}\nlet docSelectIds = null;   // Set of currently checked trip ids (persists across re-renders)\nlet knownTripIds = new Set();\nfunction syncDocSelectIds(){\n  const currentIds = new Set(tripDB.map(t=>t.id));\n  if(docSelectIds===null){\n    docSelectIds = new Set(currentIds);\n  }else{\n    Array.from(docSelectIds).forEach(id=>{ if(!currentIds.has(id)) docSelectIds.delete(id); });\n    currentIds.forEach(id=>{ if(!knownTripIds.has(id)) docSelectIds.add(id); }); // 새로 추가된 출장자는 기본 선택\n  }\n  knownTripIds = currentIds;\n}\nfunction toggleDocSelect(id, checked){\n  if(checked) docSelectIds.add(id); else docSelectIds.delete(id);\n  renderReceiptPreview();\n}\nfunction getSelectedDocIds(){ return tripDB.filter(t=>docSelectIds && docSelectIds.has(t.id)).map(t=>t.id); }\nfunction renderDocSelectList(){\n  const el = document.getElementById('docSelectList');\n  syncDocSelectIds();\n  if(tripDB.length===0){ el.innerHTML='\u003cdiv class=\"tag-empty\">먼저 \"② 출장 내역 입력\" 탭에서 출장자를 등록해주세요.\u003c/div>'; renderReceiptPreview(); return; }\n  el.innerHTML = tripDB.map(t=>{\n    const daily=calcDaily(t), meal=calcMealFee(t), trans=calcTransportFee(t), lodge=calcLodgeFee(t);\n    const total = daily+meal+trans+lodge;\n    const checked = docSelectIds.has(t.id);\n    return `\n    \u003cdiv class=\"doc-select-row\">\n      \u003cinput type=\"checkbox\" class=\"docChk\" value=\"${t.id}\" ${checked?'checked':''} onchange=\"toggleDocSelect('${t.id}', this.checked)\">\n      \u003cdiv style=\"flex:1;\">\u003cb>${t.name}\u003c/b> \u003cspan class=\"small\">(${t.position||'-'})\u003c/span> · ${t.dest||'-'} · ${fmtRange(t)}\u003c/div>\n      \u003cdiv style=\"font-weight:700;color:var(--accent);\">${fmt(total)}\u003c/div>\n    \u003c/div>`;\n  }).join('');\n  renderReceiptPreview();\n}\nconst KOR_NUM = ['','일','이','삼','사','오','육','칠','팔','구'];\nconst KOR_UNIT1 = ['','십','백','천'];\nconst KOR_UNIT2 = ['','만','억','조'];\nfunction numberToKorean(num){\n  num = Math.round(num);\n  if(num===0) return '영';\n  let result='', unitPos=0, n=num;\n  while(n>0){\n    const part = n % 10000;\n    if(part>0){\n      let partStr=''; let temp=part;\n      for(let i=0;i\u003c4;i++){\n        const digit = temp%10;\n        if(digit>0) partStr = (digit===1 && i>0 ? '' : KOR_NUM[digit]) + KOR_UNIT1[i] + partStr;\n        temp = Math.floor(temp/10);\n      }\n      result = partStr + KOR_UNIT2[unitPos] + result;\n    }\n    n = Math.floor(n/10000); unitPos++;\n  }\n  return result;\n}\nfunction dateKorParts(dtStr){\n  if(!dtStr) return {y:'',m:'',d:'',hm:''};\n  const d = new Date(dtStr);\n  return {y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(), hm:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};\n}\nfunction renderReceiptPreview(){\n  const holder = document.getElementById('previewHolder');\n  if(!holder) return;\n  const ids = getSelectedDocIds();\n  if(ids.length===0){ holder.innerHTML='\u003cdiv class=\"tag-empty\">위 목록에서 출장자를 선택하면 결의서 미리보기가 이곳에 표시됩니다.\u003c/div>'; return; }\n  holder.innerHTML = ids.map(id=>{\n    const t = tripDB.find(x=>x.id===id);\n    if(!t) return '';\n    const total = calcDaily(t)+calcMealFee(t)+calcTransportFee(t)+calcLodgeFee(t);\n    const open = expandedDocIds.has(id);\n    return `\u003cdiv class=\"preview-item\" data-id=\"${id}\">\n      \u003cdiv class=\"preview-item-head\">\n        \u003cdiv class=\"preview-item-info\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/>\u003cpath d=\"M14 2v6h6\"/>\u003c/svg>\u003cspan>\u003cb>${escapeXml(t.name)}\u003c/b> \u003cspan class=\"small\">(${escapeXml(t.position||'-')})\u003c/span> · ${escapeXml(t.dest||'-')} · \u003cb style=\"color:var(--accent-text);\">${fmt(total)}원\u003c/b>\u003c/span>\u003c/div>\n        \u003cdiv class=\"preview-item-actions\">\n          \u003cbutton class=\"btn ghost sm\" onclick=\"openPrintPreview('${id}')\">\u003csvg class=\"icon sm\" viewBox=\"0 0 24 24\">\u003cpolyline points=\"6 9 6 2 18 2 18 9\"/>\u003cpath d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"/>\u003crect x=\"6\" y=\"14\" width=\"12\" height=\"8\"/>\u003c/svg> PDF로 미리보기\u003c/button>\n          \u003cbutton class=\"btn outline sm\" onclick=\"toggleDocEdit('${id}')\">${open?'▲ 접기':'▼ 열기 (수정)'}\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      ${open ? `\u003cdiv class=\"preview-item-body\">\u003cdiv class=\"doc-page-scroll\">${buildReceiptDoc(t)}\u003c/div>\u003c/div>` : ''}\n    \u003c/div>`;\n  }).join('');\n}\n/* 실제 출력용 서식과 100% 동일한 모습으로 별도 창에 띄워 인쇄(PDF로 저장)할 수 있게 한다.\n   입력칸(input)은 현재 값 그대로 텍스트로 바꿔 넣어, 원본 한글 문서처럼 셀 크기·글자 배치가 그대로 보이게 한다. */\nconst PRINT_DOC_CSS = `\n  *{box-sizing:border-box;}\n  body{margin:0;background:#fff;}\n  .doc-page{background:#fff;width:210mm;height:297mm;margin:0 auto;padding:15mm 14mm;font-family:'Batang','바탕','HY신명조','Malgun Gothic',serif;display:flex;flex-direction:column;overflow:hidden;}\n  .doc-page:not(:last-child){page-break-after:always;}\n  .doc-title{flex:0 0 auto;text-align:center;font-size:22px;font-weight:700;letter-spacing:14px;margin:4px 0 18px;}\n  .hwpx-table{width:100%;height:100%;flex:1 1 auto;border-collapse:collapse;table-layout:fixed;font-size:11.5px;line-height:1.35;}\n  .hwpx-table td{border:1px solid #000;padding:3px 3px;text-align:center;vertical-align:middle;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}\n  .hwpx-table td.hx-left{text-align:left;}\n  .hwpx-table td.hx-amt{font-size:13px;font-weight:700;padding:6px 3px;}\n  .hx-purpose-print{white-space:pre-wrap;}\n  @page{size:A4;margin:0;}\n`;\nfunction openPrintPreview(id){\n  const t = tripDB.find(x=>x.id===id);\n  if(!t){ toast('출장자를 찾을 수 없습니다.'); return; }\n  const tmp = document.createElement('div');\n  tmp.innerHTML = buildReceiptDoc(t);\n  tmp.querySelectorAll('.hwpx-editnote').forEach(el=>el.remove());\n  tmp.querySelectorAll('textarea.hx-purpose').forEach(ta=>{\n    const span = document.createElement('span');\n    span.className = 'hx-purpose-print';\n    span.textContent = ta.value;\n    ta.replaceWith(span);\n  });\n  tmp.querySelectorAll('input').forEach(inp=>{\n    const span = document.createElement('span');\n    span.textContent = inp.value;\n    if(inp.type==='number') span.style.whiteSpace = 'nowrap';\n    if(inp.classList.contains('hx-left')) span.className = 'hx-left';\n    inp.replaceWith(span);\n  });\n  const w = window.open('', '_blank');\n  if(!w){ alert('팝업이 차단되었습니다. 브라우저의 팝업 차단을 해제한 뒤 다시 시도해주세요.'); return; }\n  w.document.open();\n  w.document.write(`\u003c!DOCTYPE html>\u003chtml>\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>${escapeXml(t.name)} 여비지출결의서\u003c/title>\u003cstyle>${PRINT_DOC_CSS}\u003c/style>\u003c/head>\u003cbody>${tmp.innerHTML}\u003cscript>window.onload=function(){setTimeout(function(){window.print();},350);};\u003c\\/script>\n\u003c/body>\u003c/html>`);\n  w.document.close();\n}\nfunction toggleDocEdit(id){\n  if(expandedDocIds.has(id)) expandedDocIds.delete(id); else expandedDocIds.add(id);\n  renderReceiptPreview();\n}\n/* 실제 출력용 .hwpx 서식(section0.xml)의 표 구조·문구를 그대로 옮긴 미리보기.\n   라벨/빈칸 등 고정 문구는 원본과 완전히 동일한 글자·공백으로 두고,\n   실제 .hwpx 생성 시 값이 채워지는 칸(buildFieldTransforms와 동일한 위치)만 입력칸으로 편집 가능하게 둔다. */\nconst HX_COLS_P1 = [11.06,3.69,3.69,3.69,5.53,4.66,11.06,11.33,11.33,5.57,5.57,5.57,12.43,4.85];\nconst HX_COLS_P2 = [10.00,5.34,5.34,5.34,5.34,3.56,3.56,3.56,5.23,5.23,5.23,5.23,5.23,5.23,8.86,4.43,4.43,8.86];\nfunction hxColgroup(cols){ return '\u003ccolgroup>'+cols.map(w=>`\u003ccol style=\"width:${w}%;\">`).join('')+'\u003c/colgroup>'; }\nfunction buildReceiptDoc(t){\n  const p = buildPersonDataForHwpx(t);\n  const id = t.id;\n  const esc = s => String(s==null?'':s).replace(/\"/g,'&quot;');\n  const transportLabel = p.transport==='자차' ? '자가용' : (p.transport==='공무용차량' ? '관용차량' : (p.transport||'-'));\n  const distLabel = p.transport==='자차' ? `왕복 ${p.distance}km` : '왕복';\n  const inp = (field, val, extra='', cls='') => `\u003cinput class=\"${cls}\" value=\"${esc(val)}\" onchange=\"updDocText('${id}','${field}',this.value)\" ${extra}>`;\n  /* 적요/용무 칸: 실제 .hwpx와 동일하게 25자 기준(어절 단위)으로 줄바꿈해서 보여준다.\n     \u003cinput>은 한 줄만 표시되므로 여러 줄짜리 \u003ctextarea>를 쓴다. */\n  const purposeInp = (field, val, extra='', cls='') => {\n    const lines = wrapTextByChars(val, HWPX_WRAP_FIELDS[44]);\n    const display = lines.map(l=>String(l==null?'':l).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;')).join('\\n');\n    return `\u003ctextarea class=\"hx-purpose ${cls}\" rows=\"${lines.length}\" onchange=\"updDocText('${id}','${field}',this.value.replace(/\\\\n/g,' ').replace(/\\\\s+/g,' ').trim())\" ${extra}>${display}\u003c/textarea>`;\n  };\n  // td helper: c=colspan, r=rowspan, cls=extra class, html=cell content\n  const td = (html, c, r, cls) => `\u003ctd${c>1?` colspan=\"${c}\"`:''}${r>1?` rowspan=\"${r}\"`:''}${cls?` class=\"${cls}\"`:''}>${html}\u003c/td>`;\n\n  /* ---------- 1쪽: 여비지출결의서 (14열 표, 원본 section0.xml 표1과 동일한 셀 구성) ---------- */\n  const nightsCell = p.nights>0 ? ` ${p.nights}야` : ' 야';\n  const lodgeAmtCell = p.nights>0 ? `${fmt(p.lodgeFee)}` : '       원';\n  const trainFareShown = p.transport==='기차' && p.trainFare>0;\n  const trainFareCell = trainFareShown ? `${p.trainFare.toLocaleString()}원` : '원';\n  const L = buildTravelLegTexts(p);\n  /* 숫자 덩어리는 쪼개지지 않게 묶고, 숫자와 단위(원/km) 사이에서만 줄이 바뀌게 한다. */\n  const fitHtml = s => !s ? '' : String(s).replace(/([0-9][0-9,.]*)/g,'\u003cspan style=\"white-space:nowrap\">$1\u003c/span>\u003cwbr>');\n\n  const page1Rows = [\n    `\u003ctr>${td('증제       호',6,1)}${td('',8,1)}\u003c/tr>`,\n    `\u003ctr>${td('계장',1,1)}${td('',3,1)}${td('분임재무관',2,1)}${td('',1,1)}${td('2026년도일반회계',2,1)}${td('취급자',3,1)}${td('지출원',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',3,1)}${td('',2,1)}${td('',1,1)}${td('세출과목',2,1)}${td('',3,1)}${td('',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('발    의',3,2)}${td('',2,2)}${td('인',1,2)}${td('조  직',1,1)}${td(' 문화유산과',2,1)}${td('발      의',2,2)}${td('',2,2)}${td('인',1,2)}\u003c/tr>`,\n    `\u003ctr>${td('정  책',1,2)}${td('전통문화 보존 및 전승',2,2)}\u003c/tr>`,\n    `\u003ctr>${td('원인행위부기재',3,2)}${td('',2,2)}${td('인',1,2)}${td('지출부기재',2,2)}${td('',2,2)}${td('인',1,2)}\u003c/tr>`,\n    `\u003ctr>${td('단  위',1,1)}${td('문화유산 보존 및 전승',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('',3,2)}${td('',2,2)}${td('',1,2)}${td('세  부',1,1)}${td('국가유산 운영',2,1)}${td('지급명령발령부기재',2,2)}${td('',2,2)}${td('인',1,2)}\u003c/tr>`,\n    `\u003ctr>${td('편성목',1,2)}${td(' 여비',2,2)}\u003c/tr>`,\n    `\u003ctr>${td('',3,2)}${td('',2,2)}${td('',1,2)}${td('지급명령번    호',2,2)}${td('제          호',3,2)}\u003c/tr>`,\n    `\u003ctr>${td('통계목',1,1)}${td(' 국내여비',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('개산급에대한정산',3,1)}${td(' 개산액',3,1)}${td('         년     월     일     ',3,1)}${td('정  산  액',2,1)}${td('    ',3,1)}\u003c/tr>`,\n    `\u003ctr>${td(`금${p.total.toLocaleString()}원(금${numberToKorean(p.total)}원)`,14,1,'hx-amt')}\u003c/tr>`,\n    `\u003ctr>${td('적    요',2,1)}${td(purposeInp('purpose',p.purpose),7,1)}${td('거래은행\\n계좌번호',2,1)}${td(inp('bankName',p.bankName,'style=\"width:46%;display:inline-block;\"')+inp('account',p.account,'style=\"width:54%;display:inline-block;\"'),3,1)}\u003c/tr>`,\n    `\u003ctr>${td('출장자',2,1)}${td(` 근무처   ${escapeXml(p.deptFull)} 직  급   ${escapeXml(p.position)} 성  명   ${escapeXml(spacedName(p.name))}    (인)`,12,1)}\u003c/tr>`,\n    `\u003ctr>${td('영수',2,1)}${td(` 위 금액을 영수함.                                                    ${p.endY}년   ${p.endM}월     일 성  명   김 욱 현    (인)`,12,1)}\u003c/tr>`,\n    `\u003ctr>${td('용무',2,1)}${td(purposeInp('purpose',p.purpose),6,1)}${td('출장지',2,1)}${td(inp('dest',p.dest),4,1)}\u003c/tr>`,\n    `\u003ctr>${td('주관과',2,1)}${td('',12,2)}\u003c/tr>`,\n    `\u003ctr>${td('취급자인',2,1)}\u003c/tr>`\n  ].join('');\n\n  /* ---------- 2쪽: 여행명세서 + 여비명세서 + 출장명령부 (18열 표, 원본 표2와 동일한 셀 구성) ---------- */\n  const page2Rows = [\n    `\u003ctr>${td('월 일',1,2)}${td('출발지',2,2)}${td('경유지',2,2)}${td('도착지',3,2)}${td('거 리 와 요 금',6,1)}${td('일수',1,2)}${td('야수',2,2)}${td('비 고',1,2)}\u003c/tr>`,\n    `\u003ctr>${td('종 별',2,1)}${td('거 리',2,1)}${td('요 금',2,1)}\u003c/tr>`,\n    `\u003ctr>${td(`${p.startM}.${p.startD}`,1,1)}${td('익산',2,1)}${td('',2,1)}${td(escapeXml(p.dest),3,1)}${td('',2,1)}${td(fitHtml(L.dist1),2,1)}${td(fitHtml(L.fee1),2,1)}${td('',1,1)}${td('',2,1)}${td(fitHtml(L.toll1),1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td(escapeXml(p.dest),2,1)}${td('',2,1)}${td('익산',3,1)}${td('',2,1)}${td(fitHtml(L.dist2),2,1)}${td(fitHtml(L.fee2),2,1)}${td('',1,1)}${td('',2,1)}${td(fitHtml(L.toll2),1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td('',2,1)}${td('',2,1)}${td('',1,1)}${td('',2,1)}${td('',1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td('',2,1)}${td('',2,1)}${td('',1,1)}${td('',2,1)}${td('',1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td('',2,1)}${td('',2,1)}${td('',1,1)}${td('',2,1)}${td('',1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td('',2,1)}${td('',2,1)}${td('',1,1)}${td('',2,1)}${td('',1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td('',2,1)}${td('',2,1)}${td('',1,1)}${td('',2,1)}${td('',1,1)}\u003c/tr>`,\n    `\u003ctr>${td('',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td('',2,1)}${td('',2,1)}${td('',1,1)}${td('',2,1)}${td('',1,1)}\u003c/tr>`,\n    `\u003ctr>${td('계',1,1)}${td('',2,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}${td(fitHtml(L.distTotal),2,1)}${td(fitHtml(L.feeTotal),2,1)}${td('',1,1)}${td('',2,1)}${td(fitHtml(L.tollTotal),1,1)}\u003c/tr>`,\n    `\u003ctr>${td('여   비   명   세   서',18,1)}\u003c/tr>`,\n    `\u003ctr>${td('종      별',2,1)}${td('',2,1)}${td('',3,1)}${td('원',4,1)}${td('참가비',2,1)}${td('',3,1)}${td('원',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('철  도  임',2,1)}${td('등실비',2,1)}${td(' 회',3,1)}${td(trainFareCell,4,1)}${td('등실비',2,1)}${td('',3,1)}${td('  ',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('선      임',2,1)}${td('등실비',2,1)}${td('',3,1)}${td('         원',4,1)}${td('등실비',2,1)}${td('',3,1)}${td('  ',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('차  마  임',2,1)}${td(escapeXml(transportLabel),2,1)}${td(escapeXml(distLabel),3,1)}${td(trainFareShown ? '         원' : (`\u003cinput type=\"number\" style=\"width:${String(Math.round(p.transportFee)).length+3}ch;max-width:80%;display:inline-block;\" value=\"${Math.round(p.transportFee)}\" onchange=\"overrideTrans('${id}',this.value)\">\u003cwbr>원`),4,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('식      비',2,1)}${td(`\u003cselect style=\"display:inline-block;width:auto;\" onchange=\"overrideMeal('${id}',this.value)\">${[1,2,3].map(n=>`\u003coption value=\"${n}\"${p.mealCount===n?' selected':''}>${n}끼\u003c/option>`).join('')}\u003c/select>`,2,1)}${td(`\u003cinput type=\"number\" style=\"width:60%;display:inline-block;\" value=\"${p.mealFee}\" onchange=\"overrideMealFee('${id}',this.value)\">원`,3,1)}${td(`\u003cinput type=\"number\" style=\"width:60%;display:inline-block;\" value=\"${p.mealFee}\" onchange=\"overrideMealFee('${id}',this.value)\">원`,4,1)}${td('',2,1)}${td('1일당   ',3,1)}${td('25,000원 한도',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('숙  박  료',2,1)}${td(nightsCell,2,1)}${td('1야당원',3,1)}${td(p.nights>0?`\u003cinput type=\"number\" style=\"width:60%;display:inline-block;\" value=\"${Math.round(p.lodgeFee)}\" onchange=\"overrideLodge('${id}',this.value)\">원`:lodgeAmtCell,4,1)}${td('야',2,1)}${td('1야당   ',3,1)}${td('  ',2,1)}\u003c/tr>`,\n    `\u003ctr>${td(`일      비${p.isHalf?'(1/2)':''}`,2,1)}${td('1일',2,1)}${td(`\u003cinput type=\"number\" style=\"width:60%;display:inline-block;\" value=\"${p.dailyFee}\" onchange=\"overrideDaily('${id}',this.value)\">원`,3,1)}${td(`\u003cinput type=\"number\" style=\"width:60%;display:inline-block;\" value=\"${p.dailyFee}\" onchange=\"overrideDaily('${id}',this.value)\">원`,4,1)}${td('',2,1)}${td('1일당 ',3,1)}${td('',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('이  전  료',2,1)}${td('  ',2,1)}${td('부임수당',3,1)}${td('  ',4,1)}${td('',2,1)}${td('가족이전표',3,1)}${td('  ',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('합         계',4,1)}${td('',3,1)}${td(`${p.total.toLocaleString()}원`,4,1)}${td('',2,1)}${td('',3,1)}${td('',2,1)}\u003c/tr>`,\n    `\u003ctr>${td('출장명령부대  조  필',2,1)}${td('김 욱 현 (인)',4,1)}${td('청구금액 외에는 포기함',3,1)}${td(`${escapeXml(spacedName(p.name))}  (인)`,4,1)}${td('비 고',3,1)}${td('',2,1)}\u003c/tr>`\n  ].join('');\n\n  return `\n  \u003cdiv class=\"doc-page\">\n    \u003cdiv class=\"doc-title\">여 비 지 출 결 의 서\u003c/div>\n    \u003ctable class=\"hwpx-table\">${hxColgroup(HX_COLS_P1)}${page1Rows}\u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"doc-page\">\n    \u003cdiv class=\"doc-title\" style=\"font-size:17px;letter-spacing:10px;\">여 행 명 세 서\u003c/div>\n    \u003ctable class=\"hwpx-table\">${hxColgroup(HX_COLS_P2)}${page2Rows}\u003c/table>\n    \u003cdiv class=\"hwpx-editnote\">\n      \u003cbutton class=\"btn ghost sm\" onclick=\"overrideTrans('${id}','')\">교통비 되돌리기\u003c/button>\n      \u003cbutton class=\"btn ghost sm\" onclick=\"overrideDaily('${id}','')\">일비 되돌리기\u003c/button>\n      \u003cbutton class=\"btn ghost sm\" onclick=\"overrideMeal('${id}','')\">식비 되돌리기\u003c/button>\n      \u003cbutton class=\"btn ghost sm\" onclick=\"overrideLodge('${id}','')\">숙박비 되돌리기\u003c/button>\n      \u003cbutton class=\"btn ghost sm\" onclick=\"resetDocOverrides('${id}')\">전체 계산값으로 되돌리기\u003c/button>\n    \u003c/div>\n  \u003c/div>`;\n}\n\n/* ============================================================\n   HWPX 원본 서식 기반 여비지출결의서 생성\n   (서식/표/문구는 절대 변경하지 않고, 지정된 값만 교체)\n============================================================ */\nlet hwpxTemplateBuf = null;   // 현재 사용중인 템플릿의 원본 zip ArrayBuffer\nlet hwpxTemplateName = '기본 내장 서식(사리장엄관 정책세미나 결의서)';\n\nfunction base64ToArrayBuffer(b64){\n  const bin = atob(b64);\n  const bytes = new Uint8Array(bin.length);\n  for(let i=0;i\u003cbin.length;i++) bytes[i] = bin.charCodeAt(i);\n  return bytes.buffer;\n}\nfunction escapeXml(s){\n  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n}\nfunction spacedName(name){\n  return String(name||'').split('').join(' ');\n}\n/* 적요/용무(목적) 칸의 줄바꿈 기준: 25글자를 넘어가면 다음 줄로 넘긴다.\n   (전각/반각 폭 계산이 아니라 순수 글자 수 기준 — 요청받은 규칙 그대로.)\n   가능하면 단어(공백) 경계에서 끊고, 공백 없이 25자를 넘는 구간은 그\n   지점에서 강제로 끊는다. */\nfunction wrapTextByChars(text, maxChars){\n  const str = String(text==null?'':text);\n  if(!maxChars || str.length\u003c=maxChars) return [str];\n  // 어절(공백 기준) 단위로 그리디하게 채워나가다가, 다음 어절을 더하면\n  // maxChars를 넘는 시점에 줄을 끊는다. (기존 글자 단위 스캔 방식은 초과\n  // 시점을 감지했을 때 이미 가장 가까운 공백을 지나친 뒤라 한 어절 앞에서\n  // 끊기는 버그가 있었음)\n  const words = str.split(' ').filter(w=>w!=='');\n  const lines = [];\n  let current = '';\n  const pushForced = (word)=>{\n    // 공백 없이 단어 하나가 maxChars보다 긴 경우, 글자 수 기준으로 강제 절단\n    let w = word;\n    while(w.length > maxChars){\n      lines.push(w.slice(0, maxChars));\n      w = w.slice(maxChars);\n    }\n    return w;\n  };\n  words.forEach(word=>{\n    const candidate = current==='' ? word : current+' '+word;\n    if(candidate.length \u003c= maxChars){\n      current = candidate;\n    } else {\n      if(current!=='') lines.push(current);\n      current = word.length \u003c= maxChars ? word : pushForced(word);\n    }\n  });\n  lines.push(current);\n  return lines;\n}\nfunction wrapTextToHwpxRuns(text, maxChars){\n  const lines = wrapTextByChars(text, maxChars);\n  const xml = lines\n    .map(line=>`\u003chp:t>${escapeXml(line)}\u003c/hp:t>`)\n    .join('\u003chp:lineBreak/>');\n  return { xml, lineCount: lines.length };\n}\n/* 25글자를 초과하면 다음 줄로 넘기는 규칙을 적용할 칸 (44=적요 칸, 58=용무/목적 칸) */\nconst HWPX_WRAP_FIELDS = { 44: 25, 58: 25 };\n/* 위 두 칸은 각각 아래 cellAddr로 서식 안에서 유일하게 식별된다.\n   \u003chp:lineBreak/>만 넣는다고 화면에 자동으로 2줄로 보이지는 않는다 — 한글은\n   문단을 열 때 \u003chp:linesegarray>(각 줄의 계산된 위치 캐시)를 그대로 신뢰해서\n   그리기 때문에, 텍스트만 2줄이 되고 캐시가 1줄 그대로면 셀 안을 직접\n   클릭/편집하기 전까지는 1줄처럼 보인다.\n   처음엔 이 캐시 값을 우리가 직접 계산해서 채워봤지만, 그 좌표는 한글의\n   실제 폰트 렌더링 엔진이 계산하는 값과 정확히 같다는 보장이 없어 자칫\n   겹쳐 보이는 등 오히려 이상하게 나올 수 있다. 그래서 대신, 줄 수가\n   늘어난 칸에서는 이 캐시를 통째로 지운다 — 한글은 캐시가 없으면 파일을\n   열 때 스스로 다시 계산해서 그리므로(셀 안을 클릭했을 때 일어나는\n   재계산이 열자마자 자동으로 일어나는 것과 같다), 좌표를 추측할 필요가\n   없다. 셀 크기/표 구조는 전혀 건드리지 않는다. */\nconst HWPX_WRAP_CELL_ANCHORS = {\n  44: '\u003chp:cellAddr colAddr=\"2\" rowAddr=\"13\"/>',\n  58: '\u003chp:cellAddr colAddr=\"2\" rowAddr=\"16\"/>'\n};\nfunction syncPurposeCellLayout(xml, anchor, lineCount){\n  if(!anchor || !lineCount || lineCount\u003c=1) return xml; // 1줄이면 원본 그대로 둔다\n  const anchorPos = xml.indexOf(anchor);\n  if(anchorPos===-1) return xml;\n  const tcStart = xml.lastIndexOf('\u003chp:tc ', anchorPos);\n  const tcEnd = xml.indexOf('\u003c/hp:tc>', anchorPos);\n  if(tcStart===-1 || tcEnd===-1) return xml;\n  let tc = xml.slice(tcStart, tcEnd);\n  // 좌표를 직접 계산해서 채우지 않고, 캐시 자체를 통째로 지워 한글이 다시 계산하게 한다.\n  tc = tc.replace(/\u003chp:linesegarray>[\\s\\S]*?\u003c\\/hp:linesegarray>/, '');\n  return xml.slice(0,tcStart) + tc + xml.slice(tcEnd);\n}\n/* ============================================================\n   여행명세서 거리·요금 표기 + 칸 폭 기준 자동 줄바꿈\n   - 글자 크기/자간은 건드리지 않는다(축소 없음). 칸에 안 들어가면 줄을 바꾼다.\n   - 줄이 2줄 이상이 된 칸은 적요/용무 칸과 같은 방식으로 줄 배치 캐시(linesegarray)를\n     지워서, 한글이 파일을 열 때 직접 다시 계산해 그리게 한다.\n============================================================ */\nconst HWPX_CELL_PAD_HU = 282;   // 서식 셀의 좌우 여백 합(141+141)\nconst HWPX_BODY_PT = 11;        // 서식 본문 글자 크기(pt)\nfunction hwpxCharWidthEm(ch){\n  if(/[0-9]/.test(ch)) return 0.55;\n  if(ch===','||ch==='.') return 0.3;\n  if(ch===' ') return 0.35;\n  if(/[A-Za-z]/.test(ch)) return /[mMWw]/.test(ch) ? 0.9 : 0.6;\n  return 1.0;                   // 한글 등 전각 글자(원, 왕복 …)\n}\nfunction hwpxTextWidthPt(str, pt){\n  let w = 0;\n  for(const ch of String(str)) w += (hwpxCharWidthEm(ch) - 0.02) * pt;   // 서식 자간 -2% 반영\n  return w;\n}\n/* 칸 안쪽 폭(availPt)에 맞게 줄을 나눈다. 가능하면 숫자 덩어리(\"30,780\")는 쪼개지 않고,\n   숫자와 단위(\"원\",\"km\") 사이/공백에서만 끊는다. */\nfunction wrapTextByWidth(text, availPt, pt){\n  pt = pt || HWPX_BODY_PT;\n  const str = String(text==null?'':text);\n  if(hwpxTextWidthPt(str, pt) \u003c= availPt) return [str];\n  const segs = str.match(/[0-9][0-9,.]*|\\s+|[^0-9\\s]+/g) || [str];\n  const lines = [];\n  let cur = '';\n  const push = ()=>{ if(cur.trim()!=='') lines.push(cur.replace(/\\s+$/,'')); cur=''; };\n  segs.forEach(seg=>{\n    if(/^\\s+$/.test(seg)){ if(cur!=='') cur += seg; return; }\n    if(hwpxTextWidthPt(cur+seg, pt) \u003c= availPt){ cur += seg; return; }\n    push();\n    if(hwpxTextWidthPt(seg, pt) \u003c= availPt){ cur = seg; return; }\n    for(const ch of seg){                       // 덩어리 하나가 칸보다 넓은 극단적인 경우만 글자 단위로 끊는다\n      if(cur!=='' && hwpxTextWidthPt(cur+ch, pt) > availPt) push();\n      cur += ch;\n    }\n  });\n  push();\n  return lines.length ? lines : [str];\n}\n/* 여행명세서 구간별 거리·요금 문구.  왕복 총액을 가는 편/오는 편으로 나누고, 합계는 \"계\" 줄에 넣는다.\n   차량(자차·공무용차량)의 거리와, 차량 요금(철도 요금은 철도임 칸에 따로 표기하므로 제외)만 대상. */\nfunction buildTravelLegTexts(p){\n  const out = { dist1:'', dist2:'', fee1:'', fee2:'', distTotal:'', feeTotal:'', toll1:'', toll2:'', tollTotal:'' };\n  const r1 = n => Math.round(n*10)/10;\n  const kmText = n => Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1})+'km';\n  const wonText = n => Math.round(n).toLocaleString('ko-KR')+'원';\n  const isCar = p.transport==='자차' || p.transport==='공무용차량';\n  const dist = isCar ? (Number(p.distance)||0) : 0;\n  const fee = Math.round(Number(p.transportFee)||0);   // 자차·관용차량 요금 또는 기차 요금(총액)\n  if(dist>0){\n    const d1 = r1(dist/2), d2 = r1(dist-d1);\n    out.dist1 = kmText(d1); out.dist2 = kmText(d2); out.distTotal = kmText(dist);\n  }\n  if(fee>0){\n    let f1 = Math.round(fee/2), f2 = fee-f1;\n    // 기차 편도 요금을 따로 입력한 경우: 가는 편/오는 편 실제 요금을 그대로 쓴다(합계가 맞을 때만).\n    if(p.transport==='기차' && p.trainLegs && Math.round(p.trainLegs.go+p.trainLegs.ret)===fee){\n      f1 = Math.round(p.trainLegs.go); f2 = Math.round(p.trainLegs.ret);\n    }\n    out.fee1 = f1>0 ? wonText(f1) : ''; out.fee2 = f2>0 ? wonText(f2) : ''; out.feeTotal = wonText(fee);\n  }\n  const toll = Math.round(Number(p.toll)||0);   // 비고란: 통행료가 있을 때만 \"통행료 n원\"\n  if(toll>0){\n    const t1 = Math.round(toll/2), t2 = toll-t1;\n    out.toll1 = '통행료 '+wonText(t1); out.toll2 = '통행료 '+wonText(t2); out.tollTotal = '통행료 '+wonText(toll);\n  }\n  return out;\n}\nfunction locateHwpxCell(xml, base, col, row){\n  const anchor = `\u003chp:cellAddr colAddr=\"${col}\" rowAddr=\"${row}\"/>`;\n  const aPos = xml.indexOf(anchor, base);\n  if(aPos===-1) return null;\n  const tcStart = xml.lastIndexOf('\u003chp:tc ', aPos);\n  const tcEnd = xml.indexOf('\u003c/hp:tc>', aPos);\n  if(tcStart===-1 || tcEnd===-1) return null;\n  const tc = xml.slice(tcStart, tcEnd);\n  const w = tc.match(/\u003chp:cellSz width=\"(\\d+)\"/);\n  const availPt = w ? (parseInt(w[1],10) - HWPX_CELL_PAD_HU)/100 : 50;\n  return { tcStart, tcEnd, tc, availPt };\n}\nfunction hwpxRunsFromLines(lines){\n  return lines.map(l=>`\u003chp:t>${escapeXml(l)}\u003c/hp:t>`).join('\u003chp:lineBreak/>');\n}\nfunction dropLineSegCache(tc){\n  return tc.replace(/\u003chp:linesegarray>[\\s\\S]*?\u003c\\/hp:linesegarray>/, '');\n}\n/* 비어 있는 칸(빈 런)에 글자를 채운다. 칸 폭을 넘으면 줄을 바꾼다. */\nfunction fillEmptyHwpxCell(xml, base, col, row, text, pt){\n  if(!text) return xml;\n  const c = locateHwpxCell(xml, base, col, row);\n  if(!c) return xml;\n  const m = c.tc.match(/\u003chp:run charPrIDRef=\"(\\d+)\"\\/>/);\n  if(!m) return xml;                       // 이미 내용이 있는 칸은 건드리지 않는다\n  const lines = wrapTextByWidth(text, c.availPt, pt);\n  let tc = c.tc.replace(m[0], `\u003chp:run charPrIDRef=\"${m[1]}\">${hwpxRunsFromLines(lines)}\u003c/hp:run>`);\n  if(lines.length>1) tc = dropLineSegCache(tc);\n  return xml.slice(0,c.tcStart) + tc + xml.slice(c.tcEnd);\n}\n/* 이미 글자가 들어 있는 칸(예: 차마임 금액)을 칸 폭에 맞게 다시 나눈다. 글자 크기는 그대로. */\nfunction refitHwpxCell(xml, base, col, row){\n  const c = locateHwpxCell(xml, base, col, row);\n  if(!c) return xml;\n  const ts = c.tc.match(/\u003chp:t>[\\s\\S]*?\u003c\\/hp:t>/g);\n  if(!ts || ts.length!==1) return xml;\n  const inner = ts[0].replace(/^\u003chp:t>|\u003c\\/hp:t>$/g,'');\n  const plain = inner.replace(/&lt;/g,'\u003c').replace(/&gt;/g,'>').replace(/&amp;/g,'&');\n  const lines = wrapTextByWidth(plain, c.availPt);\n  if(lines.length\u003c=1) return xml;\n  let tc = c.tc.replace(ts[0], hwpxRunsFromLines(lines));\n  tc = dropLineSegCache(tc);\n  return xml.slice(0,c.tcStart) + tc + xml.slice(c.tcEnd);\n}\nfunction fillTravelStatementCells(blockXml, p){\n  const base = blockXml.indexOf('\u003chp:t>월 일\u003c/hp:t>');   // 2쪽(여행명세서) 표의 시작\n  if(base===-1) return blockXml;\n  let out = blockXml;\n  const L = buildTravelLegTexts(p);\n  // 출발지(열 1)·도착지(열 5)가 길면 칸 폭에 맞게 줄바꿈 (글자 크기는 그대로)\n  [[1,2],[5,2],[1,3],[5,3]].forEach(([c,r])=>{ out = refitHwpxCell(out, base, c, r); });\n  // 여행명세서: 2행=가는 편, 3행=오는 편, 10행=\"계\" / 열 10=거리, 열 12=요금\n  out = fillEmptyHwpxCell(out, base, 10, 2, L.dist1);\n  out = fillEmptyHwpxCell(out, base, 12, 2, L.fee1);\n  out = fillEmptyHwpxCell(out, base, 10, 3, L.dist2);\n  out = fillEmptyHwpxCell(out, base, 12, 3, L.fee2);\n  out = fillEmptyHwpxCell(out, base, 10, 10, L.distTotal);\n  out = fillEmptyHwpxCell(out, base, 12, 10, L.feeTotal);\n  // 비고(열 17): 통행료가 있으면 기재. 비고 칸 글자는 9pt이고 폭이 좁아 칸에 맞게 줄이 바뀐다.\n  out = fillEmptyHwpxCell(out, base, 17, 2, L.toll1, 9);\n  out = fillEmptyHwpxCell(out, base, 17, 3, L.toll2, 9);\n  out = fillEmptyHwpxCell(out, base, 17, 10, L.tollTotal, 9);\n  // 여비명세서 차마임 금액 칸(열 7, 행 15): 길어지면 칸 안에서 줄바꿈\n  const trainFareShown = p.transport==='기차' && p.trainFare>0;\n  if(!trainFareShown) out = refitHwpxCell(out, base, 7, 15);\n  return out;\n}\nfunction initHwpxTemplate(){\n  try{\n    hwpxTemplateBuf = base64ToArrayBuffer(DEFAULT_HWPX_B64);\n    updateTplStatus(true);\n  }catch(err){\n    console.error('기본 서식 로드 실패', err);\n    updateTplStatus(false);\n  }\n}\nfunction updateTplStatus(ok){\n  const el = document.getElementById('tplStatus');\n  el.className = 'tpl-status' + (ok?' ok':'');\n  const iconOk = '\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"/>\u003cpolyline points=\"22 4 12 14.01 9 11.01\"/>\u003c/svg>';\n  const iconWarn = '\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/>\u003cline x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/>\u003cline x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/>\u003c/svg>';\n  el.innerHTML = (ok?iconOk:iconWarn) + '현재 서식: \u003cspan class=\"name\">'+hwpxTemplateName+'\u003c/span>';\n}\nfunction resetHwpxTemplate(){\n  hwpxTemplateName = '기본 내장 서식(사리장엄관 정책세미나 결의서)';\n  initHwpxTemplate();\n  toast('기본 서식으로 되돌렸습니다.');\n}\nasync function loadHwpxTemplateFile(file){\n  if(!file || !file.name.toLowerCase().endsWith('.hwpx')){\n    alert('.hwpx 파일만 서식으로 사용할 수 있습니다.'); return;\n  }\n  const buf = await file.arrayBuffer();\n  // 유효성 확인: 정상적인 hwpx(zip) 구조인지, section0.xml이 있는지 확인\n  try{\n    const zip = await JSZip.loadAsync(buf);\n    if(!zip.file('Contents/section0.xml')) throw new Error('section0.xml 없음');\n    hwpxTemplateBuf = buf;\n    hwpxTemplateName = file.name;\n    updateTplStatus(true);\n    toast('새 결의서 서식을 적용했습니다: '+file.name);\n  }catch(err){\n    alert('올바른 결의서(.hwpx) 파일이 아닌 것 같습니다.');\n    console.error(err);\n  }\n}\nfunction handleHwpxFileInput(ev){\n  const f = ev.target.files[0];\n  if(f) loadHwpxTemplateFile(f);\n  ev.target.value='';\n}\n\n/* section0.xml 내 \u003chp:t>...\u003c/hp:t> 순서를 기준으로, 지정된 인덱스만 값 교체.\n   그 외 모든 라벨/서식/표 구조 텍스트는 원본 그대로 유지한다. */\nfunction buildFieldTransforms(p){\n  const t = {};\n  t[42] = ()=> `금${p.total.toLocaleString()}원(금${numberToKorean(p.total)}원)`;\n  t[44] = ()=> p.purpose; // 줄바꿈 처리는 fillHwpxBlock에서 HWPX_WRAP_FIELDS 기준으로 적용\n  t[47] = ()=> escapeXml(p.bankName);\n  t[48] = ()=> escapeXml(p.account);\n  t[50] = ()=> ` 근무처   ${escapeXml(p.deptFull)}`;\n  t[51] = ()=> ` 직  급   ${escapeXml(p.position)}`;\n  t[52] = ()=> ` 성  명   ${escapeXml(spacedName(p.name))}    (인)`;\n  t[55] = ()=> `                                                    ${p.endY}년   ${p.endM}월     일`;\n  t[58] = ()=> p.purpose; // 줄바꿈 처리는 fillHwpxBlock에서 HWPX_WRAP_FIELDS 기준으로 적용\n  t[60] = ()=> escapeXml(p.dest);\n  t[78] = ()=> `${p.startM}.${p.startD}`;\n  t[80] = ()=> escapeXml(p.dest);\n  t[81] = ()=> escapeXml(p.dest);\n  // 철도임(t[92])에 요금이 표기되는 경우, 차마임(t[103])에는 같은 금액을 중복 표기하지 않는다.\n  // (선임에 요금이 표기되는 경우도 동일 규칙이나, 현재 서식에는 선임 요금 입력 항목이 없다.)\n  const trainFareShown = p.transport==='기차' && p.trainFare>0;\n  if(trainFareShown){\n    t[92] = ()=> `${p.trainFare.toLocaleString()}원`;\n  }\n  t[101] = ()=> p.transport==='자차' ? '자가용' : (p.transport==='공무용차량' ? '관용차량' : '-');\n  t[102] = ()=> p.transport==='자차' ? `왕복 ${p.distance}km` : '왕복';\n  if(!trainFareShown){\n    t[103] = ()=> `${Math.round(p.transportFee).toLocaleString()}원`;   // 오른쪽 정렬 칸이므로 앞 공백을 두지 않는다(공백이 칸 폭을 잡아먹어 줄바꿈이 어긋났음)\n  }\n  t[106] = ()=> `${p.mealFee.toLocaleString()}원`;\n  t[107] = ()=> `${p.mealFee.toLocaleString()}원`;\n  if(p.nights>0){\n    t[112] = ()=> ` ${p.nights}야`;\n    t[114] = ()=> `${p.lodgeFee.toLocaleString()}원`;\n  }\n  t[120] = ()=> p.isHalf ? '(1/2)' : '';\n  t[122] = ()=> `${p.dailyFee.toLocaleString()}원`;\n  t[123] = ()=> `${p.dailyFee.toLocaleString()}원`;\n  t[132] = ()=> `${p.total.toLocaleString()}원`;\n  t[138] = ()=> `${escapeXml(spacedName(p.name))}  (인)`;\n  return t;\n}\nfunction fillRemarkCells(blockXml, p){\n  // 여행명세서 \"비고\" 칸(왕복 각 구간)은 원본 서식에 빈 런(\u003chp:run charPrIDRef=\"29\"/>)으로 되어 있어\n  // \u003chp:t> 인덱스 방식으로는 채울 수 없다. 관용차량 이용 시에만 \"관용차량\"이라고 표기한다.\n  if(p.transport!=='공무용차량') return blockXml;\n  const pat = '\u003chp:run charPrIDRef=\"29\"/>';\n  const filled = `\u003chp:run charPrIDRef=\"29\">\u003chp:t>관용차량\u003c/hp:t>\u003c/hp:run>`;\n  return blockXml.split(pat).join(filled);\n}\nfunction fillHwpxBlock(blockXml, p){\n  const transforms = buildFieldTransforms(p);\n  let i = -1;\n  const wrapLineCounts = {};\n  let out = blockXml.replace(/\u003chp:t>([\\s\\S]*?)\u003c\\/hp:t>/g, (match, inner)=>{\n    i++;\n    if(!transforms[i]) return match;\n    const val = transforms[i]();\n    const maxChars = HWPX_WRAP_FIELDS[i];\n    if(maxChars){\n      const { xml, lineCount } = wrapTextToHwpxRuns(val, maxChars);\n      wrapLineCounts[i] = lineCount;\n      return xml;\n    }\n    return `\u003chp:t>${val}\u003c/hp:t>`;\n  });\n  Object.keys(wrapLineCounts).forEach(idx=>{\n    // 2줄 이상으로 늘어난 경우에만, 그 칸의 캐시된 줄 배치 정보를 맞춰준다.\n    out = syncPurposeCellLayout(out, HWPX_WRAP_CELL_ANCHORS[idx], wrapLineCounts[idx]);\n  });\n  out = fillRemarkCells(out, p);\n  out = fillTravelStatementCells(out, p);   // 여행명세서 거리·요금 + 차마임 칸 줄바꿈\n  return out;\n}\nfunction buildFilledSectionXml(masterXml, people){\n  const marker = '\u003chp:p id=\"0\" paraPrIDRef=\"15\" styleIDRef=\"14\" pageBreak=\"0\" columnBreak=\"0\" merged=\"0\">';\n  const idxs = [];\n  let pos = 0;\n  while(true){\n    const i = masterXml.indexOf(marker, pos);\n    if(i===-1) break;\n    idxs.push(i); pos = i+marker.length;\n  }\n  if(idxs.length===0) throw new Error('서식에서 결의서 블록을 찾을 수 없습니다.');\n  const tailMarker = '\u003c/hs:sec>';\n  const fileEndsWithTail = masterXml.endsWith(tailMarker);\n  const contentEnd = fileEndsWithTail ? masterXml.length - tailMarker.length : masterXml.length;\n  const headTemplate = idxs.length>1 ? masterXml.slice(0, idxs[1]) : masterXml.slice(0, contentEnd);\n  const unitTemplate = idxs.length>1\n    ? masterXml.slice(idxs[1], idxs.length>2 ? idxs[2] : contentEnd)\n    : headTemplate;\n  let out = '';\n  people.forEach((p,i)=>{\n    const tmpl = i===0 ? headTemplate : unitTemplate;\n    out += fillHwpxBlock(tmpl, p);\n  });\n  out += tailMarker;\n  return out;\n}\nfunction buildPersonDataForHwpx(t){\n  const daily=calcDaily(t), meal=calcMealFee(t), trans=calcTransportFee(t), lodge=calcLodgeFee(t);\n  const total = daily+meal+trans+lodge;\n  const s = dateKorParts(t.start), e = dateKorParts(t.end);\n  const staffInfo = staffDB.find(x=>x.name===t.name) || {};\n  return {\n    name: t.name, position: t.position||'', deptFull: '문화교육국 '+(t.dept||'문화유산과'),\n    dest: t.dest||'', purpose: t.purpose||'',\n    bankName: staffInfo.bankName||'', account: staffInfo.account||'',\n    startY: s.y, startM: s.m, startD: s.d, endY: e.y, endM: e.m, endD: e.d,\n    transport: t.transport, distance: t.distance||0,\n    transportFee: trans, mealFee: meal, mealCount: calcMealCount(t), dailyFee: daily, lodgeFee: lodge,\n    nights: t.nights||0, trainFare: t.transport==='기차' ? trans : 0,\n    trainLegs: (t.transport==='기차' && t.trainOneWay) ? {\n      go: t.trainTicketGo ? (t.trainFareGo||0) : 0,\n      ret: ((t.returnTransport||'기차')==='기차' && t.trainTicketReturn) ? (t.trainFareReturn||0) : 0\n    } : null,\n    toll: (t.transport==='자차' && t.carRole!=='passenger' && t.tollReceipt) ? (t.toll||0) : 0,   // 요금에 포함된 통행료만(영수증 첨부 시)\n    isHalf: daily===12500, total\n  };\n}\nfunction setBtnLoading(btn, loadingText){\n  if(!btn) return null;\n  const prevHtml = btn.innerHTML, prevDisabled = btn.disabled;\n  btn.disabled = true;\n  btn.innerHTML = '\u003cspan class=\"spinner\">\u003c/span>'+(loadingText||'처리 중...');\n  return ()=>{ btn.disabled = prevDisabled; btn.innerHTML = prevHtml; };\n}\nasync function generateHwpxForSelected(btn){\n  hwpxGeneratedOnce = true;\n  updateNavStatus();\n  const ids = getSelectedDocIds();\n  if(ids.length===0){ alert('출장자를 1명 이상 선택해주세요.'); return; }\n  if(!hwpxTemplateBuf){ alert('서식이 아직 로드되지 않았습니다. 잠시 후 다시 시도해주세요.'); return; }\n  const restore = setBtnLoading(btn, '생성 중...');\n  try{\n    const zip = await JSZip.loadAsync(hwpxTemplateBuf);\n    const masterXml = await zip.file('Contents/section0.xml').async('string');\n    const people = ids.map(id => buildPersonDataForHwpx(tripDB.find(x=>x.id===id)));\n    const filledXml = buildFilledSectionXml(masterXml, people);\n    zip.file('Contents/section0.xml', filledXml);\n    const blob = await zip.generateAsync({type:'blob', mimeType:'application/hwp+zip'});\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = '여비지출결의서_'+todayStr()+'.hwpx';\n    document.body.appendChild(a); a.click(); a.remove();\n    toast(people.length+'명분 여비지출결의서(.hwpx)를 생성했습니다.');\n  }catch(err){\n    console.error(err);\n    alert('결의서 생성 중 오류가 발생했습니다: '+err.message);\n  }finally{\n    if(restore) restore();\n  }\n}\n\n/* ============================================================\n   시작 시 이전 작업 확인\n============================================================ */\nfunction fmtSavedAt(iso){\n  if(!iso) return '';\n  const d = new Date(iso);\n  if(isNaN(d.getTime())) return '';\n  const p = n => String(n).padStart(2,'0');\n  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;\n}\nfunction checkStartupState(){\n  if(staffDB.length===0 && tripDB.length===0) return;\n  const parts = [];\n  if(staffDB.length>0) parts.push('직원 '+staffDB.length+'명');\n  if(tripDB.length>0) parts.push('출장 내역 '+tripDB.length+'건');\n  let desc = parts.join(', ')+'이(가) 저장되어 있습니다.';\n  const t = fmtSavedAt(localStorage.getItem('lastSavedAt'));\n  if(t) desc += ' (최근 저장: '+t+')';\n  desc += ' 이어서 작업하시겠습니까, 새로 시작하시겠습니까?';\n  document.getElementById('startupModalDesc').textContent = desc;\n  document.getElementById('startupModalBg').classList.add('active');\n}\nfunction startupContinue(){\n  document.getElementById('startupModalBg').classList.remove('active');\n}\nfunction startupBeginNew(){\n  const alsoStaff = document.getElementById('startupResetStaffToo').checked;\n  const msg = alsoStaff\n    ? '출장 내역과 직원 명단을 모두 초기화하고 새로 시작할까요?'\n    : '출장 내역을 초기화하고 새로 시작할까요? (직원 명단은 유지됩니다)';\n  if(!confirm(msg)) return;\n  tripDB = [];\n  saveTrips();\n  if(alsoStaff){\n    staffDB = [];\n    saveStaff();\n  }\n  renderStaffTable();\n  renderTripTable();\n  updateNavStatus();\n  renderCalcTable();\n  renderDocSelectList();\n  document.getElementById('startupModalBg').classList.remove('active');\n  toast('새 작업을 시작합니다.');\n}\n\n/* ============================================================\n   드래그 앤 드롭 공통 처리\n============================================================ */\nfunction wireDropzone(elId, onFile, acceptExt){\n  const el = document.getElementById(elId);\n  if(!el) return;\n  ['dragenter','dragover'].forEach(evt=>{\n    el.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('dragover'); });\n  });\n  ['dragleave','drop'].forEach(evt=>{\n    el.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); el.classList.remove('dragover'); });\n  });\n  el.addEventListener('drop', e=>{\n    const files = e.dataTransfer.files;\n    if(!files || files.length===0) return;\n    const file = files[0];\n    if(acceptExt && !acceptExt.some(ext=>file.name.toLowerCase().endsWith(ext))){\n      alert(acceptExt.join('/')+' 파일만 지원합니다.'); return;\n    }\n    onFile(file);\n  });\n}\n\n/* ============================================================\n   초기 렌더\n============================================================ */\nrenderStaffTable();\nrenderTripTable();\nupdateNavStatus();\nrenderCalcTable();\nrenderDocSelectList();\ninitHwpxTemplate();\ninitCarSpecSelects();\n// 페이지를 열면 거리계산용 유가를 자동으로 한 번 조회(실패해도 마지막 성공값 유지)\nsetTimeout(()=>{ try{ onCarFuelChange('distOilPrice','distFuelType','distRate','distOilUnit'); }catch(e){} }, 300);\nwireDropzone('staffDropzone', handleStaffFile, ['.xlsx','.xls']);\nwireDropzone('tripDropzone', handleTripFile, ['.xlsx','.xls','.pdf']);\nwireDropzone('hwpxDropzone', loadHwpxTemplateFile, ['.hwpx']);\ncheckStartupState();\n\u003c/script>\n\u003cscript>\n/* 도구 페이지 ↔ 셸 연결 (빌드 때 각 도구 안에 끼워 넣습니다)\n   · 내용 높이를 셸에 알려 iframe 높이를 맞춘다\n   · 셸의 다크 모드 / 보고 있는 화면 영역(모달 위치)을 받아 적용한다\n   · 셸 '설정'에서 저장한 API 키를 도구가 읽을 수 있게 한다  → window.suiteKey('kakao') */\n(function(){\n  var TOOL = (document.querySelector('meta[name=\"tool-id\"]') || {}).content || '';\n  var root = document.documentElement;\n  document.body.classList.add('tool');\n\n  function applyTheme(dark){ root.classList.toggle('dark', !!dark); }\n  function applyViewport(v){\n    if(!v) return;\n    root.style.setProperty('--vp-top', Math.max(0, v.top) + 'px');\n    root.style.setProperty('--vp-h', Math.max(200, v.height) + 'px');\n  }\n  try{ applyTheme(window.parent.document.documentElement.classList.contains('dark')); }catch(e){}\n\n  window.addEventListener('message', function(e){\n    var d = e.data;\n    if(!d) return;\n    if('__theme' in d) applyTheme(d.__theme === 'dark');\n    if(d.__viewport) applyViewport(d.__viewport);\n  });\n\n  /* ---- 높이 알림 ---- */\n  var last = -1, raf = 0;\n  function post(){\n    raf = 0;\n    var b = document.body;\n    var h = Math.ceil(b.getBoundingClientRect().height + parseFloat(getComputedStyle(b).marginTop || 0) + parseFloat(getComputedStyle(b).marginBottom || 0));\n    if(h === last) return;\n    last = h;\n    try{ window.parent.postMessage({__tabHeight:h, __tabId:TOOL}, '*'); }catch(e){}\n  }\n  function schedule(){ if(!raf) raf = requestAnimationFrame(post); }\n  window.addEventListener('load', function(){ schedule(); try{ window.parent.postMessage({__ready:true, __tabId:TOOL}, '*'); }catch(e){} });\n  window.addEventListener('resize', schedule);\n  if(window.ResizeObserver) new ResizeObserver(schedule).observe(document.body);\n  if(window.MutationObserver) new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true, attributes:true, characterData:true});\n\n  /* ---- 공용 설정(API 키) ---- */\n  window.suiteKey = function(name){\n    try{\n      var o = JSON.parse(localStorage.getItem('suite.keys') || '{}');\n      return (o && o[name]) || '';\n    }catch(e){ return ''; }\n  };\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="tool-data-meal">"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>급식비(매식비) 정산 엑셀 생성기\u003c/title>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\">\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js\">\u003c/script>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--accent:var(--primary);--accent-hover:var(--primary-hover);--accent-tint:var(--primary-tint);--accent-tint-strong:var(--primary-tint-strong);--ok:var(--success);--ok-tint:var(--success-tint);--warn:var(--danger);--warn-tint:var(--danger-tint);--sun:var(--danger);--sat:var(--primary);--radius-md:var(--radius-btn);--radius-lg:var(--radius-card);--shadow-sm:var(--shadow-card);--shadow-md:var(--shadow-card);--shadow-lg:var(--shadow-card);}\n*{box-sizing:border-box;}\nbody{\n  margin:0;\n  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;\n  background:var(--bg); color:var(--text); line-height:1.55; -webkit-font-smoothing:antialiased;\n}\n.wrap{\n  max-width:900px; margin:0 auto; padding:24px 28px 90px;\n}\n#summarySection{position:relative;}\n.result-placeholder{\n  background:var(--surface-2); border:1.5px dashed var(--border-strong); border-radius:var(--radius-lg);\n  padding:60px 24px; text-align:center; color:var(--text-3); font-size:13.5px;\n}\n#summarySection:not(.hidden) ~ .result-placeholder,\n#step4:not(.hidden) ~ .result-placeholder{display:none;}\n\nheader.app-header{\n  /* 상위 셸(AppShell)의 topbar가 동일한 제목/설명 영역을 이미 표시하므로 중복을 없애기 위해 숨김 처리.\n     (JS는 이 요소를 참조하지 않으므로 순수 시각적 변경) */\n  display:none;\n}\nheader.app-header .app-icon{\n  flex-shrink:0; width:40px; height:40px; border-radius:11px;\n  background:var(--accent-tint); color:var(--accent);\n  display:flex; align-items:center; justify-content:center;\n}\nheader.app-header h1{margin:0 0 6px; font-size:18px; font-weight:700; letter-spacing:-0.01em; color:var(--text);}\nheader.app-header p{margin:0; color:var(--text-2); font-size:13.5px; line-height:1.65;}\nheader.app-header p b{color:var(--text); font-weight:600;}\n\n.step{\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);\n  padding:24px 26px; margin-bottom:16px; box-shadow:var(--shadow-sm);\n  transition:border-color .15s;\n}\n.step-title{\n  display:flex; align-items:center; gap:11px; font-size:18px; font-weight:700;\n  color:var(--text); margin-bottom:6px; letter-spacing:-0.01em;\n}\n.step-badge{\n  width:24px; height:24px; border-radius:7px; background:var(--accent-tint); color:var(--accent);\n  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;\n  font-variant-numeric:tabular-nums;\n}\n.step-desc{color:var(--text-2); font-size:13px; margin-bottom:16px; line-height:1.65;}\n.step-desc b{color:var(--text); font-weight:600;}\n\n.drop-zone{\n  border:1.5px dashed var(--border-strong); border-radius:var(--radius-input); padding:24px; text-align:center;\n  background:var(--surface-2); cursor:pointer; transition:.15s ease;\n}\n.drop-zone:hover{background:var(--accent-tint); border-color:var(--accent);}\n.drop-zone.dragover{background:var(--accent-tint-strong); border-color:var(--accent);}\n.drop-zone input{display:none;}\n.drop-zone .dz-title{font-weight:600; color:var(--text); margin-bottom:4px; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:7px;}\n.drop-zone .dz-sub{font-size:12px; color:var(--text-3);}\n.file-chip{\n  display:inline-flex; align-items:center; gap:7px; background:var(--accent-tint);\n  color:var(--accent-hover); padding:6px 13px; border-radius:20px; font-size:12.5px; font-weight:600; margin-top:12px;\n}\n\n.summary-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px;}\n.summary-card{\n  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-input); padding:14px 16px; text-align:center;\n}\n.summary-card .num{font-size:18px; font-weight:700; color:var(--text); letter-spacing:-0.01em; font-variant-numeric:tabular-nums;}\n.summary-card .lbl{font-size:11px; color:var(--text-3); margin-top:3px;}\n.summary-card.highlight{background:var(--accent-tint); border-color:var(--accent-tint-strong);}\n.summary-card.highlight .num{color:var(--accent);}\n\ntable.vendor-table{width:100%; min-width:460px; border-collapse:collapse; margin-top:14px; font-size:13px;}\ntable.vendor-table th{\n  color:var(--text-3); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;\n  padding:0 8px 8px; text-align:center; border-bottom:1px solid var(--border);\n}\ntable.vendor-table td{padding:6px 6px; border-bottom:1px solid var(--border); text-align:center;}\ntable.vendor-table tr:last-child td{border-bottom:none;}\ntable.vendor-table input[type=text], table.vendor-table input[type=number]{\n  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-input); font-size:13px;\n  text-align:center; font-family:inherit; background:var(--surface); transition:border-color .15s ease, box-shadow .15s ease;\n}\ntable.vendor-table input[type=text]{text-align:left;}\ntable.vendor-table input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);}\n.row-actions button{\n  border:none; background:none; color:var(--text-3); cursor:pointer; font-size:15px; font-weight:600;\n  width:26px; height:26px; border-radius:7px; transition:.15s ease;\n  display:inline-flex; align-items:center; justify-content:center;\n}\n.row-actions button:hover{color:var(--warn); background:var(--warn-tint);}\n\n.btn{\n  border:1px solid transparent; border-radius:var(--radius-md); padding:0 16px; height:40px; font-size:13.5px; font-weight:600;\n  cursor:pointer; transition:.15s ease; font-family:inherit;\n  display:inline-flex; align-items:center; justify-content:center; gap:7px;\n}\n.btn-primary{background:var(--accent); color:#fff;}\n.btn-primary:hover{background:var(--accent-hover);}\n.btn-primary:disabled{background:var(--text-3); cursor:not-allowed; box-shadow:none;}\n.btn-outline{background:var(--surface); border-color:var(--border-strong); color:var(--text);}\n.btn-outline:hover{background:var(--surface-2); border-color:var(--text-3);}\n.btn-ghost{background:none; color:var(--text-2); border-color:var(--border);}\n.btn-lg{width:100%; padding:13px; font-size:14.5px; border-radius:var(--radius-md);}\n.toolbar{display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px;}\n\n.total-bar{\n  display:flex; justify-content:space-between; align-items:center; margin-top:14px; flex-wrap:wrap; gap:6px;\n  padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-2); font-size:13px; font-weight:500;\n  border:1px solid var(--border); color:var(--text-2);\n}\n.total-bar b{color:var(--text); font-weight:700;}\n.total-bar.over{background:var(--warn-tint); border-color:#f6cfcf; color:var(--warn);}\n.total-bar.over b{color:var(--warn);}\n.total-bar.ok{background:var(--ok-tint); border-color:#c9ecd9; color:var(--ok);}\n.total-bar.ok b{color:var(--ok);}\n\n.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;}\n.field{display:flex; flex-direction:column; gap:6px;}\n.field label{font-size:12px; color:var(--text-2); font-weight:600;}\n.field input{\n  padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-input); font-size:13.5px;\n  font-family:inherit; background:var(--surface); transition:border-color .15s ease, box-shadow .15s ease;\n}\n.field input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);}\n\n.note{font-size:12px; color:var(--text-3); margin-top:10px; line-height:1.7;}\n.note b{color:var(--text-2);}\n.hidden{display:none !important;}\n\n.preview-toggle{\n  color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; margin-top:14px; display:inline-block;\n  transition:color .15s ease;\n}\n.preview-toggle:hover{color:var(--accent-hover);}\n.preview-wrap{overflow-x:auto; margin-top:12px; border:1px solid var(--border); border-radius:var(--radius-md); max-height:420px;}\ntable.preview-table{border-collapse:collapse; font-size:11px; white-space:nowrap; width:100%;}\ntable.preview-table th, table.preview-table td{border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:5px 7px; text-align:center;}\ntable.preview-table th{background:var(--surface-2); color:var(--text-2); position:sticky; top:0; font-weight:600;}\ntable.preview-table td.o-mark{color:var(--accent); font-weight:700;}\ntable.preview-table th.sun{color:var(--sun);}\ntable.preview-table th.sat{color:var(--sat);}\n\n.status-msg{font-size:13px; padding:10px 14px; border-radius:var(--radius-sm); margin-top:12px; border:1px solid transparent; display:flex; align-items:center; gap:8px;}\n.status-msg.error{background:var(--warn-tint); color:var(--warn); border-color:#f6cfcf;}\n.status-msg.success{background:var(--ok-tint); color:var(--ok); border-color:#c9ecd9;}\n\nfooter{text-align:center; color:var(--text-3); font-size:11.5px; margin-top:34px;}\n\n@media (max-width:640px){\n  .summary-grid{grid-template-columns:repeat(2,1fr);}\n  .field-grid{grid-template-columns:1fr;}\n  .step{padding:20px 18px;}\n}\n\n\n/* 통합 셸: 제목은 셸 상단에 있으므로 도구 자체 머리말은 숨김 */\n.app-header{display:none;}\n\u003c/style>\n\u003cmeta name=\"tool-id\" content=\"meal\">\n\u003cstyle id=\"suite-theme\">\n/* ==========================================================================\n   서무 업무 자동화 — 공통 디자인 시스템\n   셸(index)과 모든 도구 페이지가 이 파일 하나를 공유합니다.\n   · 색/글꼴/모서리는 아래 토큰(:root)만 바꾸면 전체가 함께 바뀝니다.\n   · 도구마다 다르게 부르던 클래스 이름(.btn-primary / .run / .btn.outline …)도\n     여기서 한 모양으로 묶습니다. 도구 CSS 뒤에 불러오므로 같은 점수면 이 파일이 이깁니다.\n   ========================================================================== */\n\n/* ---------- 1. 토큰 ---------- */\n:root{\n  --bg:#F8FAFC;\n  --surface:#FFFFFF;\n  --surface-2:#F8FAFC;\n  --surface-3:#EEF1F5;\n  --hover:#F3F4F6;\n  --border:#E5E7EB;\n  --border-strong:#D5D9E0;\n\n  --text:#111827;\n  --text-2:#6B7280;\n  --text-3:#9CA3AF;\n\n  --primary:#2563EB;\n  --primary-hover:#1D4ED8;\n  --primary-tint:#EFF4FE;\n  --primary-tint-strong:#E1EAFD;\n  --primary-border:#C7D9FC;\n\n  --success:#16A34A;\n  --success-tint:#EAFBF2;\n  --warning:#D97706;\n  --warning-tint:#FDF1DE;\n  --danger:#DC2626;\n  --danger-hover:#B91C1C;\n  --danger-tint:#FDEEEE;\n\n  --radius-sm:8px;\n  --radius-btn:10px;\n  --radius-input:10px;\n  --radius-card:16px;\n  --radius-modal:20px;\n\n  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);\n  --shadow-pop:0 16px 40px rgba(17,24,39,.16), 0 2px 8px rgba(17,24,39,.06);\n\n  --font:'Noto Sans KR','Pretendard Variable','Segoe UI','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;\n  --mono:'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;\n\n  /* 보고 있는 화면 영역(iframe 안에서 모달·토스트 위치를 잡을 때 셸이 갱신) */\n  --vp-top:0px;\n  --vp-h:100vh;\n\n  color-scheme:light;\n}\nhtml.dark{\n  --bg:#111418;\n  --surface:#181C22;\n  --surface-2:#1C2128;\n  --surface-3:#242A33;\n  --hover:#20242B;\n  --border:#262B33;\n  --border-strong:#343B46;\n\n  --text:#E8EAED;\n  --text-2:#9AA2AD;\n  --text-3:#6B7280;\n\n  --primary:#3B82F6;\n  --primary-hover:#60A5FA;\n  --primary-tint:#152238;\n  --primary-tint-strong:#1B2B47;\n  --primary-border:#27406B;\n\n  --success:#22C55E;\n  --success-tint:#0F2A1D;\n  --warning:#F59E0B;\n  --warning-tint:#2E2410;\n  --danger:#EF4444;\n  --danger-hover:#F87171;\n  --danger-tint:#301616;\n\n  --shadow-card:0 1px 2px rgba(0,0,0,.4);\n  --shadow-pop:0 16px 40px rgba(0,0,0,.55);\n  color-scheme:dark;\n}\n\n/* ---------- 2. 바탕 ---------- */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-font-smoothing:antialiased;}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--text);\n  font-family:var(--font);\n  font-size:14px;\n  line-height:1.55;\n}\n::selection{background:var(--primary-tint-strong);color:var(--text);}\na{color:var(--primary);}\n:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}\nsvg{display:block;}\nhr{border:none;border-top:1px solid var(--border);}\ncode{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:5px;}\n::-webkit-scrollbar{width:10px;height:10px;}\n::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box;}\n::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:2px solid transparent;}\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}\n}\n\n/* 도구 페이지 공통 틀: 셸이 제목을 보여 주므로 도구는 본문만 가진다 */\nbody.tool{background:transparent;padding:0 0 40px;}\nbody.tool .wrap,\nbody.tool .page{max-width:none;margin:0;padding:0;}\n\n/* ---------- 3. 카드 / 패널 ---------- */\nbody .card,\nbody .panel,\nbody .step{\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:var(--radius-card);\n  box-shadow:var(--shadow-card);\n  padding:22px 24px;\n  margin-bottom:16px;\n}\nbody .card h2,\nbody .panel h2{\n  font-size:15px;font-weight:700;letter-spacing:-.01em;\n  text-transform:none;color:var(--text);margin:0 0 6px;\n}\nbody .card .sub,\nbody .panel .sub,\nbody .section-sub,\nbody .step-desc{color:var(--text-2);font-size:13px;line-height:1.65;}\nbody .card .sub{margin-bottom:16px;}\n\n/* ---------- 4. 버튼 ---------- */\nbody .btn,\nbody .btn-primary,\nbody .btn-secondary,\nbody .btn-outline,\nbody .btn-ghost,\nbody .btn-export,\nbody button.run{\n  --b-bg:var(--primary);--b-fg:#fff;--b-bd:var(--primary);--b-bg-h:var(--primary-hover);--b-bd-h:var(--primary-hover);\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  min-height:40px;padding:0 16px;\n  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;\n  border-radius:var(--radius-btn);\n  background:var(--b-bg);color:var(--b-fg);border:1px solid var(--b-bd);\n  box-shadow:none;text-decoration:none;cursor:pointer;\n  transition:background .15s ease,border-color .15s ease,color .15s ease,transform 60ms ease;\n}\nbody .btn:hover:not(:disabled):not(.disabled),\nbody .btn-primary:hover:not(:disabled),\nbody .btn-secondary:hover:not(:disabled),\nbody .btn-outline:hover:not(:disabled),\nbody .btn-ghost:hover:not(:disabled),\nbody .btn-export:hover:not(:disabled),\nbody button.run:hover:not(:disabled){background:var(--b-bg-h);border-color:var(--b-bd-h);color:var(--b-fg-h,var(--b-fg));box-shadow:none;}\nbody .btn:active:not(:disabled),\nbody .btn-primary:active:not(:disabled),\nbody button.run:active:not(:disabled){transform:translateY(1px);}\nbody .btn:disabled,body .btn[disabled],body .btn.disabled,\nbody .btn-primary:disabled,body .btn-secondary:disabled,body .btn-outline:disabled,\nbody .btn-ghost:disabled,body .btn-export:disabled,body button.run:disabled{\n  opacity:.5;cursor:not-allowed;\n}\n/* 보조(연한 파랑) */\nbody .btn.outline,\nbody .btn-secondary,\nbody .btn-outline{--b-bg:var(--primary-tint);--b-fg:var(--primary);--b-bd:transparent;--b-bg-h:var(--primary-tint-strong);--b-bd-h:transparent;}\n/* 낮은 우선순위(테두리) */\nbody .btn.ghost,\nbody .btn-ghost{--b-bg:var(--surface);--b-fg:var(--text-2);--b-bd:var(--border-strong);--b-bg-h:var(--hover);--b-bd-h:var(--border-strong);--b-fg-h:var(--text);}\n/* 되돌릴 수 없는 동작 */\nbody .btn.danger{--b-bg:var(--surface);--b-fg:var(--danger);--b-bd:var(--danger);--b-bg-h:var(--danger-tint);--b-bd-h:var(--danger);}\n/* 내려받기 완료형(초록) */\nbody .btn-export{--b-bg:var(--success);--b-fg:#fff;--b-bd:var(--success);--b-bg-h:var(--success);--b-bd-h:var(--success);}\nbody .btn-export:hover:not(:disabled){filter:brightness(.93);}\n/* 크기 */\nbody .btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;gap:5px;}\nbody .btn-lg,body button.run{min-height:46px;font-size:14.5px;}\nbody button.run{width:100%;}\nbody .btn svg,body button.run svg{flex:none;}\n\n/* 아이콘 단추 */\nbody .icon-btn,\nbody .btn-icon{\n  display:inline-flex;align-items:center;justify-content:center;flex:none;\n  width:32px;height:32px;min-height:0;padding:0;\n  border-radius:var(--radius-sm);border:1px solid transparent;\n  background:transparent;color:var(--text-2);cursor:pointer;box-shadow:none;\n  transition:background .15s ease,color .15s ease;\n}\nbody .icon-btn:hover,body .btn-icon:hover{background:var(--hover);color:var(--text);}\nbody .icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);}\n\n/* ---------- 5. 입력 ---------- */\nbody input[type=text],\nbody input[type=number],\nbody input[type=password],\nbody input[type=search],\nbody input[type=date],\nbody input[type=time],\nbody input[type=month],\nbody input[type=email],\nbody input[type=tel],\nbody input:not([type]),\nbody select,\nbody textarea{\n  font-family:inherit;font-size:13.5px;color:var(--text);\n  background-color:var(--surface);\n  border:1px solid var(--border-strong);\n  border-radius:var(--radius-input);\n  transition:border-color .15s ease,box-shadow .15s ease;\n}\nbody input::placeholder,body textarea::placeholder{color:var(--text-3);}\nbody input:hover:not(:focus):not([readonly]),body select:hover:not(:focus),body textarea:hover:not(:focus){border-color:var(--text-3);}\nbody input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-strong);}\nbody input[readonly]{background-color:var(--surface-2);color:var(--text-2);}\nbody select{\n  appearance:none;-webkit-appearance:none;\n  background-image:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpolyline points='6 9 12 15 18 9'/>\u003c/svg>\");\n  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;\n  padding-right:32px !important;cursor:pointer;\n}\nbody input[type=file]{display:none;}\nbody input[type=checkbox],body input[type=radio]{accent-color:var(--primary);}\nbody label{color:inherit;}\n\n/* ---------- 6. 표 ---------- */\nbody table{border-collapse:collapse;font-variant-numeric:tabular-nums;}\nbody th{\n  background:var(--surface-2);color:var(--text-2);\n  font-weight:600;font-size:12px;\n  border-bottom:1px solid var(--border-strong);\n}\nbody td{border-color:var(--border);}\nbody tbody tr:hover{background:var(--hover);}\nbody .tablewrap,\nbody .table-scroll,\nbody .preview-wrap{\n  border:1px solid var(--border);border-radius:var(--radius-input);background:var(--surface);\n}\nbody td input,body td select{background-color:transparent;}\nbody td input:focus,body td select:focus{background-color:var(--surface);}\n\n/* ---------- 7. 업로드 영역 ---------- */\nbody .dropzone,\nbody .drop-zone,\nbody .opt-dropzone{\n  border:1.5px dashed var(--border-strong);\n  border-radius:var(--radius-card);\n  background:var(--surface-2);\n  color:var(--text);\n  transition:border-color .15s ease,background .15s ease;\n}\nbody .dropzone:hover,body .drop-zone:hover,body .opt-dropzone:hover,\nbody .dropzone.drag,body .dropzone.dragover,body .dropzone.active,body .dropzone.hover,\nbody .drop-zone.drag,body .drop-zone.dragover,body .opt-dropzone.drag{\n  border-color:var(--primary);background:var(--primary-tint);box-shadow:none;\n}\n\n/* ---------- 8. 안내 / 칩 / 배지 ---------- */\nbody .hint,\nbody .callout,\nbody .note,\nbody .tpl-status,\nbody .rules-note{\n  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);\n  border-radius:var(--radius-input);\n}\nbody .hint-warn{background:var(--warning-tint);border-color:transparent;color:var(--warning);}\nbody .caption,body .small{color:var(--text-3);}\nbody .pill,body .opt-badge,body .step-badge,body .step-no{border-radius:999px;}\nbody .step-badge,body .step-no{background:var(--primary);color:#fff;}\nbody .opt-badge{background:var(--surface-3);color:var(--text-2);}\nbody .summary-box,body .summary-card{\n  background:var(--primary-tint);border:1px solid transparent;border-radius:var(--radius-input);\n}\nbody .summary-box .label,body .summary-card .lbl{color:var(--text-2);}\nbody .summary-box .val,body .summary-card .num{color:var(--primary);}\nbody .summary-card.highlight{background:var(--primary);}\nbody .summary-card.highlight .num,body .summary-card.highlight .lbl{color:#fff;}\n\n/* ---------- 9. 분할 버튼(세그먼트) ---------- */\nbody .typetabs,\nbody .segmented{\n  background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-btn);padding:3px;\n}\nbody .typebtn,\nbody .segmented-option span{color:var(--text-2);border-radius:8px;}\nbody .typebtn:hover{background:var(--hover);color:var(--text);}\nbody .typebtn.active,\nbody .segmented-option input:checked + span{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-card);font-weight:600;}\n\n/* ---------- 10. 모달 · 토스트 · 확대 보기 ----------\n   iframe이 내용 높이만큼 길어지므로, 중앙 정렬을 \"보고 있는 화면 영역\" 기준으로 잡는다. */\nbody .modal-bg,\nbody .lightbox{\n  position:fixed;left:0;right:0;inset-inline:0;\n  top:var(--vp-top);bottom:auto;height:var(--vp-h);\n  background:rgba(10,12,18,.5);backdrop-filter:blur(2px);\n}\nbody .modal{\n  max-height:calc(var(--vp-h) - 48px);\n  background:var(--surface);color:var(--text);\n  border-radius:var(--radius-modal);box-shadow:var(--shadow-pop);\n}\nbody .modal h3{border-bottom:1px solid var(--border);}\nbody .modal-actions{border-top:1px solid var(--border);}\nbody .toast{\n  top:calc(var(--vp-top) + var(--vp-h) - 76px);bottom:auto;\n  background:var(--text);color:var(--bg);border-radius:var(--radius-btn);box-shadow:var(--shadow-pop);\n}\n\n/* ---------- 11. 진행 표시 ---------- */\nbody .progress-track{background:var(--border);border-radius:999px;}\nbody .progress-fill{background:var(--primary);}\n\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\n  \u003cheader class=\"app-header\">\n    \u003cdiv class=\"app-icon\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M6 2v7a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V2\">\u003c/path>\u003cpath d=\"M9 12v10\">\u003c/path>\u003cpath d=\"M17 2c-1.7 0-3 2-3 5s1.3 5 3 5v10\">\u003c/path>\u003c/svg>\u003c/div>\n    \u003cdiv>\n      \u003ch1>급식비(매식비) 정산 엑셀 생성기\u003c/h1>\n      \u003cp>인사랑 프로그램에서 내려받은 \u003cb>초과근무 내역\u003c/b> 엑셀을 넣으면, 평일 20시 이후 야간근무자를 자동으로 뽑아\n      \u003cb>급식확인서 · 급식지급 상세내역 · 초과근무내역\u003c/b> 3개 시트가 담긴 정산 엑셀을 만들어 드립니다.\n      기존에 쓰던 정산 양식 파일을 함께 올리면 직원 명단과 순서를 그대로 이어받고, 급식처에 입력한 실제 급식인원 수에 맞춰 O표시를 날짜별로 적당히 나눠 배분합니다.\u003c/p>\n    \u003c/div>\n  \u003c/header>\n\n  \u003c!-- STEP 1 : template upload (optional) -->\n  \u003cdiv class=\"step\" id=\"stepTemplate\">\n    \u003cdiv class=\"step-title\">\u003cspan class=\"step-badge\">1\u003c/span>기존양식 파일 업로드 \u003cspan style=\"font-size:12.5px;color:var(--text-3);font-weight:500;\">(선택)\u003c/span>\u003c/div>\n    \u003cdiv class=\"step-desc\">이전 달에 쓰던 \u003cb>급식비 지급내역\u003c/b> 정산 엑셀(.xls / .xlsx)을 올리면 \"급식지급 상세내역\" 시트의 \u003cb>직원 명단과 순서\u003c/b>를 그대로 이어받습니다. 올리지 않으면 아래 초과근무 내역에서 발견되는 순서대로 직원 명단이 작성됩니다.\u003c/div>\n    \u003cdiv class=\"drop-zone\" id=\"dropZoneTemplate\">\n      \u003cinput type=\"file\" id=\"fileInputTemplate\" accept=\".xls,.xlsx\">\n      \u003cdiv class=\"dz-title\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 14.9A5 5 0 0 1 7 6a5.5 5.5 0 0 1 10.3-1.5A4.5 4.5 0 0 1 18 13\">\u003c/path>\u003cpath d=\"M12 12v9\">\u003c/path>\u003cpath d=\"M9 16l3-3 3 3\">\u003c/path>\u003c/svg> 클릭하거나 파일을 여기로 끌어다 놓으세요\u003c/div>\n      \u003cdiv class=\"dz-sub\">.xls / .xlsx 파일 지원 · 선택 사항\u003c/div>\n      \u003cdiv id=\"fileChipTemplate\">\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"templateStatus\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- STEP 2 : upload -->\n  \u003cdiv class=\"step\" id=\"stepUpload\">\n    \u003cdiv class=\"step-title\">\u003cspan class=\"step-badge\">2\u003c/span>초과근무 내역 엑셀 업로드\u003c/div>\n    \u003cdiv class=\"step-desc\">인사랑에서 다운로드한 \"초과근무 내역\" 엑셀 파일(.xls / .xlsx)을 올려주세요. No, 근무일자, 부서, 직급, 성명, 휴일구분, 출근(실제), 퇴근(실제), 총초과(분), 근무내역 컬럼을 자동으로 찾아 분석합니다.\u003c/div>\n    \u003cdiv class=\"drop-zone\" id=\"dropZone\">\n      \u003cinput type=\"file\" id=\"fileInput\" accept=\".xls,.xlsx\">\n      \u003cdiv class=\"dz-title\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 14.9A5 5 0 0 1 7 6a5.5 5.5 0 0 1 10.3-1.5A4.5 4.5 0 0 1 18 13\">\u003c/path>\u003cpath d=\"M12 12v9\">\u003c/path>\u003cpath d=\"M9 16l3-3 3 3\">\u003c/path>\u003c/svg> 클릭하거나 파일을 여기로 끌어다 놓으세요\u003c/div>\n      \u003cdiv class=\"dz-sub\">.xls / .xlsx 파일 지원\u003c/div>\n      \u003cdiv id=\"fileChip\">\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"uploadStatus\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 결과: 인식 요약 · 미리보기 (파일 업로드 후 표시) -->\n  \u003cdiv id=\"summarySection\" class=\"hidden step result-step\">\n    \u003cdiv class=\"step-title\">\u003cspan class=\"step-badge\">✓\u003c/span>인식 결과\u003c/div>\n    \u003cdiv class=\"summary-grid\">\n      \u003cdiv class=\"summary-card\">\u003cdiv class=\"num\" id=\"sumYm\">-\u003c/div>\u003cdiv class=\"lbl\">대상 연월\u003c/div>\u003c/div>\n      \u003cdiv class=\"summary-card\">\u003cdiv class=\"num\" id=\"sumRecords\">-\u003c/div>\u003cdiv class=\"lbl\">총 초과근무 기록\u003c/div>\u003c/div>\n      \u003cdiv class=\"summary-card\">\u003cdiv class=\"num\" id=\"sumEmployees\">-\u003c/div>\u003cdiv class=\"lbl\">전체 직원 수\u003c/div>\u003c/div>\n      \u003cdiv class=\"summary-card highlight\">\u003cdiv class=\"num\" id=\"sumMax\">-\u003c/div>\u003cdiv class=\"lbl\">최대 급식 가능 인원(끼)\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"note\">최대 급식 가능 인원은 \u003cb>휴일구분 = 평일\u003c/b> 이면서 \u003cb>퇴근(실제)가 20:00 이후\u003c/b>인 날의 (직원×일자) 조합 수입니다. 실제로 O표시가 들어가는 인원은 급식처별로 입력한 \u003cb>급식인원 합계\u003c/b>만큼만, 날짜별로 적당히 나눠 배분됩니다.\u003c/div>\n    \u003cspan class=\"preview-toggle\" id=\"togglePreview\">▸ 급식지급 상세내역 미리보기 열기\u003c/span>\n    \u003cdiv class=\"note\" id=\"previewNote\">\u003c/div>\n    \u003cdiv class=\"preview-wrap hidden\" id=\"previewWrap\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- STEP 3 : vendors -->\n  \u003cdiv class=\"step hidden\" id=\"step2\">\n    \u003cdiv class=\"step-title\">\u003cspan class=\"step-badge\">3\u003c/span>급식처 · 급식인원 입력\u003c/div>\n    \u003cdiv class=\"step-desc\">식사를 제공한 급식처(식당)와 인원을 나눠서 입력하세요. 지급액은 인원 × 9,000원으로 자동 계산됩니다. 여기에 입력한 \u003cb>급식인원 합계\u003c/b>만큼만 급식지급 상세내역 시트에 O표시가 들어가며, 최대 가능 인원을 모두 채우지 않고 날짜별로 적당히 나눠서 배분됩니다.\u003c/div>\n    \u003cdiv style=\"overflow-x:auto;\">\n    \u003ctable class=\"vendor-table\">\n      \u003cthead>\u003ctr>\u003cth style=\"width:44px;\">연번\u003c/th>\u003cth>급식처\u003c/th>\u003cth style=\"width:110px;\">급식인원\u003c/th>\u003cth style=\"width:90px;\">단가\u003c/th>\u003cth style=\"width:120px;\">지급액\u003c/th>\u003cth style=\"width:50px;\">\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody id=\"vendorBody\">\u003c/tbody>\n    \u003c/table>\n    \u003c/div>\n    \u003cdiv class=\"toolbar\">\n      \u003cbutton class=\"btn btn-outline\" id=\"addVendorBtn\">+ 급식처 추가\u003c/button>\n      \u003cdiv style=\"font-size:13px;color:var(--text-3);\">단가: 9,000원 (고정)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"total-bar\" id=\"totalBar\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- STEP 3 : signer -->\n  \u003cdiv class=\"step hidden\" id=\"step3\">\n    \u003cdiv class=\"step-title\">\u003cspan class=\"step-badge\">4\u003c/span>확인자 정보 (선택)\u003c/div>\n    \u003cdiv class=\"step-desc\">급식확인서 하단에 표시될 확인자 직급/성명입니다. 비워두면 공란으로 출력됩니다.\u003c/div>\n    \u003cdiv class=\"field-grid\">\n      \u003cdiv class=\"field\">\u003clabel>확인자 직급\u003c/label>\u003cinput type=\"text\" id=\"officerRank\" placeholder=\"예) 행정6급\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>확인자 성명\u003c/label>\u003cinput type=\"text\" id=\"officerName\" placeholder=\"예) 홍 길 동\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- STEP 4 : generate -->\n  \u003cdiv class=\"step hidden result-step\" id=\"step4\">\n    \u003cdiv class=\"step-title\">\u003cspan class=\"step-badge\">5\u003c/span>정산 엑셀 생성\u003c/div>\n    \u003cdiv class=\"step-desc\">아래 버튼을 누르면 \u003cb>급식확인서 / 급식지급 상세내역 / 초과근무내역\u003c/b> 3개 시트가 포함된 엑셀 파일이 다운로드됩니다.\u003c/div>\n    \u003cbutton class=\"btn btn-primary btn-lg\" id=\"generateBtn\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\">\u003c/path>\u003cpath d=\"M7 10l5 5 5-5\">\u003c/path>\u003cpath d=\"M12 15V3\">\u003c/path>\u003c/svg> 정산 엑셀 다운로드\u003c/button>\n    \u003cdiv id=\"generateStatus\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"result-placeholder\">엑셀 파일을 업로드하면 여기에 인식 결과와 다운로드 버튼이 표시됩니다.\u003c/div>\n\n  \u003cfooter>업로드한 파일은 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.\u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ============================================================\n   상태\n============================================================ */\nconst state = {\n  records: [], allEmployees: [], mealQualify: {}, rawHolidaySet: new Set(),\n  year: null, month: null, daysInMonth: null, maxMealCount: 0,\n  vendors: [],\n  templateEmployees: null, // 기존양식 파일에서 읽어온 직원 명단(순서 포함), 없으면 null\n  masterEmployees: [],     // 시트2에 실제로 출력할 직원 명단(순서 포함)\n};\n\n/* ============================================================\n   1) 업로드 & 파싱\n============================================================ */\nconst dropZone = document.getElementById('dropZone');\nconst fileInput = document.getElementById('fileInput');\n\ndropZone.addEventListener('click', () => fileInput.click());\n['dragover','dragleave','drop'].forEach(evt=>{\n  dropZone.addEventListener(evt, e=>{\n    e.preventDefault();\n    if(evt==='dragover') dropZone.classList.add('dragover');\n    else dropZone.classList.remove('dragover');\n  });\n});\ndropZone.addEventListener('drop', e=>{\n  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);\n});\nfileInput.addEventListener('change', e=>{\n  if(e.target.files.length) handleFile(e.target.files[0]);\n});\n\nfunction showStatus(elId, msg, type){\n  const el = document.getElementById(elId);\n  el.innerHTML = `\u003cdiv class=\"status-msg ${type}\">${msg}\u003c/div>`;\n}\n\nfunction handleFile(file){\n  document.getElementById('fileChip').innerHTML = `\u003cspan class=\"file-chip\">\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\">\u003c/path>\u003cpolyline points=\"14 2 14 8 20 8\">\u003c/polyline>\u003c/svg> ${file.name}\u003c/span>`;\n  document.getElementById('uploadStatus').innerHTML = '';\n  const reader = new FileReader();\n  reader.onload = (e) => {\n    try{\n      const data = new Uint8Array(e.target.result);\n      const wb = XLSX.read(data, {type:'array', cellDates:true});\n      parseOvertimeWorkbook(wb);\n    }catch(err){\n      console.error(err);\n      showStatus('uploadStatus', '파일을 읽는 중 오류가 발생했습니다: ' + err.message, 'error');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\n/* ------------------------------------------------------------\n   기존양식 파일 업로드 (선택) : 직원 명단/순서 추출\n------------------------------------------------------------ */\nconst dropZoneTemplate = document.getElementById('dropZoneTemplate');\nconst fileInputTemplate = document.getElementById('fileInputTemplate');\n\ndropZoneTemplate.addEventListener('click', () => fileInputTemplate.click());\n['dragover','dragleave','drop'].forEach(evt=>{\n  dropZoneTemplate.addEventListener(evt, e=>{\n    e.preventDefault();\n    if(evt==='dragover') dropZoneTemplate.classList.add('dragover');\n    else dropZoneTemplate.classList.remove('dragover');\n  });\n});\ndropZoneTemplate.addEventListener('drop', e=>{\n  if(e.dataTransfer.files.length) handleTemplateFile(e.dataTransfer.files[0]);\n});\nfileInputTemplate.addEventListener('change', e=>{\n  if(e.target.files.length) handleTemplateFile(e.target.files[0]);\n});\n\nfunction handleTemplateFile(file){\n  document.getElementById('fileChipTemplate').innerHTML = `\u003cspan class=\"file-chip\">\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\">\u003c/path>\u003cpolyline points=\"14 2 14 8 20 8\">\u003c/polyline>\u003c/svg> ${file.name}\u003c/span>`;\n  document.getElementById('templateStatus').innerHTML = '';\n  const reader = new FileReader();\n  reader.onload = (e) => {\n    try{\n      const data = new Uint8Array(e.target.result);\n      const wb = XLSX.read(data, {type:'array', cellDates:true});\n      const names = parseTemplateWorkbook(wb);\n      if (!names || names.length === 0){\n        state.templateEmployees = null;\n        showStatus('templateStatus', '기존양식에서 \"급식지급 상세내역\" 시트의 직원 명단을 찾지 못했습니다. 초과근무 내역 기준 순서로 작성됩니다.', 'error');\n      } else {\n        state.templateEmployees = names;\n        showStatus('templateStatus', `기존양식에서 직원 ${names.length}명의 명단/순서를 불러왔습니다.`, 'success');\n      }\n      updateMasterEmployees();\n    }catch(err){\n      console.error(err);\n      state.templateEmployees = null;\n      showStatus('templateStatus', '기존양식 파일을 읽는 중 오류가 발생했습니다: ' + err.message, 'error');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction parseTemplateWorkbook(wb){\n  const sheetName = wb.SheetNames.find(n => n.includes('급식지급')) ||\n                     wb.SheetNames.find(n => n.includes('상세내역')) ||\n                     wb.SheetNames[1] || wb.SheetNames[0];\n  const ws = wb.Sheets[sheetName];\n  if (!ws) return null;\n  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});\n\n  let headerRowIdx = -1;\n  for (let i=0;i\u003cMath.min(15,rows.length);i++){\n    if (rows[i].some(c => String(c).trim()==='성명')) { headerRowIdx = i; break; }\n  }\n  if (headerRowIdx === -1) return null;\n  const header = rows[headerRowIdx].map(c=>String(c).trim());\n  const nameCol = header.indexOf('성명');\n  if (nameCol === -1) return null;\n\n  const names = [];\n  const seen = new Set();\n  for (let i=headerRowIdx+1;i\u003crows.length;i++){\n    const r = rows[i];\n    if (!r) continue;\n    const sn = r[0];\n    const snNum = parseFloat(sn);\n    const nm = String(r[nameCol]||'').trim();\n    // 연번(첫 칸)이 숫자이고 성명이 있는 행만 실제 직원 데이터로 인정 (계/합계 행은 건너뜀)\n    if (!isNaN(snNum) && nm && !seen.has(nm)){\n      names.push(nm);\n      seen.add(nm);\n    }\n  }\n  return names;\n}\n\n/* masterEmployees(시트2 출력용 직원 명단) 갱신 : 기존양식 명단을 우선하고,\n   초과근무 내역에만 있는 직원은 뒤에 이어붙인다 */\nfunction updateMasterEmployees(){\n  if (!state.allEmployees || state.allEmployees.length === 0){\n    state.masterEmployees = state.templateEmployees ? state.templateEmployees.slice() : [];\n    r
