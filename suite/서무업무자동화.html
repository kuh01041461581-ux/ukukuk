ion defaultRowData(){\n  const d = {};\n  FIELD_KEYS.forEach(k => d[k] = \"\");\n  Object.assign(d, currentType().defaults);\n  if (d.holder) d.holder = clampHolder(d.holder);\n  return d;\n}\n\n// ---- 은행코드 매칭 (수동 수정 드롭다운에서 다른 은행으로 바꿀 때 참고용) ----\nfunction matchBankCode(raw){\n  if (!raw) return \"\";\n  const clean = raw.replace(/은행|주식회사|\\(주\\)|\\s/g, \"\").trim();\n  if (clean.length \u003c 2) return \"\";\n  for (const entry of BANK_CODES){\n    const nm = entry.split(\":\")[1].replace(/은행|\\s/g, \"\");\n    if (nm.length >= 2 && (nm.includes(clean) || clean.includes(nm))) return entry;\n  }\n  return \"\";\n}\n\n// ---- 이미지 리사이즈 → base64 ----\nfunction fileToResizedBase64(file, maxDim = 1600, quality = 0.90){\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    const reader = new FileReader();\n    reader.onload = e => {\n      img.onload = () => {\n        let { width, height } = img;\n        if (width > maxDim || height > maxDim){\n          const scale = maxDim / Math.max(width, height);\n          width = Math.round(width * scale);\n          height = Math.round(height * scale);\n        }\n        const canvas = document.createElement(\"canvas\");\n        canvas.width = width; canvas.height = height;\n        const ctx = canvas.getContext(\"2d\");\n        ctx.fillStyle = \"#fff\"; ctx.fillRect(0,0,width,height);\n        ctx.drawImage(img, 0, 0, width, height);\n        resolve(canvas.toDataURL(\"image/jpeg\", quality).split(\",\")[1]);\n      };\n      img.onerror = () => reject(new Error(\"이미지 디코딩 실패\"));\n      img.src = e.target.result;\n    };\n    reader.onerror = () => reject(new Error(\"파일 읽기 실패\"));\n    reader.readAsDataURL(file);\n  });\n}\n\n// ---- 영역 자동 확대 크롭 ----\n// 고지서 종류별로 미리 측정해둔 좌표(focusRegions, 0~1 비율)를 기준으로\n// 원본 이미지에서 \"농협 계좌\" · \"금액\" 부분만 잘라내 확대한 이미지를 만든다.\n// AI에게 전체 이미지와 함께 이 확대 이미지를 같이 보여주면 작은 숫자(계좌번호·금액)를\n// 훨씬 정확하게 읽어내므로, 별도의 \"AI 보정\" 단계 없이 한 번의 인식 호출로 정확도를 높일 수 있다.\nfunction loadImageFromBase64(base64){\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    img.onload = () => resolve(img);\n    img.onerror = () => reject(new Error(\"영역 확대를 위한 이미지 로드 실패\"));\n    img.src = \"data:image/jpeg;base64,\" + base64;\n  });\n}\n\nasync function cropFocusRegions(base64, regions, maxDim = 900, quality = 0.94){\n  if (!regions || !regions.length) return [];\n  let img;\n  try {\n    img = await loadImageFromBase64(base64);\n  } catch {\n    return []; // 크롭 실패해도 전체 이미지 인식은 계속 진행\n  }\n  const results = [];\n  for (const r of regions){\n    const sx = Math.round(r.x * img.naturalWidth);\n    const sy = Math.round(r.y * img.naturalHeight);\n    const sw = Math.max(1, Math.round(r.w * img.naturalWidth));\n    const sh = Math.max(1, Math.round(r.h * img.naturalHeight));\n    // 잘라낸 부분이 너무 작으면 숫자를 읽기 어려우니 어느 정도 확대는 하되,\n    // 토큰 사용량을 아끼기 위해 확대 배율과 최종 크기에 상한(maxDim)을 둔다.\n    const scale = Math.min(3, maxDim / Math.max(sw, sh));\n    const canvas = document.createElement(\"canvas\");\n    canvas.width = Math.max(1, Math.round(sw * scale));\n    canvas.height = Math.max(1, Math.round(sh * scale));\n    const ctx = canvas.getContext(\"2d\");\n    ctx.imageSmoothingEnabled = true;\n    ctx.imageSmoothingQuality = \"high\";\n    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);\n    results.push({ label: r.label || \"확대 영역\", base64: canvas.toDataURL(\"image/jpeg\", quality).split(\",\")[1] });\n  }\n  return results;\n}\n\n// ---- API 전송 직전 추가 축소(토큰 절약 모드) ----\n// 화면 표시·재인식용 원본(최대 1600px)은 그대로 두고, 실제 AI에 보낼 \"전체 페이지\" 이미지만\n// 필요시 한 번 더 작게 줄인다. 계좌·금액처럼 정밀도가 중요한 부분은 어차피 원본에서 잘라낸\n// 확대 크롭 이미지가 따로 전달되므로, 전체 페이지 이미지는 해상도를 낮춰도 정확도 손해가 적다.\nasync function shrinkForApi(base64, maxDim, quality){\n  let img;\n  try {\n    img = await loadImageFromBase64(base64);\n  } catch {\n    return base64; // 실패하면 원본 그대로 사용\n  }\n  if (Math.max(img.naturalWidth, img.naturalHeight) \u003c= maxDim) return base64; // 이미 충분히 작으면 재인코딩하지 않음\n  const scale = maxDim / Math.max(img.naturalWidth, img.naturalHeight);\n  const canvas = document.createElement(\"canvas\");\n  canvas.width = Math.round(img.naturalWidth * scale);\n  canvas.height = Math.round(img.naturalHeight * scale);\n  const ctx = canvas.getContext(\"2d\");\n  ctx.imageSmoothingEnabled = true;\n  ctx.imageSmoothingQuality = \"high\";\n  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);\n  return canvas.toDataURL(\"image/jpeg\", quality).split(\",\")[1];\n}\n\n// 현재 선택된 공급자·모델·절약모드 설정에 맞는 이미지 예산(해상도)을 계산한다.\nfunction getImageBudget(){\n  const isGemini = providerSel.value === \"gemini\";\n  const saving = isGemini && tokenSaverCheckbox && tokenSaverCheckbox.checked;\n  return saving\n    ? { mainMaxDim: 1024, mainQuality: 0.85, cropMaxDim: 720, cropQuality: 0.90 }\n    : { mainMaxDim: 1600, mainQuality: 0.90, cropMaxDim: 900, cropQuality: 0.94 };\n}\n\nfunction extractJson(text){\n  const cleaned = text.replace(/```json|```/g, \"\").trim();\n  const match = cleaned.match(/\\{[\\s\\S]*\\}/);\n  if (!match) throw new Error(\"응답에서 JSON을 찾을 수 없음: \" + cleaned.slice(0, 200));\n  return JSON.parse(match[0]);\n}\n\n// 429(요청 한도 초과) 오류를 구분해서 자동 재시도할 수 있도록 별도 에러 타입을 둔다.\nclass RateLimitError extends Error {\n  constructor(message, retryAfterMs){\n    super(message);\n    this.isRateLimit = true;\n    this.retryAfterMs = retryAfterMs || null;\n  }\n}\n\nfunction parseRetryAfterMs(res){\n  const header = res.headers && res.headers.get ? res.headers.get(\"retry-after\") : null;\n  if (header){\n    const sec = Number(header);\n    if (Number.isFinite(sec)) return sec * 1000;\n  }\n  return null;\n}\n\n// Gemini는 종종 Retry-After 헤더 대신 에러 본문 안에 \"retryDelay\":\"20s\" 형태로 대기 시간을 알려준다.\nfunction extractRetryDelayFromMessage(msg){\n  if (!msg) return null;\n  const m = String(msg).match(/retryDelay\"?\\s*:\\s*\"?(\\d+(?:\\.\\d+)?)s/i);\n  return m ? Math.ceil(parseFloat(m[1]) * 1000) : null;\n}\n\nasync function readErrorBody(res){\n  try {\n    const j = await res.json();\n    return j?.error?.message || j?.error || JSON.stringify(j).slice(0, 300);\n  } catch {\n    try { return (await res.text()).slice(0, 300); } catch { return \"\"; }\n  }\n}\n\nasync function callClaude(base64, apiKey, systemPrompt, crops = []){\n  const content = [\n    { type: \"image\", source: { type: \"base64\", media_type: \"image/jpeg\", data: base64 } }\n  ];\n  crops.forEach(c => {\n    content.push({ type: \"text\", text: `[확대 영역: ${c.label}]` });\n    content.push({ type: \"image\", source: { type: \"base64\", media_type: \"image/jpeg\", data: c.base64 } });\n  });\n  content.push({\n    type: \"text\",\n    text: crops.length\n      ? \"이 고지서를 인식해서 JSON으로 출력해줘. 위에 제공된 확대 영역 이미지들도 함께 참고해서 계좌번호와 금액 숫자를 정확히 확인해라.\"\n      : \"이 고지서를 인식해서 JSON으로 출력해줘.\"\n  });\n  let res;\n  try {\n    res = await fetch(\"https://api.anthropic.com/v1/messages\", {\n      method: \"POST\",\n      headers: {\n        \"Content-Type\": \"application/json\",\n        \"x-api-key\": apiKey,\n        \"anthropic-version\": \"2023-06-01\",\n        \"anthropic-dangerous-direct-browser-access\": \"true\"\n      },\n      body: JSON.stringify({\n        model: \"claude-sonnet-5\",\n        max_tokens: 1000,\n        system: systemPrompt,\n        messages: [{ role: \"user\", content }]\n      })\n    });\n  } catch (networkErr){\n    throw new Error(`Claude API 요청 실패(네트워크/CORS): ${networkErr.message}`);\n  }\n  if (!res.ok){\n    const msg = await readErrorBody(res);\n    if (res.status === 429){\n      throw new RateLimitError(`Claude API 요청 한도 초과 (429) ${msg}`, parseRetryAfterMs(res));\n    }\n    throw new Error(`Claude API 오류 (${res.status}) ${msg}`);\n  }\n  const data = await res.json();\n  const textBlock = (data.content || []).find(b => b.type === \"text\");\n  if (!textBlock) throw new Error(\"Claude 응답에 텍스트가 없습니다.\");\n  return extractJson(textBlock.text);\n}\n\nasync function callGemini(base64, apiKey, systemPrompt, crops = []){\n  const model = $(\"#geminiModel\").value || \"gemini-3.6-flash\";\n  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;\n  const introText = crops.length\n    ? systemPrompt + \"\\n\\n아래에 전체 이미지에 이어서 계좌·금액 부분을 확대한 참고 이미지들도 함께 제공된다. 함께 참고해서 계좌번호와 금액 숫자를 정확히 확인한 뒤, 이 고지서를 인식해서 JSON으로 출력해줘.\"\n    : systemPrompt + \"\\n\\n이 고지서를 인식해서 JSON으로 출력해줘.\";\n  const parts = [\n    { text: introText },\n    { inline_data: { mime_type: \"image/jpeg\", data: base64 } }\n  ];\n  crops.forEach(c => {\n    parts.push({ text: `[확대 영역: ${c.label}]` });\n    parts.push({ inline_data: { mime_type: \"image/jpeg\", data: c.base64 } });\n  });\n  let res;\n  try {\n    res = await fetch(url, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify({\n        contents: [{ parts }],\n        generationConfig: { responseMimeType: \"application/json\", temperature: 0.1 }\n      })\n    });\n  } catch (networkErr){\n    throw new Error(`Gemini API 요청 실패(네트워크): ${networkErr.message}`);\n  }\n  if (!res.ok){\n    const msg = await readErrorBody(res);\n    if (res.status === 429){\n      throw new RateLimitError(`Gemini API 요청 한도 초과 (429) ${msg}`, parseRetryAfterMs(res) || extractRetryDelayFromMessage(msg));\n    }\n    throw new Error(`Gemini API 오류 (${res.status}) ${msg}`);\n  }\n  const data = await res.json();\n  const cand = data?.candidates?.[0];\n  if (cand?.finishReason && cand.finishReason !== \"STOP\"){\n    throw new Error(`Gemini 응답이 완료되지 않음 (${cand.finishReason})`);\n  }\n  const text = cand?.content?.parts?.map(p => p.text || \"\").join(\"\") || \"\";\n  if (!text) throw new Error(\"Gemini 응답에 텍스트가 없습니다. (안전 필터에 걸렸을 수 있음)\");\n  return extractJson(text);\n}\n\nasync function recognizeBill(base64, systemPrompt, crops = []){\n  const provider = providerSel.value;\n  const apiKey = $(\"#apikey\").value.trim();\n  if (!apiKey) throw new Error(`API 키를 먼저 입력하세요 (${provider === \"gemini\" ? \"Google AI Studio\" : \"Anthropic Console\"})`);\n  return provider === \"gemini\" ? callGemini(base64, apiKey, systemPrompt, crops) : callClaude(base64, apiKey, systemPrompt, crops);\n}\n\nfunction sleep(ms){ return new Promise(r => setTimeout(r, ms)); }\n\n// ---- 인식 처리 ----\nasync function getRowBase64(row){\n  return row.kind === \"pdfpage\" ? row.base64 : fileToResizedBase64(row.file);\n}\n\n// 429(요청 한도 초과)를 만나면 곧바로 실패 처리하지 않고, 안내된 대기시간(또는 지수 백오프)만큼\n// 기다렸다가 같은 장을 다시 시도한다. 화면에는 \"N초 후 재시도 중…\"으로 진행 상황을 보여준다.\nasync function recognizeWithRetry(row, base64, prompt, crops, maxRetries = 4){\n  let attempt = 0;\n  while (true){\n    try {\n      return await recognizeBill(base64, prompt, crops);\n    } catch (err){\n      if (err.isRateLimit && attempt \u003c maxRetries){\n        attempt += 1;\n        const waitMs = Math.min(60000, err.retryAfterMs || 4000 * Math.pow(2, attempt));\n        row.status = \"인식중\";\n        row.error = `요청 한도(429) 초과 — ${Math.ceil(waitMs / 1000)}초 후 자동 재시도 (${attempt}/${maxRetries})`;\n        render();\n        await sleep(waitMs);\n        continue;\n      }\n      throw err;\n    }\n  }\n}\n\n// 원본보다 훨씬 큰 해상도(최대 3200px)의 이미지. 계좌번호 정밀 재확인용 확대 크롭은 이 이미지에서 잘라낸다.\n// (기본 1600px 이미지를 3배 확대해봐야 새 디테일이 생기지 않아 5/6 구분이 개선되지 않는다.)\nasync function getRowHiBase64(row){\n  if (row.kind === \"pdfpage\") return row.hiBase64 || row.base64;\n  return fileToResizedBase64(row.file, 3200, 0.92);\n}\n\n// 1차 결과의 농협 계좌 위치를 고해상도 원본에서 잘라 확대한 뒤, 그 부분만 다시 읽어 교차 검증한다.\n// 반환: { account, note, mismatch } 또는 null(재확인 불가 → 1차 결과 유지)\nasync function verifyAccountByCrop(row, result, prompt){\n  const b = result && result.농협계좌_위치;\n  const first = (result.농협계좌번호 || \"\").toString().trim();\n  if (!first || !b || !(b.w > 0) || !(b.h > 0)) return null;\n  const hi = await getRowHiBase64(row);\n  let img;\n  try { img = await loadImageFromBase64(hi); } catch { return null; }\n  // 위치 추정 오차와 은행명 줄 포함을 위해 좌우·상하를 넉넉히 확장\n  const clamp = v => Math.min(1, Math.max(0, v));\n  const x0 = clamp(b.x - 0.22), x1 = clamp(b.x + b.w + 0.08);\n  const y0 = clamp(b.y - b.h * 0.7), y1 = clamp(b.y + b.h * 1.7); // 이웃 은행 줄(기업은행 등)이 덜 섞이도록 상하 범위 축소\n  const sx = Math.round(x0 * img.naturalWidth), sy = Math.round(y0 * img.naturalHeight);\n  const sw = Math.max(1, Math.round((x1 - x0) * img.naturalWidth));\n  const sh = Math.max(1, Math.round((y1 - y0) * img.naturalHeight));\n  const scale = Math.min(3, 1400 / Math.max(sw, sh));\n  const c = document.createElement(\"canvas\");\n  c.width = Math.max(1, Math.round(sw * scale)); c.height = Math.max(1, Math.round(sh * scale));\n  const ctx = c.getContext(\"2d\");\n  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = \"high\";\n  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);\n  const cropB64 = c.toDataURL(\"image/jpeg\", 0.95).split(\",\")[1];\n  const r2 = await recognizeWithRetry(row, cropB64, ACCOUNT_VERIFY_PROMPT, []);\n  const second = (r2.계좌번호 || \"\").toString().trim();\n  const label = (r2.은행표기 || \"\").toString();\n  const dg = v => (v || \"\").toString().replace(/\\D/g, \"\");\n  const d1 = dg(first), d2 = dg(second);\n  const ibk = dg(r2.기업은행계좌번호) || dg(result.기업은행계좌번호);\n  // 재확인 값이 기업은행 번호이거나, 옆 은행명에 \"농\"이 없으면 채택하지 않는다\n  const secondBad = !second || (ibk && d2 === ibk) || (label && !/농|NH/i.test(label));\n  const firstBad = ibk && d1 === ibk;\n  if (secondBad){\n    if (firstBad) return { account: \"\", mismatch: true,\n      note: \"농협 줄로 읽은 번호가 기업은행 번호와 같아 비웠습니다. 고지서에서 농협 줄을 직접 확인해 입력하세요.\" };\n    return null; // 1차 결과 유지\n  }\n  if (d1 === d2) return { account: first, note: \"\", mismatch: false };\n  return { account: second, mismatch: true,\n           note: `계좌번호 재확인 불일치: 1차 ${first} → 확대 재판독 ${second} (5/6/8 등 숫자 직접 확인 권장)` };\n}\n\n// 은행별 목록 중 은행명이 농협인 줄만 선택한다 (기업은행·전북은행 등 다른 줄은 절대 채택하지 않음).\nfunction applyNonghyupOnly(result){\n  const list = Array.isArray(result && result.은행별계좌) ? result.은행별계좌 : null;\n  if (!list || !list.length) return; // 목록이 없으면 기존 인식값 유지(아래 은행표기 검증이 방어)\n  const isNH = name => {\n    const n = (name || \"\").toString().replace(/\\s/g, \"\");\n    return /농협|NH/i.test(n) && !/증권|투자|캐피탈|생명|손해|카드/.test(n);\n  };\n  const digits = v => (v || \"\").toString().replace(/\\D/g, \"\");\n  const nh = list.filter(it => it && isNH(it.은행) && digits(it.계좌번호));\n  const others = new Set(list.filter(it => it && !isNH(it.은행)).map(it => digits(it.계좌번호)).filter(Boolean));\n  const pick = nh.find(it => !others.has(digits(it.계좌번호)));\n  result.농협계좌번호 = pick ? pick.계좌번호.toString().trim() : \"\";\n  const ibk = list.find(it => it && /기업|IBK/i.test((it.은행 || \"\").toString()));\n  if (ibk) result.기업은행계좌번호 = ibk.계좌번호;\n  if (!pick) result.농협_은행표기 = \"\";\n}\n\nasync function processOne(row){\n  row.status = \"인식중\"; row.error = \"\"; render();\n  const t = currentType();\n  const useCrops = !useCropsCheckbox || useCropsCheckbox.checked;\n  try {\n    const base64 = await getRowBase64(row); // 표시·재인식용 원본 (최대 1600px, 크롭도 이 원본에서 잘라냄)\n    const budget = getImageBudget();\n    const cropSrc = (useCrops && t.focusRegions && t.focusRegions.length) ? await getRowHiBase64(row) : base64;\n    const crops = useCrops ? await cropFocusRegions(cropSrc, t.focusRegions, budget.cropMaxDim, budget.cropQuality) : [];\n    const apiBase64 = await shrinkForApi(base64, budget.mainMaxDim, budget.mainQuality); // 실제 전송용은 절약모드에서 더 축소\n    const result = await recognizeWithRetry(row, apiBase64, t.prompt, crops);\n    applyNonghyupOnly(result); // 은행별 목록에서 농협 줄만 코드로 선택\n\n    // 계좌번호 2단계 재확인 (고해상도 확대 크롭으로 다시 읽어 1차 결과와 비교)\n    let verifyNote = \"\", verifyMismatch = false;\n    if (t.verifyAccount && $(\"#verifyAcct\") && $(\"#verifyAcct\").checked){\n      try {\n        const v = await verifyAccountByCrop(row, result, t.prompt);\n        if (v){ result.농협계좌번호 = v.account; verifyNote = v.note; verifyMismatch = v.mismatch; }\n      } catch (e){ /* 재확인 실패해도 1차 결과로 계속 진행 */ }\n    }\n\n    // 고지서 종류별 고정값은 항상 유지\n    Object.assign(row.data, t.defaults);\n\n    const { checks } = t.mapResult(row, result);\n    row.data.holder = clampHolder(row.data.holder); // 종류에 상관없이 예금주명 10자 제한을 최종적으로 한 번 더 보장\n    if (verifyNote) row.aiMemo = [verifyNote, row.aiMemo].filter(Boolean).join(\" · \");\n    const failed = (checks || []).find(c => !c.ok) ||\n      (verifyMismatch ? { msg: \"계좌번호를 두 번 읽은 결과가 달라요. 5/6/8 등 숫자를 원본과 대조해 확인하세요.\" } : null);\n\n    if (failed){\n      row.status = \"확인필요\";\n      row.error = failed.msg;\n    } else {\n      row.status = \"완료\";\n    }\n  } catch (err){\n    row.status = \"오류\"; row.error = err.message;\n  }\n  render();\n}\n\nasync function processAll(){\n  const btn = $(\"#processBtn\");\n  btn.disabled = true;\n  const targets = rows.filter(r => r.status === \"대기\" || r.status === \"오류\" || r.status === \"확인필요\");\n  const pacingMs = Math.max(300, Math.round((parseFloat(pacingInput.value) || 7) * 1000));\n  for (const row of targets){\n    // eslint-disable-next-line no-await-in-loop\n    await processOne(row);\n    await sleep(pacingMs); // 연속 호출 시 API 속도 제한(429) 방지용 지연 — \"요청 간격\" 설정값 사용\n  }\n  btn.disabled = false;\n}\n\n// ---- 렌더 ----\nfunction render(){\n  const has = rows.length > 0;\n  toolbar.style.display = has ? \"flex\" : \"none\";\n  tablewrap.style.display = has ? \"block\" : \"none\";\n  emptyState.style.display = has ? \"none\" : \"flex\";\n  if (!has) return;\n\n  const done = rows.filter(r => r.status === \"완료\").length;\n  const warn = rows.filter(r => r.status === \"확인필요\").length;\n  const err = rows.filter(r => r.status === \"오류\").length;\n  statsEl.innerHTML = `\u003cspan class=\"badge\">전체 ${rows.length}\u003c/span>` +\n    `\u003cspan class=\"badge\" style=\"color:var(--teal)\">완료 ${done}\u003c/span>` +\n    (warn ? `\u003cspan class=\"badge\" style=\"color:#B5842F\">확인필요 ${warn}\u003c/span>` : \"\") +\n    (err ? `\u003cspan class=\"badge\" style=\"color:var(--rust)\">오류 ${err}\u003c/span>` : \"\");\n\n  bodyRows.innerHTML = rows.map(r => {\n    const cells = FIELD_KEYS.map(k => {\n      if (k === \"bank\") {\n        const options = BANK_CODES.map(b => `\u003coption value=\"${b}\" ${r.data.bank===b?\"selected\":\"\"}>${b}\u003c/option>`).join(\"\");\n        return `\u003ctd>\u003cselect class=\"cellinput\" data-id=\"${r.id}\" data-key=\"bank\" style=\"min-width:120px\">\n          \u003coption value=\"\">${r.data.bank && !BANK_CODES.includes(r.data.bank) ? esc(r.data.bank) : \"선택\"}\u003c/option>\n          ${options}\n        \u003c/select>\u003c/td>`;\n      }\n      const extraAttrs = k === \"holder\" ? ` maxlength=\"${HOLDER_MAX_LEN}\" title=\"예금주명은 e호조 등 회계 시스템 호환을 위해 기호 포함 최대 ${HOLDER_MAX_LEN}자까지만 입력됩니다.\"` : \"\";\n      return `\u003ctd>\u003cinput class=\"cellinput\" data-id=\"${r.id}\" data-key=\"${k}\" value=\"${esc(r.data[k])}\"${extraAttrs}>\u003c/td>`;\n    }).join(\"\");\n    const trCls = (r.status === \"오류\" || r.status === \"확인필요\") ? ' class=\"row-err\"' : \"\";\n    return `\u003ctr${trCls}>\n      \u003ctd>\u003cimg class=\"thumb\" data-id=\"${r.id}\" src=\"${r.thumb}\">\u003c/td>\n      \u003ctd>\u003cspan class=\"statusbadge st-${r.status}\" title=\"${esc(r.error)}\">${r.status}\u003c/span>\u003c/td>\n      ${cells}\n      \u003ctd class=\"memo-col\" title=\"${esc(r.aiMemo)}\">${esc(r.aiMemo)}\u003c/td>\n      \u003ctd>\n        \u003cdiv style=\"display:flex;gap:4px;\">\n          \u003cbutton class=\"btn-icon\" data-act=\"retry\" data-id=\"${r.id}\" title=\"재인식\">↻\u003c/button>\n          \u003cbutton class=\"btn-icon\" data-act=\"del\" data-id=\"${r.id}\" title=\"삭제\">✕\u003c/button>\n        \u003c/div>\n      \u003c/td>\n    \u003c/tr>`;\n  }).join(\"\");\n}\n\nfunction esc(s){\n  return (s ?? \"\").toString().replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\n}\n\n// ---- 셀 편집 / 액션 위임 ----\nbodyRows.addEventListener(\"input\", e => {\n  const el = e.target;\n  if (!el.dataset.id) return;\n  const row = rows.find(r => r.id == el.dataset.id);\n  if (!row) return;\n  let value = el.value;\n  if (el.dataset.key === \"holder\" && value.length > HOLDER_MAX_LEN){\n    value = clampHolder(value);\n    el.value = value; // 붙여넣기 등으로 10자를 넘기면 입력창에서도 바로 잘라서 보여준다\n  }\n  row.data[el.dataset.key] = value;\n});\nbodyRows.addEventListener(\"change\", e => {\n  const el = e.target;\n  if (el.tagName === \"SELECT\" && el.dataset.id){\n    const row = rows.find(r => r.id == el.dataset.id);\n    if (row) row.data.bank = el.value;\n  }\n});\nbodyRows.addEventListener(\"click\", e => {\n  const thumb = e.target.closest(\"img.thumb\");\n  if (thumb){\n    lightboxImg.src = thumb.src;\n    lightbox.style.display = \"flex\";\n    return;\n  }\n  const btn = e.target.closest(\"button[data-act]\");\n  if (!btn) return;\n  const row = rows.find(r => r.id == btn.dataset.id);\n  if (!row) return;\n  if (btn.dataset.act === \"retry\") processOne(row);\n  if (btn.dataset.act === \"del\") { rows = rows.filter(r => r.id !== row.id); render(); }\n});\n\n$(\"#clearBtn\").addEventListener(\"click\", () => { rows = []; render(); });\n$(\"#processBtn\").addEventListener(\"click\", processAll);\n\n// 금액 관련 열(공급가액/부가세액/공제액/지출액)은 엑셀에서 텍스트가 아니라\n// 실제 숫자로 들어가야 SUM 등으로 합계 계산이 가능하고, 천단위 콤마(회계 표시형식)로 보인다.\nconst NUMERIC_KEYS = [\"supply\", \"vat\", \"deduct\", \"payout\"];\nfunction toNumericCell(rawValue){\n  if (rawValue === \"\" || rawValue === null || rawValue === undefined) return \"\";\n  const n = Number(String(rawValue).replace(/,/g, \"\").trim());\n  return Number.isFinite(n) ? n : rawValue; // 숫자로 못 바꾸면 원래 값(문자) 그대로 둠\n}\n\n// ---- 엑셀 내보내기 (원본과 동일한 3개 시트: 거래처입력 / 거래처입력설명 / 은행코드_참고자료) ----\n$(\"#exportBtn\").addEventListener(\"click\", () => {\n  if (rows.length === 0) return;\n\n  // 1. 거래처입력\n  const dataRows = rows.map(r => FIELD_KEYS.map(k => {\n    const raw = r.data[k] || \"\";\n    return NUMERIC_KEYS.includes(k) ? toNumericCell(raw) : raw;\n  }));\n  const ws1 = XLSX.utils.aoa_to_sheet([HEADERS, ...dataRows]);\n  ws1[\"!cols\"] = FIELD_KEYS.map(k => ({ wch: Math.max(12, Math.round((FIELD_WIDTH[k]||100)/7)) }));\n\n  // 금액 열은 셀 표시형식을 \"#,##0\" (회계/숫자, 천단위 콤마)로 지정해서\n  // 엑셀에서 열자마자 숫자로 보이고 합계(SUM)도 바로 계산되게 한다.\n  NUMERIC_KEYS.forEach(k => {\n    const colIdx = FIELD_KEYS.indexOf(k);\n    if (colIdx === -1) return;\n    for (let r = 1; r \u003c= dataRows.length; r++){\n      const addr = XLSX.utils.encode_cell({ r, c: colIdx });\n      const cell = ws1[addr];\n      if (cell && cell.t === \"n\"){\n        cell.z = \"#,##0\";\n      }\n    }\n  });\n\n  // 2. 거래처입력설명\n  const ws2 = XLSX.utils.aoa_to_sheet(DESC_ROWS.map(row => row.map(c => c === undefined ? null : c)));\n\n  // 3. 은행코드_참고자료\n  const ws3 = XLSX.utils.aoa_to_sheet([[\"은행코드\"], ...BANK_CODES.map(b => [b])]);\n\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws1, \"거래처입력\");\n  XLSX.utils.book_append_sheet(wb, ws2, \"거래처입력설명\");\n  XLSX.utils.book_append_sheet(wb, ws3, \"은행코드_참고자료\");\n\n  const today = new Date();\n  const stamp = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,\"0\")}${String(today.getDate()).padStart(2,\"0\")}`;\n  XLSX.writeFile(wb, `${currentType().exportPrefix}_${stamp}.xlsx`);\n});\n\u003c/script>\n\u003cscript>\n/* 셸 '설정'에 저장해 둔 AI 키가 있으면 자동으로 채운다 */\n(function(){\n  var prov=document.getElementById('provider'), key=document.getElementById('apikey');\n  function fill(){\n    if(!prov||!key||!window.suiteKey) return;\n    var k=window.suiteKey(prov.value==='gemini'?'gemini':'claude');\n    key.value=k||'';\n  }\n  window.addEventListener('load', fill);\n  if(prov) prov.addEventListener('change', fill);\n})();\n\u003c/script>\n\n\u003cscript>\n/* 도구 페이지 ↔ 셸 연결 (빌드 때 각 도구 안에 끼워 넣습니다)\n   · 내용 높이를 셸에 알려 iframe 높이를 맞춘다\n   · 셸의 다크 모드 / 보고 있는 화면 영역(모달 위치)을 받아 적용한다\n   · 셸 '설정'에서 저장한 API 키를 도구가 읽을 수 있게 한다  → window.suiteKey('kakao') */\n(function(){\n  var TOOL = (document.querySelector('meta[name=\"tool-id\"]') || {}).content || '';\n  var root = document.documentElement;\n  document.body.classList.add('tool');\n\n  function applyTheme(dark){ root.classList.toggle('dark', !!dark); }\n  function applyViewport(v){\n    if(!v) return;\n    root.style.setProperty('--vp-top', Math.max(0, v.top) + 'px');\n    root.style.setProperty('--vp-h', Math.max(200, v.height) + 'px');\n  }\n  try{ applyTheme(window.parent.document.documentElement.classList.contains('dark')); }catch(e){}\n\n  window.addEventListener('message', function(e){\n    var d = e.data;\n    if(!d) return;\n    if('__theme' in d) applyTheme(d.__theme === 'dark');\n    if(d.__viewport) applyViewport(d.__viewport);\n  });\n\n  /* ---- 높이 알림 ---- */\n  var last = -1, raf = 0;\n  function post(){\n    raf = 0;\n    var b = document.body;\n    var h = Math.ceil(b.getBoundingClientRect().height + parseFloat(getComputedStyle(b).marginTop || 0) + parseFloat(getComputedStyle(b).marginBottom || 0));\n    if(h === last) return;\n    last = h;\n    try{ window.parent.postMessage({__tabHeight:h, __tabId:TOOL}, '*'); }catch(e){}\n  }\n  function schedule(){ if(!raf) raf = requestAnimationFrame(post); }\n  window.addEventListener('load', function(){ schedule(); try{ window.parent.postMessage({__ready:true, __tabId:TOOL}, '*'); }catch(e){} });\n  window.addEventListener('resize', schedule);\n  if(window.ResizeObserver) new ResizeObserver(schedule).observe(document.body);\n  if(window.MutationObserver) new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true, attributes:true, characterData:true});\n\n  /* ---- 공용 설정(API 키) ---- */\n  window.suiteKey = function(name){\n    try{\n      var o = JSON.parse(localStorage.getItem('suite.keys') || '{}');\n      return (o && o[name]) || '';\n    }catch(e){ return ''; }\n  };\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="tool-data-blur">"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>HWPX 얼굴 자동 블러 도구\u003c/title>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js\">\u003c/script>\n\u003cstyle>\n/* ==========================================================================\n   1. Design Tokens\n   ========================================================================== */\n:root{--surface-hover:var(--hover);--surface-sunken:var(--surface-2);--text-secondary:var(--text-2);--text-tertiary:var(--text-3);--primary-dim:var(--primary-tint);--success-dim:var(--success-tint);--warning-dim:var(--warning-tint);--danger-dim:var(--danger-tint);--shadow-sm:var(--shadow-card);--seal:var(--danger);--ink:var(--text);--pine:var(--primary);--paper:var(--bg);}\n\n/* ==========================================================================\n   2. Reset\n   ========================================================================== */\n*, *::before, *::after{ box-sizing:border-box; }\nhtml,body{ height:100%; }\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--text);\n  font-family:var(--font);\n  font-size:14px;\n  line-height:1.5;\n  -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,p{ margin:0; }\nbutton{ font-family:inherit; }\ninput, select{ font-family:inherit; }\n.icon{ width:18px; height:18px; flex:none; }\n.icon-sm{ width:14px; height:14px; flex:none; }\n.icon-lg{ width:34px; height:34px; flex:none; }\nsvg.icon, svg.icon-sm, svg.icon-lg{\n  fill:none; stroke:currentColor; stroke-width:1.7;\n  stroke-linecap:round; stroke-linejoin:round;\n}\n\n/* ==========================================================================\n   3. Layout\n   ========================================================================== */\n.app{\n  display:flex;\n  min-height:100vh;\n}\n.main{\n  flex:1;\n  min-width:0;\n  display:flex;\n  flex-direction:column;\n}\n.content{\n  padding:28px 36px 60px;\n  max-width:1180px;\n  width:100%;\n  margin:0 auto;\n}\n.grid-2col{\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:16px;\n  align-items:start;\n}\n.stack{ display:flex; flex-direction:column; gap:16px; }\n.section-gap{ margin-top:16px; }\n\n/* ==========================================================================\n   4. Sidebar\n   ========================================================================== */\n.sidebar{\n  width:var(--sidebar-w);\n  flex:none;\n  background:var(--surface);\n  border-right:1px solid var(--border);\n  display:flex;\n  flex-direction:column;\n  padding:18px 14px;\n  position:sticky;\n  top:0;\n  height:100vh;\n}\n.sidebar-brand{\n  display:flex;\n  align-items:center;\n  gap:10px;\n  padding:4px 8px 18px;\n}\n.brand-mark{\n  width:32px; height:32px;\n  border-radius:8px;\n  background:var(--primary);\n  color:#fff;\n  display:flex; align-items:center; justify-content:center;\n  font-weight:700; font-size:13px;\n  flex:none;\n  letter-spacing:.01em;\n}\n.brand-text{ min-width:0; }\n.brand-name{\n  font-size:13.5px; font-weight:600; color:var(--text);\n  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\n}\n.brand-version{\n  font-size:11px; color:var(--text-tertiary); margin-top:1px;\n}\n.sidebar-nav{\n  display:flex; flex-direction:column; gap:2px;\n  margin-top:4px;\n}\n.nav-item{\n  display:flex; align-items:center; gap:10px;\n  border:none; background:none; cursor:pointer;\n  width:100%; text-align:left;\n  padding:9px 10px;\n  border-radius:7px;\n  font-size:13.5px; color:var(--text-secondary);\n  transition:background .12s, color .12s;\n}\n.nav-item .icon{ color:var(--text-tertiary); }\n.nav-item:hover{ background:var(--surface-hover); color:var(--text); }\n.nav-item.active{\n  background:var(--primary-dim);\n  color:var(--primary);\n  font-weight:600;\n}\n.nav-item.active .icon{ color:var(--primary); }\n.sidebar-spacer{ flex:1; }\n.sidebar-footer{\n  display:flex; flex-direction:column; gap:12px;\n  padding-top:12px;\n}\n.status-dot{\n  width:8px; height:8px; border-radius:50%;\n  background:var(--text-tertiary);\n  flex:none;\n  transition:background .2s;\n}\n.status-dot.active{ background:var(--primary); animation:pulseDot 1.4s ease-in-out infinite; }\n.status-dot.done{ background:var(--success); }\n.status-dot.error{ background:var(--danger); }\n@keyframes pulseDot{\n  0%,100%{ opacity:1; }\n  50%{ opacity:.35; }\n}\n.status-card{\n  border:1px solid var(--border);\n  border-radius:10px;\n  background:var(--surface-sunken);\n  padding:11px 12px;\n}\n.status-card-head{\n  display:flex; align-items:center; gap:8px;\n  font-size:12.5px; font-weight:600; color:var(--text);\n}\n.status-card-body{\n  font-size:12px; color:var(--text-secondary);\n  margin-top:5px; padding-left:16px;\n}\n.sidebar-note{\n  font-size:11px; color:var(--text-tertiary);\n  line-height:1.5; padding:0 2px;\n}\n\n/* ==========================================================================\n   5. Header\n   ========================================================================== */\n.topbar{\n  display:flex; align-items:flex-start; justify-content:space-between;\n  gap:16px;\n  padding:26px 36px 0;\n  max-width:1180px; width:100%; margin:0 auto;\n}\n.breadcrumb{\n  font-size:12px; color:var(--text-tertiary);\n  margin-bottom:8px;\n}\n.page-title{\n  font-size:26px; font-weight:700; letter-spacing:-.01em; color:var(--text);\n}\n.page-desc{\n  font-size:13.5px; color:var(--text-secondary);\n  margin-top:6px;\n  max-width:560px;\n}\n.btn-ghost{\n  display:flex; align-items:center; gap:6px;\n  background:var(--surface);\n  border:1px solid var(--border);\n  color:var(--text-secondary);\n  font-size:13px; font-weight:500;\n  padding:8px 13px;\n  border-radius:var(--radius-btn);\n  cursor:pointer;\n  flex:none;\n  transition:background .12s, border-color .12s;\n}\n.btn-ghost:hover{ background:var(--surface-hover); border-color:var(--border-strong); color:var(--text); }\n.guide-panel{\n  display:none;\n  max-width:1180px; width:100%; margin:14px auto 0;\n  padding:0 36px;\n}\n.guide-panel.open{ display:block; }\n.guide-panel-inner{\n  background:var(--primary-dim);\n  border:1px solid var(--primary-border);\n  border-radius:var(--radius-card);\n  padding:16px 18px;\n}\n.guide-panel-inner h3{\n  font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px;\n}\n.guide-steps{\n  display:flex; flex-wrap:wrap; gap:8px 4px; align-items:center;\n  font-size:12.5px; color:var(--text-secondary);\n}\n.guide-steps span.step{\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:999px;\n  padding:5px 11px;\n  color:var(--text);\n  white-space:nowrap;\n}\n.guide-steps span.arrow{ color:var(--text-tertiary); }\n\n/* ==========================================================================\n   6. Cards\n   ========================================================================== */\n.card{\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:var(--radius-card);\n  box-shadow:var(--shadow-card);\n  padding:20px;\n}\n.card-title{\n  font-size:13.5px; font-weight:700; color:var(--text);\n  margin-bottom:14px;\n}\n.card-subtitle{\n  font-size:12.5px; color:var(--text-secondary);\n  margin-top:-8px; margin-bottom:14px; line-height:1.6;\n}\n.divider{\n  border:none; border-top:1px solid var(--border);\n  margin:16px 0;\n}\n\n/* ==========================================================================\n   7. Upload\n   ========================================================================== */\n.dropzone{\n  border:1.5px dashed var(--border-strong);\n  border-radius:10px;\n  background:var(--surface-sunken);\n  padding:36px 20px;\n  text-align:center;\n  cursor:pointer;\n  transition:border-color .15s, background .15s;\n}\n.dropzone.hover{ border-color:var(--primary); background:var(--primary-dim); }\n.dropzone-icon{\n  width:52px; height:52px;\n  margin:0 auto 14px;\n  border-radius:50%;\n  background:var(--primary-dim);\n  color:var(--primary);\n  display:flex; align-items:center; justify-content:center;\n}\n.dropzone-title{ font-size:14.5px; font-weight:600; color:var(--text); }\n.dropzone-sub{ font-size:12.5px; color:var(--text-secondary); margin-top:4px; }\n.dropzone .btn-secondary{ margin-top:16px; }\n.dropzone-hint{ font-size:11.5px; color:var(--text-tertiary); margin-top:12px; }\n#fileInput{ display:none; }\n\n.file-card{\n  display:none;\n  margin-top:14px;\n  align-items:center;\n  gap:10px;\n  border:1px solid var(--border);\n  background:var(--surface-sunken);\n  border-radius:10px;\n  padding:12px 12px;\n}\n.file-card-icon{\n  width:34px; height:34px; flex:none;\n  border-radius:8px;\n  background:var(--primary-dim);\n  color:var(--primary);\n  display:flex; align-items:center; justify-content:center;\n}\n.file-card-info{ flex:1; min-width:0; }\n.file-card-name{\n  font-size:12.5px; color:var(--text);\n  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\n}\n.file-card-remove{\n  display:flex; align-items:center; gap:5px;\n  background:none; border:1px solid var(--border);\n  color:var(--text-secondary);\n  font-size:12px;\n  padding:6px 10px;\n  border-radius:7px;\n  cursor:pointer;\n  flex:none;\n  transition:background .12s, color .12s, border-color .12s;\n}\n.file-card-remove:hover{ background:var(--danger-dim); border-color:#f3c6c6; color:var(--danger); }\n\n/* ==========================================================================\n   8. Controls\n   ========================================================================== */\n.control-group{ margin-bottom:16px; }\n.control-group:last-child{ margin-bottom:0; }\n.control-label{\n  display:block;\n  font-size:12.5px; font-weight:600; color:var(--text);\n  margin-bottom:8px;\n}\n.select{\n  width:100%;\n  font-size:13px; color:var(--text);\n  padding:9px 11px;\n  border:1px solid var(--border);\n  border-radius:var(--radius-input);\n  background:var(--surface) url('data:image/svg+xml;utf8,\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"%236b7280\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpolyline points=\"6 9 12 15 18 9\"/>\u003c/svg>') no-repeat right 10px center;\n  background-size:16px;\n  appearance:none;\n  -webkit-appearance:none;\n  cursor:pointer;\n  transition:border-color .12s;\n}\n.select:hover{ border-color:var(--border-strong); }\n.select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-dim); }\n\n.segmented{\n  display:flex;\n  border:1px solid var(--border);\n  border-radius:var(--radius-input);\n  padding:3px;\n  background:var(--surface-sunken);\n  gap:3px;\n}\n.segmented-option{\n  flex:1;\n  position:relative;\n  text-align:center;\n  cursor:pointer;\n}\n.segmented-option input{\n  position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;\n}\n.segmented-option span{\n  display:block;\n  padding:8px 6px;\n  border-radius:6px;\n  font-size:13px;\n  color:var(--text-secondary);\n  transition:background .12s, color .12s, box-shadow .12s;\n}\n.segmented-option input:checked + span{\n  background:var(--surface);\n  color:var(--primary);\n  font-weight:600;\n  box-shadow:var(--shadow-sm);\n}\n.segmented-option input:focus-visible + span{\n  outline:2px solid var(--primary);\n  outline-offset:1px;\n}\n\n/* Model engine list */\n.model-list{ display:flex; flex-direction:column; gap:2px; }\n.model-row{\n  display:flex; align-items:center; gap:10px;\n  padding:9px 4px;\n  border-bottom:1px solid var(--border);\n  font-size:13px;\n}\n.model-row:last-child{ border-bottom:none; }\n.model-order{\n  font-size:11px; color:var(--text-tertiary);\n  width:18px; flex:none;\n}\n.model-name{ color:var(--text); flex:1; }\n.model-state{ font-size:12px; color:var(--text-tertiary); flex:none; }\n.model-state.done{ color:var(--success); }\n.model-state.active{ color:var(--primary); }\n.model-state.error{ color:var(--warning); }\n.model-note{\n  font-size:12px; color:var(--text-secondary); line-height:1.6;\n  margin-top:12px;\n}\n\n/* ==========================================================================\n   9. Buttons\n   ========================================================================== */\nbutton.run{\n  display:flex; align-items:center; justify-content:center; gap:8px;\n  width:100%;\n  background:var(--primary);\n  color:#fff;\n  border:none;\n  padding:12px;\n  font-size:14px;\n  font-weight:600;\n  border-radius:var(--radius-btn);\n  cursor:pointer;\n  font-family:inherit;\n  transition:background .12s;\n}\nbutton.run:hover:not(:disabled){ background:var(--primary-hover); }\nbutton.run:disabled{ background:var(--border-strong); color:var(--text-tertiary); cursor:not-allowed; }\n\n.btn-secondary{\n  background:var(--surface);\n  border:1px solid var(--border);\n  color:var(--text);\n  font-size:13px; font-weight:600;\n  padding:9px 16px;\n  border-radius:var(--radius-btn);\n  cursor:pointer;\n  transition:background .12s, border-color .12s;\n}\n.btn-secondary:hover{ background:var(--surface-hover); border-color:var(--border-strong); }\n\n/* ==========================================================================\n   10. Progress\n   ========================================================================== */\n.progress-wrap{\n  display:none;\n  margin-top:16px;\n}\n.progress-track{\n  height:7px;\n  background:var(--border);\n  border-radius:999px;\n  overflow:hidden;\n}\n.progress-fill{\n  height:100%; width:0%;\n  background:var(--primary);\n  border-radius:999px;\n  transition:width .25s ease;\n}\n.progress-meta{\n  display:flex; justify-content:space-between;\n  font-size:11.5px; color:var(--text-tertiary);\n  margin-top:7px;\n}\n\n/* ==========================================================================\n   11. Logs\n   ========================================================================== */\n.log-panel{\n  font-family:var(--mono);\n  font-size:11.5px;\n  line-height:1.85;\n  color:var(--text-secondary);\n  background:var(--surface-sunken);\n  border:1px solid var(--border);\n  border-radius:10px;\n  padding:12px 14px;\n  max-height:230px;\n  overflow-y:auto;\n  white-space:pre-wrap;\n  margin-top:14px;\n}\n.log-panel > div{ padding-left:15px; position:relative; }\n.log-panel > div::before{\n  content:'';\n  position:absolute; left:0; top:8px;\n  width:5px; height:5px; border-radius:50%;\n  background:var(--text-tertiary);\n}\n.log-panel > div.ok{ color:var(--success); }\n.log-panel > div.ok::before{ background:var(--success); }\n.log-panel > div.warn{ color:var(--warning); }\n.log-panel > div.warn::before{ background:var(--warning); }\n.log-panel > div.err{ color:var(--danger); }\n.log-panel > div.err::before{ background:var(--danger); }\n\n/* ==========================================================================\n   12. Review\n   ========================================================================== */\n.reviewItem{\n  border:1px solid var(--border);\n  border-radius:10px;\n  padding:14px;\n  margin-bottom:12px;\n  background:var(--surface-sunken);\n}\n.reviewItem .fname{\n  font-size:12px; color:var(--text-secondary);\n  display:flex; justify-content:space-between; margin-bottom:10px;\n}\n.reviewItem .fname span.cnt{ color:var(--primary); font-weight:700; }\n.reviewItem canvas{\n  display:block; max-width:100%;\n  border:1px solid var(--border);\n  border-radius:8px;\n  cursor:crosshair; background:var(--surface-hover);\n  touch-action:none;\n}\n.review-hint{\n  font-size:12.5px; color:var(--text-secondary); line-height:1.7;\n  margin:-6px 0 16px;\n}\n\n/* ==========================================================================\n   13. Result\n   =============================
