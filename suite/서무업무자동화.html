<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서무 업무 자동화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* 첫 화면이 깜빡이지 않도록 다크 모드를 가장 먼저 적용 */
try{
  var t = localStorage.getItem('suite.theme');
  if(t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)){
    document.documentElement.classList.add('dark');
  }
}catch(e){}
</script>
<style>
/* ==========================================================================
   서무 업무 자동화 — 공통 디자인 시스템
   셸(index)과 모든 도구 페이지가 이 파일 하나를 공유합니다.
   · 색/글꼴/모서리는 아래 토큰(:root)만 바꾸면 전체가 함께 바뀝니다.
   · 도구마다 다르게 부르던 클래스 이름(.btn-primary / .run / .btn.outline …)도
     여기서 한 모양으로 묶습니다. 도구 CSS 뒤에 불러오므로 같은 점수면 이 파일이 이깁니다.
   ========================================================================== */

/* ---------- 1. 토큰 ---------- */
:root{
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --surface-3:#EEF1F5;
  --hover:#F3F4F6;
  --border:#E5E7EB;
  --border-strong:#D5D9E0;

  --text:#111827;
  --text-2:#6B7280;
  --text-3:#9CA3AF;

  --primary:#2563EB;
  --primary-hover:#1D4ED8;
  --primary-tint:#EFF4FE;
  --primary-tint-strong:#E1EAFD;
  --primary-border:#C7D9FC;

  --success:#16A34A;
  --success-tint:#EAFBF2;
  --warning:#D97706;
  --warning-tint:#FDF1DE;
  --danger:#DC2626;
  --danger-hover:#B91C1C;
  --danger-tint:#FDEEEE;

  --radius-sm:8px;
  --radius-btn:10px;
  --radius-input:10px;
  --radius-card:16px;
  --radius-modal:20px;

  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);
  --shadow-pop:0 16px 40px rgba(17,24,39,.16), 0 2px 8px rgba(17,24,39,.06);

  --font:'Noto Sans KR','Pretendard Variable','Segoe UI','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;

  /* 보고 있는 화면 영역(iframe 안에서 모달·토스트 위치를 잡을 때 셸이 갱신) */
  --vp-top:0px;
  --vp-h:100vh;

  color-scheme:light;
}
html.dark{
  --bg:#111418;
  --surface:#181C22;
  --surface-2:#1C2128;
  --surface-3:#242A33;
  --hover:#20242B;
  --border:#262B33;
  --border-strong:#343B46;

  --text:#E8EAED;
  --text-2:#9AA2AD;
  --text-3:#6B7280;

  --primary:#3B82F6;
  --primary-hover:#60A5FA;
  --primary-tint:#152238;
  --primary-tint-strong:#1B2B47;
  --primary-border:#27406B;

  --success:#22C55E;
  --success-tint:#0F2A1D;
  --warning:#F59E0B;
  --warning-tint:#2E2410;
  --danger:#EF4444;
  --danger-hover:#F87171;
  --danger-tint:#301616;

  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ---------- 2. 바탕 ---------- */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.55;
}
::selection{background:var(--primary-tint-strong);color:var(--text);}
a{color:var(--primary);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
svg{display:block;}
hr{border:none;border-top:1px solid var(--border);}
code{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:5px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:2px solid transparent;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

/* 도구 페이지 공통 틀: 셸이 제목을 보여 주므로 도구는 본문만 가진다 */
body.tool{background:transparent;padding:0 0 40px;}
body.tool .wrap,
body.tool .page{max-width:none;margin:0;padding:0;}

/* ---------- 3. 카드 / 패널 ---------- */
body .card,
body .panel,
body .step{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  padding:22px 24px;
  margin-bottom:16px;
}
body .card h2,
body .panel h2{
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  text-transform:none;color:var(--text);margin:0 0 6px;
}
body .card .sub,
body .panel .sub,
body .section-sub,
body .step-desc{color:var(--text-2);font-size:13px;line-height:1.65;}
body .card .sub{margin-bottom:16px;}

/* ---------- 4. 버튼 ---------- */
body .btn,
body .btn-primary,
body .btn-secondary,
body .btn-outline,
body .btn-ghost,
body .btn-export,
body button.run{
  --b-bg:var(--primary);--b-fg:#fff;--b-bd:var(--primary);--b-bg-h:var(--primary-hover);--b-bd-h:var(--primary-hover);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 16px;
  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;
  border-radius:var(--radius-btn);
  background:var(--b-bg);color:var(--b-fg);border:1px solid var(--b-bd);
  box-shadow:none;text-decoration:none;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease,transform 60ms ease;
}
body .btn:hover:not(:disabled):not(.disabled),
body .btn-primary:hover:not(:disabled),
body .btn-secondary:hover:not(:disabled),
body .btn-outline:hover:not(:disabled),
body .btn-ghost:hover:not(:disabled),
body .btn-export:hover:not(:disabled),
body button.run:hover:not(:disabled){background:var(--b-bg-h);border-color:var(--b-bd-h);color:var(--b-fg-h,var(--b-fg));box-shadow:none;}
body .btn:active:not(:disabled),
body .btn-primary:active:not(:disabled),
body button.run:active:not(:disabled){transform:translateY(1px);}
body .btn:disabled,body .btn[disabled],body .btn.disabled,
body .btn-primary:disabled,body .btn-secondary:disabled,body .btn-outline:disabled,
body .btn-ghost:disabled,body .btn-export:disabled,body button.run:disabled{
  opacity:.5;cursor:not-allowed;
}
/* 보조(연한 파랑) */
body .btn.outline,
body .btn-secondary,
body .btn-outline{--b-bg:var(--primary-tint);--b-fg:var(--primary);--b-bd:transparent;--b-bg-h:var(--primary-tint-strong);--b-bd-h:transparent;}
/* 낮은 우선순위(테두리) */
body .btn.ghost,
body .btn-ghost{--b-bg:var(--surface);--b-fg:var(--text-2);--b-bd:var(--border-strong);--b-bg-h:var(--hover);--b-bd-h:var(--border-strong);--b-fg-h:var(--text);}
/* 되돌릴 수 없는 동작 */
body .btn.danger{--b-bg:var(--surface);--b-fg:var(--danger);--b-bd:var(--danger);--b-bg-h:var(--danger-tint);--b-bd-h:var(--danger);}
/* 내려받기 완료형(초록) */
body .btn-export{--b-bg:var(--success);--b-fg:#fff;--b-bd:var(--success);--b-bg-h:var(--success);--b-bd-h:var(--success);}
body .btn-export:hover:not(:disabled){filter:brightness(.93);}
/* 크기 */
body .btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;gap:5px;}
body .btn-lg,body button.run{min-height:46px;font-size:14.5px;}
body button.run{width:100%;}
body .btn svg,body button.run svg{flex:none;}

/* 아이콘 단추 */
body .icon-btn,
body .btn-icon{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:32px;height:32px;min-height:0;padding:0;
  border-radius:var(--radius-sm);border:1px solid transparent;
  background:transparent;color:var(--text-2);cursor:pointer;box-shadow:none;
  transition:background .15s ease,color .15s ease;
}
body .icon-btn:hover,body .btn-icon:hover{background:var(--hover);color:var(--text);}
body .icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);}

/* ---------- 5. 입력 ---------- */
body input[type=text],
body input[type=number],
body input[type=password],
body input[type=search],
body input[type=date],
body input[type=time],
body input[type=month],
body input[type=email],
body input[type=tel],
body input:not([type]),
body select,
body textarea{
  font-family:inherit;font-size:13.5px;color:var(--text);
  background-color:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-input);
  transition:border-color .15s ease,box-shadow .15s ease;
}
body input::placeholder,body textarea::placeholder{color:var(--text-3);}
body input:hover:not(:focus):not([readonly]),body select:hover:not(:focus),body textarea:hover:not(:focus){border-color:var(--text-3);}
body input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-strong);}
body input[readonly]{background-color:var(--surface-2);color:var(--text-2);}
body select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;
  padding-right:32px !important;cursor:pointer;
}
body input[type=file]{display:none;}
body input[type=checkbox],body input[type=radio]{accent-color:var(--primary);}
body label{color:inherit;}

/* ---------- 6. 표 ---------- */
body table{border-collapse:collapse;font-variant-numeric:tabular-nums;}
body th{
  background:var(--surface-2);color:var(--text-2);
  font-weight:600;font-size:12px;
  border-bottom:1px solid var(--border-strong);
}
body td{border-color:var(--border);}
body tbody tr:hover{background:var(--hover);}
body .tablewrap,
body .table-scroll,
body .preview-wrap{
  border:1px solid var(--border);border-radius:var(--radius-input);background:var(--surface);
}
body td input,body td select{background-color:transparent;}
body td input:focus,body td select:focus{background-color:var(--surface);}

/* ---------- 7. 업로드 영역 ---------- */
body .dropzone,
body .drop-zone,
body .opt-dropzone{
  border:1.5px dashed var(--border-strong);
  border-radius:var(--radius-card);
  background:var(--surface-2);
  color:var(--text);
  transition:border-color .15s ease,background .15s ease;
}
body .dropzone:hover,body .drop-zone:hover,body .opt-dropzone:hover,
body .dropzone.drag,body .dropzone.dragover,body .dropzone.active,body .dropzone.hover,
body .drop-zone.drag,body .drop-zone.dragover,body .opt-dropzone.drag{
  border-color:var(--primary);background:var(--primary-tint);box-shadow:none;
}

/* ---------- 8. 안내 / 칩 / 배지 ---------- */
body .hint,
body .callout,
body .note,
body .tpl-status,
body .rules-note{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
  border-radius:var(--radius-input);
}
body .hint-warn{background:var(--warning-tint);border-color:transparent;color:var(--warning);}
body .caption,body .small{color:var(--text-3);}
body .pill,body .opt-badge,body .step-badge,body .step-no{border-radius:999px;}
body .step-badge,body .step-no{background:var(--primary);color:#fff;}
body .opt-badge{background:var(--surface-3);color:var(--text-2);}
body .summary-box,body .summary-card{
  background:var(--primary-tint);border:1px solid transparent;border-radius:var(--radius-input);
}
body .summary-box .label,body .summary-card .lbl{color:var(--text-2);}
body .summary-box .val,body .summary-card .num{color:var(--primary);}
body .summary-card.highlight{background:var(--primary);}
body .summary-card.highlight .num,body .summary-card.highlight .lbl{color:#fff;}

/* ---------- 9. 분할 버튼(세그먼트) ---------- */
body .typetabs,
body .segmented{
  background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-btn);padding:3px;
}
body .typebtn,
body .segmented-option span{color:var(--text-2);border-radius:8px;}
body .typebtn:hover{background:var(--hover);color:var(--text);}
body .typebtn.active,
body .segmented-option input:checked + span{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-card);font-weight:600;}

/* ---------- 10. 모달 · 토스트 · 확대 보기 ----------
   iframe이 내용 높이만큼 길어지므로, 중앙 정렬을 "보고 있는 화면 영역" 기준으로 잡는다. */
body .modal-bg,
body .lightbox{
  position:fixed;left:0;right:0;inset-inline:0;
  top:var(--vp-top);bottom:auto;height:var(--vp-h);
  background:rgba(10,12,18,.5);backdrop-filter:blur(2px);
}
body .modal{
  max-height:calc(var(--vp-h) - 48px);
  background:var(--surface);color:var(--text);
  border-radius:var(--radius-modal);box-shadow:var(--shadow-pop);
}
body .modal h3{border-bottom:1px solid var(--border);}
body .modal-actions{border-top:1px solid var(--border);}
body .toast{
  top:calc(var(--vp-top) + var(--vp-h) - 76px);bottom:auto;
  background:var(--text);color:var(--bg);border-radius:var(--radius-btn);box-shadow:var(--shadow-pop);
}

/* ---------- 11. 진행 표시 ---------- */
body .progress-track{background:var(--border);border-radius:999px;}
body .progress-fill{background:var(--primary);}

</style>
<style>
/* ==========================================================================
   셸(껍데기) 전용 스타일 — 색·모서리·글꼴은 모두 위 공통 토큰을 씁니다.
   ========================================================================== */
:root{ --sidebar-w:232px; --topbar-h:60px; }
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
svg.ic.sm{width:15px;height:15px;}
svg.ic.lg{width:22px;height:22px;}

.app-shell{display:flex;align-items:flex-start;min-height:100vh;}

/* ---------- 사이드바 ---------- */
.sidebar{
  width:var(--sidebar-w);flex:none;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--border);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;text-decoration:none;color:inherit;}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.brand .mark svg{stroke:#fff;}
.brand strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3;}
.brand span{display:block;font-size:11px;color:var(--text-3);margin-top:1px;letter-spacing:.02em;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-label{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.06em;padding:16px 10px 6px;}
.nav-btn{
  appearance:none;border:none;background:transparent;cursor:pointer;text-align:left;width:100%;
  display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:var(--radius-btn);
  font:inherit;font-size:14px;font-weight:500;color:var(--text-2);text-decoration:none;
  transition:background .15s ease,color .15s ease;
}
.nav-btn:hover{background:var(--hover);color:var(--text);}
.nav-btn.active{background:var(--primary-tint);color:var(--primary);font-weight:700;}
.nav-btn .badge{margin-left:auto;font-size:10px;font-weight:700;color:var(--text-3);background:var(--surface-3);border-radius:6px;padding:2px 6px;}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11px;color:var(--text-3);line-height:1.6;}

/* ---------- 본문 ---------- */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:var(--topbar-h);flex:none;position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0;}
.crumb b{color:var(--text);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-actions{display:flex;align-items:center;gap:6px;}
.top-actions .icon-btn,.crumb .icon-btn{flex:none;}
body .menu-btn{display:none;}
.user-chip{
  display:flex;align-items:center;gap:8px;margin-left:6px;padding:5px 12px 5px 6px;
  border-radius:999px;border:1px solid var(--border);color:var(--text-2);font-size:12.5px;font-weight:500;
}
.user-chip .avatar{width:24px;height:24px;border-radius:50%;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;}
.user-chip .avatar svg{width:14px;height:14px;}

main.content{padding:28px 32px 40px;max-width:1240px;width:100%;margin:0 auto;}
.page{display:none;}
.page.active{display:block;animation:rise .18s ease;}
@keyframes rise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.page-head{margin-bottom:20px;}
.page-head .eyebrow{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.02em;margin-bottom:6px;}
.page-head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em;}
.page-head p{margin:6px 0 0;color:var(--text-2);font-size:14px;max-width:720px;line-height:1.65;}
iframe.tool-frame{display:block;width:100%;height:520px;border:0;background:transparent;}
.frame-loading{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:13px;padding:26px 4px;position:absolute;}
.page{position:relative;}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- 홈 ---------- */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.home-group{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin:28px 0 12px;}
.home-group:first-of-type{margin-top:8px;}
.tool-card{
  display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;font:inherit;color:inherit;text-decoration:none;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow-card);
  transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;
}
.tool-card:hover{border-color:var(--primary-border);box-shadow:0 6px 20px rgba(37,99,235,.10);transform:translateY(-1px);}
.tool-card .ico{width:40px;height:40px;border-radius:11px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;}
.tool-card h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;}
.tool-card p{margin:0;font-size:13px;color:var(--text-2);line-height:1.6;flex:1;}
.tool-card .tags{display:flex;gap:6px;flex-wrap:wrap;}
.tool-card .tags span{font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-3);border-radius:999px;padding:3px 9px;}
.tool-card .go{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--primary);}
.tool-card.ext .ico{background:var(--surface-3);color:var(--text-2);}
.privacy{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding:16px 18px;border-radius:var(--radius-card);background:var(--primary-tint);border:1px solid var(--primary-border);color:var(--text-2);font-size:13px;line-height:1.65;}
.privacy svg{color:var(--primary);margin-top:2px;}
.privacy b{color:var(--text);}

/* ---------- 설정 ---------- */

.seal span{display:none;}\n\n/* ---------- Sections ---------- */\nsection{margin-top:32px;}\n.section-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}\n.step-no{\n  width:24px;height:24px;border-radius:7px;flex-shrink:0;\n  font-family:'Noto Sans KR',sans-serif;\n  font-size:12px;color:var(--primary);background:var(--primary-tint);\n  display:flex;align-items:center;justify-content:center;\n  font-weight:700;font-variant-numeric:tabular-nums;\n}\n.section-head h2{font-size:18px;font-weight:700;margin:0;color:var(--text);}\n.section-sub{color:var(--text-2);font-size:13px;margin:0 0 14px;}\n\n.card{\n  background:var(--card);\n  border:1px solid var(--border);\n  border-radius:var(--radius-card);\n  box-shadow:var(--shadow-card);\n  padding:24px;\n}\n\n/* ---------- Upload ---------- */\n.dropzone{\n  border:1.5px dashed var(--border);\n  border-radius:var(--radius-input);\n  padding:32px 24px;\n  text-align:center;\n  cursor:pointer;\n  transition:all .15s ease;\n  background:var(--hover);\n}\n.dropzone.drag{border-color:var(--primary);background:var(--primary-tint);}\n.dropzone:hover{border-color:var(--primary);}\n.dropzone b{display:block;font-size:14.5px;color:var(--text);margin-bottom:4px;font-weight:600;}\n.dropzone span{font-size:12.5px;color:var(--text-3);}\ninput[type=file]{display:none;}\n.file-chip{\n  display:inline-flex;align-items:center;gap:8px;\n  background:var(--primary-tint);border:1px solid var(--primary-tint-strong);border-radius:20px;\n  padding:6px 14px;font-size:13px;color:var(--primary);margin-top:12px;font-weight:500;\n}\n.file-chip button{\n  border:none;background:none;color:var(--warn);cursor:pointer;font-size:13px;font-weight:600;\n}\n\n/* ---------- Rules panel ---------- */\ndetails.rules{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}\nsummary{cursor:pointer;font-size:13.5px;color:var(--text);font-weight:600;}\nsummary::marker{color:var(--primary);}\n.rules-grid{\n  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));\n  gap:14px;margin-top:14px;\n}\n.rule-field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:500;}\n.rule-field input{\n  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-input);\n  font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--card);\n  transition:border-color .15s ease, box-shadow .15s ease;\n}\n.rule-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}\n.rules-note{\n  margin-top:14px;font-size:12px;color:var(--text-2);background:var(--hover);\n  border:1px solid var(--border);border-radius:var(--radius-input);padding:12px 14px;line-height:1.7;\n}\n\n/* ---------- Optional items (compact, de-emphasized) ---------- */\n.opt-group{margin-top:18px;}\n.opt-group-label{\n  font-size:11px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;\n  margin:0 0 8px 2px;font-weight:700;\n}\ndetails.opt{\n  border:1px solid var(--border);border-radius:var(--radius-input);background:var(--hover);\n  padding:9px 14px;margin-top:7px;transition:background .15s ease;\n}\ndetails.opt[open]{background:var(--card);}\ndetails.opt summary{\n  font-size:12.5px;color:var(--text-2);font-weight:600;list-style:none;cursor:pointer;\n  display:flex;align-items:center;gap:8px;\n}\ndetails.opt summary::-webkit-details-marker{display:none;}\ndetails.opt summary::before{\n  content:'\\25B8';color:var(--primary);font-size:10px;display:inline-block;\n  transition:transform .15s ease;width:9px;\n}\ndetails.opt[open] summary::before{transform:rotate(90deg);}\ndetails.opt .opt-badge{\n  font-size:10px;color:var(--text-3);background:var(--card);border:1px solid var(--border);border-radius:8px;\n  padding:1px 7px;font-weight:600;margin-left:auto;letter-spacing:.02em;\n}\ndetails.opt .opt-desc{font-size:11.5px;color:var(--text-3);margin:9px 0 10px;line-height:1.6;}\ndetails.opt .opt-dropzone{\n  border:1.5px dashed var(--border);border-radius:var(--radius-input);padding:13px 12px;\n  text-align:center;cursor:pointer;background:var(--card);transition:all .15s ease;\n}\ndetails.opt[open]{padding-bottom:12px;}\ndetails.opt .opt-dropzone:hover,details.opt .opt-dropzone.drag{border-color:var(--primary);background:var(--primary-tint);}\ndetails.opt .opt-dropzone b{display:block;font-size:12px;color:var(--text);margin-bottom:2px;font-weight:600;}\ndetails.opt .opt-dropzone span{font-size:10.5px;color:var(--text-3);}\ndetails.opt .file-chip{margin-top:10px;padding:5px 12px;font-size:12px;}\n\n/* ---------- Stat cards ---------- */\n.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;margin-top:18px;}\n@media (max-width:1280px){.stats{grid-template-columns:repeat(2,1fr);}}\n.stat{\n  background:var(--hover);border:1px solid var(--border);border-radius:var(--radius-input);\n  padding:14px 16px;\n}\n.stat .num{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}\n.stat .lbl{font-size:12px;color:var(--text-3);margin-top:2px;}\n.stat.warn .num{color:var(--warn);}\n.stat.ok .num{color:var(--ok);}\n\n/* ---------- Employee table ---------- */\n.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}\n.toolbar .left{display:flex;align-items:center;gap:10px;}\n.toolbar input[type=search]{\n  padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-input);font-size:13px;width:220px;\n  background:var(--card);transition:border-color .15s ease, box-shadow .15s ease;\n}\n.toolbar input[type=search]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}\n.btn{\n  font-family:'Noto Sans KR',sans-serif;\n  border:1px solid var(--primary);background:var(--primary);color:#fff;\n  height:40px;padding:0 16px;border-radius:var(--radius-btn);font-size:13.5px;font-weight:600;cursor:pointer;\n  transition:background .15s ease, border-color .15s ease, opacity .15s ease;\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n}\n.btn:hover{background:#1d4ed8;border-color:#1d4ed8;}\n.btn.ghost{background:var(--card);color:var(--text);border-color:var(--border);}\n.btn.ghost:hover{background:var(--hover);border-color:var(--text-3);}\n.btn.gold{background:var(--primary);border-color:var(--primary);}\n.btn.gold:hover{background:#1d4ed8;border-color:#1d4ed8;}\n.btn:disabled{opacity:.45;cursor:not-allowed;}\n\ntable.datagrid{width:100%;border-collapse:collapse;font-size:13px;}\ntable.datagrid th{\n  background:var(--hover);color:var(--text-2);text-align:left;\n  padding:10px 10px;font-weight:600;font-size:12px;letter-spacing:.01em;\n  position:sticky;top:0;border-bottom:1px solid var(--border);\n}\ntable.datagrid td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}\ntable.datagrid tbody tr:hover{background:var(--hover);}\ntable.datagrid tbody tr.excluded{opacity:.4;}\ntable.datagrid input[type=text]{\n  width:100%;min-width:64px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;\n  font-family:'Noto Sans KR',sans-serif;background:var(--card);box-sizing:border-box;\n  transition:border-color .15s ease, box-shadow .15s ease;\n}\ntable.datagrid input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}\ntable.datagrid td.name-cell{\n  min-width:64px;white-space:normal;word-break:keep-all;overflow-wrap:break-word;\n}\n.num-cell{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}\n.table-scroll{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-input);}\n.badge{\n  display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;\n  background:var(--primary-tint);color:var(--primary);font-weight:600;\n}\n.badge.zero{background:var(--warn-tint);color:var(--warn);}\n.badge.cap{background:var(--amber-tint);color:var(--amber);}\n\n/* ---------- Preview (ledger look) ---------- */\n.ledger-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}\n.ledger-meta .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:500;}\n.ledger-meta .field input{\n  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-input);font-size:13px;\n  background:var(--card);transition:border-color .15s ease, box-shadow .15s ease;\n}\n.ledger-meta .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}\n.ledger{\n  border:1px solid var(--border);border-radius:var(--radius-input);overflow:hidden;\n}\n.ledger-table-scroll{overflow-x:auto;}\n.ledger-table-scroll table.ledger-table{min-width:760px;}\n.ledger-title{\n  text-align:center;font-weight:700;font-size:19px;\n  padding:18px 10px 6px;color:var(--text);\n}\n.ledger-sub{\n  display:flex;justify-content:space-between;align-items:center;\n  padding:6px 22px 18px;font-size:13.5px;color:var(--text);\n}\n.ledger-sub .approver{font-family:'Noto Sans KR',sans-serif;font-size:12.5px;color:var(--text-2);text-align:right;}\n.ledger-sub .approver b{color:var(--text);}\ntable.ledger-table{width:100%;border-collapse:collapse;font-size:12.5px;}\ntable.ledger-table th{\n  background:var(--hover);border:1px solid var(--border);padding:9px 6px;font-weight:700;color:var(--text-2);\n}\ntable.ledger-table td{border:1px solid var(--border);padding:8px 6px;text-align:center;word-break:keep-all;overflow-wrap:break-word;}\ntable.ledger-table td.name{font-weight:600;white-space:normal;}\ntable.ledger-table td.amt{text-align:right;padding-right:12px;font-variant-numeric:tabular-nums;}\ntable.ledger-table tr.total-row td{background:var(--primary-tint);font-weight:700;color:var(--primary);}\ntable.ledger-table td.purpose,table.ledger-table td.days{text-align:left;font-size:11.5px;color:var(--text-2);}\n\n.empty-state{\n  text-align:center;color:var(--text-3);padding:50px 10px;font-size:13.5px;\n}\n.hidden{display:none !important;}\n\nfooter.note{\n  max-width:1480px;margin:44px auto 0;padding:0 28px 40px;color:var(--text-3);font-size:12px;\n}\nfooter.note ul{margin:6px 0 0;padding-left:18px;}\n\n\u003c/style>\n\u003cmeta name=\"tool-id\" content=\"travel\">\n\u003cstyle id=\"suite-theme\">\n/* ==========================================================================\n   서무 업무 자동화 — 공통 디자인 시스템\n   셸(index)과 모든 도구 페이지가 이 파일 하나를 공유합니다.\n   · 색/글꼴/모서리는 아래 토큰(:root)만 바꾸면 전체가 함께 바뀝니다.\n   · 도구마다 다르게 부르던 클래스 이름(.btn-primary / .run / .btn.outline …)도\n     여기서 한 모양으로 묶습니다. 도구 CSS 뒤에 불러오므로 같은 점수면 이 파일이 이깁니다.\n   ========================================================================== */\n\n/* ---------- 1. 토큰 ---------- */\n:root{\n  --bg:#F8FAFC;\n  --surface:#FFFFFF;\n  --surface-2:#F8FAFC;\n  --surface-3:#EEF1F5;\n  --hover:#F3F4F6;\n  --border:#E5E7EB;\n  --border-strong:#D5D9E0;\n\n  --text:#111827;\n  --text-2:#6B7280;\n  --text-3:#9CA3AF;\n\n  --primary:#2563EB;\n  --primary-hover:#1D4ED8;\n  --primary-tint:#EFF4FE;\n  --primary-tint-strong:#E1EAFD;\n  --primary-border:#C7D9FC;\n\n  --success:#16A34A;\n  --success-tint:#EAFBF2;\n  --warning:#D97706;\n  --warning-tint:#FDF1DE;\n  --danger:#DC2626;\n  --danger-hover:#B91C1C;\n  --danger-tint:#FDEEEE;\n\n  --radius-sm:8px;\n  --radius-btn:10px;\n  --radius-input:10px;\n  --radius-card:16px;\n  --radius-modal:20px;\n\n  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);\n  --shadow-pop:0 16px 40px rgba(17,24,39,.16), 0 2px 8px rgba(17,24,39,.06);\n\n  --font:'Noto Sans KR','Pretendard Variable','Segoe UI','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;\n  --mono:'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;\n\n  /* 보고 있는 화면 영역(iframe 안에서 모달·토스트 위치를 잡을 때 셸이 갱신) */\n  --vp-top:0px;\n  --vp-h:100vh;\n\n  color-scheme:light;\n}\nhtml.dark{\n  --bg:#111418;\n  --surface:#181C22;\n  --surface-2:#1C2128;\n  --surface-3:#242A33;\n  --hover:#20242B;\n  --border:#262B33;\n  --border-strong:#343B46;\n\n  --text:#E8EAED;\n  --text-2:#9AA2AD;\n  --text-3:#6B7280;\n\n  --primary:#3B82F6;\n  --primary-hover:#60A5FA;\n  --primary-tint:#152238;\n  --primary-tint-strong:#1B2B47;\n  --primary-border:#27406B;\n\n  --success:#22C55E;\n  --success-tint:#0F2A1D;\n  --warning:#F59E0B;\n  --warning-tint:#2E2410;\n  --danger:#EF4444;\n  --danger-hover:#F87171;\n  --danger-tint:#301616;\n\n  --shadow-card:0 1px 2px rgba(0,0,0,.4);\n  --shadow-pop:0 16px 40px rgba(0,0,0,.55);\n  color-scheme:dark;\n}\n\n/* ---------- 2. 바탕 ---------- */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-font-smoothing:antialiased;}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--text);\n  font-family:var(--font);\n  font-size:14px;\n  line-height:1.55;\n}\n::selection{background:var(--primary-tint-strong);color:var(--text);}\na{color:var(--primary);}\n:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}\nsvg{display:block;}\nhr{border:none;border-top:1px solid var(--border);}\ncode{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:5px;}\n::-webkit-scrollbar{width:10px;height:10px;}\n::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box;}\n::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:2px solid transparent;}\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}\n}\n\n/* 도구 페이지 공통 틀: 셸이 제목을 보여 주므로 도구는 본문만 가진다 */\nbody.tool{background:transparent;padding:0 0 40px;}\nbody.tool .wrap,\nbody.tool .page{max-width:none;margin:0;padding:0;}\n\n/* ---------- 3. 카드 / 패널 ---------- */\nbody .card,\nbody .panel,\nbody .step{\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:var(--radius-card);\n  box-shadow:var(--shadow-card);\n  padding:22px 24px;\n  margin-bottom:16px;\n}\nbody .card h2,\nbody .panel h2{\n  font-size:15px;font-weight:700;letter-spacing:-.01em;\n  text-transform:none;color:var(--text);margin:0 0 6px;\n}\nbody .card .sub,\nbody .panel .sub,\nbody .section-sub,\nbody .step-desc{color:var(--text-2);font-size:13px;line-height:1.65;}\nbody .card .sub{margin-bottom:16px;}\n\n/* ---------- 4. 버튼 ---------- */\nbody .btn,\nbody .btn-primary,\nbody .btn-secondary,\nbody .btn-outline,\nbody .btn-ghost,\nbody .btn-export,\nbody button.run{\n  --b-bg:var(--primary);--b-fg:#fff;--b-bd:var(--primary);--b-bg-h:var(--primary-hover);--b-bd-h:var(--primary-hover);\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  min-height:40px;padding:0 16px;\n  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;\n  border-radius:var(--radius-btn);\n  background:var(--b-bg);color:var(--b-fg);border:1px solid var(--b-bd);\n  box-shadow:none;text-decoration:none;cursor:pointer;\n  transition:background .15s ease,border-color .15s ease,color .15s ease,transform 60ms ease;\n}\nbody .btn:hover:not(:disabled):not(.disabled),\nbody .btn-primary:hover:not(:disabled),\nbody .btn-secondary:hover:not(:disabled),\nbody .btn-outline:hover:not(:disabled),\nbody .btn-ghost:hover:not(:disabled),\nbody .btn-export:hover:not(:disabled),\nbody button.run:hover:not(:disabled){background:var(--b-bg-h);border-color:var(--b-bd-h);color:var(--b-fg-h,var(--b-fg));box-shadow:none;}\nbody .btn:active:not(:disabled),\nbody .btn-primary:active:not(:disabled),\nbody button.run:active:not(:disabled){transform:translateY(1px);}\nbody .btn:disabled,body .btn[disabled],body .btn.disabled,\nbody .btn-primary:disabled,body .btn-secondary:disabled,body .btn-outline:disabled,\nbody .btn-ghost:disabled,body .btn-export:disabled,body button.run:disabled{\n  opacity:.5;cursor:not-allowed;\n}\n/* 보조(연한 파랑) */\nbody .btn.outline,\nbody .btn-secondary,\nbody .btn-outline{--b-bg:var(--primary-tint);--b-fg:var(--primary);--b-bd:transparent;--b-bg-h:var(--primary-tint-strong);--b-bd-h:transparent;}\n/* 낮은 우선순위(테두리) */\nbody .btn.ghost,\nbody .btn-ghost{--b-bg:var(--surface);--b-fg:var(--text-2);--b-bd:var(--border-strong);--b-bg-h:var(--hover);--b-bd-h:var(--border-strong);--b-fg-h:var(--text);}\n/* 되돌릴 수 없는 동작 */\nbody .btn.danger{--b-bg:var(--surface);--b-fg:var(--danger);--b-bd:var(--danger);--b-bg-h:var(--danger-tint);--b-bd-h:var(--danger);}\n/* 내려받기 완료형(초록) */\nbody .btn-export{--b-bg:var(--success);--b-fg:#fff;--b-bd:var(--success);--b-bg-h:var(--success);--b-bd-h:var(--success);}\nbody .btn-export:hover:not(:disabled){filter:brightness(.93);}\n/* 크기 */\nbody .btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;gap:5px;}\nbody .btn-lg,body button.run{min-height:46px;font-size:14.5px;}\nbody button.run{width:100%;}\nbody .btn svg,body button.run svg{flex:none;}\n\n/* 아이콘 단추 */\nbody .icon-btn,\nbody .btn-icon{\n  display:inline-flex;align-items:center;justify-content:center;flex:none;\n  width:32px;height:32px;min-height:0;padding:0;\n  border-radius:var(--radius-sm);border:1px solid transparent;\n  background:transparent;color:var(--text-2);cursor:pointer;box-shadow:none;\n  transition:background .15s ease,color .15s ease;\n}\nbody .icon-btn:hover,body .btn-icon:hover{background:var(--hover);color:var(--text);}\nbody .icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);}\n\n/* ---------- 5. 입력 ---------- */\nbody input[type=text],\nbody input[type=number],\nbody input[type=password],\nbody input[type=search],\nbody input[type=date],\nbody input[type=time],\nbody input[type=month],\nbody input[type=email],\nbody input[type=tel],\nbody input:not([type]),\nbody select,\nbody textarea{\n  font-family:inherit;font-size:13.5px;color:var(--text);\n  background-color:var(--surface);\n  border:1px solid var(--border-strong);\n  border-radius:var(--radius-input);\n  transition:border-color .15s ease,box-shadow .15s ease;\n}\nbody input::placeholder,body textarea::placeholder{color:var(--text-3);}\nbody input:hover:not(:focus):not([readonly]),body select:hover:not(:focus),body textarea:hover:not(:focus){border-color:var(--text-3);}\nbody input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-strong);}\nbody input[readonly]{background-color:var(--surface-2);color:var(--text-2);}\nbody select{\n  appearance:none;-webkit-appearance:none;\n  background-image:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpolyline points='6 9 12 15 18 9'/>\u003c/svg>\");\n  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;\n  padding-right:32px !important;cursor:pointer;\n}\nbody input[type=file]{display:none;}\nbody input[type=checkbox],body input[type=radio]{accent-color:var(--primary);}\nbody label{color:inherit;}\n\n/* ---------- 6. 표 ---------- */\nbody table{border-collapse:collapse;font-variant-numeric:tabular-nums;}\nbody th{\n  background:var(--surface-2);color:var(--text-2);\n  font-weight:600;font-size:12px;\n  border-bottom:1px solid var(--border-strong);\n}\nbody td{border-color:var(--border);}\nbody tbody tr:hover{background:var(--hover);}\nbody .tablewrap,\nbody .table-scroll,\nbody .preview-wrap{\n  border:1px solid var(--border);border-radius:var(--radius-input);background:var(--surface);\n}\nbody td input,body td select{background-color:transparent;}\nbody td input:focus,body td select:focus{background-color:var(--surface);}\n\n/* ---------- 7. 업로드 영역 ---------- */\nbody .dropzone,\nbody .drop-zone,\nbody .opt-dropzone{\n  border:1.5px dashed var(--border-strong);\n  border-radius:var(--radius-card);\n  background:var(--surface-2);\n  color:var(--text);\n  transition:border-color .15s ease,background .15s ease;\n}\nbody .dropzone:hover,body .drop-zone:hover,body .opt-dropzone:hover,\nbody .dropzone.drag,body .dropzone.dragover,body .dropzone.active,body .dropzone.hover,\nbody .drop-zone.drag,body .drop-zone.dragover,body .opt-dropzone.drag{\n  border-color:var(--primary);background:var(--primary-tint);box-shadow:none;\n}\n\n/* ---------- 8. 안내 / 칩 / 배지 ---------- */\nbody .hint,\nbody .callout,\nbody .note,\nbody .tpl-status,\nbody .rules-note{\n  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);\n  border-radius:var(--radius-input);\n}\nbody .hint-warn{background:var(--warning-tint);border-color:transparent;color:var(--warning);}\nbody .caption,body .small{color:var(--text-3);}\nbody .pill,body .opt-badge,body .step-badge,body .step-no{border-radius:999px;}\nbody .step-badge,body .step-no{background:var(--primary);color:#fff;}\nbody .opt-badge{background:var(--surface-3);color:var(--text-2);}\nbody .summary-box,body .summary-card{\n  background:var(--primary-tint);border:1px solid transparent;border-radius:var(--radius-input);\n}\nbody .summary-box .label,body .summary-card .lbl{color:var(--text-2);}\nbody .summary-box .val,body .summary-card .num{color:var(--primary);}\nbody .summary-card.highlight{background:var(--primary);}\nbody .summary-card.highlight .num,body .summary-card.highlight .lbl{color:#fff;}\n\n/* ---------- 9. 분할 버튼(세그먼트) ---------- */\nbody .typetabs,\nbody .segmented{\n  background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-btn);padding:3px;\n}\nbody .typebtn,\nbody .segmented-option span{color:var(--text-2);border-radius:8px;}\nbody .typebtn:hover{background:var(--hover);color:var(--text);}\nbody .typebtn.active,\nbody .segmented-option input:checked + span{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-card);font-weight:600;}\n\n/* ---------- 10. 모달 · 토스트 · 확대 보기 ----------\n   iframe이 내용 높이만큼 길어지므로, 중앙 정렬을 \"보고 있는 화면 영역\" 기준으로 잡는다. */\nbody .modal-bg,\nbody .lightbox{\n  position:fixed;left:0;right:0;inset-inline:0;\n  top:var(--vp-top);bottom:auto;height:var(--vp-h);\n  background:rgba(10,12,18,.5);backdrop-filter:blur(2px);\n}\nbody .modal{\n  max-height:calc(var(--vp-h) - 48px);\n  background:var(--surface);color:var(--text);\n  border-radius:var(--radius-modal);box-shadow:var(--shadow-pop);\n}\nbody .modal h3{border-bottom:1px solid var(--border);}\nbody .modal-actions{border-top:1px solid var(--border);}\nbody .toast{\n  top:calc(var(--vp-top) + var(--vp-h) - 76px);bottom:auto;\n  background:var(--text);color:var(--bg);border-radius:var(--radius-btn);box-shadow:var(--shadow-pop);\n}\n\n/* ---------- 11. 진행 표시 ---------- */\nbody .progress-track{background:var(--border);border-radius:999px;}\nbody .progress-fill{background:var(--primary);}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"wrap top-inner\">\n    \u003cdiv class=\"title-block\">\n      \u003cdiv class=\"eyebrow\">국내(관내) 여비 · 자동 산정\u003c/div>\n      \u003ch1>관내여비 지급명세서 생성기\u003c/h1>\n      \u003cp>출장 원본 집계표(엑셀)를 올리면 인원별 산정 규칙에 따라 지급액을 자동 계산하고, 지급명세서 양식으로 바로 내려받을 수 있습니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"seal\">\u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 11l3 3L22 4\">\u003c/path>\u003cpath d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\">\u003c/path>\u003c/svg>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\n  \u003c!-- STEP 1: 업로드 -->\n  \u003csection>\n    \u003cdiv class=\"section-head\">\u003cspan class=\"step-no\">1\u003c/span>\u003ch2>출장 원본 파일 업로드\u003c/h2>\u003c/div>\n    \u003cp class=\"section-sub\">\"출장 월별집계\" 형태의 원본 엑셀(예: 7월_출장_여비.xlsx)을 올려주세요. 사람별 출장기록이 자동으로 인식됩니다.\u003c/p>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"dropzone\" id=\"dropzone\">\n        \u003cb>여기에 파일을 놓거나 클릭해서 선택하세요\u003c/b>\n        \u003cspan>.xlsx 파일 · 클라이언트(브라우저) 내에서만 처리되며 서버로 전송되지 않습니다\u003c/span>\n        \u003cinput type=\"file\" id=\"fileInput\" accept=\".xlsx,.xls\">\n      \u003c/div>\n      \u003cdiv id=\"fileChipWrap\">\u003c/div>\n\n      \u003cdetails class=\"rules\">\n        \u003csummary>지급 산정 규칙 설정 (기본값: 요청하신 기준)\u003c/summary>\n        \u003cdiv class=\"rules-grid\">\n          \u003cdiv class=\"rule-field\">\u003clabel>1인 월 최대 지급액 (원, 300,000원 초과 불가)\u003c/label>\u003cinput type=\"number\" id=\"ruleMonthlyCap\" value=\"140000\" step=\"10000\" max=\"300000\" min=\"0\">\u003c/div>\n          \u003cdiv class=\"rule-field\">\u003clabel>1일 최대 지급액 (원)\u003c/label>\u003cinput type=\"number\" id=\"ruleDailyCap\" value=\"20000\" step=\"10000\">\u003c/div>\n          \u003cdiv class=\"rule-field\">\u003clabel>단일(통) 출장 인정 최소시간 (시간)\u003c/label>\u003cinput type=\"number\" id=\"ruleFullHours\" value=\"4\" step=\"0.5\">\u003c/div>\n          \u003cdiv class=\"rule-field\">\u003clabel>분할 출장 1건당 인정 최소시간 (시간)\u003c/label>\u003cinput type=\"number\" id=\"ruleSplitHours\" value=\"1\" step=\"0.5\">\u003c/div>\n          \u003cdiv class=\"rule-field\">\u003clabel>차량 운행일 1일 감액액 (원)\u003c/label>\u003cinput type=\"number\" id=\"ruleVehicleDeduction\" value=\"10000\" step=\"1000\">\u003c/div>\n          \u003cdiv class=\"rule-field\">\u003clabel>관외(타지역) 판정 키워드 (쉼표로 구분)\u003c/label>\u003cinput type=\"text\" id=\"ruleOutsideKeywords\" value=\"관외\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"rules-note\">\n          계산 로직 &nbsp;·&nbsp;\n          같은 날 출장기록이 \u003cb>1건\u003c/b>이고 시간이 단일인정기준(기본 4시간) 이상이면 → 1일 최대액(기본 2만원) 전액. 분할인정기준(기본 1시간) 이상이면 → 1일 최대액의 절반(기본 1만원). 그 미만이면 → 0원.\n          같은 날 출장기록이 \u003cb>2건 이상\u003c/b>이면: 각 건별로 시간이 분할인정기준(기본 1시간) 이상인 건만 건당 1일 최대액의 절반(기본 1만원)씩 지급하며, 합산액은 1일 최대액(기본 2만원)을 넘지 않도록 상한을 둡니다.\n          \u003cb>차량 감액\u003c/b>: 출장기록의 \"공무용차량 사용\" 표시 여부와 무관하게, \u003cb>차량배차 현황 파일에 실제 배차(운행) 기록이 있는 날짜만\u003c/b> 해당 일자 산정액에서 차량 감액액(기본 1만원)을 차감합니다. 단, \u003cb>차량배차 현황의 목적지가 관외(타지역)로 표시된 건은 감액하지 않습니다\u003c/b> — 관내 출장에 한해서만 차량 사용이 여비에 영향을 줍니다. 목적지 정보가 없거나 위 키워드에 해당하지 않으면 관내로 간주해 감액합니다. 배차 파일을 올리지 않으면 이 감액은 적용되지 않습니다.\n          \u003cb>월 한도 적용\u003c/b>: 날짜 오름차순으로 채우다 중간에 끊지 않고, 금액이 큰 날부터 우선 채운 뒤 남는 한도를 반액짜리 날로 메워 월 최대 지급액을 최대한 꽉 채웁니다.\n        \u003c/div>\n      \u003c/details>\n    \u003c/div>\n\n    \u003cdiv class=\"opt-group\">\n      \u003cdiv class=\"opt-group-label\">선택 항목\u003c/div>\n\n      \u003cdetails class=\"opt\" id=\"orderDetails\">\n        \u003csummary>지급대상자 목록\u003cspan class=\"opt-badge\">선택\u003c/span>\u003c/summary>\n        \u003cp class=\"opt-desc\">성명·은행명·계좌번호가 있는 지급대상자 목록 엑셀(연번 순서 포함)을 올리면 그 순서대로 정렬되고, 목록에 있는 사람만 자동 선택되며 은행명·계좌번호도 채워집니다. 올리지 않으면 원본 집계표에 처음 등장하는 순서를 사용합니다.\u003c/p>\n        \u003cdiv class=\"opt-dropzone\" id=\"orderDropzone\">\n          \u003cb>여기에 놓거나 클릭해서 선택\u003c/b>\n          \u003cspan>.xlsx/.xls · 연번/성명/은행명/계좌번호 열이 있는 형식\u003c/span>\n          \u003cinput type=\"file\" id=\"orderFileInput\" accept=\".xlsx,.xls\">\n        \u003c/div>\n        \u003cdiv id=\"orderFileChipWrap\">\u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"opt\" id=\"vehicleDetails\">\n        \u003csummary>차량배차 현황\u003cspan class=\"opt-badge\">선택\u003c/span>\u003c/summary>\n        \u003cp class=\"opt-desc\">공무용차량 배차대장을 올리면, 실제로 배차·운행된 날짜 중 \u003cb>목적지가 관내인 건\u003c/b>에 한해 해당 일자 여비에서 차량 감액액을 자동으로 차감합니다(관외 출장은 영향 없음). .csv(CP949/EUC-KR)와 .xlsx/.xls를 모두 지원합니다.\u003c/p>\n        \u003cdiv class=\"opt-dropzone\" id=\"vehicleDropzone\">\n          \u003cb>여기에 놓거나 클릭해서 선택\u003c/b>\n          \u003cspan>.csv/.xlsx/.xls · 배차대장(사용일시/사용자/목적지 등)\u003c/span>\n          \u003cinput type=\"file\" id=\"vehicleFileInput\" accept=\".csv,.xlsx,.xls\">\n        \u003c/div>\n        \u003cdiv id=\"vehicleFileChipWrap\">\u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"opt\" id=\"ehojoDetails\">\n        \u003csummary>e호조 지출폼 원본 양식\u003cspan class=\"opt-badge\">선택\u003c/span>\u003c/summary>\n        \u003cp class=\"opt-desc\">기존에 쓰시던 e호조 관내여비 지출폼 원본을 올리면, 다른 시트(은행 코드표 등)와 데이터 유효성 검사(드롭다운)는 그대로 두고 \"거래처입력\" 시트 값만 채워서 내려받습니다. 올리지 않으면 서식을 새로 만들어 내려받습니다.\u003c/p>\n        \u003cdiv class=\"opt-dropzone\" id=\"ehojoDropzone\">\n          \u003cb>여기에 놓거나 클릭해서 선택\u003c/b>\n          \u003cspan>.xlsx · e호조 관내여비 지출폼 원본\u003c/span>\n          \u003cinput type=\"file\" id=\"ehojoFileInput\" accept=\".xlsx\">\n        \u003c/div>\n        \u003cdiv id=\"ehojoFileChipWrap\">\u003c/div>\n      \u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- STEP 2: 대상자 -->\n  \u003csection id=\"step2\" class=\"hidden\">\n    \u003cdiv class=\"section-head\">\u003cspan class=\"step-no\">2\u003c/span>\u003ch2>대상자 선택 및 확인\u003c/h2>\u003c/div>\n    \u003cp class=\"section-sub\">인식된 인원 목록입니다. 지급명세서에 포함할 사람만 체크하고, 필요한 항목(은행/계좌/출장목적)을 직접 채워주세요.\u003c/p>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"stats\" id=\"statsRow\">\u003c/div>\n\n      \u003cdiv class=\"toolbar\" style=\"margin-top:20px;\">\n        \u003cdiv class=\"left\">\n          \u003clabel style=\"font-size:13px;display:flex;align-items:center;gap:6px;\">\n            \u003cinput type=\"checkbox\" id=\"toggleAll\" checked> 전체 선택\n          \u003c/label>\n          \u003cinput type=\"search\" id=\"searchBox\" placeholder=\"이름으로 검색\">\n        \u003c/div>\n        \u003cdiv>\n          \u003cbutton class=\"btn ghost\" id=\"btnRecalc\">다시 계산\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"table-scroll\">\n        \u003ctable class=\"datagrid\">\n          \u003cthead>\n            \u003ctr>\n              \u003cth style=\"width:34px;\">\u003c/th>\n              \u003cth style=\"width:34px;\">No\u003c/th>\n              \u003cth style=\"width:76px;\">성명\u003c/th>\n              \u003cth>소속/직급\u003c/th>\n              \u003cth style=\"width:70px;\">전체건수\u003c/th>\n              \u003cth style=\"width:90px;\">지급일수\u003c/th>\n              \u003cth style=\"width:100px;\">산정금액\u003c/th>\n              \u003cth>은행명\u003c/th>\n              \u003cth>계좌번호\u003c/th>\n              \u003cth>예금주명\u003c/th>\n              \u003cth>출장목적\u003c/th>\n            \u003c/tr>\n          \u003c/thead>\n          \u003ctbody id=\"empTableBody\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- STEP 3: 미리보기/출력 -->\n  \u003csection id=\"step3\" class=\"hidden\">\n    \u003cdiv class=\"section-head\">\u003cspan class=\"step-no\">3\u003c/span>\u003ch2>지급명세서 미리보기 &amp; 출력\u003c/h2>\u003c/div>\n    \u003cp class=\"section-sub\">아래 표가 실제 다운로드될 지급명세서 내용입니다. 상단 정보를 입력한 뒤 엑셀로 내려받으세요.\u003c/p>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"ledger-meta\">\n        \u003cdiv class=\"field\">\u003clabel>문서 제목 (연/월)\u003c/label>\u003cinput type=\"text\" id=\"metaTitleYM\" value=\"2026년 7월\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>부서명\u003c/label>\u003cinput type=\"text\" id=\"metaDept\" value=\"문화유산과\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>대조자 직급\u003c/label>\u003cinput type=\"text\" id=\"metaApproverRank\" value=\"\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>대조자 성명\u003c/label>\u003cinput type=\"text\" id=\"metaApproverName\" value=\"\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ledger\">\n        \u003cdiv class=\"ledger-title\" id=\"ledgerTitle\">2026년 7월 국내여비 지급 명세서\u003c/div>\n        \u003cdiv class=\"ledger-sub\">\n          \u003cspan>지 출 명 세 서\u003c/span>\n          \u003cspan class=\"approver\">출장명령부 대조자 &nbsp;·&nbsp; 직급: \u003cb id=\"apRankOut\">-\u003c/b> &nbsp;·&nbsp; 성명: \u003cb id=\"apNameOut\">-\u003c/b> &nbsp;(인)\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ledger-table-scroll\">\n        \u003ctable class=\"ledger-table\">\n          \u003cthead>\n            \u003ctr>\n              \u003cth style=\"width:40px;\">연번\u003c/th>\n              \u003cth style=\"width:88px;\">성명\u003c/th>\n              \u003cth style=\"width:90px;\">금액(원)\u003c/th>\n              \u003cth style=\"width:90px;\">은행명\u003c/th>\n              \u003cth style=\"width:130px;\">계좌번호\u003c/th>\n              \u003cth style=\"width:150px;\">출장기간(일)\u003c/th>\n              \u003cth>출장목적\u003c/th>\n            \u003c/tr>\n          \u003c/thead>\n          \u003ctbody id=\"ledgerBody\">\u003c/tbody>\n        \u003c/table>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"toolbar\" style=\"margin-top:18px;\">\n        \u003cdiv class=\"left\" style=\"font-size:12.5px;color:#758392;\" id=\"previewFootnote\">\u003c/div>\n        \u003cdiv style=\"display:flex;gap:10px;\">\n          \u003cbutton class=\"btn ghost\" id=\"btnDownloadEhojo\">e호조 관내여비 지출폼(.xlsx) 다운로드\u003c/button>\n          \u003cbutton class=\"btn gold\" id=\"btnDownload\">지급명세서(총괄 서식) 엑셀(.xlsx)로 다운로드\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv id=\"emptyState\" class=\"empty-state\">파일을 업로드하면 여기에 결과가 표시됩니다.\u003c/div>\n\n\u003c/div>\n\n\u003cfooter class=\"note\">\n  \u003cb>참고 사항\u003c/b>\n  \u003cul>\n    \u003cli>이 프로그램은 브라우저(클라이언트)에서만 동작하며, 업로드한 파일은 외부 서버로 전송되지 않습니다.\u003c/li>\n    \u003cli>은행명/계좌번호/출장목적은 원본 파일에 없는 경우가 많아 자동 채움 값(추정)이며, 다운로드 전 반드시 직접 확인·수정해 주세요.\u003c/li>\n    \u003cli>월 한도는 날짜 오름차순으로 채우다 중간에 끊지 않고, 금액이 큰 날부터 우선 채운 뒤 남는 한도를 반액짜리 날로 메워 월 최대 지급액을 최대한 꽉 채우는 방식으로 계산합니다. 실제 규정과 다르면 위 \"지급 산정 규칙 설정\"에서 값을 바꿔 다시 계산할 수 있습니다.\u003c/li>\n    \u003cli>\"지급대상자 목록\"을 올리면 그 파일의 \u003cb>가장 오른쪽(최신) 시트\u003c/b>를 기준으로, 그 시트에 있는 사람만 자동 선택되고(연번 순서로 정렬), 은행명·계좌번호도 그 시트 값으로 자동 채워집니다. 올리지 않으면 원본 집계표에 처음 등장하는 순서를 사용하고 은행/계좌는 직접 입력해야 합니다.\u003c/li>\n    \u003cli>차량 감액은 \u003cb>목적지가 관내인 배차 기록에만\u003c/b> 적용됩니다. 목적지가 관외(타지역)로 표시된 배차는 관내여비 계산에 영향을 주지 않습니다.\u003c/li>\n    \u003cli>1인 월 최대 지급액은 산정 규칙에서 값을 바꾸더라도 \u003cb>300,000원을 넘지 않도록\u003c/b> 항상 상한이 적용되며, 기본값은 140,000원입니다.\u003c/li>\n    \u003cli>지급명세서의 \"출장기간(일)\" 칸에는 \u003cb>금액이 반영되지 않은 날짜를 포함해\u003c/b> 원본 자료에 등장하는 모든 출장 일자가 표시됩니다. 실제 지급액 산정에 반영된 일수는 STEP 2 표의 \"지급일수\"에서 별도로 확인할 수 있습니다.\u003c/li>\n    \u003cli>e호조 관내여비 지출폼 원본 양식을 올리면, 그 파일의 다른 시트(예: 3번째 시트 은행 코드표)와 데이터 유효성 검사(드롭다운 등)를 그대로 유지한 채 \"거래처입력\" 시트 값만 채워서 내려받습니다.\u003c/li>\n  \u003c/ul>\n\u003c/footer>\n\n\u003cscript>\n(function(){\n  let allRows = [];\n  let employees = {};   // id -> {id,name,dept,purposeCounts:{},records:[{date,hours}], allCount}\n  let empOrder = [];    // ids in first-appearance order\n  let results = {};     // id -> {total, includedDates:[]}\n  let selection = {};   // id -> boolean\n  let overrides = {};   // id -> {bank,account,purpose}\n  let orderList = null; // 지급대상자 목록 참고 파일의 최신 시트에서 읽은 성명 배열 (없으면 null)\n  let refBankMap = {};  // 성명 -> {bank, account}  (참고 파일 최신 시트에서 추출)\n  let refNameSet = null; // 참고 파일에 있는 성명 집합 (있으면 이 사람만 선택)\n  let ehojoTemplateBuffer = null; // e호조 관내여비 지출폼 원본 양식(.xlsx) ArrayBuffer (있으면 이 양식의 다른 시트/유효성검사를 그대로 유지)\n  let vehicleUsageMap = new Map(); // \"성명|YYYY-M-D\" -> [목적지 텍스트, ...] 형태로, 실제 차량이 배차(운행)된 날짜와 그 목적지를 기록.\n  let vehicleFileLoaded = false;   // 차량배차 파일이 올라왔는지 여부(감액 적용 여부 판단용)\n\n  const $ = (id)=>document.getElementById(id);\n\n  const ABSOLUTE_MONTHLY_CAP = 300000; // 1인 월 최대 지급액은 규칙 설정값과 무관하게 이 값을 넘을 수 없음\n\n  function getRules(){\n    const rawMonthlyCap = Number($('ruleMonthlyCap').value) || ABSOLUTE_MONTHLY_CAP;\n    const outsideKeywords = ($('ruleOutsideKeywords').value||'')\n      .split(',').map(s=>s.trim()).filter(Boolean);\n    return {\n      monthlyCap: Math.min(rawMonthlyCap, ABSOLUTE_MONTHLY_CAP),\n      dailyCap: Number($('ruleDailyCap').value) || 20000,\n      fullHours: Number($('ruleFullHours').value) || 4,\n      splitHours: Number($('ruleSplitHours').value) || 1,\n      vehicleDeduction: Number($('ruleVehicleDeduction').value) || 0,\n      outsideKeywords: outsideKeywords.length ? outsideKeywords : ['관외']\n    };\n  }\n\n  // ---------- File handling ----------\n  const dropzone = $('dropzone');\n  const fileInput = $('fileInput');\n  dropzone.addEventListener('click', ()=>fileInput.click());\n  dropzone.addEventListener('dragover', e=>{e.preventDefault(); dropzone.classList.add('drag');});\n  dropzone.addEventListener('dragleave', ()=>dropzone.classList.remove('drag'));\n  dropzone.addEventListener('drop', e=>{\n    e.preventDefault(); dropzone.classList.remove('drag');\n    if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);\n  });\n  fileInput.addEventListener('change', e=>{\n    if(e.target.files.length) handleFile(e.target.files[0]);\n  });\n\n  const orderDropzone = $('orderDropzone');\n  const orderFileInput = $('orderFileInput');\n  orderDropzone.addEventListener('click', ()=>orderFileInput.click());\n  orderDropzone.addEventListener('dragover', e=>{e.preventDefault(); orderDropzone.classList.add('drag');});\n  orderDropzone.addEventListener('dragleave', ()=>orderDropzone.classList.remove('drag'));\n  orderDropzone.addEventListener('drop', e=>{\n    e.preventDefault(); orderDropzone.classList.remove('drag');\n    if(e.dataTransfer.files.length) handleOrderFile(e.dataTransfer.files[0]);\n  });\n  orderFileInput.addEventListener('change', e=>{\n    if(e.target.files.length) handleOrderFile(e.target.files[0]);\n  });\n\n  const vehicleDropzone = $('vehicleDropzone');\n  const vehicleFileInput = $('vehicleFileInput');\n  vehicleDropzone.addEventListener('click', ()=>vehicleFileInput.click());\n  vehicleDropzone.addEventListener('dragover', e=>{e.preventDefault(); vehicleDropzone.classList.add('drag');});\n  vehicleDropzone.addEventListener('dragleave', ()=>vehicleDropzone.classList.remove('drag'));\n  vehicleDropzone.addEventListener('drop', e=>{\n    e.preventDefault(); vehicleDropzone.classList.remove('drag');\n    if(e.dataTransfer.files.length) handleVehicleFile(e.dataTransfer.files[0]);\n  });\n  vehicleFileInput.addEventListener('change', e=>{\n    if(e.target.files.length) handleVehicleFile(e.target.files[0]);\n  });\n\n  const ehojoDropzone = $('ehojoDropzone');\n  const ehojoFileInput = $('ehojoFileInput');\n  ehojoDropzone.addEventListener('click', ()=>ehojoFileInput.click());\n  ehojoDropzone.addEventListener('dragover', e=>{e.preventDefault(); ehojoDropzone.classList.add('drag');});\n  ehojoDropzone.addEventListener('dragleave', ()=>ehojoDropzone.classList.remove('drag'));\n  ehojoDropzone.addEventListener('drop', e=>{\n    e.preventDefault(); ehojoDropzone.classList.remove('drag');\n    if(e.dataTransfer.files.length) handleEhojoTemplateFile(e.dataTransfer.files[0]);\n  });\n  ehojoFileInput.addEventListener('change', e=>{\n    if(e.target.files.length) handleEhojoTemplateFile(e.target.files[0]);\n  });\n\n  function handleEhojoTemplateFile(file){\n    $('ehojoFileChipWrap').innerHTML =\n      '\u003cdiv class=\"file-chip\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;vertical-align:-2px\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\">\u003c/path>\u003cpolyline points=\"14 2 14 8 20 8\">\u003c/polyline>\u003c/svg> '+escapeHtml(file.name)+' &nbsp;\u003cbutton id=\"clearEhojoFileBtn\">제거\u003c/button>\u003c/div>';\n    $('clearEhojoFileBtn').onclick = ()=>{\n      ehojoTemplateBuffer = null;\n      $('ehojoFileChipWrap').innerHTML = '';\n    };\n\n    const reader = new FileReader();\n    reader.onload = function(e){\n      ehojoTemplateBuffer = e.target.result; // ArrayBuffer 그대로 보관 (다운로드 시마다 새로 로드해서 원본을 훼손하지 않음)\n    };\n    reader.onerror = function(){\n      alert('e호조 양식 파일을 읽는 중 오류가 발생했습니다.');\n      ehojoTemplateBuffer = null;\n    };\n    reader.readAsArrayBuffer(file);\n  }\n\n  function handleOrderFile(file){\n    $('orderFileChipWrap').innerHTML =\n      '\u003cdiv class=\"file-chip\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;vertical-align:-2px\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\">\u003c/path>\u003cpolyline points=\"14 2 14 8 20 8\">\u003c/polyline>\u003c/svg> '+escapeHtml(file.name)+' &nbsp;\u003cbutton id=\"clearOrderFileBtn\">제거\u003c/button>\u003c/div>';\n    $('clearOrderFileBtn').onclick = ()=>{\n      orderList = null;\n      refBankMap = {};\n      refNameSet = null;\n      empOrder.forEach(id=>{ selection[id] = true; }); // 필터 해제 시 전체 선택으로 복원\n      $('orderFileChipWrap').innerHTML = '';\n      if(empOrder.length) renderAll();\n    };\n\n    const reader = new FileReader();\n    reader.onload = function(e){\n      try{\n        const data = new Uint8Array(e.target.result);\n        const wb = XLSX.read(data, {type:'array'});\n        // 지급대상자 목록 파일은 월별 시트로 구성되어 있을 수 있으므로,\n        // 가장 오른쪽(=시트 목록의 마지막, 가장 최신 달)의 시트를 참고한다.\n        const lastSheetName = wb.SheetNames[wb.SheetNames.length - 1];\n        const sheet = wb.Sheets[lastSheetName];\n        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:false});\n        const parsed = parseOrderFile(rows);\n        if(!parsed){\n          alert('이 파일(가장 최신 시트: \"'+lastSheetName+'\")에서 \"연번\"/\"성명\" 열을 찾지 못했습니다. 지급대상자 목록 형식의 파일인지 확인해주세요.');\n          orderList = null; refBankMap = {}; refNameSet = null;\n          return;\n        }\n        orderList = parsed.names;\n        refBankMap = parsed.bankMap;\n        refNameSet = new Set(parsed.names);\n        if(empOrder.length){ applyReferenceFile(); renderStats(); renderEmpTable(); renderPreview(); }\n      }catch(err){\n        alert('참고 파일을 읽는 중 오류가 발생했습니다: '+err.message);\n        console.error(err);\n      }\n    };\n    reader.readAsArrayBuffer(file);\n  }\n\n  // 지급대상자 목록 최신 시트에서 '연번'/'성명' 헤더를 찾아\n  // 그 아래 성명들을 등장 순서대로, 그리고 같은 행의 은행명·계좌번호를 함께 추출\n  function parseOrderFile(rows){\n    const cleanLabel = v => v==null ? '' : String(v).trim().replace(/[\\r\\n]/g,'');\n    let headerRow = -1, nameIdx = -1, bankIdx = -1, accIdx = -1;\n    for(let r=0; r\u003crows.length; r++){\n      const row = rows[r];\n      if(!row) continue;\n      const nIdx = row.findIndex(v=>cleanLabel(v)==='성명');\n      if(nIdx === -1) continue;\n      const noIdx = row.findIndex(v=>cleanLabel(v)==='연번');\n      if(noIdx === -1) continue;\n      headerRow = r; nameIdx = nIdx;\n      bankIdx = row.findIndex(v=>cleanLabel(v)==='은행명');\n      accIdx = row.findIndex(v=>cleanLabel(v)==='계좌번호');\n      break;\n    }\n    if(headerRow === -1) return null;\n    const names = [];\n    const bankMap = {};\n    for(let r=headerRow+1; r\u003crows.length; r++){\n      const row = rows[r];\n      if(!row) continue;\n      const cell = row[nameIdx];\n      if(cell == null) continue;\n      const name = String(cell).trim();\n      if(!name || name === '계') continue;\n      names.push(name);\n      const bank = (bankIdx>=0 && row[bankIdx]!=null) ? String(row[bankIdx]).trim() : '';\n      const account = (accIdx>=0 && row[accIdx]!=null) ? String(row[accIdx]).trim() : '';\n      if(bank || account){\n        bankMap[name] = {bank, account};\n      }\n    }\n    return names.length ? {names, bankMap} : null;\n  }\n\n  function handleVehicleFile(file){\n    $('vehicleFileChipWrap').innerHTML =\n      '\u003cdiv class=\"file-chip\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;vertical-align:-2px\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\">\u003c/path>\u003cpolyline points=\"14 2 14 8 20 8\">\u003c/polyline>\u003c/svg> '+escapeHtml(file.name)+' &nbsp;\u003cbutton id=\"clearVehicleFileBtn\">제거\u003c/button>\u003c/div>';\n    $('clearVehicleFileBtn').onclick = ()=>{\n      vehicleUsageMap = new Map();\n      vehicleFileLoaded = false;\n      $('vehicleFileChipWrap').innerHTML = '';\n      if(empOrder.length){ computeAll(); renderStats(); renderEmpTable(); renderPreview(); }\n    };\n\n    const isCsv = /\\.csv$/i.test(file.name);\n    const reader = new FileReader();\n    reader.onload = function(e){\n      try{\n        let rows;\n        if(isCsv){\n          // 배차대장 CSV는 보통 CP949/EUC-KR(윈도우 엑셀 \"CSV\" 내보내기)로 인코딩되어 있어\n          // UTF-8로 그대로 읽으면 한글이 깨진다. EUC-KR로 우선 시도하고, 깨짐이 심하면 UTF-8로 재시도.\n          const buf = e.target.result;\n          let text;\n          try{\n            text = new TextDecoder('euc-kr').decode(buf);\n          }catch(_e){\n            text = new TextDecoder('utf-8').decode(buf);\n          }\n          if((text.match(/\\uFFFD/g)||[]).length > 3){ // 대체문자(�)가 많으면 잘못된 인코딩으로 판단, UTF-8로 재시도\n            text = new TextDecoder('utf-8').decode(buf);\n          }\n          const wbCsv = XLSX.read(text, {type:'string'});\n          rows = XLSX.utils.sheet_to_json(wbCsv.Sheets[wbCsv.SheetNames[0]], {header:1, defval:null, raw:false});\n        } else {\n          const data = new Uint8Array(e.target.result);\n          const wb = XLSX.read(data, {type:'array'});\n          // 월별 시트로 구성되어 있을 수 있으므로, 가장 오른쪽(=최신) 시트를 우선 사용.\n          const lastSheetName = wb.SheetNames[wb.SheetNames.length - 1];\n          rows = XLSX.utils.sheet_to_json(wb.Sheets[lastSheetName], {header:1, defval:null, raw:false});\n        }\n        const parsed = parseVehicleFile(rows);\n        if(!parsed || !parsed.size){\n          alert('이 파일에서 사용일시/사용자 등 배차대장 열을 찾지 못했거나 유효한 배차 기록이 없습니다. 차량배차 현황 파일 형식을 확인해주세요.');\n          vehicleUsageMap = new Map(); vehicleFileLoaded = false;\n          return;\n        }\n        vehicleUsageMap = parsed;\n        vehicleFileLoaded = true;\n        if(empOrder.length){ computeAll(); renderStats(); renderEmpTable(); renderPreview(); }\n      }catch(err){\n        alert('차량배차 파일을 읽는 중 오류가 발생했습니다: '+err.message);\n        console.error(err);\n      }\n    };\n    if(isCsv) reader.readAsArrayBuffer(file);\n    else reader.readAsArrayBuffer(file);\n  }\n\n  // 배차대장(예: 새올 차량배차 현황) 형식을 우선 지원:\n  // 순번,신청일자,사용일시,차량등록번호,차명,차량사용부서,차량관리부서,사용자,운전자,신청자,\n  // 배차여부,운행상황,반납시간,운행일지,목적지,용무,동승자 수,동승자,배차신청결재,배차승인결재,비고\n  // \"사용일시\"에서 실제 이용 기간(날짜)을 뽑고, \"사용자\"+\"운전자\"+\"동승자\"에 포함된 모든 사람에게\n  // 그 날짜(들)의 차량 이용과 그때의 \"목적지\" 텍스트를 함께 기록한다(관내/관외 판정은 계산 시점에 수행).\n  // 다만 배차여부/운행상황이 취소·미운행 등으로 보이면 제외.\n  function parseVehicleFile(rows){\n    const cleanLabel = v => v==null ? '' : String(v).trim().replace(/[\\r\\n]/g,'');\n    const DATE_LABELS = ['사용일시','배차일자','운행일자','사용일자','출장일자','배차일','운행일','사용일','날짜','일자','배차기간','운행기간'];\n    const NAME_LABELS = ['사용자','성명','신청자','신청인','운전자','이름'];\n\n    let headerRow = -1, dateIdx = -1, nameIdx = -1, driverIdx = -1, companionIdx = -1, statusIdx = -1, assignIdx = -1, destIdx = -1;\n    for(let r=0; r\u003crows.length; r++){\n      const row = rows[r];\n      if(!row) continue;\n      let dIdx = -1;\n      for(const label of DATE_LABELS){ dIdx = row.findIndex(v=>cleanLabel(v)===label); if(dIdx!==-1) break; }\n      if(dIdx === -1) continue;\n      let nIdx = -1;\n      for(const label of NAME_LABELS){ nIdx = row.findIndex(v=>cleanLabel(v)===label); if(nIdx!==-1) break; }\n      if(nIdx === -1) continue;\n      headerRow = r; dateIdx = dIdx; nameIdx = nIdx;\n      driverIdx = row.findIndex(v=>cleanLabel(v)==='운전자');\n      companionIdx = row.findIndex(v=>cleanLabel(v)==='동승자');\n      statusIdx = row.findIndex(v=>cleanLabel(v)==='운행상황');\n      assignIdx = row.findIndex(v=>cleanLabel(v)==='배차여부');\n      destIdx = row.findIndex(v=>cleanLabel(v)==='목적지');\n      break;\n    }\n    if(headerRow === -1) return null;\n\n    const usageMap = new Map(); // key(\"성명|YYYY-MM-DD\") -> [목적지 텍스트, ...]\n    for(let r=headerRow+1; r\u003crows.length; r++){\n      const row = rows[r];\n      if(!row) continue;\n      const dateCell = row[dateIdx];\n      if(dateCell == null || String(dateCell).trim()==='') continue;\n\n      if(!isActuallyDriven(assignIdx>=0?row[assignIdx]:null, statusIdx>=0?row[statusIdx]:null)) continue;\n\n      const names = new Set();\n      const addFrom = (cell)=>{ splitPeopleNames(cell).forEach(n=>names.add(n)); };\n      addFrom(row[nameIdx]);\n      if(driverIdx >= 0) addFrom(row[driverIdx]);\n      if(companionIdx >= 0) addFrom(row[companionIdx]);\n      if(!names.size) continue;\n\n      const destText = (destIdx >= 0 && row[destIdx] != null) ? String(row[destIdx]).trim() : '';\n      const dateKeys = parseVehicleDates(dateCell);\n      if(!dateKeys.length) continue;\n      names.forEach(name=>{\n        dateKeys.forEach(dk=>{\n          const key = name+'|'+dk;\n          if(!usageMap.has(key)) usageMap.set(key, []);\n          usageMap.get(key).push(destText);\n        });\n      });\n    }\n    return usageMap;\n  }\n\n  // 목적지 텍스트가 \"관외(타지역)\"에 해당하는지 판정. 키워드(기본 \"관외\")를 포함하면 관외로 본다.\n  function isOutsideDestination(destText, outsideKeywords){\n    if(!destText) return false;\n    return outsideKeywords.some(k=>k && destText.includes(k));\n  }\n\n  // 해당 성명·날짜에 \"관내\" 배차(운행) 기록이 하나라도 있는지 확인.\n  // 목적지 정보가 아예 없는 배차 기록(destText === '')은 관내로 간주한다(기존 동작 유지).\n  function hasInJurisdictionVehicleUsage(name, dateKey, rules){\n    const dests = vehicleUsageMap.get(name+'|'+dateKey);\n    if(!dests) return false;\n    return dests.some(destText => !isOutsideDestination(destText, rules.outsideKeywords));\n  }\n\n  // 배차여부/운행상황 값으로 볼 때 \"실제로 운행\"된 건인지 판단.\n  // 명시적으로 취소·미운행을 나타내는 표현이 있으면 false, 그 외(정보 없음 포함)에는 true로 간주.\n  function isActuallyDriven(assignCell, statusCell){\n    const s1 = String(assignCell==null?'':assignCell).trim();\n    const s2 = String(statusCell==null?'':statusCell).trim();\n    const NEGATIVE = ['취소','반려','미승인','미배차','불가','미운행','운행전','대기중','철회'];\n    if(NEGATIVE.some(k=>s1.includes(k))) return false;\n    if(NEGATIVE.some(k=>s2.includes(k))) return false;\n    return true;\n  }\n\n  // \"박성일-조상미\", \"조선영- 조상미\" 처럼 한 칸에 여러 명이 하이픈 등으로 이어져 있는 경우를\n  // 개별 이름으로 분리한다. 값이 없거나 \"없음\" 등 자리표시 텍스트면 빈 배열 반환.\n  function splitPeopleNames(cell){\n    if(cell == null) return [];\n    const raw = String(cell).replace(/[\\r\\n]/g,' ').trim();\n    if(!raw) return [];\n    const PLACEHOLDER = ['없음','해당없음','-','.',''];\n    return raw.split(/[-,·\\/、;]+/)\n      .map(s=>{\n        const t = s.trim();\n        const withId = parseName(t);\n        return withId ? withId.name : t;\n      })\n      .filter(n=>n && !PLACEHOLDER.includes(n));\n  }\n\n  // 사용일시 칸이 단일 날짜(\"2026-07-01\"), 기간(\"2026-07-01 09:00 ~ 2026-07-01 18:00\" 등\n  // 여러 날에 걸친 기간 포함), 점(.)/슬래시(/) 구분자 등 다양한 형식일 수 있으므로 유연하게 파싱.\n  // 기간으로 되어 있으면 그 사이의 모든 날짜를 각각 반환(해당 기간 내 어느 날이든 감액 대상).\n  function parseVehicleDates(cell){\n    const raw = String(cell).replace(/\\r/g,' ').replace(/\\n/g,' ').trim();\n    if(!raw) return [];\n    const parts = raw.indexOf('~') !== -1 ? raw.split('~') : [raw];\n    const toYMD = (s)=>{\n      const m = String(s).trim().match(/(\\d{4})[.\\-\\/](\\d{1,2})[.\\-\\/](\\d{1,2})/);\n      if(!m) return null;\n      return {y:+m[1], mo:+m[2], d:+m[3]};\n    };\n    const start = toYMD(parts[0]);\n    if(!start) return [];\n    const end = parts.length > 1 ? (toYMD(parts[1]) || start) : start;\n    const startDate = new Date(start.y, start.mo-1, start.d);\n    const endDate = new Date(end.y, end.mo-1, end.d);\n    const keys = [];\n    if(isNaN(startDate) || isNaN(endDate) || endDate \u003c startDate){\n      keys.push(start.y+'-'+String(start.mo).padStart(2,'0')+'-'+String(start.d).padStart(2,'0'));\n      return keys;\n    }\n    // 과도하게 긴 기간(파싱 오류 등) 방지용 안전장치\n    let cur = new Date(startDate);\n    let guard = 0;\n    while(cur \u003c= endDate && guard \u003c 62){\n      keys.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));\n      cur.setDate(cur.getDate()+1);\n      guard++;\n    }\n    return keys;\n  }\n\n  // 참고 파일(orderList/refBankMap/refNameSet)을 employees/selection/overrides에 반영\n  function applyReferenceFile(){\n    if(!refNameSet && !Object.keys(refBankMap).length) return;\n    empOrder.forEach(id=>{\n      const emp = employees[id];\n      if(refNameSet){\n        selection[id] = refNameSet.has(emp.name); // 참고 파일에 있는 사람만 선택(체크)\n      }\n      const ref = refBankMap[emp.name];\n      if(ref){\n        if(!overrides[id]) overrides[id] = {bank:'', account:'', holder:emp.name, purpose:mostCommonPurpose(emp)};\n        if(ref.bank) overrides[id].bank = ref.bank;\n        if(ref.account) overrides[id].account = ref.account;\n      }\n    });\n  }\n\n  // 참고 파일이 있으면 그 순서를, 없으면 원본 등장 순서를 반환\n  function getDisplayOrder(){\n    if(!orderList || !orderList.length) return empOrder;\n    const rank = {};\n    orderList.forEach((n, i)=>{ if(!(n in rank)) rank[n] = i; });\n    return [...empOrder].sort((a,b)=>{\n      const ra = (employees[a].name in rank) ? rank[employees[a].name] : Infinity;\n      const rb = (employees[b].name in rank) ? rank[employees[b].name] : Infinity;\n      if(ra !== rb) return ra - rb;\n      return empOrder.indexOf(a) - empOrder.indexOf(b);\n    });\n  }\n\n  function handleFile(file){\n    $('fileChipWrap').innerHTML =\n      '\u003cdiv class=\"file-chip\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;vertical-align:-2px\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\">\u003c/path>\u003cpolyline points=\"14 2 14 8 20 8\">\u003c/polyline>\u003c/svg> '+escapeHtml(file.name)+' &nbsp;\u003cbutton id=\"clearFileBtn\">제거\u003c/button>\u003c/div>';\n    $('clearFileBtn').onclick = ()=>{ location.reload(); };\n\n    const reader = new FileReader();\n    reader.onload = function(e){\n      try{\n        const data = new Uint8Array(e.target.result);\n        const wb = XLSX.read(data, {type:'array'});\n        const sheet = wb.Sheets[wb.SheetNames[0]];\n        allRows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:false});\n        parseEmployees();\n        computeAll();\n        renderAll();\n      }catch(err){\n        alert('파일을 읽는 중 오류가 발생했습니다: '+err.message);\n        console.error(err);\n      }\n    };\n    reader.readAsArrayBuffer(file);\n  }\n\n  // ---------- Parsing ----------\n  function parseName(cell){\n    if(!cell) return null;\n    const m = String(cell).trim().match(/^(.+?)\\(([^)]+)\\)\\s*$/);\n    if(!m) return null;\n    return {name:m[1].trim(), id:m[2].trim()};\n  }\n\n  function parsePeriod(cell){\n    if(!cell) return null;\n    const clean = String(cell).replace(/\\r/g,' ').replace(/\\n/g,' ').trim();\n    if(clean.indexOf('~') === -1) return null;\n    const parts = clean.split('~');\n    if(parts.length !== 2) return null;\n    const sd = parseDT(parts[0].trim());\n    const ed = parseDT(parts[1].trim());\n    if(!sd || !ed) return null;\n    return {start:sd, end:ed};\n  }\n\n  function parseDT(s){\n    const m = s.match(/(\\d{4})-(\\d{2})-(\\d{2})\\s+(\\d{2}):(\\d{2})/);\n    if(!m) return null;\n    return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);\n  }\n\n  // 헤더 행을 찾아 '성명','출장기간','소속/직급','출장목적' 컬럼의 실제 위치를 동적으로 감지.\n  // (엑셀마다 사용범위 시작열이 A열/B열 등으로 달라질 수 있어 고정 인덱스는 어긋나기 쉬움)\n  function detectColumns(rows){\n    const cleanLabel = v => v==null ? '' : String(v).trim().replace(/[\\r\\n]/g,'');\n    for(let r=0; r\u003crows.length; r++){\n      const row = rows[r];\n      if(!row) continue;\n      const nameIdx = row.findIndex(v=>cleanLabel(v)==='성명');\n      if(nameIdx === -1) continue;\n      const periodIdx = row.findIndex(v=>cleanLabel(v)==='출장기간');\n      if(periodIdx === -1) continue; // 진짜 헤더행인지 재확인\n      const findIdx = (label)=> row.findIndex(v=>cleanLabel(v)===label);\n      return {\n        name: nameIdx,\n        period: periodIdx,\n        dept: findIdx('소속/직급'),\n        purpose: findIdx('출장목적'),\n        headerRow: r\n      };\n    }\n    return null;\n  }\n\n  function parseEmployees(){\n    employees = {}; empOrder = [];\n    const cols = detectColumns(allRows);\n    if(!cols){\n      alert('엑셀에서 \"성명\"/\"출장기간\" 헤더를 찾을 수 없습니다. 파일 형식을 확인해주세요.');\n      return;\n    }\n    for(const row of allRows){\n      if(!row) continue;\n      const nameCell = row[cols.name];\n      const periodCell = row[cols.period];\n      const deptCell = cols.dept >= 0 ? row[cols.dept] : null;\n      const purposeCell = cols.purpose >= 0 ? row[cols.purpose] : null;\n      const parsedName = parseName(nameCell);\n      if(!parsedName) continue;\n      const period = parsePeriod(periodCell);\n      if(!period) continue;\n\n      const dur = (period.end - period.start) / 3600000; // hours\n      if(!(dur >= 0)) continue;\n\n      const y = period.start.getFullYear(), mo = period.start.getMonth()+1, d = period.start.getDate();\n      const dateKey = y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');\n\n      if(!employees[parsedName.id]){\n        employees[parsedName.id] = {\n          id: parsedName.id, name: parsedName.name,\n          dept: (deptCell? String(deptCell).replace(/_x000D_/g,' ').replace(/[\\r\\n]+/g,' ').trim() : ''),\n          purposeCounts: {}, records: [], allCount: 0\n        };\n        empOrder.push(parsedName.id);\n      }\n      const emp = employees[parsedName.id];\n      emp.allCount++;\n      emp.records.push({date:dateKey, day:d, hours:dur});\n      if(purposeCell){\n        const p = String(purposeCell).replace(/_x000D_/g,' ').replace(/[\\r\\n]+/g,' ').trim();\n        if(p){ emp.purposeCounts[p] = (emp.purposeCounts[p]||0)+1; }\n      }\n    }\n  }\n\n  function mostCommonPurpose(emp){\n    let best=null, bestN=-1;\n    for(const p in emp.purposeCounts){\n      if(emp.purposeCounts[p] > bestN){ best=p; bestN = emp.purposeCounts[p]; }\n    }\n    return best || '';\n  }\n\n  // ---------- Fee computation ----------\n  function computeForEmployee(emp, rules){\n    const byDate = {};\n    emp.records.forEach(r=>{\n      (byDate[r.date] = byDate[r.date] || []).push(r);\n    });\n    const dates = Object.keys(byDate).sort();\n\n    // 1) 날짜별 산정액 계산\n    //    같은 날 기록이 2건 이상이어도, 그 중 한 건이라도 단독으로\n    //    \"단일 출장 인정 기준(fullHours)\"을 넘으면 그날은 무조건 1일 최대액 전액을 인정한다.\n    //    (예: 하루 중 한 건이 4시간 이상이면 다른 짧은 건이 섞여 있어도 절반으로 깎지 않음)\n    const dayFeesAll = dates.map(d=>{\n      const dayRecs = byDate[d];\n      let fee = 0;\n      if(dayRecs.length === 1){\n        // 하루에 출장이 1건뿐인 경우: 4시간(단일인정기준) 이상이면 전액, 1시간(분할인정기준) 이상이면 절반\n        const h = dayRecs[0].hours;\n        if(h >= rules.fullHours) fee = rules.dailyCap;\n        else if(h >= rules.splitHours) fee = rules.dailyCap/2;\n        else fee = 0;\n      } else {\n        // 하루에 출장이 2건 이상인 경우: 각 건이 1시간(분할인정기준)을 넘으면 건당 절반씩,\n        // 합산액은 1일 최대액을 넘지 않도록 상한\n        dayRecs.forEach(r=>{\n          if(r.hours >= rules.splitHours) fee += rules.dailyCap/2;\n        });\n        fee = Math.min(fee, rules.dailyCap);\n      }\n      // 차량 감액: 출장기록의 \"공무용차량 사용\" 표시와 무관하게, 차량배차 현황 파일에\n      // 실제 배차(운행) 기록이 있고 그 목적지가 관내인 날짜만 감액한다\n      // (목적지가 관외로 표시된 배차는 관내여비 계산에 영향을 주지 않음. 파일을 올리지 않았으면 적용 안 함).\n      let vehicleDeducted = false, vehicleDeductAmount = 0;\n      if(vehicleFileLoaded && rules.vehicleDeduction > 0 && fee > 0 && hasInJurisdictionVehicleUsage(emp.name, d, rules)){\n        const before = fee;\n        fee = Math.max(0, fee - rules.vehicleDeduction);\n        vehicleDeducted = true;\n        vehicleDeductAmount = before - fee;\n      }\n      return {date:d, day:dayRecs[0].day, fee, vehicleDeducted, vehicleDeductAmount};\n    });\n    // 계산(월한도 배분)에는 실제 지급액이 0원보다 큰 날짜만 사용\n    const dayFees = dayFeesAll.filter(x=>x.fee > 0);\n\n    // 2) 월 한도 내에서 합계가 최대한(가능하면 한도까지 꽉) 채워지도록 선택.\n    //    날짜 오름차순으로 채우다 중간에 끊는 방식이 아니라,\n    //    금액이 큰 날(전액)부터 먼저 채우고 남는 한도를 반액짜리로 메워\n    //    월 한도를 최대한 소진시킨다. (날짜 순서는 최종 합계 산정에 영향 없음)\n    const sortedByFeeDesc = [...dayFees].sort((a,b)=> b.fee - a.fee || (a.date \u00
