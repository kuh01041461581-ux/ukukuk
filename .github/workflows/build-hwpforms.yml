name: Build 한글양식생성기 (hwp_form_generator)

on:
  push:
    paths: ["hwp_form_generator/**", ".github/workflows/build-hwpforms.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hwp_form_generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests --ignore=tests/test_gui.py
      - name: Build exe
        run: python -m PyInstaller -F -w --icon assets/app.ico --name HwpFormGenerator --add-data "forms;forms" --add-data "assets;assets" --hidden-import lxml.etree --hidden-import win32com.client --hidden-import pythoncom --hidden-import pystray._win32 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HwpFormGenerator
          path: hwp_form_generator/dist/HwpFormGenerator.exe
      - name: 릴리스에 올리기 (latest-hwpforms)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-hwpforms --yes --cleanup-tag || true
          gh release create latest-hwpforms dist/HwpFormGenerator.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "한글 양식 생성기 (최신 빌드)" \
            --notes "한글 옆에 붙여 쓰는 양식 도우미. HwpFormGenerator.exe 를 내려받아 실행하세요. 커밋 $GITHUB_SHA"
