name: Build 서무 업무 자동화 (Qt) exe

on:
  push:
    branches: [main, "claude/**"]
    paths: ["seomu/**", "run_seomu.py", "requirements-seomu.txt", ".github/workflows/build-seomu-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-seomu.txt pyinstaller
      - name: Build exe (폴더 → zip)
        env:
          SEOMU_VERSION: v2.0.${{ github.run_number }}
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name SeomuSuite --icon seomu/assets/icon.ico
          --add-data "seomu/assets;seomu/assets"
          --collect-submodules seomu
          --collect-data cv2
          --exclude-module tkinter --exclude-module unittest --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick
          run_seomu.py
      - name: 점검 (글꼴·모델·모든 화면)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\SeomuSuite\SeomuSuite.exe -ArgumentList "--selftest" -Wait -PassThru -RedirectStandardOutput out.txt
          Get-Content out.txt
          if ($p.ExitCode -ne 0) { throw "selftest 실패" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\SeomuSuite -DestinationPath SeomuSuite-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SeomuSuite-windows
          path: SeomuSuite-windows.zip
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-seomu
          name: 서무 업무 자동화 최신 빌드 (SeomuSuite-windows.zip)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            **SeomuSuite-windows.zip** 을 내려받아 압축을 풀고 `SeomuSuite.exe` 를 실행하세요. 설치 필요 없음 · Windows 10/11.
            처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** 을 누르세요(서명되지 않은 프로그램이라 나오는 안내입니다).
          files: SeomuSuite-windows.zip
