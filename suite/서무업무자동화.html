ransportFields()\">\n        \u003coption value=\"공무용차량\">공무용차량(관용차)\u003c/option>\n        \u003coption value=\"자차\">자차\u003c/option>\n        \u003coption value=\"기차\">기차/철도\u003c/option>\n        \u003coption value=\"기타\">대중교통/기타(무료)\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"formrow\">\u003clabel>왕복 거리(km)\u003c/label>\u003cinput type=\"number\" id=\"m_distance\" placeholder=\"예: 342\">\u003c/div>\n    \u003cdiv class=\"hint\" style=\"margin:-4px 0 10px;\">※ 편도가 아닌 왕복 총거리 기준입니다. 100km 이상이면 식비 3끼(25,000원) 지급 조건에 해당될 수 있어요.\u003c/div>\n    \u003cdiv id=\"m_carFields\" style=\"display:none;\">\n      \u003cdiv class=\"formrow\">\u003clabel>탑승 구분\u003c/label>\n        \u003cdiv class=\"checkbox-row\" style=\"gap:14px;\">\n          \u003clabel class=\"small\">\u003cinput type=\"radio\" name=\"m_carRole\" value=\"driver\" checked> 운전자(운임료 지급)\u003c/label>\n          \u003clabel class=\"small\">\u003cinput type=\"radio\" name=\"m_carRole\" value=\"passenger\"> 동승자(운임료 제외, 일비만)\u003c/label>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"formrow\">\u003clabel>유종\u003c/label>\n        \u003cselect id=\"m_fuelType\" onchange=\"onCarFuelChange('m_oilPrice','m_fuelType','m_rate','m_oilUnit')\">\u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"formrow\">\u003clabel>차종\u003c/label>\n        \u003cselect id=\"m_carType\">\u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"hint\" style=\"margin:-4px 0 6px;\">※ 차종은 통행료(하이패스) 참고용일 뿐, 운임단가 계산에는 영향을 주지 않습니다.\u003c/div>\n      \u003cdiv class=\"formrow\">\u003clabel>유가(\u003cspan id=\"m_oilUnit\">원/L\u003c/span>)\u003c/label>\n        \u003cdiv style=\"display:flex;gap:6px;align-items:center;\">\n          \u003cinput type=\"number\" id=\"m_oilPrice\" value=\"1859\" oninput=\"updateRateFromOilPrice('m_oilPrice','m_fuelType','m_rate')\" style=\"flex:1;\">\n          \u003cbutton class=\"btn outline sm\" type=\"button\" onclick=\"onCarFuelChange('m_oilPrice','m_fuelType','m_rate','m_oilUnit')\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M21 12a9 9 0 1 1-2.64-6.36\"/>\u003cpath d=\"M21 3v6h-6\"/>\u003c/svg> 유가 조회\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"small\" id=\"m_oilPrice_src\" style=\"grid-column:2;color:var(--text-sub);\">예시값(직접 확인 후 수정 권장)\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"formrow\">\u003clabel>운임단가(원/km)\u003c/label>\u003cinput type=\"number\" id=\"m_rate\" value=\"140\">\u003c/div>\n      \u003cdiv class=\"hint\" style=\"margin:-4px 0 6px;\">※ 운임단가 = 유가 ÷ 유종별 연비(공무원보수 등의 업무지침 고시값). 거리 계산기 탭에서 유종을 바꾸면 자동으로 다시 계산되며, 필요하면 직접 수정할 수 있습니다.\u003c/div>\n      \u003cdiv class=\"formrow\">\u003clabel>통행료(원)\u003c/label>\u003cinput type=\"number\" id=\"m_toll\" value=\"0\">\u003c/div>\n      \u003cdiv class=\"formrow\">\u003clabel>\u003c/label>\u003cdiv class=\"checkbox-row\">\u003cinput type=\"checkbox\" id=\"m_tollReceipt\">\u003clabel for=\"m_tollReceipt\" class=\"small\">통행료 영수증 첨부함\u003c/label>\u003c/div>\u003c/div>\n      \u003cdiv class=\"hint\" style=\"margin-top:-4px;\">※ 같은 차로 함께 이동한 인원이 여러 명이면, \u003cb>운전자 1명만 \"운전자\"\u003c/b>로 선택하고 나머지는 \"동승자\"로 선택하세요. 동승자는 자차 운임료(거리×단가+통행료)를 받지 않고 일비·식비·숙박비만 지급됩니다. 여러 명에게 한 번에 거리를 적용하려면 \"③ 거리 계산기·자차 입력\" 탭을 이용하세요.\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"m_trainFields\" style=\"display:none;\">\n      \u003cdiv class=\"formrow\">\u003clabel>\u003c/label>\u003cdiv class=\"checkbox-row\">\u003cinput type=\"checkbox\" id=\"m_trainOneWay\" onchange=\"toggleTrainOneWay()\">\u003clabel for=\"m_trainOneWay\" class=\"small\">왕복이 아니라 가는 편·오는 편을 따로 입력(편도, 귀임 교통수단이 다를 때)\u003c/label>\u003c/div>\u003c/div>\n      \u003cdiv id=\"m_trainRoundFields\">\n        \u003cdiv class=\"formrow\">\u003clabel>기차/KTX 요금(원)\u003c/label>\u003cinput type=\"number\" id=\"m_trainFare\" placeholder=\"예: 23700\">\u003c/div>\n        \u003cdiv class=\"hint\" style=\"margin:-4px 0 6px;\">※ 왕복 합계 금액입니다. 승차권(매표)에 적힌 금액을 직접 입력해주세요.\u003c/div>\n        \u003cdiv class=\"formrow\">\u003clabel>\u003c/label>\u003cdiv class=\"checkbox-row\">\u003cinput type=\"checkbox\" id=\"m_trainTicket\">\u003clabel for=\"m_trainTicket\" class=\"small\">승차권 첨부함\u003c/label>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"m_trainOneWayFields\" style=\"display:none;\">\n        \u003cdiv class=\"hint\" style=\"margin:0 0 6px;font-weight:600;\">▸ 가는 편(출발 → 목적지)\u003c/div>\n        \u003cdiv class=\"formrow\">\u003clabel>가는 편 요금(원)\u003c/label>\u003cinput type=\"number\" id=\"m_trainFareGo\" placeholder=\"예: 12000\">\u003c/div>\n        \u003cdiv class=\"formrow\">\u003clabel>\u003c/label>\u003cdiv class=\"checkbox-row\">\u003cinput type=\"checkbox\" id=\"m_trainTicketGo\">\u003clabel for=\"m_trainTicketGo\" class=\"small\">승차권 첨부함\u003c/label>\u003c/div>\u003c/div>\n        \u003cdiv class=\"hint\" style=\"margin:8px 0 6px;font-weight:600;\">▸ 오는 편(목적지 → 복귀)\u003c/div>\n        \u003cdiv class=\"formrow\">\u003clabel>오는 편 교통수단\u003c/label>\n          \u003cselect id=\"m_returnTransport\" onchange=\"toggleReturnTransportFields()\">\n            \u003coption value=\"기차\">기차/철도\u003c/option>\n            \u003coption value=\"공무용차량\">공무용차량(관용차, 무료)\u003c/option>\n            \u003coption value=\"기타\">대중교통/기타(무료)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv id=\"m_returnTrainFields\">\n          \u003cdiv class=\"formrow\">\u003clabel>오는 편 요금(원)\u003c/label>\u003cinput type=\"number\" id=\"m_trainFareReturn\" placeholder=\"예: 12000\">\u003c/div>\n          \u003cdiv class=\"formrow\">\u003clabel>\u003c/label>\u003cdiv class=\"checkbox-row\">\u003cinput type=\"checkbox\" id=\"m_trainTicketReturn\">\u003clabel for=\"m_trainTicketReturn\" class=\"small\">승차권 첨부함\u003c/label>\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"hint\" style=\"margin:-4px 0 6px;\">※ 오는 편을 관용차·대중교통으로 선택하면 오는 편 교통비는 지급되지 않습니다(무료).\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"formrow\">\u003clabel>숙박 일수\u003c/label>\u003cinput type=\"number\" id=\"m_nights\" value=\"0\" min=\"0\">\u003c/div>\n    \u003cdiv class=\"formrow\">\u003clabel>숙박 지역\u003c/label>\n      \u003cselect id=\"m_lodgeRegion\">\n        \u003coption value=\"서울\">서울 (1박 최대 100,000원)\u003c/option>\n        \u003coption value=\"광역시\">광역시 (1박 최대 80,000원)\u003c/option>\n        \u003coption value=\"기타\">그 밖의 지역 (1박 최대 70,000원)\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"formrow\">\u003clabel>숙박비(영수증)\u003c/label>\u003cinput type=\"number\" id=\"m_lodge\" value=\"0\" placeholder=\"영수증 금액 입력\">\u003c/div>\n    \u003cdiv class=\"formrow\">\u003clabel>비고\u003c/label>\u003cinput id=\"m_notes\" placeholder=\"선택 입력\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn ghost\" onclick=\"closeTripModal()\">취소\u003c/button>\n      \u003cbutton class=\"btn\" onclick=\"saveTripModal()\">저장\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n/* 기본 내장 결의서 서식(.hwpx) — 서식의 표/문구는 절대 수정하지 않고, 이 파일을 그대로 복제해\n   이름/금액/계좌 등 값만 갈아끼운다. 다른 서식을 쓰려면 화면에서 드래그앤드롭으로 교체 가능. */\nconst DEFAULT_HWPX_B64 = \"UEsDBBQAAAAAAAAAIQCC8EFHEwAAABMAAAAIAAAAbWltZXR5cGVhcHBsaWNhdGlvbi9od3AremlwUEsDBBQAAAAAAAAAIQCEPDSBNQEAADUBAAALAAAAdmVyc2lvbi54bWw8P3htbCB2ZXJzaW9uPSIxLjAiIGVuY29kaW5nPSJVVEYtOCIgc3RhbmRhbG9uZT0ieWVzIiA/PjxodjpIQ0ZWZXJzaW9uIHhtbG5zOmh2PSJodHRwOi8vd3d3LmhhbmNvbS5jby5rci9od3BtbC8yMDExL3ZlcnNpb24iIHRhZ2V0QXBwbGljYXRpb249IldPUkRQUk9DRVNTT1IiIG1ham9yPSI1IiBtaW5vcj0iMSIgbWljcm89IjAiIGJ1aWxkTnVtYmVyPSIxIiBvcz0iMSIgeG1sVmVyc2lvbj0iMS40IiBhcHBsaWNhdGlvbj0iSGFuY29tIE9mZmljZSBIYW5ndWwiIGFwcFZlcnNpb249IjExLCAwLCAwLCA1NDA5IFdJTjMyTEVXaW5kb3dzXzgiLz5QSwMEFAAEAAgAAAAhALWyt85HGQAAfLABABMAAABDb250ZW50cy9oZWFkZXIueG1s7V1bb+PIlf4rhPKSfbBlyW67bcQJfG2rx203bDmdfpkBLZVEjimSIan2OE8TBAEC5GF3gJlFsJmHGexidzIYYBuTfmjsZv/Q2P0f9qvinRJJkaIkiq7uBxcp1uVU1Tl1Ll9V/eJXnw0U4Q0xTF xtContent = msg; t.classList.add('show');\n  clearTimeout(window._toastT);\n  window._toastT = setTimeout(()=>t.classList.remove('show'), 2200);\n}\nfunction fmt(n){ return (Math.round(n)||0).toLocaleString('ko-KR')+'원'; }\n\n/* ============================================================\n   탭 전환\n============================================================ */\ndocument.querySelectorAll('.tabbtn').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));\n    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));\n    b.classList.add('active');\n    document.getElementById('tab-'+b.dataset.tab).classList.add('active');\n    const topbarTitleEl = document.getElementById('topbarTitle');\n    if(topbarTitleEl) topbarTitleEl.textContent = b.dataset.title || b.textContent.trim();\n    const topbarActionsEl = document.getElementById('topbarActions');\n    if(topbarActionsEl) topbarActionsEl.style.display = (b.dataset.tab==='output') ? 'flex' : 'none';\n    if(b.dataset.tab==='calc') renderCalcTable();\n    if(b.dataset.tab==='output') renderDocSelectList();\n    if(b.dataset.tab==='distance') renderDistApplyList();\n    updateNavStatus();\n  });\n});\n/* 왼쪽 메뉴에 각 단계의 완료 여부를 표시 (● 초록=완료, ● 주황=진행중, 빈칸=시작 전) */\nlet hwpxGeneratedOnce = false;\nfunction setNavStatus(tabName, state){\n  const el = document.getElementById('navStatus-'+tabName);\n  if(!el) return;\n  el.classList.remove('done','doing');\n  if(state==='done'){ el.classList.add('done'); el.innerHTML='\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" style=\"width:10px;height:10px;stroke-width:3\">\u003cpolyline points=\"20 6 9 17 4 12\"/>\u003c/svg>'; }\n  else if(state==='doing'){ el.classList.add('doing'); el.textContent=''; }\n  else { el.textContent=''; }\n}\nfunction updateNavStatus(){\n  setNavStatus('staff', staffDB.length>0 ? 'done' : '');\n  setNavStatus('trip', tripDB.length>0 ? 'done' : '');\n  if(tripDB.length===0){\n    setNavStatus('distance', '');\n    setNavStatus('calc', '');\n  } else {\n    const carTrips = tripDB.filter(t=>t.transport==='자차');\n    const distanceReady = carTrips.length===0 || carTrips.every(t=>t.distance>0);\n    setNavStatus('distance', distanceReady ? 'done' : 'doing');\n    setNavStatus('calc', 'done');\n  }\n  setNavStatus('output', hwpxGeneratedOnce ? 'done' : (tripDB.length>0 ? 'doing' : ''));\n}\n\n/* ============================================================\n   TAB1: 부서원 계좌관리\n============================================================ */\nfunction renderStaffTable(){\n  updateNavStatus();\n  const tb = document.querySelector('#staffTable tbody');\n  tb.innerHTML = '';\n  staffDB.forEach((s,i)=>{\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      \u003ctd>${i+1}\u003c/td>\n      \u003ctd>\u003cinput value=\"${s.name||''}\" onchange=\"updStaff(${i},'name',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput value=\"${s.dept||''}\" onchange=\"updStaff(${i},'dept',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput value=\"${s.position||''}\" onchange=\"updStaff(${i},'position',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput value=\"${s.bankCode||''}\" style=\"width:50px\" onchange=\"updStaff(${i},'bankCode',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput value=\"${s.bankName||''}\" onchange=\"updStaff(${i},'bankName',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput value=\"${s.account||''}\" onchange=\"updStaff(${i},'account',this.value)\">\u003c/td>\n      \u003ctd>\u003cbutton class=\"icon-btn danger\" title=\"삭제\" onclick=\"delStaff(${i})\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpolyline points=\"3 6 5 6 21 6\"/>\u003cpath d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/>\u003cpath d=\"M10 11v6M14 11v6\"/>\u003cpath d=\"M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2\"/>\u003c/svg>\u003c/button>\u003c/td>`;\n    tb.appendChild(tr);\n  });\n  refreshStaffSelectOptions();\n}\nfunction updStaff(i,field,val){ staffDB[i][field]=val; saveStaff(); }\nfunction delStaff(i){ staffDB.splice(i,1); saveStaff(); renderStaffTable(); }\nfunction addStaffRow(){\n  staffDB.push({name:'',dept:'문화유산과',position:'',bankCode:'',bankName:'',account:''});\n  saveStaff(); renderStaffTable();\n}\nfunction clearStaff(){\n  if(!confirm('부서원 명단을 전부 삭제할까요?')) return;\n  staffDB = []; saveStaff(); renderStaffTable();\n}\nfunction importStaffExcel(ev){\n  const file = ev.target.files[0]; if(!file) return;\n  handleStaffFile(file);\n  ev.target.value='';\n}\nfunction handleStaffFile(file){\n  const reader = new FileReader();\n  reader.onload = e=>{\n    const wb = XLSX.read(e.target.result, {type:'array'});\n    const wsName = wb.SheetNames.find(n=>n.includes('거래처입력') && !n.includes('설명')) || wb.SheetNames[0];\n    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wsName], {header:1, defval:''});\n    let added = 0;\n    for(let i=1;i\u003crows.length;i++){\n      const r = rows[i];\n      if(!r[0]) continue;\n      const bank = (r[5]||'').toString();\n      const bankCode = bank.includes(':') ? bank.split(':')[0] : '';\n      const bankName = bank.includes(':') ? bank.split(':')[1] : bank;\n      staffDB.push({\n        name: r[0], position:'', dept:'문화유산과',\n        bankCode, bankName, account: r[7]||''\n      });\n      added++;\n    }\n    saveStaff(); renderStaffTable();\n    toast(added+'명을 불러왔습니다.');\n  };\n  reader.readAsArrayBuffer(file);\n}\nfunction exportStaffExcel(){\n  const header = ['거래처명\\n(100자리이하)\\n(필수입력)','거래처구분\\n(필수입력)','사업자등록번호\\n(10자리)','생년월일\\n(8자리)','입금유형\\n(선택)','은행\\n(선택)','예금주명\\n(100자리이하)','계좌번호\\n(30자리이하)','공급가액\\n(17자리이하)\\n(필수입력)','부가세액\\n(17자리이하)','공제액\\n(금액 0원으로 고정)','지출액\\n(17자리이하)','지로번호\\n(19자리이하)','CMS번호\\n(20자리이하)','대표채주\\n(Y/N)','대표자명\\n(100자리)','우편번호\\n(5자리)','기본주소\\n(75자이하)','상세주소\\n(75자이하)','전화번호\\n(30자리이하)','휴대폰번호\\n(20자리이하)','입금명세(100자리)'];\n  const rows = staffDB.map(s=>[s.name,'30:개인','','','10:계좌이체', (s.bankCode?s.bankCode+':':'')+(s.bankName||''), s.name, s.account,'','','','','','','','','','','','','','']);\n  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws, '거래처입력');\n  XLSX.writeFile(wb, '거래처입력_부서원계좌.xlsx');\n}\nfunction refreshStaffSelectOptions(){\n  const sel = document.getElementById('m_staffSelect');\n  sel.innerHTML = '\u003coption value=\"\">직접입력...\u003c/option>' + staffDB.map((s,i)=>`\u003coption value=\"${i}\">${s.name} (${s.position||'-'})\u003c/option>`).join('');\n}\n\n/* ============================================================\n   TAB2: 출장 내역 입력\n============================================================ */\nfunction openTripModal(id){\n  editingTripId = id || null;\n  document.getElementById('tripModalTitle').textContent = id ? '출장 내역 수정' : '출장자 추가';\n  refreshStaffSelectOptions();\n  if(id){\n    const t = tripDB.find(x=>x.id===id);\n    document.getElementById('m_staffSelect').value='';\n    document.getElementById('m_name').value=t.name;\n    document.getElementById('m_position').value=t.position;\n    document.getElementById('m_dept').value=t.dept;\n    document.getElementById('m_start').value=t.start;\n    document.getElementById('m_end').value=t.end;\n    document.getElementById('m_dest').value=t.dest;\n    document.getElementById('m_purpose').value=t.purpose;\n    document.getElementById('m_grade').value=t.grade;\n    document.getElementById('m_transport').value=t.transport;\n    document.getElementById('m_distance').value=t.distance||0;\n    document.getElementById('m_fuelType').value=t.fuelType||'GASOLINE';\n    document.getElementById('m_carType').value=t.carType||3;\n    document.getElementById('m_oilPrice').value=t.oilPrice||FALLBACK_FUEL_PRICE[t.fuelType||'GASOLINE'];\n    document.getElementById('m_oilUnit').textContent=FUEL_PRICE_UNIT[t.fuelType||'GASOLINE']||'원/L';\n    document.getElementById('m_rate').value=t.rate||calcRatePerKm(t.fuelType||'GASOLINE', getBestKnownOilPrice(t.fuelType||'GASOLINE'), t.start);\n    document.getElementById('m_toll').value=t.toll||0;\n    document.getElementById('m_tollReceipt').checked=!!t.tollReceipt;\n    document.getElementById('m_trainFare').value=t.trainFare||0;\n    document.getElementById('m_trainTicket').checked=!!t.trainTicket;\n    document.getElementById('m_trainOneWay').checked=!!t.trainOneWay;\n    document.getElementById('m_trainFareGo').value=t.trainFareGo||0;\n    document.getElementById('m_trainTicketGo').checked=!!t.trainTicketGo;\n    document.getElementById('m_returnTransport').value=t.returnTransport||'기차';\n    document.getElementById('m_trainFareReturn').value=t.trainFareReturn||0;\n    document.getElementById('m_trainTicketReturn').checked=!!t.trainTicketReturn;\n    document.getElementById('m_nights').value=t.nights||0;\n    document.getElementById('m_lodgeRegion').value=t.lodgeRegion||guessLodgeRegion(t.dest);\n    document.getElementById('m_lodge').value=t.lodge||0;\n    document.getElementById('m_notes').value=t.notes||'';\n    document.querySelectorAll('input[name=m_carRole]').forEach(r=>r.checked=(r.value===(t.carRole||'driver')));\n  } else {\n    ['m_name','m_position','m_dest','m_purpose','m_notes'].forEach(id=>document.getElementById(id).value='');\n    document.getElementById('m_dept').value='문화유산과';\n    document.getElementById('m_grade').value='제2호';\n    document.getElementById('m_transport').value='공무용차량';\n    document.getElementById('m_distance').value=0;\n    document.getElementById('m_fuelType').value='GASOLINE';\n    document.getElementById('m_carType').value=3;\n    document.getElementById('m_oilPrice').value=getBestKnownOilPrice('GASOLINE');\n    document.getElementById('m_oilUnit').textContent='원/L';\n    document.getElementById('m_rate').value=calcRatePerKm('GASOLINE', getBestKnownOilPrice('GASOLINE'));\n    document.getElementById('m_toll').value=0;\n    document.getElementById('m_tollReceipt').checked=false;\n    document.getElementById('m_trainFare').value=0;\n    document.getElementById('m_trainTicket').checked=false;\n    document.getElementById('m_trainOneWay').checked=false;\n    document.getElementById('m_trainFareGo').value=0;\n    document.getElementById('m_trainTicketGo').checked=false;\n    document.getElementById('m_returnTransport').value='기차';\n    document.getElementById('m_trainFareReturn').value=0;\n    document.getElementById('m_trainTicketReturn').checked=false;\n    document.getElementById('m_nights').value=0;\n    document.getElementById('m_lodgeRegion').value='기타';\n    document.getElementById('m_lodge').value=0;\n    document.querySelectorAll('input[name=m_carRole]').forEach(r=>r.checked=(r.value==='driver'));\n    const now = new Date(); const pad=n=>String(n).padStart(2,'0');\n    const dstr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T09:00`;\n    document.getElementById('m_start').value=dstr;\n    document.getElementById('m_end').value=dstr.replace('09:00','18:00');\n  }\n  toggleTransportFields();\n  document.getElementById('tripModalBg').classList.add('active');\n}\nfunction closeTripModal(){ document.getElementById('tripModalBg').classList.remove('active'); }\nfunction onStaffPick(){\n  const i = document.getElementById('m_staffSelect').value;\n  if(i===''){ return; }\n  const s = staffDB[i];\n  document.getElementById('m_name').value = s.name;\n  document.getElementById('m_position').value = s.position||'';\n  document.getElementById('m_dept').value = s.dept||'문화유산과';\n}\nfunction toggleTransportFields(){\n  const v = document.getElementById('m_transport').value;\n  document.getElementById('m_carFields').style.display = (v==='자차') ? 'block' : 'none';\n  document.getElementById('m_trainFields').style.display = (v==='기차') ? 'block' : 'none';\n  if(v==='기차') toggleTrainOneWay();\n}\nfunction toggleTrainOneWay(){\n  const oneWay = document.getElementById('m_trainOneWay').checked;\n  document.getElementById('m_trainRoundFields').style.display = oneWay ? 'none' : 'block';\n  document.getElementById('m_trainOneWayFields').style.display = oneWay ? 'block' : 'none';\n  if(oneWay) toggleReturnTransportFields();\n}\nfunction toggleReturnTransportFields(){\n  const v = document.getElementById('m_returnTransport').value;\n  document.getElementById('m_returnTrainFields').style.display = (v==='기차') ? 'block' : 'none';\n}\nfunction guessLodgeRegion(dest){\n  if(!dest) return '기타';\n  if(dest.includes('서울')) return '서울';\n  const metros = ['부산','대구','인천','광주','대전','울산','세종'];\n  if(metros.some(m=>dest.includes(m))) return '광역시';\n  return '기타';\n}\nfunction onDestInputChange(){\n  const dest = document.getElementById('m_dest').value;\n  document.getElementById('m_lodgeRegion').value = guessLodgeRegion(dest);\n}\nfunction saveTripModal(){\n  const name = document.getElementById('m_name').value.trim();\n  if(!name){ alert('성명을 입력해주세요.'); return; }\n  const rec = {\n    id: editingTripId || uid(),\n    name, position: document.getElementById('m_position').value,\n    dept: document.getElementById('m_dept').value,\n    start: document.getElementById('m_start').value,\n    end: document.getElementById('m_end').value,\n    dest: document.getElementById('m_dest').value,\n    purpose: document.getElementById('m_purpose').value,\n    grade: document.getElementById('m_grade').value,\n    transport: document.getElementById('m_transport').value,\n    carRole: document.querySelector('input[name=m_carRole]:checked')?.value || 'driver',\n    distance: parseFloat(document.getElementById('m_distance').value)||0,\n    fuelType: document.getElementById('m_fuelType').value || 'GASOLINE',\n    carType: parseInt(document.getElementById('m_carType').value) || 3,\n    oilPrice: parseFloat(document.getElementById('m_oilPrice').value)||0,\n    rate: parseFloat(document.getElementById('m_rate').value)||calcRatePerKm('GASOLINE', getBestKnownOilPrice('GASOLINE'), document.getElementById('m_start').value),\n    toll: parseFloat(document.getElementById('m_toll').value)||0,\n    tollReceipt: document.getElementById('m_tollReceipt').checked,\n    trainFare: parseFloat(document.getElementById('m_trainFare').value)||0,\n    trainTicket: document.getElementById('m_trainTicket').checked,\n    trainOneWay: document.getElementById('m_trainOneWay').checked,\n    trainFareGo: parseFloat(document.getElementById('m_trainFareGo').value)||0,\n    trainTicketGo: document.getElementById('m_trainTicketGo').checked,\n    returnTransport: document.getElementById('m_returnTransport').value,\n    trainFareReturn: parseFloat(document.getElementById('m_trainFareReturn').value)||0,\n    trainTicketReturn: document.getElementById('m_trainTicketReturn').checked,\n    nights: parseInt(document.getElementById('m_nights').value)||0,\n    lodgeRegion: document.getElementById('m_lodgeRegion').value,\n    lodge: parseFloat(document.getElementById('m_lodge').value)||0,\n    notes: document.getElementById('m_notes').value,\n    mealOverride: null, mealFeeOverride: null, dailyOverride: null, transOverride: null, lodgeOverride: null\n  };\n  if(editingTripId){\n    const idx = tripDB.findIndex(x=>x.id===editingTripId);\n    // preserve any prior overrides\n    rec.mealOverride = tripDB[idx].mealOverride ?? null;\n    rec.mealFeeOverride = tripDB[idx].mealFeeOverride ?? null;\n    rec.dailyOverride = tripDB[idx].dailyOverride ?? null;\n    rec.transOverride = tripDB[idx].transOverride ?? null;\n    rec.lodgeOverride = tripDB[idx].lodgeOverride ?? null;\n    tripDB[idx] = rec;\n  } else {\n    tripDB.push(rec);\n  }\n  saveTrips(); renderTripTable(); closeTripModal();\n}\nfunction delTrip(id){\n  if(!confirm('이 출장 내역을 삭제할까요?')) return;\n  tripDB = tripDB.filter(x=>x.id!==id); saveTrips(); renderTripTable();\n}\nfunction clearTrips(){\n  if(!confirm('출장 내역을 전부 삭제할까요?')) return;\n  tripDB=[]; saveTrips(); renderTripTable();\n}\nfunction fmtRange(t){\n  if(!t.start) return '-';\n  const s = t.start.replace('T',' '), e = t.end.replace('T',' ');\n  return s + ' ~ ' + (e.split(' ')[1]||e);\n}\nfunction transportBadge(t){\n  const warn = (t.notes||'').startsWith('⚠') ? ' \u003cspan class=\"pill\" style=\"background:var(--warn-light);color:var(--warn);\">확인필요\u003c/span>' : '';\n  if(t.transport==='공무용차량') return '\u003cspan class=\"pill gov\">관용차\u003c/span>'+warn;\n  if(t.transport==='자차'){\n    const fuelLabel = CAR_FUEL_OPTIONS.find(f=>f.value===t.fuelType)?.label || '';\n    const carLabel = CAR_TYPE_OPTIONS.find(c=>c.value===t.carType)?.label || '';\n    return `\u003cspan class=\"pill own\">자차 ${t.distance}km ${fuelLabel}·${carLabel} ${t.carRole==='passenger'?'(동승)':'(운전)'}\u003c/span>`+warn;\n  }\n  if(t.transport==='기차'){\n    if(t.trainOneWay){\n      const goLabel = t.trainTicketGo ? '승차권O' : '승차권X';\n      const retLabel = (t.returnTransport||'기차')==='기차' ? (t.trainTicketReturn?'승차권O':'승차권X') : (t.returnTransport==='공무용차량'?'관용차':'기타');\n      return `\u003cspan class=\"pill train\">기차(편도) 가는편 ${goLabel} / 오는편 ${retLabel}\u003c/span>`+warn;\n    }\n    return `\u003cspan class=\"pill train\">기차 ${t.trainTicket?'(승차권O)':'(승차권X)'}\u003c/span>`+warn;\n  }\n  return '\u003cspan class=\"pill\">기타\u003c/span>'+warn;\n}\nfunction detailText(t){\n  if(t.transport==='자차'){\n    if(t.carRole==='passenger') return '동승자 — 자차 운임료 미지급(일비만 지급)';\n    return `거리비 ${fmt(t.distance*t.rate)} + 통행료 ${t.tollReceipt?fmt(t.toll):'미첨부(0원)'}`;\n  }\n  if(t.transport==='기차'){\n    if(t.trainOneWay){\n      const goFee = t.trainTicketGo ? fmt(t.trainFareGo||0) : '승차권 미첨부(0원)';\n      let retText;\n      if((t.returnTransport||'기차')==='기차'){\n        retText = t.trainTicketReturn ? fmt(t.trainFareReturn||0) : '승차권 미첨부(0원)';\n      } else {\n        retText = (t.returnTransport==='공무용차량' ? '관용차(무료)' : '기타(무료)');\n      }\n      return `가는편 ${goFee} / 오는편 ${retText}`;\n    }\n    return `운임 ${t.trainTicket?fmt(t.trainFare):'승차권 미첨부(0원)'}`;\n  }\n  return '-';\n}\nfunction renderTripTable(){\n  updateNavStatus();\n  const tb = document.querySelector('#tripTable tbody');\n  tb.innerHTML='';\n  tripDB.forEach((t,i)=>{\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      \u003ctd>${i+1}\u003c/td>\u003ctd>${t.name}\u003c/td>\u003ctd>${t.position||'-'}\u003c/td>\n      \u003ctd style=\"white-space:nowrap;font-size:11.5px;\">${fmtRange(t)}\u003c/td>\n      \u003ctd>${t.dest||'-'}\u003c/td>\u003ctd>${t.purpose||'-'}\u003c/td>\n      \u003ctd>${transportBadge(t)}\u003c/td>\n      \u003ctd style=\"font-size:11px;\">${detailText(t)}\u003c/td>\n      \u003ctd>${t.nights>0? t.nights+'박 '+fmt(t.lodge) : '-'}\u003c/td>\n      \u003ctd>\u003cdiv class=\"row-actions\">\u003cbutton class=\"icon-btn\" title=\"수정\" onclick=\"openTripModal('${t.id}')\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 20h9\"/>\u003cpath d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z\"/>\u003c/svg>\u003c/button>\u003cbutton class=\"icon-btn danger\" title=\"삭제\" onclick=\"delTrip('${t.id}')\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpolyline points=\"3 6 5 6 21 6\"/>\u003cpath d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/>\u003cpath d=\"M10 11v6M14 11v6\"/>\u003cpath d=\"M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/td>`;\n    tb.appendChild(tr);\n  });\n}\nfunction importTripExcel(ev){\n  const file = ev.target.files[0]; if(!file) return;\n  handleTripFile(file);\n  ev.target.value='';\n}\n/* 신규 출장자 레코드를 만드는 공통 헬퍼. staffDB에 등록된 인원이면 직급/부서를 자동으로 채웁니다. */\nfunction makeTripRecord(f){\n  const s = staffDB.find(x=>x.name===f.name) || {};\n  return {\n    id: uid(), name: f.name,\n    position: f.position || s.position || '',\n    dept: f.dept || s.dept || '문화유산과',\n    start: f.start||'', end: f.end||'', dest: f.dest||'', purpose: f.purpose||'',\n    grade: f.grade || '제2호',\n    transport: f.transport || '자차',\n    carRole: 'driver',\n    distance:0, fuelType:'GASOLINE', carType:3, rate:calcRatePerKm('GASOLINE', getBestKnownOilPrice('GASOLINE'), f.start), toll:0, tollReceipt:false,\n    trainFare:0, trainTicket:false, nights:0, lodge:0, lodgeRegion:'기타', notes:f.notes||'',\n    mealOverride:null, mealFeeOverride:null, dailyOverride:null, transOverride:null, lodgeOverride:null\n  };\n}\n/* ============================================================\n   범용 표 서식 인식기 (헤더 이름 기반)\n   \"관외출장 집계표\", \"출장내역서\", \"출장 월별집계표\" 등 이름과 컬럼 순서가\n   조금씩 다른 엑셀이라도, 헤더 행에서 아래 키워드를 찾아 그 열 위치를\n   그때그때 파악해서 읽습니다. 즉 정해진 양식이 아니어도 \"성명/출장기간(또는\n   출장시작·종료일시)/출장지/출장목적\" 같은 우리가 필요로 하는 정보가 표\n   안에 있기만 하면 자동으로 인식합니다. 인쇄 시 페이지마다 헤더가 반복되는\n   경우도 헤더를 다시 만날 때마다 컬럼 매핑을 갱신하므로 문제없이 읽습니다. */\nconst HEADER_FIELD_SYNONYMS = {\n  name:     ['성명','이름','출장자','출장자명'],\n  deptPos:  ['소속/직급','소속·직급','소속및직급','부서/직급','소속·직위'],\n  dept:     ['소속','부서'],\n  position: ['직급','직위'],\n  gubun:    ['구분','근무구분'],\n  carUsed:  ['공무용차량','관용차량','차량사용유무'],\n  purpose:  ['출장목적','목적','용무'],\n  period:   ['출장기간','출장일정','출장일시'],\n  startDT:  ['출장시작일시','시작일시','출장시작','출발일시'],\n  endDT:    ['출장종료일시','종료일시','출장종료','복귀일시'],\n  grade:    ['여비등급','여비구분','등급'],\n  dest:     ['출장지','출장지역','목적지']\n};\nfunction normHeaderCell(v){ return String(v==null?'':v).replace(/[\\s\\r\\n]+/g,''); }\nfunction isHeaderRow(row){\n  const colMap = {};\n  let matchCount = 0;\n  row.forEach((cell, ci)=>{\n    const norm = normHeaderCell(cell);\n    if(!norm) return;\n    for(const field in HEADER_FIELD_SYNONYMS){\n      if(colMap[field]!=null) continue; // 같은 행에서 먼저 매칭된 열을 우선 사용\n      if(HEADER_FIELD_SYNONYMS[field].includes(norm)){ colMap[field]=ci; matchCount++; break; }\n    }\n  });\n  // \"성명\" 컬럼을 포함해 최소 3개 이상의 필드를 인식해야 진짜 헤더 행으로 인정\n  return (colMap.name!=null && matchCount>=3) ? colMap : null;\n}\nfunction parseDateTimeCell(v){\n  const s = String(v==null?'':v).trim();\n  const m = s.match(/(\\d{4}-\\d{2}-\\d{2})[^\\d]*?(\\d{1,2}:\\d{2})/);\n  if(!m) return '';\n  const time = m[2].length===4 ? '0'+m[2] : m[2];\n  return m[1]+'T'+time;\n}\nfunction parsePeriodCell(v){\n  const s = String(v==null?'':v).replace(/_x000D_/g,'\\n');\n  const m = s.match(/(\\d{4}-\\d{2}-\\d{2})[^\\d]*?(\\d{1,2}:\\d{2})\\s*[~\\-]\\s*(\\d{4}-\\d{2}-\\d{2})[^\\d]*?(\\d{1,2}:\\d{2})/);\n  if(!m) return {start:'', end:''};\n  const t1 = m[2].length===4?'0'+m[2]:m[2], t2 = m[4].length===4?'0'+m[4]:m[4];\n  return {start:m[1]+'T'+t1, end:m[3]+'T'+t2};\n}\nfunction parseGenericTripRows(rows){\n  const out=[];\n  let colMap=null;\n  for(const row of rows){\n    const hdr = isHeaderRow(row);\n    if(hdr){ colMap = hdr; continue; }\n    if(!colMap) continue;\n    const get = (field)=> colMap[field]!=null ? row[colMap[field]] : undefined;\n    const nameRaw = String(get('name')||'').trim();\n    if(!nameRaw) continue;\n    if(/^(소|총|합)\\s*계$/.test(nameRaw.replace(/\\s+/g,''))) continue; // \"소 계\"/\"총 계\" 행 제외\n    const name = nameRaw.replace(/\\(.*?\\)/,'').trim();\n    if(!/[가-힣]{2,}/.test(name)) continue; // 이름처럼 보이지 않는 행(페이지 바닥글 등)은 제외\n\n    // 관외출장(근무지외) 대상만 반영 — \"구분\" 컬럼이 있을 때만 필터링\n    if(colMap.gubun!=null){\n      const gubun = String(get('gubun')||'').trim();\n      if(gubun && gubun!=='근무지외') continue;\n    }\n\n    // 소속/직급\n    let dept='', position='';\n    if(colMap.deptPos!=null){\n      const raw = String(get('deptPos')||'');\n      const parts = raw.split(/\\r\\n|\\r|\\n|_x000D_/).map(s=>s.trim()).filter(Boolean);\n      dept = parts[0]||''; position = parts[parts.length-1]||'';\n    } else {\n      if(colMap.dept!=null) dept = String(get('dept')||'').trim();\n      if(colMap.position!=null) position = String(get('position')||'').trim();\n    }\n\n    const purpose = colMap.purpose!=null ? String(get('purpose')||'').trim() : '';\n    const grade = (colMap.grade!=null && String(get('grade')||'').trim()) || '제2호';\n    const dest = colMap.dest!=null ? String(get('dest')||'').trim() : '';\n\n    // 공무용차량 사용 여부 → 이동수단\n    // 주의: \"관용차 미사용\"은 관용차를 안 썼다는 뜻일 뿐, 자차를 썼다는 뜻이 아닙니다.\n    // (기차·대중교통 등일 수도 있음) 원본 표에 실제 이동수단을 알 수 있는 정보가 없으므로,\n    // \"사용\"이 명확한 경우에만 공무용차량으로 확정하고, 그 외에는 임의로 자차로 단정하지 않고\n    // \"기타/확인필요\"로 표시해 사용자가 직접 확인하게 합니다.\n    let transport = '기타', needsTransportCheck = true;\n    if(colMap.carUsed!=null){\n      const cu = String(get('carUsed')||'').trim();\n      if(cu.includes('미사용')){ transport='기타'; needsTransportCheck=true; }\n      else if(cu.includes('사용')){ transport='공무용차량'; needsTransportCheck=false; }\n    }\n    const notes = needsTransportCheck ? '⚠ 이동수단 확인 필요(원본에는 관용차 미사용 여부만 있음 — 자차/기차/대중교통 중 실제 수단을 선택해주세요)' : '';\n\n    // 출장 일시: \"출장시작일시/출장종료일시\" 분리 컬럼 또는 \"출장기간\" 합쳐진 컬럼 둘 다 지원\n    let start='', end='';\n    if(colMap.startDT!=null || colMap.endDT!=null){\n      start = parseDateTimeCell(get('startDT'));\n      end = parseDateTimeCell(get('endDT'));\n    } else if(colMap.period!=null){\n      const pr = parsePeriodCell(get('period'));\n      start = pr.start; end = pr.end;\n    }\n\n    // 페이지 바닥글(\"익산시 문화유산과\" 등)처럼 성명 칸만 채워지고 나머지 정보가\n    // 전부 빈 행은 실제 출장자 데이터가 아니므로 제외\n    if(!(start || end || purpose || dest || position || dept)) continue;\n\n    out.push(makeTripRecord({name, dept, position, dest, purpose, grade, start, end, transport, notes}));\n  }\n  return out;\n}\n/* ---- 서식① 관외출장 집계표 (기존 서식, 헤더 인식이 실패했을 때의 폴백) ---- */\nfunction parseAggregateRows(rows){\n  const out=[];\n  for(const r of rows){\n    if(!/^\\d+$/.test(String(r[1]).trim())) continue; // 순번 컬럼이 숫자인 행만 실제 데이터\n    const deptPos = String(r[2]||'').split(/\\r|\\n/);\n    const position = deptPos[deptPos.length-1] || '';\n    const nameRaw = String(r[4]||'');\n    const name = nameRaw.replace(/\\(.*?\\)/,'').trim();\n    const periodRaw = String(r[5]||'');\n    const m = periodRaw.match(/(\\d{4}-\\d{2}-\\d{2})\\s+(\\d{2}:\\d{2})\\s*\\r?\\n?\\s*~\\s*(\\d{4}-\\d{2}-\\d{2})\\s+(\\d{2}:\\d{2})/);\n    let start='', end='';\n    if(m){ start = m[1]+'T'+m[2]; end = m[3]+'T'+m[4]; }\n    const carUsed = String(r[9]||'').includes('사용');\n    const dest = r[11]||'';\n    const purpose = r[13]||'';\n    const grade = r[15]||'제2호';\n    if(!name) continue;\n    out.push(makeTripRecord({name, position, dest, purpose, grade, start, end, transport: carUsed?'공무용차량':'자차'}));\n  }\n  return out;\n}\n/* ---- 서식② 출장내역서 (전자결재 시스템 다운로드 양식, 근무지외 행만 사용) ---- */\nfunction parseTripListRows(rows){\n  const out=[];\n  for(const r of rows){\n    if(!/^\\d+$/.test(String(r[0]).trim())) continue; // No. 컬럼이 숫자인 행만 실제 데이터\n    const gubun = String(r[5]||'').trim();\n    if(gubun !== '근무지외') continue; // 관외출장 대상만 반영\n    const name = String(r[1]||'').trim();\n    if(!name) continue;\n    const dept = String(r[3]||'')||'문화유산과';\n    const position = String(r[4]||'');\n    const carUsed = String(r[6]||'').trim()==='사용';\n    const purpose = String(r[7]||'');\n    const startDate = String(r[8]||''), startTime = String(r[9]||'');\n    const endDate = String(r[10]||''), endTime = String(r[11]||'');\n    const start = startDate && startTime ? startDate+'T'+startTime : '';\n    const end = endDate && endTime ? endDate+'T'+endTime : '';\n    const grade = String(r[17]||'제2호');\n    const dest = String(r[20]||'');\n    out.push(makeTripRecord({name, position, dept, dest, purpose, grade, start, end, transport: carUsed?'공무용차량':'자차'}));\n  }\n  return out;\n}\n/* ---- 서식③ 기안상신내역서 (전자결재 기안문, 텍스트 본문에서 항목을 추출) ---- */\nfunction parseDraftText(text){\n  const out=[];\n  const norm = text.replace(/\\u00a0/g,' ');\n  const grabLine = (label)=>{\n    const re = new RegExp(label+'\\\\s*[:：]\\\\s*([^\\\\n\\\\r]+)');\n    const m = norm.match(re);\n    return m ? m[1].trim() : '';\n  };\n  const actorsLine = grabLine('출\\\\s*장\\\\s*자');\n  const destLine = grabLine('출\\\\s*장\\\\s*지');\n  const purpose = grabLine('출장목적') || grabLine('출\\\\s*장\\\\s*목\\\\s*적');\n  const dateLine = grabLine('출장일시') || grabLine('출\\\\s*장\\\\s*일\\\\s*시');\n  if(!actorsLine && !dateLine) return out; // 기안상신내역서 서식이 아님\n\n  const names = actorsLine.split(/[\\s,、·]+/).map(n=>n.replace(/\\(.*?\\)/,'').trim())\n    .filter(n=>/^[가-힣]{2,4}$/.test(n));\n\n  const carMatch = destLine.match(/공무용차량\\s*\\(?\\s*(사용|미사용)\\)?/);\n  const carUsed = !!(carMatch && carMatch[1]==='사용');\n  const dest = destLine.split(/[,、]/)[0].trim();\n\n  const dm = dateLine.match(/(\\d{4})\\D+(\\d{1,2})\\D+(\\d{1,2})\\D+(\\d{1,2}):(\\d{2})\\s*~\\s*(\\d{4})\\D+(\\d{1,2})\\D+(\\d{1,2})\\D+(\\d{1,2}):(\\d{2})/);\n  let start='', end='';\n  if(dm){\n    const pad=n=>String(n).padStart(2,'0');\n    start = `${dm[1]}-${pad(dm[2])}-${pad(dm[3])}T${pad(dm[4])}:${dm[5]}`;\n    end   = `${dm[6]}-${pad(dm[7])}-${pad(dm[8])}T${pad(dm[9])}:${dm[10]}`;\n  }\n  const deptMatch = norm.match(/([가-힣]{2,10}[시군구])\\s+([가-힣]{2,10}(?:과|팀|국|실))/);\n  const dept = deptMatch ? deptMatch[2] : '';\n\n  const targetNames = names.length ? names : [];\n  for(const name of targetNames){\n    out.push(makeTripRecord({name, dept, dest, purpose, start, end, transport: carUsed?'공무용차량':'자차'}));\n  }\n  return out;\n}\nfunction parseDraftRows(rows){\n  // 셀 단위로 흩어진 기안본문 텍스트를 한 덩어리로 합쳐서 파싱\n  const text = rows.map(r=>r.map(c=>String(c==null?'':c)).join(' ')).join('\\n');\n  return parseDraftText(text);\n}\n/* PDF에서 추출한 순수 텍스트로 두 서식을 순서대로 시도 */\nfunction parseFromPlainText(text){\n  const draft = parseDraftText(text);\n  if(draft.length) return draft;\n  // 출장내역서를 PDF로 인쇄한 경우: 줄 단위 표 형태를 최대한 인식\n  const out=[];\n  const lineRe = /^\\s*(\\d+)\\s+([가-힣]{2,4})\\s+\\S+\\s+(\\S+)\\s+(\\S+)\\s+(근무지외|근무지내)\\s+(사용|미사용)\\s+(.+?)\\s+(\\d{4}-\\d{2}-\\d{2})\\s+(\\d{2}:\\d{2})\\s+(\\d{4}-\\d{2}-\\d{2})\\s+(\\d{2}:\\d{2}).*?(제\\d호)\\s+.*?\\s+(\\S+)\\s+(결재완료|진행중)/;\n  text.split(/\\r?\\n/).forEach(line=>{\n    const m = line.match(lineRe);\n    if(!m) return;\n    const [,,name,dept,position,gubun,car,purpose,sDate,sTime,eDate,eTime,grade,dest] = m;\n    if(gubun!=='근무지외') return;\n    out.push(makeTripRecord({name, dept, position, purpose, grade, dest,\n      start:sDate+'T'+sTime, end:eDate+'T'+eTime, transport: car==='사용'?'공무용차량':'자차'}));\n  });\n  return out;\n}\nfunction detectAndParseWorkbookRows(rows){\n  const flat = rows.map(r=>r.join(' ')).join('\\n');\n  if(/기안상신\\s*내역서|기안본문/.test(flat)) return {kind:'기안상신내역서', list: parseDraftRows(rows)};\n\n  // 1순위: 헤더 이름을 스스로 찾아서 읽는 범용 인식기.\n  // \"관외출장 집계표\", \"출장내역서\", \"출장 월별집계표\" 등 양식 이름이나 컬럼\n  // 순서가 조금 달라도, 표 안에 성명·출장일시(또는 출장기간)·출장지·출장목적 같은\n  // 정보가 있으면 그대로 읽어들입니다.\n  const generic = parseGenericTripRows(rows);\n  if(generic.length){\n    let kindLabel = '출장내역(자동인식)';\n    if(/출장\\s*월별\\s*집계/.test(flat)) kindLabel = '출장월별집계표';\n    else if(/출\\s*장\\s*내\\s*역\\s*서/.test(flat)) kindLabel = '출장내역서';\n    else if(/관외출장\\s*집계표/.test(flat)) kindLabel = '관외출장 집계표';\n    return {kind:kindLabel, list: generic};\n  }\n\n  // 2순위: 예전에 쓰던 고정 컬럼 위치 기반 파서 (헤더를 못 찾았을 때의 폴백)\n  const title = String((rows[0]||[])[0]||'').trim();\n  const headerFlat = (rows[1]||[]).join(' ');\n  if(title==='출장내역서' || /식별번호/.test(headerFlat)) return {kind:'출장내역서', list: parseTripListRows(rows)};\n  return {kind:'관외출장 집계표', list: parseAggregateRows(rows)};\n}\nfunction finishTripImport(kind, list){\n  if(!list.length){\n    alert('['+kind+'] 형식에서 관외출장 내역을 찾지 못했습니다. 서식을 확인해 주세요.');\n    return;\n  }\n  tripDB.push(...list);\n  saveTrips(); renderTripTable();\n  const needCheck = list.filter(t=>(t.notes||'').startsWith('⚠')).length;\n  let msg = '['+kind+'] 서식에서 '+list.length+'건의 출장 내역을 불러왔습니다.';\n  if(needCheck>0) msg += ' 이 중 '+needCheck+'건은 관용차 미사용만 확인됐고 실제 이동수단(자차/기차/대중교통)은 알 수 없어 \"확인필요\"로 표시했습니다 — 목록에서 확인 후 직접 수정해주세요.';\n  else msg += ' 자차인 경우 거리·운임을 확인해주세요.';\n  toast(msg);\n}\nfunction handleTripFile(file){\n  const name = file.name.toLowerCase();\n  if(name.endsWith('.pdf')){\n    if(!window['pdfjsLib']){ alert('PDF 불러오기 기능을 로드하지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }\n    const reader = new FileReader();\n    reader.onload = async e=>{\n      try{\n        const pdf = await pdfjsLib.getDocument({data: new Uint8Array(e.target.result)}).promise;\n        let text='';\n        for(let p=1;p\u003c=pdf.numPages;p++){\n          const page = await pdf.getPage(p);\n          const content = await page.getTextContent();\n          text += content.items.map(it=>it.str).join(' ')+'\\n';\n        }\n        const list = parseFromPlainText(text);\n        finishTripImport('PDF', list);\n      }catch(err){\n        console.error(err);\n        alert('PDF를 읽는 중 오류가 발생했습니다: '+err.message);\n      }\n    };\n    reader.readAsArrayBuffer(file);\n    return;\n  }\n  const reader = new FileReader();\n  reader.onload = e=>{\n    const wb = XLSX.read(e.target.result, {type:'array'});\n    const ws = wb.Sheets[wb.SheetNames[0]];\n    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});\n    const {kind, list} = detectAndParseWorkbookRows(rows);\n    finishTripImport(kind, list);\n  };\n  reader.readAsArrayBuffer(file);\n}\n\n/* ============================================================\n   계산 엔진\n============================================================ */\nfunction minutesOf(dtStr){\n  if(!dtStr) return null;\n  const d = new Date(dtStr);\n  return {date:d, min: d.getHours()*60+d.getMinutes()};\n}\nfunction calcMealCount(t){\n  if(t.mealOverride!=null) return Math.max(0, Math.min(3, parseInt(t.mealOverride)||0));\n  if(!t.start || !t.end) return 0;\n  const s = minutesOf(t.start), e = minutesOf(t.end);\n  const sameDay = (new Date(t.start)).toDateString() === (new Date(t.end)).toDateString();\n  const sMin = s.min, eMin = sameDay ? e.min : 24*60; // 익일까지 이어지면 당일은 자정까지로 취급(단순화)\n  const includesLunch = sMin \u003c 13*60 && eMin > 11*60;          // 점심시간(11:00~13:00) 포함 여부\n  const extendsBeyondCore = (!sameDay) || sMin \u003c 9*60 || eMin > 18*60; // 09:00~18:00 범위를 벗어나는지\n  const longDistance = (t.distance||0) >= 100;                 // 왕복 100km 이상 원거리 출장인지\n  let count = 1;                 // 기본 제공 1끼(9,000원)\n  if(includesLunch) count = 2;   // 점심시간 포함 시 2끼(18,000원)\n  if(extendsBeyondCore || longDistance) count = 3; // 09~18시를 벗어나거나 100km 이상 원거리면 3끼(25,000원)\n  return count;\n}\nfunction tripDurationHours(t){\n  if(!t.start || !t.end) return 0;\n  return (new Date(t.end) - new Date(t.start)) / 3600000;\n}\nfunction calcDaily(t){\n  if(t.dailyOverride!=null) return t.dailyOverride;\n  if(tripDurationHours(t) \u003c 4) return 0; // 4시간 미만 출장은 일비 미지급\n  // 일비는 오직 \"가는 편(t.transport)\"의 관용차 사용 여부로만 판단한다.\n  // 오는 편(returnTransport)을 관용차로 선택해도 일비에는 영향을 주지 않는다.\n  const usedGovCar = t.transport==='공무용차량';\n  return usedGovCar ? 12500 : 25000;\n}\n// 식비 단가표: 1끼 9,000원 / 2끼 18,000원 / 3끼 25,000원(1일 한도)\nconst MEAL_FEE_TABLE = {0:0, 1:9000, 2:18000, 3:25000};\nfunction mealFeeOfCount(n){ n = Math.max(0, Math.min(3, parseInt(n)||0)); return MEAL_FEE_TABLE[n]; }\nfunction calcMealFee(t){\n  if(t.mealFeeOverride!=null) return t.mealFeeOverride;   // 금액을 직접 수정한 경우\n  return mealFeeOfCount(calcMealCount(t));                  // 끼니 수 → 금액 자동\n}\nfunction calcTransportFee(t){\n  if(t.transOverride!=null) return t.transOverride;\n  if(t.transport==='자차'){\n    if(t.carRole==='passenger') return 0; // 동승자는 자차 운임료 미지급, 운전자만 지급\n    const mileage = (t.distance||0)*(t.rate||0);\n    const toll = t.tollReceipt ? (t.toll||0) : 0;\n    return mileage+toll;\n  }\n  if(t.transport==='기차'){\n    if(t.trainOneWay){\n      let fee = t.trainTicketGo ? (t.trainFareGo||0) : 0;\n      if((t.returnTransport||'기차')==='기차'){\n        fee += t.trainTicketReturn ? (t.trainFareReturn||0) : 0;\n      } // 오는 편이 공무용차량/기타면 추가 요금 없음\n      return fee;\n    }\n    return t.trainTicket ? (t.trainFare||0) : 0;\n  }\n  return 0;\n}\nfunction lodgeCapPerNight(region){\n  if(region==='서울') return 100000;\n  if(region==='광역시') return 80000;\n  return 70000; // 그 밖의 지역\n}\nfunction calcLodgeFee(t){\n  if(t.lodgeOverride!=null) return t.lodgeOverride;\n  if(!t.nights || t.nights\u003c=0) return 0;\n  const cap = t.nights*lodgeCapPerNight(t.lodgeRegion||'기타');\n  return Math.min(t.lodge||0, cap);\n}\nfunction calcTotal(t){\n  return calcDaily(t)+calcMealFee(t)+calcTransportFee(t)+calcLodgeFee(t);\n}\nfunction findAccount(name){\n  const s = staffDB.find(x=>x.name===name);\n  return s ? s.account : '';\n}\n\n/* ============================================================\n   TAB3: 거리 계산기 · 자차 이용 입력\n   지도 API(카카오 로컬/모빌리티 REST API) 키는 셸의 '설정'에서 한 번만 입력하면 됩니다.\n      화면의 \"API 키\" 입력칸에 넣어도 동일하게 동작합니다(입력칸이 우선 적용).\n============================================================ */\nconst MAP_API_KEY = '';   // 키는 코드에 적지 않습니다 → 셸의 '설정'에서 입력 (이 브라우저에만 저장)\nconst DEFAULT_ORIGIN_ADDR = '전북특별자치도 익산시 익산시청';   // 출발지를 따로 입력하지 않으면 이 주소로 고정\nlet lastDistCalc = null;\n\n/* ---- 유종 · 차종 설정 ----\n   차종은 표시용입니다. 통행료는 카카오맵 경로검색과 같은 기본 조건(차종·유종 미지정)으로 조회하며,\n   자차 운임료(연료비) 계산에도 영향을 주지 않습니다.\n\n   자차 운임료(연료비) = 거리(km) × 유가(원/L 등, 도착지역 기준) ÷ 연비(km/L 등, 유종별 고정값)\n   — 충남 데이터포털 \"올담\" 국내여비 간편산출(alldam.chungnam.go.kr)이 쓰는 산식과 동일하며,\n   연비 고정값은 인사혁신처 \"공무원보수 등의 업무지침\"에 유종별로 고시되어 있습니다.\n   (배기량/차종에 따른 연비 구분은 이 지침에 없습니다 — 차종은 통행료 계산용으로만 쓰세요.) */\nconst CAR_FUEL_OPTIONS = [\n  {value:'GASOLINE', label:'휘발유'},\n  {value:'DIESEL', label:'경유'},\n  {value:'LPG', label:'LPG(가스)'},\n  {value:'EV', label:'전기'},\n  {value:'HYDROGEN', label:'수소'}\n];\nconst CAR_TYPE_OPTIONS = [\n  {value:1, label:'경차'},\n  {value:2, label:'소형(1,600cc 미만)'},\n  {value:3, label:'중형(1,600~2,000cc)'},\n  {value:4, label:'대형(2,000cc 초과)'}\n];\n// 유종별 연비(전기는 km/kWh, 수소는 km/kg) — 공무원보수 등의 업무지침 고시값\n// 휘발유 연비는 2023년부터 11.97km/L로 변경되었습니다(종전 13.3km/L).\nconst FUEL_EFFICIENCY = {GASOLINE:11.97, DIESEL:12.52, LPG:8.83, EV:5.22, HYDROGEN:94.9};\n// 2023-01-01 이전 출장에 적용하는 종전 연비(변경된 유종만 기재, 나머지는 FUEL_EFFICIENCY 사용)\nconst FUEL_EFFICIENCY_BEFORE_2023 = {GASOLINE:13.3};\nconst FUEL_EFFICIENCY_CHANGE_DATE = '2023-01-01';\n// 출장일(YYYY-MM-DD 또는 datetime-local 값)에 맞는 연비. 날짜가 없거나 2023년 이후면 현행 연비.\nfunction getFuelEfficiency(fuelType, dateStr){\n  const d = (dateStr||'').slice(0,10);\n  if(d && d \u003c FUEL_EFFICIENCY_CHANGE_DATE && FUEL_EFFICIENCY_BEFORE_2023[fuelType]) return FUEL_EFFICIENCY_BEFORE_2023[fuelType];\n  return FUEL_EFFICIENCY[fuelType] || FUEL_EFFICIENCY.GASOLINE;\n}\nconst FUEL_PRICE_UNIT = {GASOLINE:'원/L', DIESEL:'원/L', LPG:'원/L', EV:'원/kWh', HYDROGEN:'원/kg'};\n// OPINET 제품구분코드(휘발유/경유/LPG만 해당). 전기·수소는 오피넷이 아닌\n// 무공해차 통합누리집(전기)·수소유통정보시스템(수소) 소관이라 별도 키가 필요합니다 — 아래 안내 참고.\nconst OPINET_PRODCD = {GASOLINE:'B027', DIESEL:'D047', LPG:'K015'};\n// 사전 등록된 API 키가 없을 때 화면에 채워둘 참고용 유가(원). 휘발유·경유·LPG는\n// 오피넷 2026-09-10자 전국 평균 판매가격(휘발유 1858.83원, 경유 1843.84원, LPG 1098.25원)이며,\n// 전기는 환경부 공공충전기 완속 요금(2026-04-30 개편 기준 324.4원/kWh), 수소는 충전소별 편차가\n// 커서(공공 8천원대~민간 1만2천원대) 중간값으로 잡은 참고치입니다.\n// 출장 시작일 기준 최신 유가와 다를 수 있으니, 실제 지급 전에는 반드시 확인해 덮어써야 합니다.\nconst FALLBACK_FUEL_PRICE = {GASOLINE:1859, DIESEL:1844, LPG:1098, EV:324, HYDROGEN:9000};\nconst OPINET_API_KEY = '';   // 오피넷 인증키도 셸의 '설정'에서 입력 → 전국 평균 유가를 자동 조회합니다.\n// 직접 만든 오피넷 중계 주소(Cloudflare Worker 등). 비워두면 공개 중계 서버만 사용합니다.\n// 예: 'https://opinet-relay.내계정.workers.dev'  (함께 제공된 opinet-relay-worker.js 참고)\nconst OPINET_PROXY_URL = '';\nfunction calcRatePerKm(fuelType, oilPrice, dateStr){\n  const eff = getFuelEfficiency(fuelType, dateStr);\n  return Math.round((oilPrice||0) / eff);\n}\nfunction getOpinetApiKey(){\n  const el = document.getElementById('distOpinetKeyInput');\n  const override = el ? el.value.trim() : '';\n  return override || OPINET_API_KEY || (window.suiteKey ? suiteKey('opinet') : '');\n}\n/* 오피넷 avgAllPrice.do(전국 평균 유가)로 유종별 현재 평균가를 조회합니다.\n   - 인증키 파라미터는 문서상 certkey, 예제상 code 로 혼재되어 있어 둘 다 보냅니다.\n   - 오피넷은 브라우저 직접 호출(CORS)을 막기 때문에, 직접 호출과 공개 CORS 프록시 여러 곳을\n     동시에 시도해서 가장 먼저 성공한 응답을 사용합니다.\n   - 전부 실패하면 FALLBACK_FUEL_PRICE 예시값을 쓰되, 실패 사유를 화면에 표시합니다. */\nfunction fetchWithTimeout(url, ms, opts){\n  // AbortController/signal은 일부 뷰어(fetch를 postMessage로 대행)에서 복제 오류가 나므로 쓰지 않고\n  // 시간 제한은 Promise.race 로 처리합니다. headers 등 단순 옵션만 전달합니다.\n  return Promise.race([\n    opts ? fetch(url, opts) : fetch(url),\n    new Promise((_,rej)=>setTimeout(()=>rej(new Error(Math.round(ms/1000)+'초 내 응답 없음')), ms))\n  ]);\n}\n/* ---- 오피넷 조회 안정화 ----\n   · 마지막으로 성공한 응답을 localStorage에 저장 → 이후 조회가 실패해도 \"마지막 성공값\"을 보여줍니다.\n   · 같은 시점의 중복 호출은 하나로 합치고, 전 경로가 실패하면 한 번 더 재시도합니다.\n   · 저장소를 쓸 수 없는 환경(뷰어 등)에서는 메모리에만 보관합니다. */\nconst OPINET_CACHE_KEY = 'opinetAvgAllCache_v1';\nlet opinetMemCache = null;      // {list, ts}\nlet opinetInflight = null;      // 진행 중인 조회 Promise\nfunction loadOpinetCache(){\n  if(opinetMemCache) return opinetMemCache;\n  try{\n    const raw = localStorage.getItem(OPINET_CACHE_KEY);\n    if(raw){ const c = JSON.parse(raw); if(c && Array.isArray(c.list) && c.list.length){ opinetMemCache = c; return c; } }\n  }catch(e){}\n  return null;\n}\nfunction saveOpinetCache(list){\n  opinetMemCache = {list, ts: Date.now()};\n  try{ localStorage.setItem(OPINET_CACHE_KEY, JSON.stringify(opinetMemCache)); }catch(e){}\n}\nfunction fmtCacheTime(ts){\n  const d = new Date(ts);\n  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;\n}\nfunction parseOpinetText(text){\n  let data;\n  try{ data = JSON.parse(text); }\n  catch(e){\n    // 일부 프록시는 JSON을 문자열/래핑해서 줌 → {...} 부분만 추출해 재시도\n    const m = String(text).match(/\\{[\\s\\S]*\\}/);\n    if(!m) throw new Error('JSON 아님(응답: '+String(text).slice(0,40).replace(/\\s+/g,' ')+')');\n    try{ data = JSON.parse(m[0]); }catch(e2){ throw new Error('JSON 해석 실패'); }\n  }\n  if(data && typeof data.contents==='string'){ return parseOpinetText(data.contents); } // allorigins /get 형식\n  const list = data?.RESULT?.OIL;\n  if(!Array.isArray(list) || !list.length) throw new Error('유가 데이터 없음');\n  return list;\n}\nasync function fetchOpinetAvgAllOnce(key){\n  const k = encodeURIComponent(key);\n  const target = `https://www.opinet.co.kr/api/avgAllPrice.do?out=json&certkey=${k}&code=${k}`;\n  const routes = [\n    ...(OPINET_PROXY_URL ? [{name:'내 중계서버', url: OPINET_PROXY_URL.replace(/\\/+$/,'')+'?k='+k}] : []),\n    {name:'direct',     url: target},\n    {name:'corsproxy',  url: 'https://corsproxy.io/?url='+encodeURIComponent(target)},\n    {name:'allorigins', url: 'https://api.allorigins.win/raw?url='+encodeURIComponent(target)},\n    {name:'allorigins-get', url: 'https://api.allorigins.win/get?url='+encodeURIComponent(target)},\n    {name:'codetabs',   url: 'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(target)}\n  ];\n  const attempt = async (r)=>{\n    try{\n      const res = await fetchWithTimeout(r.url, 10000);\n      if(!res.ok) throw new Error('HTTP '+res.status);\n      const list = parseOpinetText(await res.text());\n      return {list, via:r.name};\n    }catch(e){\n      throw new Error(r.name+': '+((e && e.message) || String(e)));\n    }\n  };\n  return Promise.any(routes.map(attempt));   // 가장 먼저 성공한 경로 사용\n}\nasync function fetchOpinetAvgAll(key){\n  if(opinetInflight) return opinetInflight;\n  opinetInflight = (async()=>{\n    let lastErr;\n    for(let round=0; round\u003c2; round++){             // 전 경로 실패 시 1회 재시도\n      try{\n        const r = await fetchOpinetAvgAllOnce(key);\n        saveOpinetCache(r.list);\n        return r;\n      }catch(e){ lastErr = e; await new Promise(res=>setTimeout(res, 700)); }\n    }\n    throw lastErr;\n  })();\n  try{ return await opinetInflight; } finally{ opinetInflight = null; }\n}\nfunction opinetRowToResult(list, prodcd){\n  const row = list.find(x=>x.PRODCD===prodcd);\n  if(!row || !row.PRICE) return null;\n  const d = String(row.TRADE_DT||'');\n  return {price: Math.round(parseFloat(row.PRICE)), date: d.length===8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : ''};\n}\n// 현재 알고 있는 가장 좋은 유가(마지막 성공값 → 참고값). 조회 없이 즉시 반환.\nfunction getBestKnownOilPrice(fuelType){\n  const prodcd = OPINET_PRODCD[fuelType];\n  const c = prodcd ? loadOpinetCache() : null;\n  const r = c ? opinetRowToResult(c.list, prodcd) : null;\n  return r ? r.price : FALLBACK_FUEL_PRICE[fuelType];\n}\nasync function fetchOilPrice(fuelType){\n  const prodcd = OPINET_PRODCD[fuelType];\n  const key = getOpinetApiKey();\n  if(!prodcd){\n    return {price: FALLBACK_FUEL_PRICE[fuelType], source:'fallback', reason:'전기·수소는 오피넷 조회 대상이 아닙니다(참고값 사용).'};\n  }\n  const cached = loadOpinetCache();\n  const fromCache = (reason)=>{\n    const r = cached ? opinetRowToResult(cached.list, prodcd) : null;\n    if(r) return {price:r.price, source:'cache', date:r.date, cachedAt:cached.ts, reason, manual:true};\n    return {price: FALLBACK_FUEL_PRICE[fuelType], source:'fallback', reason, manual:true};\n  };\n  if(!key) return fromCache('오피넷 API 키가 없습니다.');\n  try{\n    const {list, via} = await fetchOpinetAvgAll(key);\n    const r = opinetRowToResult(list, prodcd);\n    if(r) return {price:r.price, source:'opinet', date:r.date, via};\n    return fromCache('오피넷 응답에 해당 유종이 없습니다.');\n  }catch(e){\n    const all = (e && e.errors) ? e.errors.map(x=>x.message).join(' / ') : ((e && e.message) || '알 수 없는 오류');\n    console.warn('오피넷 유가 조회 실패', e);\n    return fromCache('오피넷 조회 실패 → '+all);\n  }\n}\nfunction opinetManualUrl(){\n  const k = encodeURIComponent(getOpinetApiKey());\n  return `https://www.opinet.co.kr/api/avgAllPrice.do?out=json&certkey=${k}&code=${k}`;\n}\n/* 자동 조회가 막힌 환경용: 새 탭에 열린 오피넷 응답을 복사해 붙여넣으면 즉시 유가를 읽어 채웁니다.\n   (뷰어에서 막히는 prompt() 대신 화면의 입력칸을 사용) */\nfunction applyOpinetText(txt, oilPriceElId, fuelTypeElId, rateElId){\n  txt = (txt||'').trim();\n  if(!txt) return;\n  const fuelType = document.getElementById(fuelTypeElId).value;\n  const prodcd = OPINET_PRODCD[fuelType];\n  const hintEl = document.getElementById(oilPriceElId+'_src');\n  const fail = (msg)=>{ if(hintEl){ hintEl.style.color='#c0392b'; hintEl.dataset.pasteErr = msg; const n = hintEl.querySelector('.paste-err'); if(n) n.textContent = msg; } };\n  if(!prodcd){ fail('이 유종은 오피넷 조회 대상이 아닙니다.'); return; }\n  let list;\n  try{ list = JSON.parse(txt)?.RESULT?.OIL; }catch(e){ fail('JSON으로 읽지 못했습니다. 새 탭 화면 전체를 복사(Ctrl+A → Ctrl+C)해 붙여넣어 주세요.'); return; }\n  const row = Array.isArray(list) ? list.find(x=>x.PRODCD===prodcd) : null;\n  if(!row || !row.PRICE){ fail('붙여넣은 내용에 해당 유종 가격이 없습니다.'); return; }\n  saveOpinetCache(list);\n  document.getElementById(oilPriceElId).value = Math.round(parseFloat(row.PRICE));\n  updateRateFromOilPrice(oilPriceElId, fuelTypeElId, rateElId);\n  if(hintEl){\n    const d = String(row.TRADE_DT||'');\n    const ds = d.length===8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : '';\n    hintEl.style.color='';\n    hintEl.textContent = '✅ 오피넷 응답 붙여넣기 반영' + (ds ? ` (${ds} 기준)` : '');\n  }\n}\nfunction fillSelectOptions(selectEl, options, valueField, labelField){\n  if(!selectEl) return;\n  selectEl.innerHTML = options.map(o=>`\u003coption value=\"${o[valueField]}\">${o[labelField]}\u003c/option>`).join('');\n}\nfunction initCarSpecSelects(){\n  fillSelectOptions(document.getElementById('m_fuelType'), CAR_FUEL_OPTIONS, 'value','label');\n  fillSelectOptions(document.getElementById('m_carType'), CAR_TYPE_OPTIONS, 'value','label');\n  fillSelectOptions(document.getElementById('distFuelType'), CAR_FUEL_OPTIONS, 'value','label');\n  fillSelectOptions(document.getElementById('distCarType'), CAR_TYPE_OPTIONS, 'value','label');\n  const defCarType = document.getElementById('m_carType'); if(defCarType) defCarType.value='3';\n  const defDistCarType = document.getElementById('distCarType'); if(defDistCarType) defDistCarType.value='3';\n  const mOil = document.getElementById('m_oilPrice'); if(mOil) mOil.value = getBestKnownOilPrice('GASOLINE');\n  const dOil = document.getElementById('distOilPrice'); if(dOil) dOil.value = getBestKnownOilPrice('GASOLINE');\n  updateRateFromOilPrice('m_oilPrice','m_fuelType','m_rate');\n  updateRateFromOilPrice('distOilPrice','distFuelType','distRate');\n}\nfunction updateRateFromOilPrice(oilPriceElId, fuelTypeElId, rateElId){\n  const fuelType = document.getElementById(fuelTypeElId).value;\n  const oilPrice = parseFloat(document.getElementById(oilPriceElId).value)||0;\n  const startEl = (rateElId==='m_rate') ? document.getElementById('m_start') : null;   // 출장 입력창은 출장 시작일 기준 연비 적용\n  document.getElementById(rateElId).value = calcRatePerKm(fuelType, oilPrice, startEl ? startEl.value : '');\n}\nlet oilPendingPromises = {};   // 입력칸별 진행 중인 유가 조회(거리 계산이 기다릴 수 있게)\nlet oilReqSeq = {};   // 입력칸별 최신 요청만 반영(응답 순서 꼬임 방지)\nfunction onCarFuelChange(oilPriceElId, fuelTypeElId, rateElId, unitElId){\n  const p = _onCarFuelChange(oilPriceElId, fuelTypeElId, rateElId, unitElId);\n  oilPendingPromises[oilPriceElId] = p;\n  const clear = ()=>{ if(oilPendingPromises[oilPriceElId]===p) delete oilPendingPromises[oilPriceElId]; };\n  p.then(clear, clear);\n  return p;\n}\nasync function _onCarFuelChange(oilPriceElId, fuelTypeElId, rateElId, unitElId){\n  const fuelType = document.getElementById(fuelTypeElId).value;\n  const unitEl = document.getElementById(unitElId);\n  if(unitEl) unitEl.textContent = FUEL_PRICE_UNIT[fuelType]||'원/L';\n  const hintEl = document.getElementById(oilPriceElId+'_src');\n  const seq = oilReqSeq[oilPriceElId] = (oilReqSeq[oilPriceElId]||0)+1;\n  // 1) 마지막 성공값이 있으면 먼저 즉시 보여주고, 최신값은 백그라운드에서 조회\n  const known = getBestKnownOilPrice(fuelType);\n  document.getElementById(oilPriceElId).value = known;\n  updateRateFromOilPrice(oilPriceElId, fuelTypeElId, rateElId);\n  if(hintEl){ hintEl.style.color='var(--text-sub)'; hintEl.textContent='⏳ 오피넷에서 최신 유가를 조회하는 중...'; }\n  const res = await fetchOilPrice(fuelType);\n  if(seq !== oilReqSeq[oilPriceElId]) return;   // 더 최신 요청이 있으면 무시\n  document.getElementById(oilPriceElId).value = res.price;\n  updateRateFromOilPrice(oilPriceElId, fuelTypeElId, rateElId);\n  if(!hintEl) return;\n  const retryBtn = `\u003cbutton type=\"button\" class=\"btn outline sm\" style=\"margin-left:6px;padding:1px 8px;\" onclick=\"onCarFuelChange('${oilPriceElId}','${fuelTypeElId}','${rateElId}','${unitElId}')\">다시 조회\u003c/button>`;\n  const manualBox = `\u003cbr>\u003ca href=\"${opinetManualUrl()}\" target=\"_blank\" rel=\"noopener\">① 오피넷 응답 새 탭에서 열기\u003c/a> → 화면에서 Ctrl+A, Ctrl+C 로 전체 복사`\n    + `\u003cbr>\u003ctextarea rows=\"2\" style=\"width:100%;margin-top:4px;box-sizing:border-box;\" placeholder=\"② 여기에 붙여넣기(Ctrl+V) 하면 바로 반영됩니다\" oninput=\"applyOpinetText(this.value,'${oilPriceElId}','${fuelTypeElId}','${rateElId}')\">\u003c/textarea>`\n    + `\u003cdiv class=\"paste-err small\">\u003c/div>`;\n  if(res.source==='opinet'){\n    hintEl.style.color='';\n    hintEl.innerHTML = '✅ 오피넷 전국 평균가' + (res.date ? ` (${res.date} 기준)` : '') + ' · 조회 경로: ' + escapeXml(res.via||'');\n  }else if(res.source==='cache'){\n    hintEl.style.color='#b9770e';\n    hintEl.innerHTML = `⚠️ 이번 조회는 실패해서 \u003cb>마지막 성공값\u003c/b>(${fmtCacheTime(res.cachedAt)} 조회${res.date?`, ${res.date} 기준`:''})을 사용했습니다.` + retryBtn + manualBox;\n  }else{\n    hintEl.style.color='#c0392b';\n    hintEl.innerHTML = '⚠️ ' + escapeXml(res.reason || '조회 실패') + ' — 예시값을 채웠으니 확인 후 수정하세요.' + (res.manual ? retryBtn + manualBox : '');\n  }\n}\nfunction getMapApiKey(){\n  const el = document.getElementById('distApiKeyInput');\n  const override = el ? el.value.trim() : '';\n  return override || MAP_API_KEY || (window.suiteKey ? suiteKey('kakao') : '');\n}\nasync function geocodeAddress(addr){\n  const key = getMapApiKey();\n  if(key){\n    try{\n      const res = await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr), {\n        headers:{ Authorization: 'KakaoAK '+key }\n      });\n      if(res.ok){\n        const data = await res.json();\n        if(data.documents && data.documents.length>0){\n          const d = data.documents[0];\n          return { lat: parseFloat(d.y), lng: parseFloat(d.x), roadAddr: (d.road_address && d.road_address.address_name) || d.address_name };\n        }\n      }\n    }catch(e){ console.warn('카카오 주소 검색 실패, 무료 검색으로 대체합니다.', e); }\n  }\n  // API 키가 없거나 카카오 검색에 실패하면 별도 키가 필요 없는 오픈스트리트맵(Nominatim) 검색으로 대체합니다.\n  const res2 = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(addr));\n  if(!res2.ok) throw new Error('주소 검색에 실패했습니다 (오류 '+res2.status+').');\n  const data2 = await res2.json();\n  if(!data2 || data2.length===0) throw new Error('주소를 찾을 수 없습니다: '+addr);\n  return { lat: parseFloat(data2[0].lat), lng: parseFloat(data2[0].lon), roadAddr: data2[0].display_name };\n}\n/* ---- 출발지/도착지 주소 검색 팝업 ---- */\nlet addrModalTarget = null;\nlet addrModalCandidates = [];\nfunction openAddrModal(target){\n  addrModalTarget = target;\n  document.getElementById('addrModalTitle').textContent = target==='origin' ? '출발지 주소 검색' : '도착지(출장지) 주소 검색';\n  const srcInput = document.getElementById(target==='origin' ? 'distOrigin' : 'distDest');\n  const modalInput = document.getElementById('addrModalInput');\n  modalInput.value = srcInput.value.trim();\n  document.getElementById('addrModalResults').innerHTML = '';\n  document.getElementById('addrModalBg').classList.add('active');\n  modalInput.focus();\n}\nfunction closeAddrModal(){\n  document.getElementById('addrModalBg').classList.remove('active');\n}\nasync function searchAddressCandidates(q){\n  const key = getMapApiKey();\n  const out = [];\n  if(key){\n    try{\n      const [addrRes, keywordRes] = await Promise.all([\n        fetch('https://dapi.kakao.com/v2/local/search/address.json?size=10&query='+encodeURIComponent(q), { headers:{ Authorization:'KakaoAK '+key } }),\n        fetch('https://dapi.kakao.com/v2/local/search/keyword.json?size=10&query='+encodeURIComponent(q), { headers:{ Authorization:'KakaoAK '+key } })\n      ]);\n      if(addrRes.ok){\n        const d = await addrRes.json();\n        (d.documents||[]).forEach(doc=>{\n          out.push({ title: doc.address_name, roadAddr: (doc.road_address && doc.road_address.address_name) || doc.address_name, lat: parseFloat(doc.y), lng: parseFloat(doc.x) });\n        });\n      }\n      if(keywordRes.ok){\n        const d2 = await keywordRes.json();\n        (d2.documents||[]).forEach(doc=>{\n          out.push({ title: doc.place_name, roadAddr: doc.road_address_name || doc.address_name, lat: parseFloat(doc.y), lng: parseFloat(doc.x) });\n        });\n      }\n      if(out.length>0) return out;\n    }catch(e){ console.warn('카카오 검색 실패, 무료 검색으로 대체합니다.', e); }\n  }\n  // 키가 없거나 카카오 검색 결과가 없으면 무료 오픈스트리트맵(Nominatim)으로 대체합니다.\n  const res2 = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=8&countrycodes=kr&q='+encodeURIComponent(q));\n  if(!res2.ok) throw new Error('주소 검색에 실패했습니다 (오류 '+res2.status+').');\n  const data2 = await res2.json();\n  return (data2||[]).map(d=>({ title: d.display_name, roadAddr: d.display_name, lat: parseFloat(d.lat), lng: parseFloat(d.lon) }));\n}\nasync function runAddrModalSearch(){\n  const q = document.getElementById('addrModalInput').value.trim();\n  const resultsEl = document.getElementById('addrModalResults');\n  if(!q){ resultsEl.innerHTML = '\u003cdiv class=\"tag-empty\">검색어를 입력해주세요.\u003c/div>'; return; }\n  resultsEl.innerHTML = '\u003cdiv class=\"tag-empty\">검색 중...\u003c/div>';\n  try{\n    const list = await searchAddressCandidates(q);\n    addrModalCandidates = list;\n    if(list.length===0){ resultsEl.innerHTML = '\u003cdiv class=\"tag-empty\">검색 결과가 없습니다.\u003c/div>'; return; }\n    resultsEl.innerHTML = list.map((r,i)=>`\n      \u003cdiv class=\"doc-select-row\" style=\"cursor:pointer;\" onclick=\"selectAddrCandidate(${i})\">\n        \u003cdiv>\n          \u003cdiv style=\"font-weight:600;\">${escapeXml(r.title||r.roadAddr)}\u003c/div>\n          \u003cdiv class=\"small\">${escapeXml(r.roadAddr)}\u003c/div>\n        \u003c/div>\n      \u003c/div>`).join('');\n  }catch(e){\n    resultsEl.innerHTML = '\u003cdiv class=\"tag-empty\">'+e.message+'\u003c/div>';\n  }\n}\nfunction selectAddrCandidate(i){\n  const r = addrModalCandidates[i];\n  if(!r) return;\n  const targetInput = document.getElementById(addrModalTarget==='origin' ? 'distOrigin' : 'distDest');\n  targetInput.value = r.roadAddr;\n  closeAddrModal();\n}\nfunction haversineKm(a,b){\n  const R=6371, toRad=x=>x*Math.PI/180;\n  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);\n  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;\n  return R*2*Math.asin(Math.sqrt(s));\n}\n// 카카오모빌리티 길찾기 API(car_fuel)는 GASOLINE/DIESEL/LPG만 받습니다. 전기·수소를 그대로 보내면\n// 요청 전체가 거절되어 거리·통행료를 못 받으므로 휘발유로 바꿔 보냅니다(통행료는 차종 기준이라 영향 없음).\nfunction kakaoCarFuel(fuelType){ return ['GASOLINE','DIESEL','LPG'].includes(fuelType) ? fuelType : 'GASOLINE'; }\nasync function callKakaoDirections(origin, destination, key, params){\n  let url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${origin.lng},${origin.lat}&destination=${destination.lng},${destination.lat}`;\n  if(params) url += params;\n  const res = await fetchWithTimeout(url, 12000, { headers:{ Authorization: 'KakaoAK '+key } });\n  if(!res.ok){\n    let detail=''; try{ detail = (await res.text()).slice(0,80).replace(/\\s+/g,' '); }catch(e){}\n    throw new Error('HTTP '+res.status+(detail?' '+detail:''));\n  }\n  const data = await res.json();\n  const route = data && data.routes && data.routes[0];\n  if(!route || route.result_code!==0 && route.result_code!==undefined && !route.summary) throw new Error(route && route.result_msg ? route.result_msg : '경로 없음');\n  const summary = route.summary;\n  if(!summary || !summary.distance) throw new Error('거리 정보 없음');\n  return {route, summary};\n}\nasync function fetchDrivingDistanceMeters(origin, destination, fuelType, carType){\n  const key = getMapApiKey();\n  let kakaoError = '';\n  if(key){\n    // 카카오맵 웹의 자동차 경로검색은 차종·유종·하이패스를 입력받지 않고 기본값(승용차·미장착)으로 통행료를 보여준다.\n    // 통행료를 그 값과 맞추기 위해 car_type/car_fuel/car_hipass를 보내지 않고 API 기본값으로만 조회한다.\n    const attempts = [''];\n    for(const params of attempts){\n      try{\n        const {route, summary} = await callKakaoDirections(origin, destination, key, params);\n        const hasToll = !!(summary.fare && summary.fare.toll!==undefined);\n        const roads = [];\n        (route.sections||[]).forEach(sec=>(sec.roads||[]).forEach(r=>{ if(r.name && !roads.includes(r.name)) roads.push(r.name); }));\n        return {\n          meters: summary.distance,\n          tollFare: (summary.fare && summary.fare.toll) || 0,\n          tollKnown: hasToll,\n          taxiFare: (summary.fare && summary.fare.taxi) || 0,\n          duration: summary.duration || 0, roads, kakaoUsed:true\n        };\n      }catch(e){\n        kakaoError = (e && e.message) || String(e);\n        console.warn('카카오 길찾기 호출 실패', params, e);\n      }\n    }\n  }else{\n    kakaoError = '카카오 API 키가 없습니다.';\n  }\n  // 길찾기 API를 쓸 수 없으면 직선거리에 도로 보정계수(1.3)를 곱해 추정하고, 통행료는 알 수 없으므로 0원(미확인)으로 둡니다.\n  return { meters: haversineKm(origin, destination)*1000*1.3, tollFare: 0, tollKnown:false, taxiFare:0, duration:0, roads:[], kakaoUsed:false, kakaoError };\n}\n/* 실제 카카오맵(map.kakao.com)에서 이 경로를 그대로 열어 눈으로 확인할 수 있는 길찾기 링크 생성 */\nfunction buildKakaoMapRouteUrl(originLabel, o, destLabel, d){\n  const enc = s => encodeURIComponent(s);\n  return `https://map.kakao.com/link/by/car/${enc(originLabel)},${o.lat},${o.lng}/${enc(destLabel)},${d.lat},${d.lng}`;\n}\nasync function runDistanceCalc(){\n  const originAddr = document.getElementById('distOrigin').value.trim() || DEFAULT_ORIGIN_ADDR;\n  const destAddr = document.getElementById('distDest').value.trim();\n  const fuelType = document.getElementById('distFuelType').value;\n  const carType = parseInt(document.getElementById('distCarType').value);\n  const resultEl = document.getElementById('distResult');\n  if(!destAddr){ alert('도착지(출장지)를 입력해주세요.'); return; }\n  resultEl.textContent = '계산 중...';\n  // 오피넷 유가 조회가 아직 진행 중이면 끝날 때까지(최대 25초) 기다린 뒤 최신 유가로 계산\n  if(oilPendingPromises['distOilPrice']){\n    resultEl.textContent = '오피넷 유가 조회 결과를 기다리는 중...';\n    await Promise.race([oilPendingPromises['distOilPrice'], new Promise(r=>setTimeout(r,25000))]);\n    resultEl.textContent = '계산 중...';\n  }\n  let oilPrice = parseFloat(document.getElementById('distOilPrice').value)||0;\n  if(!(oilPrice>0)){ oilPrice = getBestKnownOilPrice(fuelType); document.getElementById('distOilPrice').value = oilPrice; }\n  try{\n    const [o,d] = await Promise.all([geocodeAddress(originAddr), geocodeAddress(destAddr)]);\n    const {meters, tollFare, tollKnown, taxiFare, duration, roads, kakaoUsed, kakaoError} = await fetchDrivingDistanceMeters(o,d,fuelType,carType);\n    const oneWayKm = Math.round(meters/1000*10)/10;\n    const roundKm = Math.round(meters/1000*2*10)/10;\n    const rate = calcRatePerKm(fuelType, oilPrice);\n    document.getElementById('distRate').value = rate;\n    const oneWayFare = Math.round(oneWayKm*rate);\n    const roundFare = Math.round(roundKm*rate);\n    lastDistCalc = { oneWayKm, roundKm, originAddr:o.roadAddr||originAddr, destAddr:d.roadAddr||destAddr, fuelType, carType, oilPrice, rate, oneWayFare, roundFare, tollFareOneWay: tollFare, tollFareRound: Math.round(tollFare*2), kakaoUsed, oLat:o.lat, oLng:o.lng, dLat:d.lat, dLng:d.lng };\n    const fuelLabel = CAR_FUEL_OPTIONS.find(f=>f.value===fuelType)?.label||fuelType;\n    const carLabel = CAR_TYPE_OPTIONS.find(c=>c.value===carType)?.label||carType;\n    const mapUrl = buildKakaoMapRouteUrl(lastDistCalc.originAddr, o, lastDistCalc.destAddr, d);\n\n    let html = `편도 \u003cb>${oneWayKm}km\u003c/b> · 왕복 \u003cb>${roundKm}km\u003c/b> (${escapeXml(lastDistCalc.originAddr)} → ${escapeXml(lastDistCalc.destAddr)})\u003cbr>`\n      + `유종: ${fuelLabel} · 유가(오피넷) ${oilPrice.toLocaleString()}${FUEL_PRICE_UNIT[fuelType]||'원/L'} ÷ 연비 ${getFuelEfficiency(fuelType)} · 운임단가 \u003cb>${rate.toLocaleString()}원/km\u003c/b> \u003cbr>`\n      + `편도 운임비 \u003cb>${oneWayFare.toLocaleString()}원\u003c/b> · 왕복 운임비 \u003cb>${roundFare.toLocaleString()}원\u003c/b>`\n      + '\u003cbr>' + (!kakaoUsed\n          ? `통행료(카카오맵): \u003cb style=\"color:#c0392b;\">확인 못 함\u003c/b> — 영수증 금액을 통행료 칸에 직접 입력하세요.`\n          : (tollFare>0\n              ? `통행료(카카오맵): 편도 ${tollFare.toLocaleString()}원 · 왕복 예상 \u003cb>${lastDistCalc.tollFareRound.toLocaleString()}원\u003c/b>(영수증 첨부 시 지급)`\n              : `통행료(카카오맵): 통행료 없는 경로(0원)`));\n\n    if(!kakaoUsed){\n      html += `\u003cdiv class=\"hint hint-warn\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/>\u003cline x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/>\u003cline x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/>\u003c/svg>\u003cspan>카카오 길찾기 결과를 받지 못해 직선거리×1.3 추정 거리를 사용했고 통행료는 반영되지 않았습니다.${kakaoError ? ' (원인: '+escapeXml(kakaoError)+')' : ''} 키 입력·권한(카카오내비 사용 설정)을 확인하고 다시 계산해주세요.\u003c/span>\u003c/div>`;\n    }\n\n    const mapBtn = document.getElementById('distMapBtn');\n    mapBtn.href = mapUrl;\n    mapBtn.classList.remove('disabled');\n    mapBtn.style.pointerEvents = '';\n    mapBtn.style.opacity = '';\n\n    resultEl.innerHTML = html;\n    renderDistApplyList();\n  }catch(err){\n    resultEl.textContent = err.message;\n  }\n}\nfunction renderDistApplyList(){\n  updateNavStatus();\n  const el = document.getElementById('distApplyList');\n  if(!el) return;\n  if(!lastDistCalc){ el.innerHTML=''; return; }\n  if(tripDB.length===0){ el.innerHTML = '\u003cdiv class=\"tag-empty\">먼저 \"② 출장 내역 입력\" 탭에서 출장자를 등록해주세요.\u003c/div>'; return; }\n  el.innerHTML = `\n    \u003cdiv class=\"hint\">이번 자차 동행 인원을 선택하세요. \u003cb>운전자는 1명만\u003c/b> 선택하며, 자차 운임료는 운전자에게만 지급되고 동승자는 운임료 없이 일비만 지급됩니다.\u003c/div>\n    \u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:60px\">운전자\u003c/th>\u003cth style=\"width:60px\">동승\u003c/th>\u003cth>성명\u003c/th>\u003cth>출장지\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${tripDB.map(t=>`\u003ctr>\n      \u003ctd>\u003cinput type=\"radio\" name=\"distDriver\" value=\"${t.id}\">\u003c/td>\n      \u003ctd>\u003cinput type=\"checkbox\" class=\"distRider\" value=\"${t.id}\">\u003c/td>\n      \u003ctd>${t.name}\u003c/td>\u003ctd>${t.dest||'-'}\u003c/td>\n    \u003c/tr>`).join('')}\n    \u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"toolbar\" style=\"margin-top:10px;\">\u003cbutton class=\"btn\" onclick=\"applyDistanceToSelected()\">선택 인원에게 왕복 거리 적용\u003c/button>\u003c/div>`;\n}\nfunction applyDistanceToSelected(){\n  if(!lastDistCalc){ alert('먼저 거리를 계산해주세요.'); return; }\n  const driverEl = document.querySelector('input[name=distDriver]:checked');\n  const driverId = driverEl ? driverEl.value : null;\n  const riderIds = Array.from(document.querySelectorAll('.distRider:checked')).map(c=>c.value);\n  const allIds = new Set([...(driverId?[driverId]:[]), ...riderIds]);\n  if(allIds.size===0){ alert('운전자 또는 동승자를 1명 이상 선택해주세요.'); return; }\n  allIds.forEach(id=>{\n    const t = tripDB.find(x=>x.id===id);\n    if(!t) return;\n    t.transport='자차';\n    t.distance = lastDistCalc.roundKm;\n    t.carRole = (id===driverId) ? 'driver' : 'passenger';\n    t.fuelType = lastDistCalc.fuelType;\n    t.carType = lastDistCalc.carType;\n    t.oilPrice = lastDistCalc.oilPrice;\n    t.rate = lastDistCalc.rate;\n    if(id===driverId && lastDistCalc.tollFareRound>0) t.toll = lastDistCalc.tollFareRound;\n  });\n  saveTrips(); renderTripTable();\n  toast(allIds.size+'명에게 왕복 '+lastDistCalc.roundKm+'km를 적용했습니다.');\n}\n\nfunction renderCalcTable(){\n  const tb = document.querySelector('#calcTable tbody');\n  tb.innerHTML='';\n  let sD=0,sM=0,sT=0,sL=0,sTot=0;\n  tripDB.forEach(t=>{\n    const daily=calcDaily(t), meal=calcMealFee(t), trans=calcTransportFee(t), lodge=calcLodgeFee(t);\n    const total = daily+meal+trans+lodge;\n    sD+=daily; sM+=meal; sT+=trans; sL+=lodge; sTot+=total;\n    const dailyStyle = t.dailyOverride!=null ? 'color:var(--accent);font-weight:700;' : '';\n    const mealStyle = t.mealOverride!=null ? 'color:var(--accent);font-weight:700;' : '';\n    const mealFeeStyle = (t.mealFeeOverride!=null || t.mealOverride!=null) ? 'color:var(--accent);font-weight:700;' : '';\n    const transStyle = t.transOverride!=null ? 'color:var(--accent);font-weight:700;' : '';\n    const lodgeStyle = t.lodgeOverride!=null ? 'color:var(--accent);font-weight:700;' : '';\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      \u003ctd>${t.name}\u003c/td>\n      \u003ctd style=\"font-size:11px;\">${findAccount(t.name)||'\u003cspan style=\\\"color:var(--danger)\\\">미등록\u003c/span>'}\u003c/td>\n      \u003ctd style=\"font-size:11px;\">${fmtRange(t)}\u003c/td>\n      \u003ctd>\u003cselect style=\"width:64px;${mealStyle}\" onchange=\"overrideMeal('${t.id}',this.value)\">${[1,2,3].map(n=>`\u003coption value=\"${n}\"${calcMealCount(t)===n?' selected':''}>${n}끼\u003c/option>`).join('')}\u003c/select>\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" class=\"amt-input\" style=\"${dailyStyle}\" value=\"${daily}\" onchange=\"overrideDaily('${t.id}',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" class=\"amt-input\" style=\"${mealFeeStyle}\" value=\"${meal}\" onchange=\"overrideMealFee('${t.id}',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" class=\"amt-input\" style=\"${transStyle}\" value=\"${Math.round(trans)}\" onchange=\"overrideTrans('${t.id}',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" class=\"amt-input\" style=\"${lodgeStyle}\" value=\"${Math.round(lodge)}\" onchange=\"overrideLodge('${t.id}',this.value)\">\u003c/td>\n      \u003ctd class=\"amt\" style=\"font-weight:700;\">${fmt(total)}\u003c/td>`;\n    tb.appendChild(tr);\n  });\n  document.getElementById('sumCount').textContent = tripDB.length+'건';\n  document.getElementById('sumDaily').textContent = fmt(sD);\n  document.getElementById('sumMeal').textContent = fmt(sM);\n  document.getElementById('sumTrans').textContent = fmt(sT);\n  document.getElementById('sumLodge').textContent = fmt(sL);\n  document.getElementById('sumTotal').textContent = fmt(sTot);\n}\nfunction refreshCalcAndDocViews(){\n  if(document.getElementById('calcTable')) renderCalcTable();\n  if(document.getElementById('docSelectList')) renderDocSelectList();\n}\n// 끼니 수(1/2/3끼)를 바꾸면 금액이 자동으로 들어갑니다. 빈 값이면 자동 산정으로 되돌립니다.\nfunction overrideMeal(id,val){\n  const t = tripDB.find(x=>x.id===id);\n  if(val==='' || val==null){ t.mealOverride = null; t.mealFeeOverride = null; }\n  else { t.mealOverride = Math.max(0, Math.min(3, parseInt(val)||0)); t.mealFeeOverride = null; }\n  saveTrips(); refreshCalcAndDocViews();\n}\n// 식비 금액을 직접 입력(끼니 수와 별개로 금액만 덮어씀). 빈 값이면 끼니 수 기준 금액으로 복귀.\nfunction overrideMealFee(id,val){\n  const t = tripDB.find(x=>x.id===id);\n  t.mealFeeOverride = (val==='' || val==null) ? null : (parseFloat(val)||0);\n  saveTrips(); refreshCalcAndDocViews();\n}\nfunction overrideDaily(id,val){\n  const t = tripDB.find(x=>x.id===id);\n  t.dailyOverride = parseFloat(val)||0;\n  saveTrips(); refreshCalcAndDocViews();\n}\n\n/* ============================================================\n   TAB4: 엑셀 출력\n============================================================ */\nfunction exportPaymentForm(){\n  if(tripDB.length===0){ alert('출장 내역이 없습니다.'); return; }\n  const header = ['거래처명\\n(100자리이하)\\n(필수입력)','거래처구분\\n(필수입력)','사업자등록번호\\n(10자리)','생년월일\\n(8자리)','입금유형\\n(선택)','은행\\n(선택)','예금주명\\n(100자리이하)','계좌번호\\n(30자리이하)','공급가액\\n(17자리이하)\\n(필수입력)','부가세액\\n(17자리이하)','공제액\\n(금액 0원으로 고정)','지출액\\n(17자리이하)','지로번호\\n(19자리이하)','CMS번호\\n(20자리이하)','대표채주\\n(Y/N)','대표자명\\n(100자리)','우편번호\\n(5자리)','기본주소\\n(75자이하)','상세주소\\n(75자이하)','전화번호\\n(30자리이하)','휴대폰번호\\n(20자리이하)','입금명세(100자리)'];\n  const rows = tripDB.map(t=>{\n    const s = staffDB.find(x=>x.name===t.name) || {};\n    const total = calcTotal(t);\n    return [t.name,'30:개인','','','10:계좌이체',(s.bankCode?s.bankCode+':':'')+(s.bankName||''),t.name,s.account||'',total,0,0,total,'','','','','','','','','', t.purpose||''];\n  });\n  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws, '거래처입력');\n  XLSX.writeFile(wb, '관외출장_지급폼_'+todayStr()+'.xlsx');\n}\nfunction exportDetailForm(){\n  if(tripDB.length===0){ alert('출장 내역이 없습니다.'); return; }\n  const header = ['출장자명\\n(100자리이하)','계좌번호\\n(30자리이하)','직급명\\n(100자리이하)','출장목적\\n(100자리이하)','정산유형\\n(선택)','일자\\n(8자리)','출발지\\n(100자리이하)','경유지\\n(100자리이하)','도착지\\n(100자리이하)','교통편\\n(선택)','종별\\n(100자리이하)','등급\\n(100자리이하)','거리\\n(10자리이하)','요금\\n(17자리이하)','출장시작일\\n(8자리)','출장종료일\\n(8자리)','식비\\n(17자리이하)','숙박료\\n(17자리이하)','일비\\n(17자리이하)','현지교통비\\n(사용하지 않는 항목)','기타\\n(사용하지 않는 항목)','계\\n(17자리이하)','청구 및 수령액\\n(17자리이하)','실국명\\n(100자리이하)','부서명\\n(100자리이하)'];\n  const rows = tripDB.map(t=>{\n    const s = staffDB.find(x=>x.name===t.name) || {};\n    const daily=calcDaily(t), meal=calcMealFee(t), trans=calcTransportFee(t), lodge=calcLodgeFee(t);\n    const total = daily+meal+trans+lodge;\n    const startDate = t.start ? t.start.split('T')[0].replace(/-/g,'') : '';\n    const endDate = t.end ? t.end.split('T')[0].replace(/-/g,'') : '';\n    const transportCode = t.transport==='기차' ? '002:철도' : (t.transport==='자차' ? '003:자가용' : '001:없음');\n    return [t.name, s.account||'', t.position||'', t.purpose||'', '002:실비', startDate, '익산', '', t.dest||'',\n      transportCode, '', t.grade||'', t.distance||'', trans, startDate, endDate, meal, lodge, daily, '', '', total, total, '문화교육국', t.dept||'문화유산과'];\n  });\n  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws, '여비상세입력');\n  XLSX.writeFile(wb, '관외출장_여비상세폼_'+todayStr()+'.xlsx');\n}\nfunction todayStr(){\n  const d = new Date(); const p=n=>String(n).padStart(2,'0');\n  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;\n}\n\n/* ============================================================\n   여비지출결의서 선택 목록 · 편집 가능한 미리보기\n============================================================ */\nconst expandedDocIds = new Set();\nfunction overrideTrans(id,val){\n  const t = tripDB.find(x=>x.id===id);\n  t.transOverride = (val==='' || val==null) ? null : (parseFloat(val)||0);\n  saveTrips(); refreshCalcAndDocViews();\n}\nfunction overrideLo
