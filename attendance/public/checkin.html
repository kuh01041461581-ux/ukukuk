<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출석 체크</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#777;--pri:#2f5d50;--a:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#171a19;--card:#222726;--ink:#eee;--mut:#9a9;--pri:#6fb59f}}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:480px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #8886;background:var(--card);color:var(--ink);width:100%;margin:4px 0}
button.pri{background:var(--pri);color:#fff;border:0;font-weight:700}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px}.names button{margin:0}
.names .sel{background:var(--pri);color:#fff}.names .done{opacity:.4}
.err{color:var(--a);font-weight:600}.mut{color:var(--mut);font-size:14px}.big{font-size:22px;text-align:center}
h4{margin:12px 0 4px}
</style></head><body><main>
<h2 id="title">출석 체크</h2><div id="sub" class="mut"></div>
<div id="body"></div>
<script>
const $=id=>document.getElementById(id);
const token=location.pathname.split('/').pop();
let dev=localStorage.getItem('dev');if(!dev){dev=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.setItem('dev',dev)}
let sel=localStorage.getItem('me')||null,gid=null,S=null;
let LOC=null,locState='idle'; // idle | asking | ok | denied | error
const HELP=`<b>위치 권한을 켜 주세요.</b><br>· 안드로이드: 주소창 왼쪽 자물쇠(또는 설정) → 권한 → 위치 → 허용<br>· 아이폰: 설정 → 개인정보 보호 및 보안 → 위치 서비스 → Safari(또는 사용 중인 브라우저) → <b>앱을 사용하는 동안</b><br>· 카카오톡에서 열었다면 오른쪽 아래 ⋮ → <b>다른 브라우저로 열기</b> 후 다시 시도`;
function locHtml(){
  if(!S.venue)return '';
  const box=(t,cls)=>`<div class="${cls}" style="margin:8px 0;padding:10px;border-radius:10px;border:1px solid #8886">${t}</div>`;
  if(locState==='ok')return box(`📍 위치 확인됨 — 교육장(${S.venue.name||'지정 장소'}) 안에서 출석할 수 있습니다`,'');
  if(locState==='asking')return box('📍 위치 권한을 허용해 주세요… (허용 창이 보이면 [허용]을 눌러 주세요)','');
  if(locState==='denied')return box(HELP+'<br><button id="retry" class="pri" style="margin-top:8px">위치 다시 확인</button>','');
  if(locState==='error')return box('📍 위치를 가져오지 못했습니다. 실외나 창가에서 <button id="retry" style="width:auto;padding:6px 10px;margin:0">다시 시도</button>','');
  return '';}
function askLocation(){
  if(!S||!S.venue)return;
  if(!navigator.geolocation){locState='denied';draw();return}
  locState='asking';draw();
  navigator.geolocation.getCurrentPosition(x=>{LOC={lat:x.coords.latitude,lng:x.coords.longitude,accuracy:x.coords.accuracy,t:Date.now()};locState='ok';draw()},
    e=>{locState=e&&e.code===1?'denied':'error';draw()},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function load(){
  const r=await fetch('/api/s/'+token);S=await r.json();
  if(!r.ok){$('body').innerHTML=`<div class="card err">${S.error}</div>`;return}
  $('title').textContent=S.lecture.name;$('sub').textContent=`${S.date} · ${S.lecture.start}~${S.lecture.end}`;
  if(!S.open){$('body').innerHTML='<div class="card err">출석이 마감되었습니다.</div>';return}
  if(!S.venue&&!S.useCode){$('body').innerHTML='<div class="card err">교육 장소가 아직 설정되지 않아 출석할 수 없습니다. 담당자에게 문의하세요.</div>';return}
  draw();askLocation(); // 링크를 열면 바로 위치 권한을 요청
}
function draw(msg){
  if(!gid)gid=(me()&&S.groups.find(g=>g.members.some(m=>m.id===sel))?.id)||localStorage.getItem('gid')||null;
  const G=S.groups.find(g=>g.id===gid);
  $('body').innerHTML=`<div class="card"><h4 style="margin-top:0">① 소속 단체</h4><div class="names">${S.groups.map(g=>`<button data-gid="${g.id}" class="${gid===g.id?'sel':''}">${g.name}</button>`).join('')}</div>
  ${G?`<h4>② 본인 이름</h4><div class="names">${G.members.map(m=>`<button data-id="${m.id}" class="mem ${sel===m.id?'sel':''} ${m.done?'done':''}">${m.name}${m.done?' ✔':''}</button>`).join('')}</div>`:''}</div>
  <div class="card">${sel&&me()?`<div>👤 <b>${me().name}</b>님으로 출석합니다 <a href="#" id="other">다른 사람이에요</a></div>`:''}
  <label ${bound()?'hidden':''}>본인 확인: 전화번호 뒤 4자리<input id="ph" inputmode="numeric" maxlength="4" placeholder="예: 1234"></label>
  ${S.useCode?`<label>현장 코드 (교육장에서 안내)<input id="code" inputmode="numeric" maxlength="4" placeholder="4자리"></label>`:''}
  ${locHtml()}
  <button class="pri" id="go">출석하기</button><div id="msg" class="${msg?.err?'err':''}">${msg?.t||''}</div></div>`;
  document.querySelectorAll('[data-gid]').forEach(b=>b.onclick=()=>{gid=b.dataset.gid;sel=null;localStorage.setItem('gid',gid);draw()});
  document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{sel=b.dataset.id;const c=$('code')?.value;draw();if($('code'))$('code').value=c||''});
  $('go').onclick=go;
  if($('retry'))$('retry').onclick=askLocation;
  if($('other'))$('other').onclick=e=>{e.preventDefault();localStorage.removeItem('bound');localStorage.removeItem('me');sel=null;draw()};
}
const me=()=>S&&S.groups.flatMap(g=>g.members).find(m=>m.id===sel);
const bound=()=>!!localStorage.getItem('bound')&&localStorage.getItem('bound')===sel;
function pos(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}):no({message:'unsupported'}))}
async function go(){
  const msg=(t,err)=>{$('msg').className=err?'err':'';$('msg').textContent=t};
  if(!sel)return msg('본인 이름을 눌러 주세요',1);
  let p={};
  if(S.venue){msg('위치 확인 중…');
    try{const x=await pos();p={lat:x.coords.latitude,lng:x.coords.longitude,accuracy:x.coords.accuracy}}
    catch(e){if(LOC&&Date.now()-LOC.t<120000)p={lat:LOC.lat,lng:LOC.lng,accuracy:LOC.accuracy};
      else{locState=e&&e.code===1?'denied':'error';draw();return}}}
  const r=await fetch(`/api/s/${token}/checkin`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({memberId:sel,code:$('code')?$('code').value:'',phone4:$('ph').value,deviceId:dev,...p})});
  const j=await r.json();
  if(!r.ok)return msg(j.error,1);
  localStorage.setItem('me',sel);localStorage.setItem('bound',sel);
  const name=S.groups.flatMap(g=>g.members).find(m=>m.id===sel).name;
  $('body').innerHTML=`<div class="card big">✅<br>${name}님<br>${j.status==='L'?'지각 처리되었습니다':'출석되었습니다'}${j.already?'<div class="mut">(이미 출석됨)</div>':''}</div>`;
}
load();
</script></main></body></html>
