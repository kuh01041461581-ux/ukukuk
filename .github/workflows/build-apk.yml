name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths: [mobile/**, .github/workflows/build-apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Test
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
      - name: Build APK
        working-directory: mobile
        run: |
          CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))   # 시간이 갈수록 커지는 버전 코드: 새 빌드가 항상 업데이트로 설치됨
          flutter build apk --release --build-name=1.0.0 --build-number=$CODE --dart-define=APP_VERSION="1.0.0 (빌드 $CODE)"
      - name: Rename
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk DeskCalendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeskCalendar-android
          path: DeskCalendar.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: DeskCalendar 안드로이드 최신 빌드 (APK)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: DeskCalendar.apk
