}\n  .page-title{ font-size:21px; }\n}\n\n/* 통합 셸: 좌측 사이드바·큰 제목은 숨기고 '사용 안내' 버튼만 남김 */\n.sidebar{display:none;}\n.app,.main{display:block;min-height:0;}\n.topbar{padding:0 0 12px;max-width:none;justify-content:flex-end;}\n.topbar > div:first-child{display:none;}\n.guide-panel{padding:0;max-width:none;margin:0 0 14px;}\n.content{padding:0;max-width:none;}\n\u003c/style>\n\u003cmeta name=\"tool-id\" content=\"blur\">\n\u003cstyle id=\"suite-theme\">\n/* ==========================================================================\n   서무 업무 자동화 — 공통 디자인 시스템\n   셸(index)과 모든 도구 페이지가 이 파일 하나를 공유합니다.\n   · 색/글꼴/모서리는 아래 토큰(:root)만 바꾸면 전체가 함께 바뀝니다.\n   · 도구마다 다르게 부르던 클래스 이름(.btn-primary / .run / .btn.outline …)도\n     여기서 한 모양으로 묶습니다. 도구 CSS 뒤에 불러오므로 같은 점수면 이 파일이 이깁니다.\n   ========================================================================== */\n\n/* ---------- 1. 토큰 ---------- */\n:root{\n  --bg:#F8FAFC;\n  --surface:#FFFFFF;\n  --surface-2:#F8FAFC;\n  --surface-3:#EEF1F5;\n  --hover:#F3F4F6;\n  --border:#E5E7EB;\n  --border-strong:#D5D9E0;\n\n  --text:#111827;\n  --text-2:#6B7280;\n  --text-3:#9CA3AF;\n\n  --primary:#2563EB;\n  --primary-hover:#1D4ED8;\n  --primary-tint:#EFF4FE;\n  --primary-tint-strong:#E1EAFD;\n  --primary-border:#C7D9FC;\n\n  --success:#16A34A;\n  --success-tint:#EAFBF2;\n  --warning:#D97706;\n  --warning-tint:#FDF1DE;\n  --danger:#DC2626;\n  --danger-hover:#B91C1C;\n  --danger-tint:#FDEEEE;\n\n  --radius-sm:8px;\n  --radius-btn:10px;\n  --radius-input:10px;\n  --radius-card:16px;\n  --radius-modal:20px;\n\n  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);\n  --shadow-pop:0 16px 40px rgba(17,24,39,.16), 0 2px 8px rgba(17,24,39,.06);\n\n  --font:'Noto Sans KR','Pretendard Variable','Segoe UI','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;\n  --mono:'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;\n\n  /* 보고 있는 화면 영역(iframe 안에서 모달·토스트 위치를 잡을 때 셸이 갱신) */\n  --vp-top:0px;\n  --vp-h:100vh;\n\n  color-scheme:light;\n}\nhtml.dark{\n  --bg:#111418;\n  --surface:#181C22;\n  --surface-2:#1C2128;\n  --surface-3:#242A33;\n  --hover:#20242B;\n  --border:#262B33;\n  --border-strong:#343B46;\n\n  --text:#E8EAED;\n  --text-2:#9AA2AD;\n  --text-3:#6B7280;\n\n  --primary:#3B82F6;\n  --primary-hover:#60A5FA;\n  --primary-tint:#152238;\n  --primary-tint-strong:#1B2B47;\n  --primary-border:#27406B;\n\n  --success:#22C55E;\n  --success-tint:#0F2A1D;\n  --warning:#F59E0B;\n  --warning-tint:#2E2410;\n  --danger:#EF4444;\n  --danger-hover:#F87171;\n  --danger-tint:#301616;\n\n  --shadow-card:0 1px 2px rgba(0,0,0,.4);\n  --shadow-pop:0 16px 40px rgba(0,0,0,.55);\n  color-scheme:dark;\n}\n\n/* ---------- 2. 바탕 ---------- */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-font-smoothing:antialiased;}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--text);\n  font-family:var(--font);\n  font-size:14px;\n  line-height:1.55;\n}\n::selection{background:var(--primary-tint-strong);color:var(--text);}\na{color:var(--primary);}\n:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}\nsvg{display:block;}\nhr{border:none;border-top:1px solid var(--border);}\ncode{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:5px;}\n::-webkit-scrollbar{width:10px;height:10px;}\n::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box;}\n::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:2px solid transparent;}\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}\n}\n\n/* 도구 페이지 공통 틀: 셸이 제목을 보여 주므로 도구는 본문만 가진다 */\nbody.tool{background:transparent;padding:0 0 40px;}\nbody.tool .wrap,\nbody.tool .page{max-width:none;margin:0;padding:0;}\n\n/* ---------- 3. 카드 / 패널 ---------- */\nbody .card,\nbody .panel,\nbody .step{\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:var(--radius-card);\n  box-shadow:var(--shadow-card);\n  padding:22px 24px;\n  margin-bottom:16px;\n}\nbody .card h2,\nbody .panel h2{\n  font-size:15px;font-weight:700;letter-spacing:-.01em;\n  text-transform:none;color:var(--text);margin:0 0 6px;\n}\nbody .card .sub,\nbody .panel .sub,\nbody .section-sub,\nbody .step-desc{color:var(--text-2);font-size:13px;line-height:1.65;}\nbody .card .sub{margin-bottom:16px;}\n\n/* ---------- 4. 버튼 ---------- */\nbody .btn,\nbody .btn-primary,\nbody .btn-secondary,\nbody .btn-outline,\nbody .btn-ghost,\nbody .btn-export,\nbody button.run{\n  --b-bg:var(--primary);--b-fg:#fff;--b-bd:var(--primary);--b-bg-h:var(--primary-hover);--b-bd-h:var(--primary-hover);\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  min-height:40px;padding:0 16px;\n  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;\n  border-radius:var(--radius-btn);\n  background:var(--b-bg);color:var(--b-fg);border:1px solid var(--b-bd);\n  box-shadow:none;text-decoration:none;cursor:pointer;\n  transition:background .15s ease,border-color .15s ease,color .15s ease,transform 60ms ease;\n}\nbody .btn:hover:not(:disabled):not(.disabled),\nbody .btn-primary:hover:not(:disabled),\nbody .btn-secondary:hover:not(:disabled),\nbody .btn-outline:hover:not(:disabled),\nbody .btn-ghost:hover:not(:disabled),\nbody .btn-export:hover:not(:disabled),\nbody button.run:hover:not(:disabled){background:var(--b-bg-h);border-color:var(--b-bd-h);color:var(--b-fg-h,var(--b-fg));box-shadow:none;}\nbody .btn:active:not(:disabled),\nbody .btn-primary:active:not(:disabled),\nbody button.run:active:not(:disabled){transform:translateY(1px);}\nbody .btn:disabled,body .btn[disabled],body .btn.disabled,\nbody .btn-primary:disabled,body .btn-secondary:disabled,body .btn-outline:disabled,\nbody .btn-ghost:disabled,body .btn-export:disabled,body button.run:disabled{\n  opacity:.5;cursor:not-allowed;\n}\n/* 보조(연한 파랑) */\nbody .btn.outline,\nbody .btn-secondary,\nbody .btn-outline{--b-bg:var(--primary-tint);--b-fg:var(--primary);--b-bd:transparent;--b-bg-h:var(--primary-tint-strong);--b-bd-h:transparent;}\n/* 낮은 우선순위(테두리) */\nbody .btn.ghost,\nbody .btn-ghost{--b-bg:var(--surface);--b-fg:var(--text-2);--b-bd:var(--border-strong);--b-bg-h:var(--hover);--b-bd-h:var(--border-strong);--b-fg-h:var(--text);}\n/* 되돌릴 수 없는 동작 */\nbody .btn.danger{--b-bg:var(--surface);--b-fg:var(--danger);--b-bd:var(--danger);--b-bg-h:var(--danger-tint);--b-bd-h:var(--danger);}\n/* 내려받기 완료형(초록) */\nbody .btn-export{--b-bg:var(--success);--b-fg:#fff;--b-bd:var(--success);--b-bg-h:var(--success);--b-bd-h:var(--success);}\nbody .btn-export:hover:not(:disabled){filter:brightness(.93);}\n/* 크기 */\nbody .btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;gap:5px;}\nbody .btn-lg,body button.run{min-height:46px;font-size:14.5px;}\nbody button.run{width:100%;}\nbody .btn svg,body button.run svg{flex:none;}\n\n/* 아이콘 단추 */\nbody .icon-btn,\nbody .btn-icon{\n  display:inline-flex;align-items:center;justify-content:center;flex:none;\n  width:32px;height:32px;min-height:0;padding:0;\n  border-radius:var(--radius-sm);border:1px solid transparent;\n  background:transparent;color:var(--text-2);cursor:pointer;box-shadow:none;\n  transition:background .15s ease,color .15s ease;\n}\nbody .icon-btn:hover,body .btn-icon:hover{background:var(--hover);color:var(--text);}\nbody .icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);}\n\n/* ---------- 5. 입력 ---------- */\nbody input[type=text],\nbody input[type=number],\nbody input[type=password],\nbody input[type=search],\nbody input[type=date],\nbody input[type=time],\nbody input[type=month],\nbody input[type=email],\nbody input[type=tel],\nbody input:not([type]),\nbody select,\nbody textarea{\n  font-family:inherit;font-size:13.5px;color:var(--text);\n  background-color:var(--surface);\n  border:1px solid var(--border-strong);\n  border-radius:var(--radius-input);\n  transition:border-color .15s ease,box-shadow .15s ease;\n}\nbody input::placeholder,body textarea::placeholder{color:var(--text-3);}\nbody input:hover:not(:focus):not([readonly]),body select:hover:not(:focus),body textarea:hover:not(:focus){border-color:var(--text-3);}\nbody input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-strong);}\nbody input[readonly]{background-color:var(--surface-2);color:var(--text-2);}\nbody select{\n  appearance:none;-webkit-appearance:none;\n  background-image:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpolyline points='6 9 12 15 18 9'/>\u003c/svg>\");\n  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;\n  padding-right:32px !important;cursor:pointer;\n}\nbody input[type=file]{display:none;}\nbody input[type=checkbox],body input[type=radio]{accent-color:var(--primary);}\nbody label{color:inherit;}\n\n/* ---------- 6. 표 ---------- */\nbody table{border-collapse:collapse;font-variant-numeric:tabular-nums;}\nbody th{\n  background:var(--surface-2);color:var(--text-2);\n  font-weight:600;font-size:12px;\n  border-bottom:1px solid var(--border-strong);\n}\nbody td{border-color:var(--border);}\nbody tbody tr:hover{background:var(--hover);}\nbody .tablewrap,\nbody .table-scroll,\nbody .preview-wrap{\n  border:1px solid var(--border);border-radius:var(--radius-input);background:var(--surface);\n}\nbody td input,body td select{background-color:transparent;}\nbody td input:focus,body td select:focus{background-color:var(--surface);}\n\n/* ---------- 7. 업로드 영역 ---------- */\nbody .dropzone,\nbody .drop-zone,\nbody .opt-dropzone{\n  border:1.5px dashed var(--border-strong);\n  border-radius:var(--radius-card);\n  background:var(--surface-2);\n  color:var(--text);\n  transition:border-color .15s ease,background .15s ease;\n}\nbody .dropzone:hover,body .drop-zone:hover,body .opt-dropzone:hover,\nbody .dropzone.drag,body .dropzone.dragover,body .dropzone.active,body .dropzone.hover,\nbody .drop-zone.drag,body .drop-zone.dragover,body .opt-dropzone.drag{\n  border-color:var(--primary);background:var(--primary-tint);box-shadow:none;\n}\n\n/* ---------- 8. 안내 / 칩 / 배지 ---------- */\nbody .hint,\nbody .callout,\nbody .note,\nbody .tpl-status,\nbody .rules-note{\n  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);\n  border-radius:var(--radius-input);\n}\nbody .hint-warn{background:var(--warning-tint);border-color:transparent;color:var(--warning);}\nbody .caption,body .small{color:var(--text-3);}\nbody .pill,body .opt-badge,body .step-badge,body .step-no{border-radius:999px;}\nbody .step-badge,body .step-no{background:var(--primary);color:#fff;}\nbody .opt-badge{background:var(--surface-3);color:var(--text-2);}\nbody .summary-box,body .summary-card{\n  background:var(--primary-tint);border:1px solid transparent;border-radius:var(--radius-input);\n}\nbody .summary-box .label,body .summary-card .lbl{color:var(--text-2);}\nbody .summary-box .val,body .summary-card .num{color:var(--primary);}\nbody .summary-card.highlight{background:var(--primary);}\nbody .summary-card.highlight .num,body .summary-card.highlight .lbl{color:#fff;}\n\n/* ---------- 9. 분할 버튼(세그먼트) ---------- */\nbody .typetabs,\nbody .segmented{\n  background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-btn);padding:3px;\n}\nbody .typebtn,\nbody .segmented-option span{color:var(--text-2);border-radius:8px;}\nbody .typebtn:hover{background:var(--hover);color:var(--text);}\nbody .typebtn.active,\nbody .segmented-option input:checked + span{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-card);font-weight:600;}\n\n/* ---------- 10. 모달 · 토스트 · 확대 보기 ----------\n   iframe이 내용 높이만큼 길어지므로, 중앙 정렬을 \"보고 있는 화면 영역\" 기준으로 잡는다. */\nbody .modal-bg,\nbody .lightbox{\n  position:fixed;left:0;right:0;inset-inline:0;\n  top:var(--vp-top);bottom:auto;height:var(--vp-h);\n  background:rgba(10,12,18,.5);backdrop-filter:blur(2px);\n}\nbody .modal{\n  max-height:calc(var(--vp-h) - 48px);\n  background:var(--surface);color:var(--text);\n  border-radius:var(--radius-modal);box-shadow:var(--shadow-pop);\n}\nbody .modal h3{border-bottom:1px solid var(--border);}\nbody .modal-actions{border-top:1px solid var(--border);}\nbody .toast{\n  top:calc(var(--vp-top) + var(--vp-h) - 76px);bottom:auto;\n  background:var(--text);color:var(--bg);border-radius:var(--radius-btn);box-shadow:var(--shadow-pop);\n}\n\n/* ---------- 11. 진행 표시 ---------- */\nbody .progress-track{background:var(--border);border-radius:999px;}\nbody .progress-fill{background:var(--primary);}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\n\n  \u003cdiv class=\"main\">\n    \u003cheader class=\"topbar\">\n      \u003cdiv>\n        \u003cdiv class=\"breadcrumb\">파일 처리 / HWPX 얼굴 자동 블러\u003c/div>\n        \u003ch1 class=\"page-title\">HWPX 얼굴 자동 블러 도구\u003c/h1>\n        \u003cp class=\"page-desc\">HWPX 문서 안의 얼굴을 자동으로 탐지하고 개인정보 보호를 위해 블러 처리합니다.\u003c/p>\n      \u003c/div>\n      \u003cbutton type=\"button\" class=\"btn-ghost\" id=\"guideBtn\">\n        \u003csvg class=\"icon-sm\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.3 9.2a2.7 2.7 0 0 1 5.2.9c0 1.8-2.5 2.1-2.5 3.9\"/>\u003cpath d=\"M12 17.2h.01\"/>\u003c/svg>\n        사용 안내\n      \u003c/button>\n    \u003c/header>\n\n    \u003cdiv class=\"guide-panel\" id=\"guidePanel\">\n      \u003cdiv class=\"guide-panel-inner\">\n        \u003ch3>사용 순서\u003c/h3>\n        \u003cdiv class=\"guide-steps\">\n          \u003cspan class=\"step\">① HWPX 선택\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n          \u003cspan class=\"step\">② 블러 옵션 확인\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n          \u003cspan class=\"step\">③ 얼굴 자동 인식 시작\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n          \u003cspan class=\"step\">④ 진행 상태 확인\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n          \u003cspan class=\"step\">⑤ 검출 결과 확인\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n          \u003cspan class=\"step\">⑥ 필요 시 보정\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n          \u003cspan class=\"step\">⑦ HWPX 다운로드\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"content\">\n\n      \u003cdiv class=\"grid-2col\">\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-title\">파일 선택\u003c/div>\n          \u003cdiv id=\"drop\" class=\"dropzone\">\n            \u003cdiv class=\"dropzone-icon\">\n              \u003csvg class=\"icon-lg\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a3.5 3.5 0 0 1-.7 6.94\"/>\u003cpath d=\"M12 12v7\"/>\u003cpath d=\"M9.4 14.6 12 12l2.6 2.6\"/>\u003c/svg>\n            \u003c/div>\n            \u003cp class=\"dropzone-title\">HWPX 파일을 여기에 놓으세요\u003c/p>\n            \u003cp class=\"dropzone-sub\">또는 파일을 선택하여 업로드하세요\u003c/p>\n            \u003cbutton type=\"button\" class=\"btn-secondary\">파일 선택\u003c/button>\n            \u003cp class=\"dropzone-hint\">.hwpx 파일만 지원됩니다 · 서버로 업로드되지 않음\u003c/p>\n            \u003cinput type=\"file\" id=\"fileInput\" accept=\".hwpx\">\n          \u003c/div>\n          \u003cdiv class=\"file-card\" id=\"fileTag\">\n            \u003cdiv class=\"file-card-icon\">\n              \u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z\"/>\u003cpath d=\"M14 3v5h5\"/>\u003cpath d=\"M9 13h6M9 17h6\"/>\u003c/svg>\n            \u003c/div>\n            \u003cdiv class=\"file-card-info\">\n              \u003cdiv class=\"file-card-name\" id=\"fileTagName\">\u003c/div>\n            \u003c/div>\n            \u003cbutton type=\"button\" class=\"file-card-remove\" id=\"clearFile\">\n              \u003csvg class=\"icon-sm\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/svg>\n              제거\n            \u003c/button>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-title\">처리 옵션\u003c/div>\n          \u003cdiv class=\"control-group\">\n            \u003clabel class=\"control-label\">블러 방식\u003c/label>\n            \u003cdiv class=\"segmented\">\n              \u003clabel class=\"segmented-option\">\n                \u003cinput type=\"radio\" name=\"mode\" value=\"pixelate\" checked>\n                \u003cspan>모자이크\u003c/span>\n              \u003c/label>\n              \u003clabel class=\"segmented-option\">\n                \u003cinput type=\"radio\" name=\"mode\" value=\"blur\">\n                \u003cspan>가우시안 블러\u003c/span>\n              \u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"control-group\">\n            \u003clabel class=\"control-label\" for=\"padSel\">여백 배율\u003c/label>\n            \u003cselect id=\"padSel\" class=\"select\">\n              \u003coption value=\"0.15\">좁게\u003c/option>\n              \u003coption value=\"0.3\" selected>보통\u003c/option>\n              \u003coption value=\"0.5\">넓게\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cdiv class=\"control-group\">\n            \u003clabel class=\"control-label\" for=\"sensSel\">민감도\u003c/label>\n            \u003cselect id=\"sensSel\" class=\"select\">\n              \u003coption value=\"0.7\">낮음 — 확실한 얼굴만\u003c/option>\n              \u003coption value=\"0.5\" selected>보통\u003c/option>\n              \u003coption value=\"0.3\">높음 — 작은 얼굴도 검출\u003c/option>\n            \u003c/select>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003csection class=\"card section-gap\">\n        \u003cdiv class=\"card-title\">얼굴 인식 엔진\u003c/div>\n        \u003cdiv class=\"model-list\">\n          \u003cdiv class=\"model-row\" data-model=\"ssd\">\n            \u003cspan class=\"status-dot\" data-dot>\u003c/span>\n            \u003cspan class=\"model-order\">01\u003c/span>\n            \u003cspan class=\"model-name\">SSD Mobilenet v1\u003c/span>\n            \u003cspan class=\"model-state\" data-state>대기 중\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"model-row\" data-model=\"mediapipe\">\n            \u003cspan class=\"status-dot\" data-dot>\u003c/span>\n            \u003cspan class=\"model-order\">02\u003c/span>\n            \u003cspan class=\"model-name\">MediaPipe BlazeFace\u003c/span>\n            \u003cspan class=\"model-state\" data-state>대기 중\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"model-note\">두 모델을 순서대로 적용해 검출 결과를 합칩니다. SSD Mobilenet v1이 정면·일반 얼굴을 폭넓게 잡고, MediaPipe BlazeFace가 작은 얼굴·측면 얼굴 등 놓친 부분을 빠르게 보완합니다. 정확도 손실을 최소화하면서 로딩·처리 속도를 크게 개선했습니다. 처리는 여전히 이 브라우저 안에서만 이루어집니다.\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"card section-gap\">\n        \u003cbutton type=\"button\" class=\"run\" id=\"runBtn\" disabled>\n          \u003csvg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"none\">\u003cpath d=\"M8 5v14l11-7z\"/>\u003c/svg>\n          모델 로딩 중…\n        \u003c/button>\n        \u003cdiv class=\"progress-wrap\" id=\"progressBar\">\n          \u003cdiv class=\"progress-track\">\u003cdiv id=\"progressFill\" class=\"progress-fill\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"progress-meta\">\n            \u003cspan id=\"progressPercent\">0%\u003c/span>\n            \u003cspan id=\"progressCount\">\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"log\" class=\"log-panel\" style=\"display:none;\">\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card section-gap\" id=\"downloadPanel\" style=\"display:none;\">\n        \u003cdiv class=\"card-title\">처리 결과\u003c/div>\n        \u003cdiv id=\"downloadArea\">\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card section-gap\" id=\"reviewPanel\" style=\"display:none;\">\n        \u003cdiv class=\"card-title\">검출 결과 확인\u003c/div>\n        \u003cp class=\"review-hint\">\n          자동으로 검출된 얼굴에는 이미 블러가 적용되어 위에서 바로 다운로드할 수 있습니다. 놓친 얼굴이 있거나 잘못 잡힌 박스가 있다면 여기서 보정한 뒤 다시 생성하세요.\u003cbr>\n          박스를 클릭하면 삭제 · 빈 공간을 드래그하면 박스 추가\u003cbr>\n          자동 검출이 되지 않은 사진도 목록에 표시되며, 드래그로 직접 영역을 지정할 수 있습니다.\n        \u003c/p>\n        \u003cdiv id=\"reviewList\">\u003c/div>\n        \u003cbutton type=\"button\" class=\"run\" id=\"applyBtn\" style=\"margin-top:6px;\">보정 반영하여 다시 생성\u003c/button>\n      \u003c/section>\n\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst dropEl = document.getElementById('drop');\nconst fileInput = document.getElementById('fileInput');\nconst fileTag = document.getElementById('fileTag');\nconst fileTagName = document.getElementById('fileTagName');\nconst clearFileBtn = document.getElementById('clearFile');\nconst runBtn = document.getElementById('runBtn');\nconst applyBtn = document.getElementById('applyBtn');\nconst logEl = document.getElementById('log');\nconst progressBar = document.getElementById('progressBar');\nconst progressFill = document.getElementById('progressFill');\nconst reviewPanel = document.getElementById('reviewPanel');\nconst reviewList = document.getElementById('reviewList');\nconst downloadPanel = document.getElementById('downloadPanel');\nconst downloadArea = document.getElementById('downloadArea');\n\nlet currentFile = null;\nlet currentZip = null;\nlet modelsLoaded = { ssd:false, mediapipe:false };\nlet mediapipeDetector = null;\nlet mediapipeConfidence = null;\nlet images = []; // {name, origCanvas, boxes:[{x,y,w,h}], displayCanvas, scale}\n\nfunction log(msg, cls){\n  logEl.style.display = 'block';\n  const line = document.createElement('div');\n  if(cls) line.className = cls;\n  line.textContent = msg;\n  logEl.appendChild(line);\n  logEl.scrollTop = logEl.scrollHeight;\n}\n\nfunction boxIoU(a, b){\n  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);\n  const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);\n  const iw = Math.max(0, x2 - x1), ih = Math.max(0, y2 - y1);\n  const inter = iw * ih;\n  const union = a.w * a.h + b.w * b.h - inter;\n  return union > 0 ? inter / union : 0;\n}\n\n// 1차(SSD) 박스를 기준으로 2차(MediaPipe)가 새로 찾은 얼굴만 추가하고,\n// 서로 겹치는 얼굴은 더 정밀한 MediaPipe 좌표로 교체합니다.\nfunction mergeBoxes(ssdBoxes, mpBoxes, iouThresh = 0.3){\n  const merged = [];\n  const usedMp = new Set();\n  ssdBoxes.forEach(sb => {\n    let bestIdx = -1, bestIou = 0;\n    mpBoxes.forEach((mb, i) => {\n      if(usedMp.has(i)) return;\n      const iou = boxIoU(sb, mb);\n      if(iou > bestIou){ bestIou = iou; bestIdx = i; }\n    });\n    if(bestIdx >= 0 && bestIou > iouThresh){\n      merged.push(mpBoxes[bestIdx]);\n      usedMp.add(bestIdx);\n    } else {\n      merged.push(sb);\n    }\n  });\n  mpBoxes.forEach((mb, i) => { if(!usedMp.has(i)) merged.push(mb); });\n  return merged;\n}\n\nconst MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';\n\nconst MEDIAPIPE_VERSION = '0.10.20';\nconst MEDIAPIPE_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite';\n\nasync function ensureModelsLoaded(sensitivity){\n  if(!modelsLoaded.ssd){\n    log('1차 모델(SSD Mobilenet v1) 로딩 중… (용량이 커서 시간이 조금 걸립니다)');\n    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);\n    modelsLoaded.ssd = true;\n    log('1차 모델 로딩 완료.', 'ok');\n  }\n  if(!mediapipeDetector || mediapipeConfidence !== sensitivity){\n    log('2차 모델(MediaPipe BlazeFace) 로딩 중… (최초 1회, 용량이 있어 시간이 걸릴 수 있습니다)');\n    const visionModule = await import(\n      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}/vision_bundle.mjs`\n    );\n    const { FaceDetector, FilesetResolver } = visionModule;\n    const filesetResolver = await FilesetResolver.forVisionTasks(\n      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}/wasm`\n    );\n    const baseConfig = {\n      baseOptions: { modelAssetPath: MEDIAPIPE_MODEL_URL },\n      runningMode: 'IMAGE',\n      minDetectionConfidence: sensitivity\n    };\n    try{\n      mediapipeDetector = await FaceDetector.createFromOptions(filesetResolver, {\n        ...baseConfig,\n        baseOptions: { ...baseConfig.baseOptions, delegate: 'GPU' }\n      });\n    }catch(e){\n      log('  → GPU 가속 사용 불가, CPU로 재시도합니다.', 'warn');\n      mediapipeDetector = await FaceDetector.createFromOptions(filesetResolver, {\n        ...baseConfig,\n        baseOptions: { ...baseConfig.baseOptions, delegate: 'CPU' }\n      });\n    }\n    mediapipeConfidence = sensitivity;\n    modelsLoaded.mediapipe = true;\n    log('2차 모델 로딩 완료.', 'ok');\n  }\n}\n\nrunBtn.disabled = false;\nrunBtn.textContent = '얼굴 자동 인식 시작';\n\nfunction updateRunButton(){\n  if(currentFile){\n    runBtn.disabled = false;\n    runBtn.textContent = '얼굴 자동 인식 시작';\n  } else {\n    runBtn.disabled = true;\n    runBtn.textContent = '파일을 먼저 업로드하세요';\n  }\n}\n\n// ---- File selection ----\ndropEl.addEventListener('click', () => fileInput.click());\ndropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('hover'); });\ndropEl.addEventListener('dragleave', () => dropEl.classList.remove('hover'));\ndropEl.addEventListener('drop', e => {\n  e.preventDefault();\n  dropEl.classList.remove('hover');\n  if(e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);\n});\nfileInput.addEventListener('change', e => {\n  if(e.target.files.length) setFile(e.target.files[0]);\n});\nclearFileBtn.addEventListener('click', () => {\n  currentFile = null;\n  fileTag.style.display = 'none';\n  fileInput.value = '';\n  updateRunButton();\n});\n\nfunction setFile(f){\n  if(!f.name.toLowerCase().endsWith('.hwpx')){\n    log('.hwpx 파일만 지원합니다. (.hwp 구형 파일은 지원되지 않습니다)', 'err');\n    return;\n  }\n  currentFile = f;\n  fileTagName.textContent = f.name + '  (' + (f.size/1024).toFixed(1) + ' KB)';\n  fileTag.style.display = 'flex';\n  updateRunButton();\n}\n\n// ---- Phase 1: detect faces, build review UI ----\nrunBtn.addEventListener('click', async () => {\n  if(!currentFile) return;\n  runBtn.disabled = true;\n  reviewPanel.style.display = 'none';\n  downloadPanel.style.display = 'none';\n  reviewList.innerHTML = '';\n  logEl.innerHTML = '';\n  images = [];\n  progressBar.style.display = 'block';\n  progressFill.style.width = '0%';\n\n  const sensitivity = parseFloat(document.getElementById('sensSel').value);\n\n  try{\n    await ensureModelsLoaded(sensitivity);\n\n    log('HWPX 압축 해제 중…');\n    currentZip = await JSZip.loadAsync(currentFile);\n\n    const imgExt = /\\.(png|jpe?g|bmp|gif)$/i;\n    const imageEntries = Object.keys(currentZip.files).filter(name =>\n      /BinData\\//i.test(name) && imgExt.test(name) && !currentZip.files[name].dir\n    );\n\n    if(imageEntries.length === 0){\n      log('BinData 폴더 안에서 이미지 파일을 찾지 못했습니다.', 'warn');\n    } else {\n      log(`이미지 ${imageEntries.length}개 발견.`, 'ok');\n    }\n\n    const ssdOptions = new faceapi.SsdMobilenetv1Options({ minConfidence: sensitivity });\n\n    let totalFaces = 0;\n\n    for(let i = 0; i \u003c imageEntries.length; i++){\n      const name = imageEntries[i];\n      progressFill.style.width = Math.round(((i)/imageEntries.length)*100) + '%';\n      log(`[${i+1}/${imageEntries.length}] ${name.split('/').pop()} 분석 중…`);\n\n      const blob = await currentZip.files[name].async('blob');\n      const bitmap = await createImageBitmapSafe(blob);\n      if(!bitmap){\n        log('  → 이미지 디코딩 실패, 건너뜀', 'warn');\n        continue;\n      }\n\n      const origCanvas = document.createElement('canvas');\n      origCanvas.width = bitmap.width;\n      origCanvas.height = bitmap.height;\n      origCanvas.getContext('2d').drawImage(bitmap, 0, 0);\n\n      // 1차: 정확한 모델(SSD Mobilenet v1)\n      let ssdBoxes = [];\n      try{\n        const detections = await faceapi.detectAllFaces(origCanvas, ssdOptions);\n        ssdBoxes = detections.map(d => ({\n          x: Math.max(0, d.box.x), y: Math.max(0, d.box.y),\n          w: d.box.width, h: d.box.height\n        }));\n      }catch(e){\n        log('  → 1차(SSD) 인식 오류: ' + e.message, 'err');\n      }\n\n      // 2차: 초정밀 모델(MediaPipe) — 1차 결과와 합쳐 누락을 보완\n      let mpBoxes = [];\n      try{\n        const result = mediapipeDetector.detect(origCanvas);\n        mpBoxes = (result.detections || []).map(d => ({\n          x: Math.max(0, d.boundingBox.originX), y: Math.max(0, d.boundingBox.originY),\n          w: d.boundingBox.width, h: d.boundingBox.height\n        }));\n      }catch(e){\n        log('  → 2차(MediaPipe) 인식 오류: ' + e.message, 'err');\n      }\n\n      const boxes = mergeBoxes(ssdBoxes, mpBoxes);\n      totalFaces += boxes.length;\n      log(boxes.length > 0\n        ? `  → 얼굴 ${boxes.length}개 검출 (SSD ${ssdBoxes.length} + MediaPipe ${mpBoxes.length}, 중복 제거 병합)`\n        : '  → 얼굴 미검출');\n\n      images.push({ name, origCanvas, boxes });\n    }\n\n    progressFill.style.width = '100%';\n    log(`자동 인식 완료 (총 ${totalFaces}개). 블러를 적용해 결과를 생성합니다…`, 'ok');\n\n    buildReviewUI();\n\n    await applyAndDownload();\n    downloadPanel.scrollIntoView({ behavior:'smooth', block:'start' });\n\n  }catch(e){\n    console.error(e);\n    log('처리 중 오류 발생: ' + e.message, 'err');\n  } finally {\n    runBtn.disabled = false;\n    runBtn.textContent = '다시 인식하기';\n  }\n});\n\n// ---- Review UI: click box to delete, drag empty area to add ----\n// 모든 사진을 노출한다. 자동 검출이 0개여도 드래그로 직접 영역을 지정할 수 있다.\nfunction buildReviewUI(){\n  reviewList.innerHTML = '';\n\n  // 검출 개수와 무관하게 모든 사진을 노출한다. (미검출 사진에도 수동으로 영역을 추가할 수 있어야 함)\n  if(images.length === 0){\n    reviewPanel.style.display = 'none';\n    return;\n  }\n  reviewPanel.style.display = 'block';\n\n  images.forEach((img, idx) => {\n\n    const item = document.createElement('div');\n    item.className = 'reviewItem';\n\n    const fname = document.createElement('div');\n    fname.className = 'fname';\n    fname.innerHTML = `\u003cspan>${img.name.split('/').pop()}\u003c/span>\u003cspan class=\"cnt\" id=\"cnt-${idx}\">${img.boxes.length}개 검출됨\u003c/span>`;\n    item.appendChild(fname);\n\n    const displayW = Math.min(420, img.origCanvas.width);\n    const scale = displayW / img.origCanvas.width;\n    const displayH = Math.round(img.origCanvas.height * scale);\n\n    const canvas = document.createElement('canvas');\n    canvas.width = displayW;\n    canvas.height = displayH;\n    item.appendChild(canvas);\n    reviewList.appendChild(item);\n\n    img.displayCanvas = canvas;\n    img.scale = scale;\n    redrawReview(idx);\n    attachEditHandlers(idx);\n  });\n}\n\nfunction redrawReview(idx){\n  const img = images[idx];\n  const ctx = img.displayCanvas.getContext('2d');\n  ctx.clearRect(0,0,img.displayCanvas.width, img.displayCanvas.height);\n  ctx.drawImage(img.origCanvas, 0, 0, img.displayCanvas.width, img.displayCanvas.height);\n  ctx.lineWidth = 2;\n  ctx.strokeStyle = '#8c2f2f';\n  ctx.fillStyle = 'rgba(140,47,47,0.12)';\n  img.boxes.forEach(b => {\n    const x = b.x * img.scale, y = b.y * img.scale, w = b.w * img.scale, h = b.h * img.scale;\n    ctx.fillRect(x,y,w,h);\n    ctx.strokeRect(x,y,w,h);\n  });\n  const cnt = document.getElementById('cnt-'+idx);\n  if(cnt) cnt.textContent = img.boxes.length + '개 검출됨';\n}\n\nfunction attachEditHandlers(idx){\n  const img = images[idx];\n  const canvas = img.displayCanvas;\n  let dragStart = null;\n  let dragging = false;\n\n  function getPos(e){\n    const rect = canvas.getBoundingClientRect();\n    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;\n    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;\n    return { x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height) };\n  }\n\n  function hitBox(pos){\n    for(let i = img.boxes.length-1; i >= 0; i--){\n      const b = img.boxes[i];\n      const x = b.x*img.scale, y = b.y*img.scale, w = b.w*img.scale, h = b.h*img.scale;\n      if(pos.x >= x && pos.x \u003c= x+w && pos.y >= y && pos.y \u003c= y+h) return i;\n    }\n    return -1;\n  }\n\n  function down(e){\n    e.preventDefault();\n    dragStart = getPos(e);\n    dragging = false;\n  }\n  function move(e){\n    if(!dragStart) return;\n    const pos = getPos(e);\n    if(Math.abs(pos.x-dragStart.x) > 4 || Math.abs(pos.y-dragStart.y) > 4){\n      dragging = true;\n      redrawReview(idx);\n      const ctx = canvas.getContext('2d');\n      ctx.lineWidth = 2;\n      ctx.strokeStyle = '#2f4a3d';\n      ctx.setLineDash([5,3]);\n      ctx.strokeRect(\n        Math.min(dragStart.x,pos.x), Math.min(dragStart.y,pos.y),\n        Math.abs(pos.x-dragStart.x), Math.abs(pos.y-dragStart.y)\n      );\n      ctx.setLineDash([]);\n    }\n  }\n  function up(e){\n    if(!dragStart) return;\n    const pos = getPos(e);\n    if(dragging){\n      const x = Math.min(dragStart.x,pos.x)/img.scale;\n      const y = Math.min(dragStart.y,pos.y)/img.scale;\n      const w = Math.abs(pos.x-dragStart.x)/img.scale;\n      const h = Math.abs(pos.y-dragStart.y)/img.scale;\n      if(w > 6 && h > 6){\n        img.boxes.push({x,y,w,h});\n      }\n    } else {\n      const hitIdx = hitBox(dragStart);\n      if(hitIdx >= 0) img.boxes.splice(hitIdx, 1);\n    }\n    dragStart = null; dragging = false;\n    redrawReview(idx);\n  }\n\n  canvas.addEventListener('mousedown', down);\n  canvas.addEventListener('mousemove', move);\n  window.addEventListener('mouseup', up);\n  canvas.addEventListener('touchstart', down, {passive:false});\n  canvas.addEventListener('touchmove', move, {passive:false});\n  canvas.addEventListener('touchend', up);\n}\n\n// ---- Phase 2: apply blur to confirmed boxes, repackage hwpx ----\n// NOTE: this always works from a fresh copy of img.origCanvas (which is\n// never mutated), so it can be called again after the user removes/adds\n// boxes in the review panel without permanently baking in earlier blurs.\nasync function applyAndDownload(){\n  const mode = document.querySelector('input[name=\"mode\"]:checked').value;\n  const padRatio = parseFloat(document.getElementById('padSel').value);\n\n  let totalApplied = 0;\n  for(const img of images){\n    const canvas = document.createElement('canvas');\n    canvas.width = img.origCanvas.width;\n    canvas.height = img.origCanvas.height;\n    const ctx = canvas.getContext('2d');\n    ctx.drawImage(img.origCanvas, 0, 0);\n\n    img.boxes.forEach(b => {\n      const padX = b.w * padRatio;\n      const padY = b.h * padRatio;\n      const x = Math.max(0, b.x - padX);\n      const y = Math.max(0, b.y - padY);\n      const w = Math.min(canvas.width - x, b.w + padX*2);\n      const h = Math.min(canvas.height - y, b.h + padY*2);\n      if(mode === 'pixelate') pixelateRegion(ctx, x, y, w, h);\n      else blurRegion(ctx, x, y, w, h);\n      totalApplied++;\n    });\n\n    img.resultCanvas = canvas;\n\n    const outMime = /\\.png$/i.test(img.name) ? 'image/png' : 'image/jpeg';\n    const outBlob = await new Promise(res => canvas.toBlob(res, outMime, 0.92));\n    if(!outBlob){\n      throw new Error(`${img.name.split('/').pop()} 이미지를 저장 가능한 형식으로 변환하지 못했습니다.`);\n    }\n    const arrBuf = await outBlob.arrayBuffer();\n    currentZip.file(img.name, arrBuf, { binary: true });\n  }\n\n  log(`블러 처리 완료: 총 ${totalApplied}개 영역. HWPX 재압축 중…`, 'ok');\n\n  if(typeof JSZip === 'undefined' || !currentZip){\n    throw new Error('ZIP 라이브러리 또는 원본 파일 데이터가 준비되지 않았습니다. 새로고침 후 파일을 다시 업로드해 주세요.');\n  }\n\n  const outZipBlob = await currentZip.generateAsync({\n    type: 'blob',\n    mimeType: 'application/vnd.hancom.hwpx',\n    compression: 'DEFLATE',\n    compressionOptions: { level: 6 }\n  });\n\n  if(!outZipBlob || outZipBlob.size === 0){\n    throw new Error('HWPX 재압축 결과가 비어 있습니다.');\n  }\n\n  const outName = currentFile.name.replace(/\\.hwpx$/i, '') + '_blurred.hwpx';\n  log(`재압축 완료 (${(outZipBlob.size/1024).toFixed(1)} KB). 다운로드를 준비합니다…`, 'ok');\n\n  renderDownload(outZipBlob, outName);\n  downloadPanel.style.display = 'block';\n}\n\napplyBtn.addEventListener('click', async () => {\n  applyBtn.disabled = true;\n  applyBtn.textContent = '처리 중…';\n\n  try{\n    await applyAndDownload();\n    downloadPanel.scrollIntoView({ behavior:'smooth', block:'start' });\n    log('보정 반영 완료. 파일이 다시 생성되었습니다.', 'ok');\n  }catch(e){\n    console.error(e);\n    log('블러 적용 중 오류 발생: ' + (e && e.message ? e.message : e), 'err');\n    downloadArea.innerHTML = `\u003cp style=\"color:#8c2f2f; font-family:var(--mono); font-size:12px;\">오류로 다운로드 파일을 만들지 못했습니다: ${(e && e.message) ? e.message : e}\u003c/p>`;\n    downloadPanel.style.display = 'block';\n  } finally {\n    applyBtn.disabled = false;\n    applyBtn.textContent = '보정 반영하여 다시 생성';\n  }\n});\n\n// ---- Show an expanded result preview + an explicit download button.\n// Nothing downloads automatically: the user reviews the blurred result\n// first, and only clicking the button saves the file. (A \"새 탭에서 열기\"\n// fallback is kept since some embedded/preview iframes sandbox blob\n// downloads — opening in a new tab, outside that sandbox, still lets the\n// browser save the file normally.)\nfunction renderDownload(blob, outName){\n  const url = URL.createObjectURL(blob);\n\n  const previewItems = images.map(img => {\n    const isPng = /\\.png$/i.test(img.name);\n    const srcCanvas = img.resultCanvas || img.origCanvas;\n    const dataUrl = srcCanvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.9);\n    return `\n      \u003cdiv style=\"margin-bottom:14px;\">\n        \u003cimg src=\"${dataUrl}\" style=\"max-width:100%; display:block; border:1px solid #ccc;\">\n        \u003cp style=\"font-family:var(--mono); font-size:10.5px; color:#999; margin:4px 0 0;\">${img.name.split('/').pop()}\u003c/p>\n      \u003c/div>`;\n  }).join('');\n\n  downloadArea.innerHTML = `\n    \u003cdiv id=\"resultPreview\">\n      \u003cp style=\"font-family:var(--mono); font-size:11.5px; color:#777; margin:-2px 0 12px;\">\n        미리보기 — 자동 검출된 얼굴에 블러를 적용한 결과입니다. 놓친 얼굴이 있다면 아래 [검출 결과 확인]에서 박스를 삭제/추가한 뒤 [보정 반영하여 다시 생성]을 눌러 주세요.\n        \u003cbutton type=\"button\" id=\"goReviewBtn\" style=\"margin-left:8px;background:none;border:1px solid #999;color:#444;padding:3px 8px;font-size:11px;cursor:pointer;border-radius:6px;\">영역 직접 수정하러 가기 ↓\u003c/button>\n      \u003c/p>\n      ${previewItems}\n    \u003c/div>\n    \u003ca id=\"hwpxDownloadLink\" href=\"${url}\" download=\"${outName}\" style=\"display:none;\">\u003c/a>\n    \u003cbutton type=\"button\" class=\"run\" id=\"hwpxDownloadBtn\">완성된 HWPX 다운로드\u003c/button>\n    \u003cp>${outName} · ${(blob.size/1024).toFixed(1)} KB · 이미지 외 원본 서식·글꼴은 변경되지 않았습니다\u003c/p>\n    \u003cp>\n      \u003cbutton type=\"button\" id=\"openNewTabBtn\" style=\"background:none;border:1px solid #999;color:#444;padding:6px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;\">\n        다운로드가 안 되면 → 새 탭에서 열어 저장하기\n      \u003c/button>\n    \u003c/p>\n    \u003cp style=\"font-family:var(--mono); font-size:10.5px; color:#999;\">\n      ※ 이 페이지가 채팅창 미리보기(샌드박스) 안에서 열려 있다면 다운로드가 막힐 수 있습니다.\n      이 HTML 파일을 저장한 뒤 브라우저(Chrome 등)에서 직접 열어 실행하면 정상적으로 저장됩니다.\n    \u003c/p>\n  `;\n\n  const linkEl = document.getElementById('hwpxDownloadLink');\n  const downloadBtn = document.getElementById('hwpxDownloadBtn');\n  const newTabBtn = document.getElementById('openNewTabBtn');\n\n  downloadBtn.addEventListener('click', () => {\n    linkEl.click();\n  });\n\n  const goReviewBtn = document.getElementById('goReviewBtn');\n  if(goReviewBtn){\n    goReviewBtn.addEventListener('click', () => {\n      reviewPanel.scrollIntoView({ behavior:'smooth', block:'start' });\n    });\n  }\n\n  newTabBtn.addEventListener('click', () => {\n    window.open(url, '_blank');\n  });\n}\n\nasync function createImageBitmapSafe(blob){\n  try{\n    return await createImageBitmap(blob);\n  }catch(e){\n    return null;\n  }\n}\n\nfunction pixelateRegion(ctx, x, y, w, h){\n  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);\n  if(w \u003c= 0 || h \u003c= 0) return;\n  const blockSize = Math.max(4, Math.round(Math.min(w,h) / 10));\n  const imgData = ctx.getImageData(x, y, w, h);\n  const data = imgData.data;\n  for(let by = 0; by \u003c h; by += blockSize){\n    for(let bx = 0; bx \u003c w; bx += blockSize){\n      let r=0,g=0,b=0,a=0,count=0;\n      for(let dy=0; dy\u003cblockSize && by+dy\u003ch; dy++){\n        for(let dx=0; dx\u003cblockSize && bx+dx\u003cw; dx++){\n          const idx = ((by+dy)*w + (bx+dx)) * 4;\n          r += data[idx]; g += data[idx+1]; b += data[idx+2]; a += data[idx+3];\n          count++;\n        }\n      }\n      r = r/count; g = g/count; b = b/count; a = a/count;\n      for(let dy=0; dy\u003cblockSize && by+dy\u003ch; dy++){\n        for(let dx=0; dx\u003cblockSize && bx+dx\u003cw; dx++){\n          const idx = ((by+dy)*w + (bx+dx)) * 4;\n          data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = a;\n        }\n      }\n    }\n  }\n  ctx.putImageData(imgData, x, y);\n}\n\nfunction blurRegion(ctx, x, y, w, h){\n  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);\n  if(w \u003c= 0 || h \u003c= 0) return;\n  const canvas = ctx.canvas;\n  const blurPx = Math.max(8, Math.round(Math.min(w,h)/5));\n\n  // Sample a padded (\"bleed\") region around the box so the blur filter\n  // isn't starved of pixels at the crop edge (avoids dark/soft edge halos).\n  const bleed = blurPx * 2;\n  const sx = Math.max(0, x - bleed);\n  const sy = Math.max(0, y - bleed);\n  const ex = Math.min(canvas.width, x + w + bleed);\n  const ey = Math.min(canvas.height, y + h + bleed);\n  const sw = ex - sx, sh = ey - sy;\n\n  const temp = document.createElement('canvas');\n  temp.width = sw; temp.height = sh;\n  const tctx = temp.getContext('2d');\n  tctx.filter = 'blur(' + blurPx + 'px)';\n  tctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);\n\n  // Crop the blurred patch back down to the box size.\n  const patch = document.createElement('canvas');\n  patch.width = w; patch.height = h;\n  const pctx = patch.getContext('2d');\n  pctx.drawImage(temp, x - sx, y - sy, w, h, 0, 0, w, h);\n\n  // Feather the patch into a soft ellipse (opaque center, fading to\n  // transparent near the edges) so it blends into the surrounding skin/\n  // hair instead of leaving a hard rectangle.\n  pctx.globalCompositeOperation = 'destination-in';\n  pctx.save();\n  const cx = w / 2, cy = h / 2, rx = w / 2, ry = h / 2;\n  pctx.translate(cx, cy);\n  pctx.scale(rx, ry);\n  const grad = pctx.createRadialGradient(0, 0, 0, 0, 0, 1);\n  grad.addColorStop(0, 'rgba(0,0,0,1)');\n  grad.addColorStop(0.62, 'rgba(0,0,0,1)');\n  grad.addColorStop(1, 'rgba(0,0,0,0)');\n  pctx.fillStyle = grad;\n  pctx.fillRect(-1, -1, 2, 2);\n  pctx.restore();\n  pctx.globalCompositeOperation = 'source-over';\n\n  // Draw over the (untouched) original — the feathered alpha does the blending.\n  ctx.drawImage(patch, x, y);\n}\n\u003c/script>\n\u003cscript>\n// ---------------------------------------------------------------------\n// UI polish layer only. Purely additive: reads DOM/log state produced by\n// the original processing logic above and reflects it visually. Never\n// calls into or alters the detection / HWPX pipeline.\n// ---------------------------------------------------------------------\n(function(){\n  var guideBtn = document.getElementById('guideBtn');\n  var guidePanel = document.getElementById('guidePanel');\n  if(guideBtn && guidePanel){\n    guideBtn.addEventListener('click', function(){\n      guidePanel.classList.toggle('open');\n    });\n  }\n\n  // Sidebar nav is a single-page tool; clicking just gives visual feedback.\n  document.querySelectorAll('.nav-item').forEach(function(item){\n    item.addEventListener('click', function(){\n      document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });\n      item.classList.add('active');\n      if(item.getAttribute('data-nav') === 'guide' && guidePanel){\n        guidePanel.classList.add('open');\n      }\n    });\n  });\n\n  var modelRows = {\n    ssd: document.querySelector('.model-row[data-model=\"ssd\"]'),\n    mediapipe: document.querySelector('.model-row[data-model=\"mediapipe\"]')\n  };\n  var sidebarDot = document.getElementById('modelStatusDot');\n  var sidebarText = document.getElementById('modelStatusText');\n\n  function setModel(key, state, label){\n    var row = modelRows[key];\n    if(!row) return;\n    var dot = row.querySelector('[data-dot]');\n    var st = row.querySelector('[data-state]');\n    dot.className = 'status-dot' + (state ? ' ' + state : '');\n    st.className = 'model-state' + (state ? ' ' + state : '');\n    st.textContent = label;\n  }\n\n  function resetModels(){\n    Object.keys(modelRows).forEach(function(key){ setModel(key, '', '대기 중'); });\n    if(sidebarDot) sidebarDot.className = 'status-dot active';\n    if(sidebarText) sidebarText.textContent = '모델 로딩 중…';\n  }\n\n  var progressPercent = document.getElementById('progressPercent');\n  var progressCount = document.getElementById('progressCount');\n  var progressFillEl = document.getElementById('progressFill');\n\n  if(progressFillEl && window.MutationObserver){\n    var pObs = new MutationObserver(function(){\n      var w = progressFillEl.style.width || '0%';\n      if(progressPercent) progressPercent.textContent = w;\n    });\n    pObs.observe(progressFillEl, { attributes:true, attributeFilter:['style'] });\n  }\n\n  var logEl = document.getElementById('log');\n  if(logEl && window.MutationObserver){\n    var lObs = new MutationObserver(function(mutations){\n      mutations.forEach(function(m){\n        m.addedNodes.forEach(function(node){\n          var text = node.textContent || '';\n\n          if(/1차 모델\\(SSD Mobilenet v1\\) 로딩 중/.test(text)) setModel('ssd','active','로딩 중');\n          else if(/^1차 모델 로딩 완료/.test(text)) setModel('ssd','done','준비 완료');\n          else if(/2차 모델\\(MediaPipe BlazeFace\\) 로딩 중/.test(text)) setModel('mediapipe','active','로딩 중');\n          else if(/^2차 모델 로딩 완료/.test(text)) setModel('mediapipe','done','준비 완료');\n\n          if(/^자동 인식 완료/.test(text)){\n            if(sidebarDot) sidebarDot.className = 'status-dot done';\n            if(sidebarText) sidebarText.textContent = '모델 로드 완료 · 정상 작동 중';\n          }\n          if(/처리 중 오류 발생/.test(text)){\n            if(sidebarDot) sidebarDot.className = 'status-dot error';\n            if(sidebarText) sidebarText.textContent = '오류가 발생했습니다';\n          }\n\n          var progMatch = /^\\[(\\d+)\\/(\\d+)\\]/.exec(text);\n          if(progMatch && progressCount){\n            progressCount.textContent = progMatch[2] + '개 이미지 중 ' + progMatch[1] + '개 처리';\n          }\n        });\n      });\n    });\n    lObs.observe(logEl, { childList:true });\n  }\n\n  var runBtn = document.getElementById('runBtn');\n  if(runBtn){\n    runBtn.addEventListener('click', function(){\n      if(!document.getElementById('fileTagName') || !document.getElementById('fileTagName').textContent) return;\n      resetModels();\n      if(progressPercent) progressPercent.textContent = '0%';\n      if(progressCount) progressCount.textContent = '';\n    });\n  }\n})();\n\u003c/script>\n\n\n\u003cscript>\n/* 도구 페이지 ↔ 셸 연결 (빌드 때 각 도구 안에 끼워 넣습니다)\n   · 내용 높이를 셸에 알려 iframe 높이를 맞춘다\n   · 셸의 다크 모드 / 보고 있는 화면 영역(모달 위치)을 받아 적용한다\n   · 셸 '설정'에서 저장한 API 키를 도구가 읽을 수 있게 한다  → window.suiteKey('kakao') */\n(function(){\n  var TOOL = (document.querySelector('meta[name=\"tool-id\"]') || {}).content || '';\n  var root = document.documentElement;\n  document.body.classList.add('tool');\n\n  function applyTheme(dark){ root.classList.toggle('dark', !!dark); }\n  function applyViewport(v){\n    if(!v) return;\n    root.style.setProperty('--vp-top', Math.max(0, v.top) + 'px');\n    root.style.setProperty('--vp-h', Math.max(200, v.height) + 'px');\n  }\n  try{ applyTheme(window.parent.document.documentElement.classList.contains('dark')); }catch(e){}\n\n  window.addEventListener('message', function(e){\n    var d = e.data;\n    if(!d) return;\n    if('__theme' in d) applyTheme(d.__theme === 'dark');\n    if(d.__viewport) applyViewport(d.__viewport);\n  });\n\n  /* ---- 높이 알림 ---- */\n  var last = -1, raf = 0;\n  function post(){\n    raf = 0;\n    var b = document.body;\n    var h = Math.ceil(b.getBoundingClientRect().height + parseFloat(getComputedStyle(b).marginTop || 0) + parseFloat(getComputedStyle(b).marginBottom || 0));\n    if(h === last) return;\n    last = h;\n    try{ window.parent.postMessage({__tabHeight:h, __tabId:TOOL}, '*'); }catch(e){}\n  }\n  function schedule(){ if(!raf) raf = requestAnimationFrame(post); }\n  window.addEventListener('load', function(){ schedule(); try{ window.parent.postMessage({__ready:true, __tabId:TOOL}, '*'); }catch(e){} });\n  window.addEventListener('resize', schedule);\n  if(window.ResizeObserver) new ResizeObserver(schedule).observe(document.body);\n  if(window.MutationObserver) new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true, attributes:true, characterData:true});\n\n  /* ---- 공용 설정(API 키) ---- */\n  window.suiteKey = function(name){\n    try{\n      var o = JSON.parse(localStorage.getItem('suite.keys') || '{}');\n      return (o && o[name]) || '';\n    }catch(e){ return ''; }\n  };\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

  ];
  var GROUPS = ['여비','정산','문서'];
  var RELEASE_URL = 'https://github.com/kuh01041461581-ux/ukukuk/releases/latest';

  var $ = function(s, r){ return (r||document).querySelector(s); };
  function icon(id, cls){ return '<svg class="ic '+(cls||'')+'"><use href="#i-'+id+'"/></svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function byId(id){ for(var i=0;i<TOOLS.length;i++) if(TOOLS[i].id===id) return TOOLS[i]; return null; }
  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return null; }

  $('#verText').textContent = VERSION;

  /* ---------- 사이드바 ---------- */
  var nav = $('#nav'), html = '';
  html += '<a class="nav-btn" data-go="home" href="#home">'+icon('home')+'홈</a>';
  GROUPS.forEach(function(g){
    html += '<div class="nav-label">'+g+'</div>';
    TOOLS.filter(function(t){ return t.group===g; }).forEach(function(t){
      html += '<a class="nav-btn" data-go="'+t.id+'" href="#'+t.id+'">'+icon(t.icon)+esc(t.label)+'</a>';
    });
  });
  html += '<div class="nav-label">기타</div>';
  html += '<a class="nav-btn" data-go="settings" href="#settings">'+icon('gear')+'설정</a>';
  nav.innerHTML = html;

  /* ---------- 홈 ---------- */
  function cardHtml(t){
    return '<a class="tool-card" href="#'+t.id+'"><div class="ico">'+icon(t.icon,'lg')+'</div>'+
      '<h3>'+esc(t.title)+'</h3><p>'+esc(t.desc)+'</p>'+
      '<div class="tags">'+t.tags.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('')+'</div>'+
      '<div class="go">열기 '+icon('arrow','sm')+'</div></a>';
  }
  var home = '<div class="page-head"><div class="eyebrow">GENERAL AFFAIRS SUITE</div><h1>서무 업무 자동화</h1>'+
    '<p>자주 하는 서무 업무를 한 곳에 모았습니다. 왼쪽 메뉴나 아래 카드에서 업무를 골라 파일을 올리면 됩니다.</p></div>';
  GROUPS.forEach(function(g){
    home += '<div class="home-group">'+g+'</div><div class="home-grid">'+
      TOOLS.filter(function(t){ return t.group===g; }).map(cardHtml).join('')+'</div>';
  });
  home += '<div class="home-group">데스크톱 프로그램</div><div class="home-grid">'+
    '<a class="tool-card ext" href="'+RELEASE_URL+'" target="_blank" rel="noopener"><div class="ico">'+icon('calendar','lg')+'</div>'+
    '<h3>DeskCalendar (바탕화면 달력)</h3>'+
    '<p>바탕화면에 떠 있는 달력 + 할 일 · 메모. 공문 PDF에서 일정을 뽑아 넣을 수 있습니다. Windows 프로그램이라 이 화면 안에는 넣지 못하고 별도로 설치해 씁니다.</p>'+
    '<div class="tags"><span>Windows</span><span>Android</span></div>'+
    '<div class="go">내려받기 '+icon('ext','sm')+'</div></a></div>';
  home += '<div class="privacy">'+icon('shield')+'<div><b>개인정보는 밖으로 나가지 않습니다.</b> 엑셀·HWPX·고지서 처리는 모두 이 브라우저 안에서 이뤄집니다. '+
    '단, 공과금 고지서 인식은 사용자가 입력한 AI 키로 이미지를 Google(Gemini) 또는 Anthropic(Claude)에 보내 글자를 읽는 기능이므로, 개인정보가 많은 문서에는 주의하세요.</div></div>';
  $('#page-home').innerHTML = home;

  /* ---------- 설정 ---------- */
  var KEYS = [
    {k:'kakao',  label:'카카오 REST API 키', sub:'관외출장 · 주소검색/거리계산'},
    {k:'opinet', label:'오피넷 인증키',      sub:'관외출장 · 전국 평균 유가 조회'},
    {k:'gemini', label:'Gemini API 키',      sub:'공과금 고지서 · 기본 AI'},
    {k:'claude', label:'Claude API 키',      sub:'공과금 고지서 · 선택 AI'}
  ];
  var s = '<div class="page-head"><div class="eyebrow">설정</div><h1>API 키 관리</h1>'+
    '<p>도구들이 함께 쓰는 키를 한 곳에서 관리합니다. 비워 두면 해당 기능은 키 없이 가능한 범위(추정 거리 등)로만 동작합니다.</p></div>'+
    '<div class="card settings-card"><h2>이 컴퓨터(브라우저)에 저장</h2>'+
    '<p class="desc">입력한 키는 이 브라우저의 저장소에만 보관되고, 각 도구가 필요할 때 자동으로 가져다 씁니다. 파일이나 서버에는 기록되지 않습니다.</p>';
  KEYS.forEach(function(x){
    s += '<div class="key-row"><label for="key-'+x.k+'">'+x.label+'<small>'+x.sub+'</small></label>'+
      '<input type="password" id="key-'+x.k+'" autocomplete="off" placeholder="입력하지 않으면 사용 안 함"></div>';
  });
  s += '<div class="key-actions"><button class="btn" id="keySave">저장</button><button class="btn ghost" id="keyClear">모두 지우기</button><span class="saved-note" id="keyNote">저장했습니다</span></div>'+
    '<div class="warn-box">공용 PC나 다른 사람이 쓰는 계정에서는 키를 저장하지 마세요. 저장된 키는 이 브라우저를 쓰는 누구나 볼 수 있습니다. 필요하면 사용 후 &lsquo;모두 지우기&rsquo;를 누르세요.</div></div>';
  $('#page-settings').innerHTML = s;

  function loadKeys(){ try{ return JSON.parse(store('suite.keys') || '{}') || {}; }catch(e){ return {}; } }
  function fillKeys(){ var o = loadKeys(); KEYS.forEach(function(x){ $('#key-'+x.k).value = o[x.k] || ''; }); }
  function flash(msg){ var n = $('#keyNote'); n.textContent = msg; n.classList.add('show'); setTimeout(function(){ n.classList.remove('show'); }, 1800); }
  $('#keySave').addEventListener('click', function(){
    var o = {}; KEYS.forEach(function(x){ var v = $('#key-'+x.k).value.trim(); if(v) o[x.k] = v; });
    store('suite.keys', JSON.stringify(o)); flash('저장했습니다');
  });
  $('#keyClear').addEventListener('click', function(){
    if(!confirm('저장된 API 키를 모두 지울까요?')) return;
    store('suite.keys', null); fillKeys(); flash('지웠습니다');
  });
  fillKeys();

  /* ---------- 도구 iframe (처음 열 때 한 번만 불러오고 이후엔 상태 유지) ---------- */
  var frames = {};
  function ensureFrame(t){
    if(frames[t.id]) return frames[t.id];
    var page = document.createElement('section');
    page.className = 'page'; page.id = 'page-'+t.id;
    page.innerHTML = '<div class="page-head"><div class="eyebrow">'+esc(t.group)+'</div><h1>'+esc(t.title)+'</h1><p>'+esc(t.desc)+'</p></div>'+
      '<div class="frame-loading"><span class="spin"></span>불러오는 중…</div>';
    var f = document.createElement('iframe');
    f.className = 'tool-frame'; f.title = t.title;
    page.appendChild(f);
    $('#content').appendChild(page);
    var data = document.getElementById('tool-data-'+t.id);
    f.srcdoc = JSON.parse(data.textContent);
    frames[t.id] = {page:page, frame:f};
    return frames[t.id];
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || !d.__tabId) return;
    var rec = frames[d.__tabId];
    if(!rec || e.source !== rec.frame.contentWindow) return;
    if(d.__tabHeight){
      rec.frame.style.height = Math.max(320, d.__tabHeight + 8) + 'px';
      var ld = rec.page.querySelector('.frame-loading'); if(ld) ld.remove();
      sendViewport();
    }
    if(d.__ready) pushState(rec.frame);
  });

  /* 셸 → 도구: 다크 모드, 보고 있는 화면 영역 */
  function pushState(f){
    try{
      f.contentWindow.postMessage({__theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light'}, '*');
    }catch(e){}
    sendViewport(f);
  }
  var vpQueued = false;
  function sendViewport(only){
    if(vpQueued && !only) return;
    vpQueued = true;
    requestAnimationFrame(function(){
      vpQueued = false;
      var list = only ? [only] : Object.keys(frames).map(function(k){ return frames[k].frame; });
      list.forEach(function(f){
        if(f.offsetParent === null) return;
        var r = f.getBoundingClientRect();
        var top = Math.max(0, -r.top);
        var bottom = Math.min(r.bottom, window.innerHeight);
        var topVis = Math.max(r.top, 0);
        var h = Math.max(200, bottom - topVis);
        try{ f.contentWindow.postMessage({__viewport:{top:top, height:h}}, '*'); }catch(e){}
      });
    });
  }
  window.addEventListener('scroll', function(){ sendViewport(); }, {passive:true});
  window.addEventListener('resize', function(){ sendViewport(); });

  /* ---------- 다크 모드 ---------- */
  function paintThemeBtn(){
    var dark = document.documentElement.classList.contains('dark');
    $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon');
    $('#themeBtn').title = dark ? '라이트 모드' : '다크 모드';
  }
  $('#themeBtn').addEventListener('click', function(){
    var dark = document.documentElement.classList.toggle('dark');
    store('suite.theme', dark ? 'dark' : 'light');
    paintThemeBtn();
    Object.keys(frames).forEach(function(k){ pushState(frames[k].frame); });
  });
  paintThemeBtn();

  /* ---------- 화면 전환 ---------- */
  var current = null;
  function show(id){
    var t = byId(id);
    if(!t && id !== 'settings') id = 'home';
    if(id === current) return;
    current = id;
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-go') === id); });
    var group = '홈', title = '서무 업무 자동화';
    if(t){ ensureFrame(t).page.classList.add('active'); group = t.group; title = t.title; }
    else if(id === 'settings'){ $('#page-settings').classList.add('active'); group = '기타'; title = '설정'; }
    else { $('#page-home').classList.add('active'); }
    $('#crumbGroup').textContent = group; $('#crumbTitle').textContent = title;
    document.title = (id === 'home' ? '' : title + ' · ') + '서무 업무 자동화';
    document.body.classList.remove('nav-open');
    window.scrollTo(0, 0);
    sendViewport();
  }
  function route(){ show((location.hash || '#home').slice(1)); }
  window.addEventListener('hashchange', route);
  route();

  /* ---------- 모바일 메뉴 ---------- */
  $('#menuBtn').addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
  $('#scrim').addEventListener('click', function(){ document.body.classList.remove('nav-open'); });
})();
</script>
</body>
</html>
