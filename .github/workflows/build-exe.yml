name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    paths: ["*.py", requirements.txt, assets/**, tests/**, .github/workflows/build-exe.yml]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test (업무·공문·한글 파일 규칙을 윈도우에서 확인)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_fixtures.py
          python tests/test_work.py
      - name: Build exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pdfminer --hidden-import gongmun --hidden-import core --hidden-import holidays_kr --hidden-import cloudsync --hidden-import glass --hidden-import holidays_api --hidden-import PIL._tkinter_finder --hidden-import analyze --hidden-import quickadd --hidden-import ocr --hidden-import work --hidden-import hwpdoc --hidden-import olefile --hidden-import PIL.ImageGrab --hidden-import pystray --hidden-import pystray._win32 --collect-all korean_lunar_calendar --collect-all segno --name DeskCalendar --icon assets/app.ico desk_calendar.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeskCalendar-windows
          path: dist/DeskCalendar.exe
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest-build' }}
          name: ${{ github.event_name == 'release' && github.event.release.name || 'DeskCalendar 최신 빌드' }}
          prerelease: ${{ github.event_name != 'release' }}
          target_commitish: ${{ github.sha }}
          files: dist/DeskCalendar.exe
