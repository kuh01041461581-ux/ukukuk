name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    paths: [desk_calendar.py, gongmun.py, core.py, holidays_kr.py, cloudsync.py, glass.py, holidays_api.py, requirements.txt, assets/**, .github/workflows/build-exe.yml]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pdfminer --hidden-import gongmun --hidden-import core --hidden-import holidays_kr --hidden-import cloudsync --hidden-import glass --hidden-import holidays_api --hidden-import PIL._tkinter_finder --collect-all korean_lunar_calendar --collect-all segno --name DeskCalendar --icon assets/app.ico desk_calendar.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeskCalendar-windows
          path: dist/DeskCalendar.exe
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest-build' }}
          name: ${{ github.event_name == 'release' && github.event.release.name || 'DeskCalendar 최신 빌드' }}
          prerelease: ${{ github.event_name != 'release' }}
          target_commitish: ${{ github.sha }}
          files: dist/DeskCalendar.exe
