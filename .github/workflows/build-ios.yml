name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main, "claude/**"]
    paths: [mobile/**, .github/workflows/build-ios.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Prepare
        working-directory: mobile
        run: |
          bash tools/fetch_font.sh
          flutter pub get
          flutter build ios --config-only --release --no-codesign || true
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          grep -n "platform :ios" ios/Podfile
      - name: Build (unsigned)
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R mobile/build/ios/iphoneos/Runner.app Payload/
          zip -qr DeskCalendar.ipa Payload
          ls -la DeskCalendar.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DeskCalendar-ios
          path: DeskCalendar.ipa
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ios
          name: DeskCalendar 아이폰 최신 빌드 (IPA, 서명 전)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: DeskCalendar.ipa
