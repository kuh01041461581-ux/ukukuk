<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0067c0">
<title>출석 체크</title>
<meta property="og:title" content="출석 체크"><meta property="og:description" content="링크를 눌러 출석해 주세요">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/pretendard/pretendardvariable-dynamic-subset.css"></head><body>
<div class="app">
  <header><div class="top"><span class="seal">출</span><span class="brand">국가무형유산 교육 출석</span></div><h1 id="title">출석 체크</h1><dl class="info" id="meta"></dl></header>
  <main id="body"><div class="status"><span class="spin"></span><div>불러오는 중…</div></div></main>
</div>
<div class="bar" id="bar" hidden></div>
<script>
const $=id=>document.getElementById(id);
const token=location.pathname.split('/').pop();
let dev=null;try{dev=localStorage.getItem('dev');if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()+Math.random());localStorage.setItem('dev',dev)}}catch{}
let S=null,gid=null,sel=null,PH='',errBox=null,busy=false,autoTried=false;
let LOC=null,locState='idle'; // idle | asking | ok | denied | error
const IC={pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/>'};
const ico=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),DAYS='일월화수목금토';
const HELP=`<details class="help" open><summary>위치 권한 켜는 방법</summary><ol>
  <li><b>카카오톡 앱</b>의 위치 권한을 켭니다<br>안드로이드: 설정 → 앱 → 카카오톡 → 권한 → 위치 → 허용<br>아이폰: 설정 → 카카오톡 → 위치 → 앱을 사용하는 동안</li>
  <li>허용 창이 나오면 <b>[허용]</b>을 누릅니다</li><li>아래 <b>[위치 다시 확인]</b>을 누릅니다</li></ol></details>`;
const locHtml=()=>{
  if(!S.venue)return '';
  if(locState==='ok')return `<div class="status ok">${ico('pin')}<div><b>위치 확인됨</b><span class="mut">${esc(S.venue.name||'교육장')} 안에서 출석할 수 있습니다</span></div></div>`;
  if(locState==='asking')return `<div class="status"><span class="spin"></span><div><b>위치를 확인하고 있어요</b><span class="mut">허용 창이 보이면 [허용]을 눌러 주세요</span></div></div>`;
  if(locState==='denied')return `<div class="status bad">${ico('alert')}<div><b>위치 권한이 필요합니다</b></div></div>${HELP}<button class="btn ghost" id="retry">위치 다시 확인</button>`;
  if(locState==='error')return `<div class="status bad">${ico('alert')}<div><b>위치를 가져오지 못했어요</b><span class="mut">실외나 창가에서 다시 시도해 주세요</span></div></div><button class="btn ghost" id="retry">위치 다시 확인</button>`;
  return ''};
const errHtml=()=>errBox?`<div class="alert">${ico('alert')}<div>${esc(errBox.t)}${errBox.canRequest?'<button class="btn ghost" id="req" style="margin-top:12px">담당자에게 기기 변경 요청</button>':''}</div></div>`:'';
function askLocation(){
  if(!S||!S.venue)return;
  if(!navigator.geolocation){locState='denied';render();return}
  locState='asking';render();
  navigator.geolocation.getCurrentPosition(x=>{LOC={lat:x.coords.latitude,lng:x.coords.longitude,accuracy:x.coords.accuracy,t:Date.now()};locState='ok';render();
      if(S.me&&!S.me.done&&!S.useCode&&!autoTried){autoTried=true;go()}},   // 등록된 휴대폰은 위치가 확인되면 바로 출석
    e=>{locState=e&&e.code===1?'denied':'error';render()},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function load(){
  const r=await fetch('/api/s/'+token+'?deviceId='+encodeURIComponent(dev||''));S=await r.json();
  if(!r.ok){$('body').innerHTML=`<div class="alert">${ico('alert')}<div>${esc(S.error)}</div></div>`;return}
  if(S.notToday){
    const nx=S.next?(()=>{const d=new Date(S.next+'T00:00:00Z');return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${DAYS[d.getUTCDay()]}) ${S.lecture.start}`})():null;
    $('title').textContent=S.lecture.name;
    $('body').innerHTML=`<div class="card"><div style="font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.03em">오늘은 이 강의가<br>없는 날입니다</div>${nx?`<div class="mut" style="margin-top:18px">다음 강의</div><div style="font-size:24px;font-weight:800">${nx}</div>`:''}<div class="mut" style="margin-top:14px">강의 날에 이 링크를 다시 눌러 주세요.</div></div>`;return}
  if(S.deviceId){dev=S.deviceId;try{localStorage.setItem('dev',dev)}catch{}}
  $('title').textContent=S.lecture.name;
  const d=new Date(S.date+'T00:00:00Z');
  $('meta').innerHTML=`<div><dt>일시</dt><dd>${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${DAYS[d.getUTCDay()]}) · ${S.lecture.start} ~ ${S.lecture.end}</dd></div>${S.venue&&S.venue.name?`<div><dt>장소</dt><dd>${esc(S.venue.name)}</dd></div>`:''}`;
  if(!S.open){$('body').innerHTML=`<div class="alert">${ico('alert')}<div>출석이 마감되었습니다.</div></div>`;return}
  if(!S.venue&&!S.useCode){$('body').innerHTML=`<div class="alert">${ico('alert')}<div>교육 장소가 아직 설정되지 않아 출석할 수 없습니다. 담당자에게 문의하세요.</div></div>`;return}
  render();askLocation()}
function codeCard(){return S.useCode?`<div class="card"><label class="lbl" for="code">현장 코드 <span class="mut">(교육장에서 안내)</span></label><input class="input code" id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"></div>`:''}
function setBar(html){const b=$('bar');b.innerHTML=html?`<div class="bar-in">${html}</div>`:'';b.hidden=!html}
function render(){
  if(S.me){ // ── 등록된 휴대폰: 이름 선택 없이 바로 출석 ──
    $('body').innerHTML=`<div class="card"><div class="me"><div class="avatar">${esc(S.me.name.slice(0,1))}</div><div><b>${esc(S.me.name)}</b><span>${esc(S.me.group||'')}</span><div class="tag">이 휴대폰은 본인 전용</div></div></div></div>${locHtml()}${codeCard()}${errHtml()}<div class="note">본인이 아니라면 담당자에게 문의해 주세요.</div>`;
    setBar(`<button class="btn" id="go" ${S.me.done?'disabled':''}>${S.me.done?'✔ 이미 출석했습니다':'출석하기'}</button>`);
  }else{ // ── 처음 접속: 단체 → 이름 → 전화번호 뒤 4자리 ──
    if(!gid&&S.groups.length===1)gid=S.groups[0].id;
    const G=S.groups.find(g=>g.id===gid),M=G&&G.members.find(m=>m.id===sel);
    let h=`<div class="note" style="margin-top:0"><b>처음 한 번만</b> 본인 확인을 합니다. 다음부터는 링크만 누르면 자동으로 출석되고, 이 휴대폰은 선택한 분 <b>본인 전용</b>이 됩니다.</div>`;
    h+=`<div class="card" id="s1"><div class="step-h"><span class="num ${G?'done':''}">${G?'':'01'}</span><span class="t">소속 단체</span></div>`;
    h+=G?`<div class="picked"><span>${esc(G.name)}</span><button data-back="g">바꾸기</button></div>`:`<div class="chips">${S.groups.map(g=>`<button class="chip" data-gid="${g.id}">${esc(g.name)}</button>`).join('')}</div>`;
    h+=`</div>`;
    if(G){h+=`<div class="card" id="s2"><div class="step-h"><span class="num ${M?'done':''}">${M?'':'02'}</span><span class="t">본인 이름</span></div>`;
      h+=M?`<div class="picked"><span>${esc(M.name)}</span><button data-back="m">바꾸기</button></div>`:`<div class="chips">${G.members.map(m=>`<button class="chip" data-id="${m.id}">${esc(m.name)}</button>`).join('')}</div>`;h+=`</div>`}
    if(M){h+=`<div class="card" id="s3"><div class="step-h"><span class="num">03</span><span class="t">전화번호 뒤 4자리</span></div><input class="input" id="ph" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" value="${esc(PH)}"><div class="mut" style="margin-top:10px">담당자에게 등록된 휴대폰 번호의 마지막 4자리입니다</div></div>`}
    h+=codeCard()+locHtml()+errHtml();
    $('body').innerHTML=h;
    const ready=!!M&&PH.length===4;
    setBar(`${ready?'':'<p class="bar-hint" id="hint">'+(G?M?'전화번호 뒤 4자리를 입력해 주세요':'본인 이름을 눌러 주세요':'소속 단체를 눌러 주세요')+'</p>'}<button class="btn" id="go" ${ready?'':'disabled'}>등록하고 출석하기</button>`);
  }
  bind();
  // 오류·위치 문제가 생기면 그 안내가 보이도록 스크롤 (하단 버튼에 가려지지 않게)
  const t=(errBox&&document.querySelector('.alert'))||((locState==='denied'||locState==='error')&&document.querySelector('.status.bad'));
  if(t)setTimeout(()=>t.scrollIntoView({block:'center',behavior:'smooth'}),60)}
function bind(){
  document.querySelectorAll('[data-gid]').forEach(b=>b.onclick=()=>{gid=b.dataset.gid;sel=null;PH='';errBox=null;render();$('s2')?.scrollIntoView({behavior:'smooth',block:'start'})});
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sel=b.dataset.id;PH='';errBox=null;render();$('s3')?.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('ph')&&$('ph').focus({preventScroll:true}),350)});
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.back==='g'){gid=null;sel=null}else sel=null;PH='';errBox=null;render()});
  const ph=$('ph');if(ph)ph.oninput=()=>{PH=ph.value.replace(/\D/g,'').slice(0,4);ph.value=PH;errBox=null;const ok=PH.length===4;$('go').disabled=!ok;const h=$('hint');if(h)h.hidden=ok;if(ok)ph.blur()};
  if($('go'))$('go').onclick=go;if($('retry'))$('retry').onclick=askLocation;if($('req'))$('req').onclick=reqChange}
function pos(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}):no({message:'unsupported'}))}
async function go(){
  if(busy)return;errBox=null;
  if(!S.me&&!(sel&&PH.length===4)){render();return}
  let p={};
  if(S.venue){
    if(LOC&&Date.now()-LOC.t<20000)p={lat:LOC.lat,lng:LOC.lng,accuracy:LOC.accuracy}; // 방금 확인한 위치를 그대로 사용
    else try{const x=await pos();p={lat:x.coords.latitude,lng:x.coords.longitude,accuracy:x.coords.accuracy}}
    catch(e){if(LOC&&Date.now()-LOC.t<120000)p={lat:LOC.lat,lng:LOC.lng,accuracy:LOC.accuracy};else{locState=e&&e.code===1?'denied':'error';render();return}}}
  const body={deviceId:dev,code:$('code')?$('code').value:'',...p};if(!S.me){body.memberId=sel;body.phone4=PH}
  busy=true;if($('go')){$('go').disabled=true;$('go').textContent='처리 중…'}
  let r,j;try{r=await fetch(`/api/s/${token}/checkin`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});j=await r.json()}
  catch{busy=false;errBox={t:'인터넷 연결을 확인하고 다시 시도해 주세요'};render();return}
  busy=false;
  if(!r.ok){errBox={t:j.error,canRequest:j.canRequest,memberId:j.memberId};render();return}
  showDone(j)}
function showDone(j){
  setBar('');const late=j.status==='L',t=new Date();
  $('body').innerHTML=`<div class="card done-card"><div class="okring ${late?'late':''}"><b>${late?'지각':'출석'}</b><i>${S.date.slice(5).replace('-','.')}</i></div><div class="nm">${esc(j.name)}님</div><div class="st ${late?'late':''}">${late?'지각 처리되었습니다':'출석되었습니다'}</div>
    <div class="mut">${esc(S.lecture.name)} · ${p2(t.getHours())}:${p2(t.getMinutes())}${j.already?' (이미 출석됨)':''}</div></div>
    ${j.registered?`<div class="card"><div class="tag" style="margin:0 0 10px">등록 완료</div><div>이 휴대폰이 <b>${esc(j.name)}</b>님 전용으로 등록되었습니다. 다음부터는 링크만 누르면 자동으로 출석됩니다.</div></div>`:''}
    <div class="note" style="text-align:center">이제 화면을 닫으셔도 됩니다.</div>`;window.scrollTo(0,0)}
async function reqChange(){
  if(PH.length!==4){errBox={t:'전화번호 뒤 4자리를 입력한 뒤 다시 요청해 주세요',canRequest:true,memberId:sel};render();return}
  const r=await fetch(`/api/s/${token}/device-request`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceId:dev,memberId:errBox&&errBox.memberId||sel,phone4:PH})});const j=await r.json();
  setBar('');$('body').innerHTML=r.ok?`<div class="card done-card"><div class="okring"><b>요청</b><i>접수</i></div><div class="nm">요청했습니다</div><div class="mut" style="margin-top:8px">담당자가 확인하고 승인하면<br>이 링크를 다시 열어 주세요.</div></div>`:`<div class="alert">${ico('alert')}<div>${esc(j.error)}</div></div>`}
load();
</script></body></html>
