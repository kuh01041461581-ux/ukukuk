name: Build 한글양식생성기 (hwp_form_generator)

on:
  push:
    paths: ["hwp_form_generator/**", ".github/workflows/build-hwpforms.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hwp_form_generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests --ignore=tests/test_gui.py
      - name: Build exe
        run: python -m PyInstaller -F -w --name HwpFormGenerator --add-data "forms;forms" --add-data "assets;assets" --hidden-import lxml.etree --hidden-import win32com.client --hidden-import pythoncom app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HwpFormGenerator
          path: hwp_form_generator/dist/HwpFormGenerator.exe
