<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서무 업무 자동화</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B6DF8'/%3E%3Cstop offset='1' stop-color='%237557F5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Crect x='15' y='15' width='15' height='15' rx='4' fill='%23fff'/%3E%3Crect x='34' y='15' width='15' height='15' rx='4' fill='%23fff' opacity='.7'/%3E%3Crect x='15' y='34' width='15' height='15' rx='4' fill='%23fff' opacity='.7'/%3E%3Crect x='34' y='34' width='15' height='15' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* 첫 화면이 깜빡이지 않도록 다크 모드·사이드바 상태를 가장 먼저 적용 */
try{
  var t = localStorage.getItem('suite.theme');
  if(t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)){
    document.documentElement.classList.add('dark');
  }
  if(localStorage.getItem('suite.collapsed') === '1') document.documentElement.classList.add('collapsed');
}catch(e){}
</script>

</style>
<style>
/* ==========================================================================
   셸(껍데기) 전용 스타일 — 색·모서리·글꼴은 모두 위 공통 토큰을 씁니다. (PC 전용)
   ========================================================================== */
:root{ --sidebar-w:248px; --rail-w:68px; --topbar-h:56px; }
html.collapsed{ --sidebar-w:var(--rail-w); }
body{
  min-width:1100px;
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(99,102,241,.13), transparent 62%),
    radial-gradient(900px 480px at 98% -6%, rgba(168,85,247,.10), transparent 58%),
    var(--bg);
  background-attachment:fixed;
}
html.dark body{
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(99,102,241,.16), transparent 62%),
    radial-gradient(900px 480px at 98% -6%, rgba(168,85,247,.12), transparent 58%),
    var(--bg);
  background-attachment:fixed;
}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
svg.ic.sm{width:15px;height:15px;}
svg.ic.lg{width:22px;height:22px;}

.app-shell{display:flex;align-items:flex-start;min-height:100vh;}

/* ---------- 사이드바 (Windows 11 Mica 느낌) ---------- */
.sidebar{
  width:var(--sidebar-w);flex:none;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:16px 12px 12px;overflow:hidden auto;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 82%,transparent),color-mix(in srgb,var(--surface-2) 70%,transparent));
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-right:1px solid var(--border);z-index:30;
  transition:width .18s ease;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;text-decoration:none;color:inherit;min-height:56px;}
.brand .mark{
  width:34px;height:34px;border-radius:10px;background:var(--grad-primary);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn);
}
.brand .mark svg{stroke:#fff;}
.brand strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.015em;line-height:1.3;white-space:nowrap;}
.brand span{display:block;font-size:11px;color:var(--text-3);margin-top:1px;letter-spacing:.03em;white-space:nowrap;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.06em;padding:16px 10px 6px;white-space:nowrap;}
.nav-btn{
  position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 11px;border-radius:var(--radius-btn);
  font:inherit;font-size:13.5px;font-weight:500;color:var(--text-2);text-decoration:none;white-space:nowrap;
  transition:background .14s ease,color .14s ease;
}
.nav-btn:hover{background:var(--hover);color:var(--text);}
.nav-btn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,28,80,.08),0 0 0 1px var(--border);}
.nav-btn.active svg{color:var(--primary);}
.nav-btn.active::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--grad-primary);}
.nav-btn kbd{margin-left:auto;font:inherit;font-size:10.5px;color:var(--text-3);background:var(--surface-3);border-radius:5px;padding:1px 6px;}
.side-foot{margin-top:auto;padding:12px 6px 0;font-size:11px;color:var(--text-3);line-height:1.65;white-space:nowrap;}
.side-foot .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.collapse-btn{margin-left:auto;}
html.collapsed .brand > div:last-child,
html.collapsed .nav-label,
html.collapsed .nav-btn span,
html.collapsed .nav-btn kbd,
html.collapsed .side-foot .txt{display:none;}
html.collapsed .nav-btn{justify-content:center;padding:0;}
html.collapsed .nav-btn.active::before{left:-12px;}
html.collapsed .brand{justify-content:center;padding:4px 0 16px;}
html.collapsed .nav-label{display:block;height:1px;margin:10px 8px;padding:0;background:var(--border);font-size:0;}
html.collapsed .side-foot .row{justify-content:center;}
html.collapsed .collapse-btn{margin:0;transform:scaleX(-1);}

/* ---------- 본문 ---------- */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:var(--topbar-h);flex:none;position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--border);
}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0;}
.crumb b{color:var(--text);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb .sep{opacity:.5;}
.search-pill{
  flex:0 1 320px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-btn);
  color:var(--text-3);font:inherit;font-size:13px;text-align:left;box-shadow:0 1px 2px rgba(20,28,80,.04);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.search-pill:hover{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.search-pill span{flex:1;}
.search-pill kbd,.kbd{font:inherit;font-size:11px;color:var(--text-3);background:var(--surface-3);border:1px solid var(--border);border-radius:5px;padding:0 6px;line-height:18px;}
.top-actions{display:flex;align-items:center;gap:6px;}
.user-chip{
  display:flex;align-items:center;gap:8px;margin-left:6px;padding:4px 12px 4px 4px;cursor:pointer;
  border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:12.5px;font-weight:500;
}
.user-chip:hover{border-color:var(--primary-border);}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

main.content{padding:28px 36px 48px;max-width:1280px;width:100%;margin:0 auto;}
.page{display:none;position:relative;}
.page.active{display:block;animation:rise .2s ease;}
@keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.page-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px;}
.page-head .tile{
  width:46px;height:46px;border-radius:13px;flex:none;color:#fff;background:var(--grad-primary);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn);
}
.page-head .tile svg{stroke:#fff;width:23px;height:23px;}
.page-head .eyebrow{font-size:11.5px;font-weight:600;color:var(--primary);letter-spacing:.05em;margin-bottom:2px;}
.page-head h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.3;}
.page-head p{margin:6px 0 0;color:var(--text-2);font-size:14px;max-width:760px;line-height:1.7;}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;}
.steps .st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 5px;box-shadow:0 1px 2px rgba(20,28,80,.04);}
.steps .st i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--grad-soft);color:var(--primary);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--primary-border);}
.steps .arrow{color:var(--text-3);font-size:12px;}

body.fill-mode main.content{padding:14px 20px 14px;max-width:none;}
.page.fill iframe.tool-frame{height:calc(100vh - var(--topbar-h) - 28px) !important;min-height:0;border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);background:var(--surface);}
iframe.tool-frame{display:block;width:100%;height:520px;min-height:calc(100vh - 180px);border:0;background:transparent;}
.frame-loading{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:13px;padding:26px 4px;position:absolute;}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- 홈 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:20px;padding:30px 34px;margin-bottom:8px;color:#fff;
  background:radial-gradient(600px 240px at 85% -20%,rgba(255,255,255,.28),transparent 60%),linear-gradient(120deg,#4B5CF0 0%,#6D55F2 55%,#8B5CF6 100%);
  box-shadow:0 24px 48px -24px rgba(79,93,240,.55),0 1px 0 rgba(255,255,255,.25) inset;
}
.hero::after{content:"";position:absolute;right:-60px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);}
.hero .date{font-size:12.5px;opacity:.85;font-weight:500;letter-spacing:.02em;}
.hero h1{margin:6px 0 6px;font-size:28px;font-weight:700;letter-spacing:-.025em;}
.hero p{margin:0;opacity:.88;font-size:14px;max-width:560px;line-height:1.7;}
.hero .hero-actions{display:flex;gap:8px;margin-top:18px;position:relative;z-index:1;}
.hero .hbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-btn);font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px);transition:background .15s ease;}
.hero .hbtn:hover{background:rgba(255,255,255,.28);}
.hero .hbtn.solid{background:#fff;color:#4B5CF0;border-color:#fff;}
.hero .hbtn.solid:hover{background:#F2F4FF;}
.hero .hbtn kbd{font:inherit;font-size:11px;background:rgba(255,255,255,.22);border-radius:4px;padding:0 5px;}
.home-group{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin:28px 0 12px;display:flex;align-items:center;gap:10px;}
.home-group::after{content:"";flex:1;height:1px;background:var(--border);}
.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.tool-card{
  position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;font:inherit;color:inherit;text-decoration:none;
  background:var(--card-grad);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px 18px 16px;box-shadow:var(--shadow-card);
  transition:border-color .15s ease,box-shadow .2s ease,transform .2s ease;
}
.tool-card:hover{border-color:var(--primary-border);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 16px 32px -16px rgba(79,93,240,.38);transform:translateY(-2px);}
.tool-card .top{display:flex;align-items:center;justify-content:space-between;}
.tool-card .ico{width:40px;height:40px;border-radius:11px;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn);}
.tool-card .ico svg{stroke:#fff;}
.tool-card .num{font-size:11px;font-weight:600;color:var(--text-3);background:var(--surface-3);border-radius:5px;padding:1px 7px;}
.tool-card h3{margin:2px 0 0;font-size:15.5px;font-weight:700;letter-spacing:-.015em;}
.tool-card p{margin:0;font-size:13px;color:var(--text-2);line-height:1.65;flex:1;}
.tool-card .tags{display:flex;gap:5px;flex-wrap:wrap;}
.tool-card .tags span{font-size:11px;font-weight:500;color:var(--text-2);background:var(--surface-3);border-radius:999px;padding:2px 9px;}
.tool-card .go{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--primary);}
.tool-card .go svg{transition:transform .15s ease;}
.tool-card:hover .go svg{transform:translateX(3px);}
.tool-card.ext .ico{background:var(--surface-3);box-shadow:none;color:var(--text-2);}
.tool-card.ext .ico svg{stroke:currentColor;}
.recent{display:flex;gap:10px;flex-wrap:wrap;}
.recent a{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px 0 10px;border-radius:var(--radius-btn);background:var(--surface);border:1px solid var(--border);text-decoration:none;color:var(--text);font-size:13px;font-weight:500;box-shadow:0 1px 2px rgba(20,28,80,.04);transition:border-color .15s ease;}
.recent a:hover{border-color:var(--primary-border);}
.recent a .mini{width:24px;height:24px;border-radius:7px;background:var(--grad-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;border:1px solid var(--primary-border);}
.recent a .mini svg{width:14px;height:14px;}
.privacy{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding:16px 18px;border-radius:var(--radius-card);background:var(--grad-soft);border:1px solid var(--primary-border);color:var(--text-2);font-size:13px;line-height:1.7;}
.privacy svg{color:var(--primary);margin-top:2px;}
.privacy b{color:var(--text);}

/* ---------- 설정 ---------- */
.settings-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;max-width:1100px;}
.s-card{background:var(--card-grad);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:22px 24px;margin-bottom:16px;}
.s-card h2{font-size:15px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em;}
.s-card .desc{font-size:13px;color:var(--text-2);margin:0 0 18px;line-height:1.7;}
.key-row{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start;margin-bottom:14px;}
.key-row label{font-size:13px;font-weight:600;padding-top:9px;}
.key-row label small{display:block;font-weight:400;font-size:11.5px;color:var(--text-3);margin-top:2px;}
.key-row input{width:100%;height:38px;padding:0 12px;}
.key-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.saved-note{font-size:12.5px;color:var(--success);opacity:0;transition:opacity .2s ease;font-weight:600;}
.saved-note.show{opacity:1;}
.warn-box{margin-top:16px;font-size:12.5px;line-height:1.7;color:var(--warning);background:var(--warning-tint);border-radius:var(--radius-input);padding:11px 14px;}
.side-note{font-size:12.5px;color:var(--text-2);line-height:1.75;}
.side-note b{color:var(--text);}
.side-note ul{margin:8px 0 0;padding-left:18px;}
.about-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--border);color:var(--text-2);}
.about-row:last-child{border:none;}
.about-row b{color:var(--text);font-weight:600;}

/* ---------- 빠른 이동 (Ctrl+K) ---------- */
.palette-bg{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,12,24,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);align-items:flex-start;justify-content:center;padding-top:14vh;}
.palette-bg.open{display:flex;animation:fadein .12s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.palette{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);overflow:hidden;}
.palette input{width:100%;height:54px;padding:0 20px;font:inherit;font-size:15px;background:transparent;color:var(--text);outline:none;border-radius:0;box-shadow:none;}
.palette input,body .palette input:focus,body .palette input:hover{border:none;border-bottom:1px solid var(--border);border-radius:0;box-shadow:none;}
.palette ul{list-style:none;margin:0;padding:8px;max-height:340px;overflow:auto;}
.palette li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--text);}
.palette li .mini{width:28px;height:28px;border-radius:8px;background:var(--grad-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;border:1px solid var(--primary-border);flex:none;}
.palette li small{color:var(--text-3);margin-left:auto;font-size:11.5px;}
.palette li.sel{background:var(--primary-tint);}
.palette .empty{padding:24px;text-align:center;color:var(--text-3);font-size:13px;}
.palette .foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);background:var(--surface-2);}

.toast-s{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:120;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-pop);transition:opacity .2s ease,transform .2s ease;}
.toast-s.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></symbol>

<script>
(function(){

    ,{id:'labels',     group:'라벨', label:'우편 라벨지',   icon:'tag',    title:'우편 라벨지 자동화', fill:true,

     tags:['엑셀 입력','라벨 편집','인쇄'],
     steps:['데이터 불러오기','라벨 편집','출력(인쇄)']}
  ];
  var GROUPS = ['여비','정산','문서','라벨'];

  var $ = function(s, r){ return (r||document).querySelector(s); };
  function icon(id, cls){ return '<svg class="ic '+(cls||'')+'"><use href="#i-'+id+'"/></svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function byId(id){ for(var i=0;i<TOOLS.length;i++) if(TOOLS[i].id===id) return TOOLS[i]; return null; }
  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return null; }
  function jget(k){ try{ return JSON.parse(store(k) || 'null'); }catch(e){ return null; } }
  var toastT;
  function toast(msg){ var t = $('#toastS'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2200); }

  $('#verText').textContent = VERSION;

  /* ---------- 기본 정보(이름·부서) ---------- */
  function info(){ return jget('suite.info') || {}; }
  function paintUser(){
    var n = (info().name || '').trim() || '서무 담당자';
    $('#userName').textContent = n; $('#avatar').textContent = n.charAt(0);
  }

    html += '<div class="nav-label">'+g+'</div>';

      n++; t.no = n;
      html += '<a class="nav-btn" data-go="'+t.id+'" href="#'+t.id+'" title="'+esc(t.title)+' (Alt+'+n+')">'+icon(t.icon)+'<span>'+esc(t.label)+'</span><kbd>Alt '+n+'</kbd></a>';
    });
  });
  html += '<div class="nav-label">기타</div>';
  html += '<a class="nav-btn" data-go="settings" href="#settings" title="설정">'+icon('gear')+'<span>설정</span></a>';
  nav.innerHTML = html;

  $('#collapseBtn').addEventListener('click', function(){
    autoCollapsed = false;
    var c = document.documentElement.classList.toggle('collapsed');
    store('suite.collapsed', c ? '1' : '0');
    setTimeout(function(){ sendViewport(); }, 220);
  });

  /* ---------- 홈 ---------- */
  function cardHtml(t){
    return '<a class="tool-card" href="#'+t.id+'"><div class="top"><div class="ico">'+icon(t.icon,'lg')+'</div><span class="num">Alt '+t.no+'</span></div>'+
      '<h3>'+esc(t.title)+'</h3><p>'+esc(t.desc)+'</p>'+
      '<div class="tags">'+t.tags.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('')+'</div>'+
      '<div class="go">열기 '+icon('arrow','sm')+'</div></a>';
  }
  function renderHome(){
    var d = new Date(), wd = ['일','월','화','수','목','금','토'][d.getDay()];
    var nm = (info().name || '').trim();
    var h = d.getHours(), greet = h < 12 ? '좋은 아침입니다' : (h < 18 ? '안녕하세요' : '수고하셨습니다');

      '<h1>'+greet+(nm ? ', '+esc(nm)+'님' : '')+'</h1>'+
      '<p>자주 하는 서무 업무를 한 곳에 모았습니다. 업무를 고르고 파일을 올리면 끝입니다. 모든 처리는 이 PC 안에서만 이뤄집니다.</p>'+

      '<a class="hbtn" href="#settings" style="text-decoration:none">'+icon('gear','sm')+'기본 정보 · API 키</a></div></div>';

    $('#page-home').innerHTML = s;
    $('#heroSearch').addEventListener('click', openPalette);
  }

  /* ---------- 설정 ---------- */
  var KEYS = [
    {k:'kakao',  label:'카카오 REST API 키', sub:'관외출장 · 주소검색/거리계산'},

  var st = '<div class="page-head"><div class="tile">'+icon('gear')+'</div><div><div class="eyebrow">설정</div><h1>기본 정보 · API 키 · 백업</h1>'+

    '<div class="s-card"><h2>기본 정보</h2><p class="desc">홈 인사말과 관외출장의 기본 부서명에 쓰입니다.</p>'+

    '<div class="s-card"><h2>작업 데이터 백업 · 복원</h2><p class="desc">관외출장의 <b>부서원 명단과 출장 내역</b>을 파일로 저장하거나 불러옵니다. PC를 바꾸거나 프로그램을 다시 설치하기 전에 백업해 두세요. (API 키는 백업에 넣지 않습니다.)</p>'+
    '<div class="key-actions"><button class="btn outline" id="bkSave">'+icon('down','sm')+'백업 파일 저장</button><button class="btn ghost" id="bkLoad">'+icon('up','sm')+'백업 불러오기</button></div></div>'+
    '</div><div><div class="s-card"><h2>사용 팁</h2><div class="side-note">'+
    '<ul><li><b>Ctrl K</b> 로 어느 화면에서든 업무를 검색해 이동</li><li><b>Alt 1~5</b> 로 각 업무로 바로 이동</li><li>다른 업무로 옮겨도 <b>작업 중인 내용은 그대로</b> 남아 있습니다</li><li>왼쪽 아래 화살표로 사이드바를 접으면 작업 공간이 넓어집니다</li></ul></div></div>'+
    '<div class="s-card"><h2>정보</h2><div class="about-row"><span>버전</span><b>'+esc(VERSION)+'</b></div><div class="about-row"><span>도구</span><b>'+TOOLS.length+'개</b></div><div class="about-row"><span>데이터 위치</span><b>이 PC 프로그램 저장소</b></div></div></div></div>';
  $('#page-settings').innerHTML = st;

  function fillSettings(){
    var o = jget('suite.keys') || {}; KEYS.forEach(function(x){ $('#key-'+x.k).value = o[x.k] || ''; });
    var i = info(); $('#inf-name').value = i.name || ''; $('#inf-dept').value = i.dept || '';
  }
  function flash(id, msg){ var n = $(id); n.textContent = msg; n.classList.add('show'); setTimeout(function(){ n.classList.remove('show'); }, 1800); }
  $('#keySave').addEventListener('click', function(){
    var o = {}; KEYS.forEach(function(x){ var v = $('#key-'+x.k).value.trim(); if(v) o[x.k] = v; });
    store('suite.keys', JSON.stringify(o)); flash('#keyNote', '저장했습니다');
  });
  $('#keyClear').addEventListener('click', function(){
    if(!confirm('저장된 API 키를 모두 지울까요?')) return;
    store('suite.keys', null); fillSettings(); flash('#keyNote', '지웠습니다');
  });
  $('#infSave').addEventListener('click', function(){
    store('suite.info', JSON.stringify({name:$('#inf-name').value.trim(), dept:$('#inf-dept').value.trim()}));
    paintUser(); renderHome(); flash('#infNote', '저장했습니다');
  });
  $('#userChip').addEventListener('click', function(){ location.hash = '#settings'; });

  /* 백업 · 복원 */
  var BACKUP_KEYS = ['staffDB','tripDB','lastSavedAt','suite.info'];
  $('#bkSave').addEventListener('click', function(){
    var o = {__suite:1, savedAt:new Date().toISOString(), data:{}};
    BACKUP_KEYS.forEach(function(k){ var v = store(k); if(v !== null) o.data[k] = v; });
    var blob = new Blob([JSON.stringify(o, null, 1)], {type:'application/json'});
    var a = document.createElement('a'), d = new Date(), p = function(x){ return (x<10?'0':'')+x; };
    a.href = URL.createObjectURL(blob);
    a.download = '서무업무자동화_백업_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    toast('백업 파일을 저장했습니다');
  });
  $('#bkLoad').addEventListener('click', function(){ $('#restoreFile').click(); });
  $('#restoreFile').addEventListener('change', function(e){
    var f = e.target.files[0]; e.target.value = ''; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var o = JSON.parse(r.result);
        if(!o || !o.__suite || !o.data) throw new Error('형식 오류');
        if(!confirm('현재 저장된 부서원 명단·출장 내역을 백업 파일 내용으로 바꿀까요?')) return;
        BACKUP_KEYS.forEach(function(k){ if(typeof o.data[k] === 'string') store(k, o.data[k]); });
        toast('복원했습니다. 화면을 다시 불러옵니다'); setTimeout(function(){ location.reload(); }, 900);
      }catch(err){ alert('백업 파일을 읽지 못했습니다. 이 프로그램에서 저장한 .json 파일인지 확인하세요.'); }
    };
    r.readAsText(f);
  });
  fillSettings();

  /* ---------- 도구 iframe (처음 열 때 한 번만 불러오고 이후엔 상태 유지) ---------- */
  var frames = {};
  function headHtml(t){
    var steps = !t.steps.length ? '' : t.steps.map(function(x, i){ return '<span class="st"><i>'+(i+1)+'</i>'+esc(x)+'</span>'; }).join('<span class="arrow">›</span>');
    return '<div class="page-head"><div class="tile">'+icon(t.icon)+'</div><div><div class="eyebrow">'+esc(t.group)+'</div><h1>'+esc(t.title)+'</h1><p>'+esc(t.desc)+'</p>'+(steps ? '<div class="steps">'+steps+'</div>' : '')+'</div></div>';
  }
  function ensureFrame(t){
    if(frames[t.id]) return frames[t.id];
    var page = document.createElement('section');
    page.className = 'page' + (t.fill ? ' fill' : ''); page.id = 'page-'+t.id;
    page.innerHTML = (t.fill ? '' : headHtml(t)) + '<div class="frame-loading"><span class="spin"></span>불러오는 중…</div>';
    var f = document.createElement('iframe');
    f.className = 'tool-frame'; f.title = t.title;
    page.appendChild(f);
    $('#content').appendChild(page);
    f.srcdoc = JSON.parse(document.getElementById('tool-data-'+t.id).textContent);
    frames[t.id] = {page:page, frame:f};
    return frames[t.id];
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || !d.__tabId) return;
    var rec = frames[d.__tabId];
    if(!rec || e.source !== rec.frame.contentWindow) return;
    if(d.__tabHeight && !byId(d.__tabId).fill){
      rec.frame.style.height = Math.max(320, d.__tabHeight + 8) + 'px';
      var ld = rec.page.querySelector('.frame-loading'); if(ld) ld.remove();
      sendViewport();
    }
    if(d.__ready){ var ld2 = rec.page.querySelector('.frame-loading'); if(ld2 && byId(d.__tabId).fill) ld2.remove(); pushState(rec.frame); }
  });

  function pushState(f){
    try{ f.contentWindow.postMessage({__theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light'}, '*'); }catch(e){}
    sendViewport(f);
  }
  var vpQueued = false;
  function sendViewport(only){
    if(vpQueued && !only) return;
    vpQueued = true;
    requestAnimationFrame(function(){
      vpQueued = false;
      var list = only ? [only] : Object.keys(frames).map(function(k){ return frames[k].frame; });
      list.forEach(function(f){
        if(f.offsetParent === null) return;
        var r = f.getBoundingClientRect();
        var top = Math.max(0, -r.top);
        var h = Math.max(200, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0));
        try{ f.contentWindow.postMessage({__viewport:{top:top, height:h}}, '*'); }catch(e){}
      });
    });
  }
  window.addEventListener('scroll', function(){ sendViewport(); }, {passive:true});
  window.addEventListener('resize', function(){ sendViewport(); });

  /* ---------- 다크 모드 ---------- */
  function paintThemeBtn(){
    var dark = document.documentElement.classList.contains('dark');
    $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon');
    $('#themeBtn').title = dark ? '라이트 모드' : '다크 모드';
  }
  function toggleTheme(){
    var dark = document.documentElement.classList.toggle('dark');
    store('suite.theme', dark ? 'dark' : 'light');
    paintThemeBtn();
    Object.keys(frames).forEach(function(k){ pushState(frames[k].frame); });
  }
  $('#themeBtn').addEventListener('click', toggleTheme);
  paintThemeBtn();

  /* ---------- 화면 전환 ---------- */
  var current = null, autoCollapsed = false;
  function show(id){
    var t = byId(id);
    if(!t && id !== 'settings') id = 'home';
    if(id === current) return;
    current = id;
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-go') === id); });
    var group = '홈', title = '서무 업무 자동화';
    if(t){
      ensureFrame(t).page.classList.add('active'); group = t.group; title = t.title;
      var rec = (jget('suite.recent') || []).filter(function(x){ return x !== t.id; });
      rec.unshift(t.id); store('suite.recent', JSON.stringify(rec.slice(0, 4)));
    } else if(id === 'settings'){ $('#page-settings').classList.add('active'); group = '기타'; title = '설정'; }
    else { renderHome(); $('#page-home').classList.add('active'); }
    $('#crumbGroup').textContent = group; $('#crumbTitle').textContent = title;
    document.title = (id === 'home' ? '' : title + ' · ') + '서무 업무 자동화';
    document.body.classList.toggle('fill-mode', !!(t && t.fill));
    /* 전체 화면 편집 도구에 들어가면 사이드바를 자동으로 접어 작업 공간을 넓히고, 나오면 원래대로 */
    var root = document.documentElement;
    if(t && t.fill){ if(!root.classList.contains('collapsed')){ root.classList.add('collapsed'); autoCollapsed = true; } }
    else if(autoCollapsed){ root.classList.remove('collapsed'); autoCollapsed = false; }
    window.scrollTo(0, 0);
    sendViewport();
  }
  function route(){ show((location.hash || '#home').slice(1)); }
  window.addEventListener('hashchange', route);
  route();

  /* ---------- 빠른 이동 (Ctrl+K) ---------- */
  var ITEMS = [{id:'home', label:'홈', sub:'시작 화면', icon:'home'}]
    .concat(TOOLS.map(function(t){ return {id:t.id, label:t.title, sub:t.group+' · Alt '+t.no, icon:t.icon, key:t.label+' '+t.tags.join(' ')+' '+t.desc}; }))
    .concat([{id:'settings', label:'설정', sub:'기본 정보 · API 키 · 백업', icon:'gear', key:'키 백업 부서 이름 복원'},
             {id:'__theme', label:'다크/라이트 모드 전환', sub:'화면 색', icon:'moon', key:'테마 다크 라이트 어둡게'}]);
  var sel = 0, shown = [];
  function renderPalette(){
    var q = $('#paletteInput').value.trim().toLowerCase();
    shown = ITEMS.filter(function(it){ return !q || (it.label+' '+(it.key||'')+' '+it.sub).toLowerCase().indexOf(q) >= 0; });
    if(sel >= shown.length) sel = 0;
    $('#paletteList').innerHTML = shown.length ? shown.map(function(it, i){
      return '<li class="'+(i===sel?'sel':'')+'" data-i="'+i+'"><span class="mini">'+icon(it.icon)+'</span>'+esc(it.label)+'<small>'+esc(it.sub)+'</small></li>';
    }).join('') : '<div class="empty">찾는 업무가 없습니다</div>';
  }
  function openPalette(){ $('#paletteBg').classList.add('open'); $('#paletteInput').value = ''; sel = 0; renderPalette(); setTimeout(function(){ $('#paletteInput').focus(); }, 0); }
  function closePalette(){ $('#paletteBg').classList.remove('open'); }
  function choose(i){
    var it = shown[i]; if(!it) return; closePalette();
    if(it.id === '__theme') toggleTheme(); else location.hash = '#'+it.id;
  }
  $('#searchBtn').addEventListener('click', openPalette);
  $('#paletteBg').addEventListener('mousedown', function(e){ if(e.target === this) closePalette(); });
  $('#paletteInput').addEventListener('input', function(){ sel = 0; renderPalette(); });
  $('#paletteList').addEventListener('click', function(e){ var li = e.target.closest('li'); if(li) choose(+li.getAttribute('data-i')); });
  $('#paletteInput').addEventListener('keydown', function(e){
    if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(shown.length-1, sel+1); renderPalette(); scrollSel(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, sel-1); renderPalette(); scrollSel(); }
    else if(e.key === 'Enter'){ e.preventDefault(); choose(sel); }
  });
  function scrollSel(){ var el = $('#paletteList li.sel'); if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); }
    else if(e.key === 'Escape') closePalette();
    else if(e.altKey && /^[1-9]$/.test(e.key)){
      var t = TOOLS[+e.key - 1]; if(t){ e.preventDefault(); location.hash = '#'+t.id; }
    }
  });
  /* 도구 화면(iframe) 안에서 누른 단축키도 셸이 받도록 전달 */
  window.__suiteKey = function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); }
    else if(e.altKey && /^[1-9]$/.test(e.key)){ var t = TOOLS[+e.key - 1]; if(t){ e.preventDefault(); location.hash = '#'+t.id; } }
  };
})();
</script>
</body>
</html>
