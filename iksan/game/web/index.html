<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>익산타이쿤</title>
<style>
@font-face{font-family:Galmuri;src:url(galmuri11.ttf)}
:root{--bg:#10141c;--panel:#1b2230;--line:#34405a;--tx:#e8edf7;--dim:#93a0b8;--acc:#ffb347;--ok:#5bd68a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Galmuri,monospace;-webkit-font-smoothing:none}
#app{max-width:560px;margin:0 auto;padding:10px 16px 40px}
h1{font-size:16px;margin:8px 0}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border:2px solid var(--line);padding:4px 6px}.stat b{display:block;color:var(--acc)}
.meter{height:6px;background:#0b0f16;margin-top:2px}.meter i{display:block;height:100%;background:var(--ok)}
.date{background:var(--panel);border:2px solid var(--line);padding:6px 10px;margin:6px 0;display:flex;justify-content:space-between}
button{font:inherit;color:var(--tx);background:#25304a;border:2px solid var(--line);padding:10px 8px;min-height:44px;cursor:pointer}
button:active{background:#33456b}button:disabled{opacity:.4}
.cmds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.zones{display:grid;gap:6px;margin:8px 0}.zone{background:var(--panel);border:2px solid var(--line);padding:6px 8px}
.zone small{color:var(--dim)}
.card{background:var(--panel);border:3px solid var(--acc);padding:12px;margin:10px 0}.card h2{margin:0 0 6px;font-size:15px;color:var(--acc)}
.card button{display:block;width:100%;margin-top:8px;text-align:left}
#log{color:var(--dim);font-size:12px;max-height:130px;overflow:auto;border-top:2px solid var(--line);margin-top:10px;padding-top:6px}
.end{text-align:center}.grade{font-size:56px;color:var(--acc)}
</style></head><body><div id="app"></div><script type="module" src="ui.js"></script></body></html>
