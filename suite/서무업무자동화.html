eturn;\n  }\n  let master;\n  if (state.templateEmployees && state.templateEmployees.length){\n    master = state.templateEmployees.slice();\n    state.allEmployees.forEach(n => { if (!master.includes(n)) master.push(n); });\n  } else {\n    master = state.allEmployees.slice();\n  }\n  state.masterEmployees = master;\n  if (state.year){ renderSummary(); refreshPreviewLive(); }\n}\n\nfunction parseOvertimeWorkbook(wb){\n  const sheetName = wb.SheetNames.find(n => n.includes('초과근무')) || wb.SheetNames[0];\n  const ws = wb.Sheets[sheetName];\n  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});\n\n  let headerRowIdx = -1;\n  for (let i=0;i\u003cMath.min(10,rows.length);i++){\n    if (rows[i].some(c => String(c).trim()==='근무일자')) { headerRowIdx = i; break; }\n  }\n  if (headerRowIdx === -1){\n    showStatus('uploadStatus', '\"근무일자\" 컬럼을 찾을 수 없습니다. 인사랑에서 내려받은 초과근무 내역 엑셀이 맞는지 확인해주세요.', 'error');\n    return;\n  }\n  const header = rows[headerRowIdx].map(c=>String(c).trim());\n  const findCol = (name) => header.indexOf(name);\n  const col = {\n    no: findCol('No.'), date: findCol('근무일자'), dept: findCol('부서'), rank: findCol('직급'),\n    name: findCol('성명'), holiday: findCol('휴일구분'), checkin: findCol('출근(실제)'),\n    checkout: findCol('퇴근(실제)'), otmin: findCol('총초과(분)'), detail: findCol('근무내역'),\n  };\n  const required = ['date','name','holiday','checkout'];\n  const missing = required.filter(k => col[k] === -1);\n  if (missing.length){\n    showStatus('uploadStatus', '필수 컬럼이 누락되었습니다: ' + missing.join(', '), 'error');\n    return;\n  }\n\n  function parseDate(v){\n    if (v instanceof Date) return {y:v.getFullYear(), m:v.getMonth()+1, d:v.getDate()};\n    const s = String(v).trim();\n    let mm = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n    if (mm) return {y:+mm[1], m:+mm[2], d:+mm[3]};\n    mm = s.match(/^(\\d{4})\\.(\\d{1,2})\\.(\\d{1,2})/);\n    if (mm) return {y:+mm[1], m:+mm[2], d:+mm[3]};\n    return null;\n  }\n  function parseTimeMinutes(v){\n    if (v instanceof Date) return v.getHours()*60 + v.getMinutes();\n    if (typeof v === 'number'){ const frac = v % 1; return Math.round(frac*24*60); }\n    const s = String(v).trim();\n    const mm = s.match(/^(\\d{1,2}):(\\d{2})/);\n    if (mm) return (+mm[1])*60 + (+mm[2]);\n    return null;\n  }\n\n  const records = [];\n  for (let i=headerRowIdx+1;i\u003crows.length;i++){\n    const r = rows[i];\n    if (!r || r.length===0) continue;\n    const nameV = r[col.name], dateV = r[col.date];\n    if (!nameV || !dateV) continue;\n    const d = parseDate(dateV);\n    if (!d) continue;\n    records.push({\n      no: r[col.no], y:d.y, m:d.m, d:d.d,\n      dateStr: `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`,\n      dept: col.dept>-1 ? r[col.dept] : '', rank: col.rank>-1 ? r[col.rank] : '',\n      name: String(nameV).trim(), holiday: String(r[col.holiday]).trim(),\n      checkin: col.checkin>-1 ? r[col.checkin] : '', checkout: r[col.checkout],\n      checkoutMin: parseTimeMinutes(r[col.checkout]),\n      otmin: col.otmin>-1 ? r[col.otmin] : '', detail: col.detail>-1 ? r[col.detail] : '',\n    });\n  }\n  if (records.length === 0){\n    showStatus('uploadStatus', '유효한 데이터 행을 찾지 못했습니다.', 'error');\n    return;\n  }\n\n  // 연/월 감지 (가장 많이 등장하는 연-월)\n  const freq = {};\n  records.forEach(rec=>{ const k = `${rec.y}-${rec.m}`; freq[k]=(freq[k]||0)+1; });\n  const [ym] = Object.entries(freq).sort((a,b)=>b[1]-a[1]);\n  const [year, month] = ym[0].split('-').map(Number);\n  const daysInMonth = new Date(year, month, 0).getDate();\n\n  // 급식 대상 판정: 휴일구분=평일 & 퇴근(실제)>=20:00\n  const mealQualify = {};\n  records.forEach(rec=>{\n    if (rec.holiday === '평일' && rec.checkoutMin !== null && rec.checkoutMin >= 20*60){\n      if (!mealQualify[rec.name]) mealQualify[rec.name] = new Set();\n      mealQualify[rec.name].add(rec.dateStr);\n    }\n  });\n\n  const allEmployees = [];\n  const seen = new Set();\n  records.forEach(rec=>{ if(!seen.has(rec.name)){ seen.add(rec.name); allEmployees.push(rec.name); } });\n\n  const rawHolidaySet = new Set();\n  records.forEach(rec=>{ if (rec.holiday === '휴일') rawHolidaySet.add(rec.dateStr); });\n\n  let maxMealCount = 0;\n  Object.values(mealQualify).forEach(s=> maxMealCount += s.size);\n\n  // 상태 저장\n  state.records = records;\n  state.allEmployees = allEmployees;\n  state.mealQualify = mealQualify;\n  state.rawHolidaySet = rawHolidaySet;\n  state.year = year; state.month = month; state.daysInMonth = daysInMonth;\n  state.maxMealCount = maxMealCount;\n  state.vendors = [{name:'', count:0}];\n  updateMasterEmployees();\n\n  renderSummary();\n  renderPreview();\n  renderVendors();\n  document.getElementById('summarySection').classList.remove('hidden');\n  document.getElementById('step2').classList.remove('hidden');\n  document.getElementById('step3').classList.remove('hidden');\n  document.getElementById('step4').classList.remove('hidden');\n  showStatus('uploadStatus', `분석 완료: ${records.length}건 중 ${maxMealCount}건이 급식 지급 대상입니다.`, 'success');\n}\n\nfunction renderSummary(){\n  document.getElementById('sumYm').textContent = `${state.year}.${state.month}`;\n  document.getElementById('sumRecords').textContent = state.records.length + '건';\n  document.getElementById('sumEmployees').textContent = (state.masterEmployees.length || state.allEmployees.length) + '명';\n  document.getElementById('sumMax').textContent = state.maxMealCount + '끼';\n}\n\n/* ============================================================\n   미리보기 (상세내역 매트릭스)\n============================================================ */\nfunction weekday(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }\nfunction isRedDay(day){\n  const wd = weekday(state.year, state.month, day);\n  const dateStr = `${state.year}-${String(state.month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;\n  return wd===0 || (wd!==6 && state.rawHolidaySet.has(dateStr));\n}\nfunction isBlueDay(day){\n  return weekday(state.year, state.month, day) === 6;\n}\n\ndocument.getElementById('togglePreview').addEventListener('click', ()=>{\n  const wrap = document.getElementById('previewWrap');\n  const toggle = document.getElementById('togglePreview');\n  wrap.classList.toggle('hidden');\n  toggle.textContent = wrap.classList.contains('hidden') ? '▸ 급식지급 상세내역 미리보기 열기' : '▾ 미리보기 닫기';\n});\n\n/* ============================================================\n   급식인원 날짜별 배분\n   - mealQualify(휴일구분=평일 & 20시 이후 퇴근)로 \"가능한\" 인원 슬롯을 모은 뒤,\n   - 급식처에 입력한 급식인원 합계(target)만큼만 골라서 O 표시한다.\n   - 날짜별 가능 인원수에 비례해서(최대잔여법) 나누고, 같은 사람에게 몰리지 않도록\n     \"지금까지 가장 적게 배정된 사람\"을 우선 선택해 최대한 여러 명에게 고르게 나눈다.\n============================================================ */\nfunction allocateMealSlots(target){\n  const dateMap = {}; // dateStr -> [name, ...] (그 날짜에 급식 가능한 직원들)\n  Object.entries(state.mealQualify).forEach(([name, set])=>{\n    set.forEach(dateStr=>{\n      if (!dateMap[dateStr]) dateMap[dateStr] = [];\n      dateMap[dateStr].push(name);\n    });\n  });\n  const dates = Object.keys(dateMap).sort();\n  const totalCapacity = dates.reduce((a,d)=>a+dateMap[d].length, 0);\n  const goal = Math.max(0, Math.min(target||0, totalCapacity));\n\n  const plan = dates.map(d => ({date:d, cap:dateMap[d].length, alloc:0, frac:0}));\n  if (goal > 0 && totalCapacity > 0){\n    plan.forEach(p=>{\n      const exact = goal * p.cap / totalCapacity;\n      p.alloc = Math.floor(exact);\n      p.frac = exact - p.alloc;\n    });\n    let remainder = goal - plan.reduce((a,p)=>a+p.alloc, 0);\n    const byFrac = [...plan].sort((a,b)=> b.frac - a.frac);\n    let guard = 0;\n    while (remainder > 0 && guard \u003c byFrac.length*4 + 20){\n      const p = byFrac[guard % byFrac.length];\n      if (p.alloc \u003c p.cap){ p.alloc++; remainder--; }\n      guard++;\n    }\n  }\n\n  const order = state.masterEmployees && state.masterEmployees.length ? state.masterEmployees : state.allEmployees;\n  const rankOf = {};\n  order.forEach((n,i)=>{ rankOf[n] = i; });\n\n  // 날짜가 이른 순으로 처리하면서, 그때까지 배정 횟수가 가장 적은 사람부터 뽑는다.\n  // -> 특정 한두 명에게 몰리지 않고 최대한 많은 인원에게 고르게 분산되며,\n  //    같은 사람이 여러 날짜에 겹치더라도 자연스럽게 최소한으로 억제된다.\n  const usageCount = {}; // name -> 지금까지 배정된 날짜 수\n  const selected = {};   // name -> Set(dateStr)\n  plan.forEach(p=>{\n    if (p.alloc \u003c= 0) return;\n    const candidates = dateMap[p.date].slice().sort((a,b)=>{\n      const ua = usageCount[a]||0, ub = usageCount[b]||0;\n      if (ua !== ub) return ua - ub;                 // 적게 배정된 사람 우선\n      return (rankOf[a]??999999) - (rankOf[b]??999999); // 동률이면 명단 순서로 결정\n    });\n    candidates.slice(0, p.alloc).forEach(n=>{\n      if (!selected[n]) selected[n] = new Set();\n      selected[n].add(p.date);\n      usageCount[n] = (usageCount[n]||0) + 1;\n    });\n  });\n  return selected;\n}\n\nfunction currentVendorTotal(){\n  return state.vendors.reduce((a,v)=>a+(v.count||0), 0);\n}\n\nfunction refreshPreviewLive(){\n  if (!state.year) return;\n  renderPreview();\n}\n\nfunction renderPreview(){\n  const days = state.daysInMonth;\n  const target = currentVendorTotal();\n  const finalQualify = allocateMealSlots(target);\n  const employees = state.masterEmployees && state.masterEmployees.length ? state.masterEmployees : state.allEmployees;\n\n  let html = '\u003ctable class=\"preview-table\">\u003cthead>\u003ctr>\u003cth>연번\u003c/th>\u003cth>성명\u003c/th>\u003cth>계\u003c/th>';\n  for(let d=1; d\u003c=days; d++){\n    const cls = isRedDay(d) ? 'sun' : (isBlueDay(d) ? 'sat' : '');\n    html += `\u003cth class=\"${cls}\">${d}\u003c/th>`;\n  }\n  html += '\u003c/tr>\u003c/thead>\u003ctbody>';\n  employees.forEach((emp, idx)=>{\n    const qualSet = finalQualify[emp] || new Set();\n    html += `\u003ctr>\u003ctd>${idx+1}\u003c/td>\u003ctd>${emp}\u003c/td>\u003ctd>${qualSet.size}\u003c/td>`;\n    for(let d=1; d\u003c=days; d++){\n      const dateStr = `${state.year}-${String(state.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n      html += qualSet.has(dateStr) ? '\u003ctd class=\"o-mark\">O\u003c/td>' : '\u003ctd>\u003c/td>';\n    }\n    html += '\u003c/tr>';\n  });\n  html += '\u003c/tbody>\u003c/table>';\n  document.getElementById('previewWrap').innerHTML = html;\n\n  const noteTarget = target > 0 ? `현재 입력된 급식인원 합계 \u003cb>${target}명\u003c/b> 기준으로 배분된 미리보기입니다.` : `급식처 단계에서 급식인원을 입력하면 그 인원수만큼 날짜별로 배분된 O표시를 미리 볼 수 있습니다.`;\n  const prevNote = document.getElementById('previewNote');\n  if (prevNote) prevNote.innerHTML = noteTarget;\n}\n\n/* ============================================================\n   2) 급식처 입력\n============================================================ */\nfunction renderVendors(){\n  const body = document.getElementById('vendorBody');\n  body.innerHTML = '';\n  state.vendors.forEach((v, idx)=>{\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      \u003ctd>${idx+1}\u003c/td>\n      \u003ctd>\u003cinput type=\"text\" data-idx=\"${idx}\" class=\"vendor-name\" placeholder=\"예) 원광반점\" value=\"${v.name||''}\">\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" min=\"0\" data-idx=\"${idx}\" class=\"vendor-count\" value=\"${v.count||''}\">\u003c/td>\n      \u003ctd>9,000원\u003c/td>\n      \u003ctd class=\"vendor-amount\">${((v.count||0)*9000).toLocaleString()}원\u003c/td>\n      \u003ctd class=\"row-actions\">${state.vendors.length>1 ? `\u003cbutton data-idx=\"${idx}\" class=\"removeVendor\">\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cline x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\">\u003c/line>\u003cline x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\">\u003c/line>\u003c/svg>\u003c/button>` : ''}\u003c/td>\n    `;\n    body.appendChild(tr);\n  });\n  body.querySelectorAll('.vendor-name').forEach(inp=>{\n    inp.addEventListener('input', e=>{ state.vendors[+e.target.dataset.idx].name = e.target.value; updateTotalBar(); });\n  });\n  body.querySelectorAll('.vendor-count').forEach(inp=>{\n    inp.addEventListener('input', e=>{\n      const idx = +e.target.dataset.idx;\n      state.vendors[idx].count = Math.max(0, parseInt(e.target.value)||0);\n      const tr = body.children[idx];\n      if (tr){\n        const amountCell = tr.querySelector('.vendor-amount');\n        if (amountCell) amountCell.textContent = (state.vendors[idx].count*9000).toLocaleString()+'원';\n      }\n      updateTotalBar();\n    });\n  });\n  body.querySelectorAll('.removeVendor').forEach(btn=>{\n    btn.addEventListener('click', e=>{\n      state.vendors.splice(+e.target.dataset.idx, 1);\n      renderVendors();\n    });\n  });\n  updateTotalBar();\n}\n\ndocument.getElementById('addVendorBtn').addEventListener('click', ()=>{\n  state.vendors.push({name:'', count:0});\n  renderVendors();\n});\n\nfunction updateTotalBar(){\n  const totalCount = state.vendors.reduce((a,v)=>a+(v.count||0),0);\n  const totalAmount = totalCount*9000;\n  const bar = document.getElementById('totalBar');\n  const diff = state.maxMealCount - totalCount;\n  let msg = `입력한 급식인원 합계: \u003cb>${totalCount}명\u003c/b> · 지급액 합계: \u003cb>${totalAmount.toLocaleString()}원\u003c/b> · 최대 가능: ${state.maxMealCount}명`;\n  if (diff \u003c 0){\n    bar.className = 'total-bar over';\n    msg += ` &nbsp;최대치보다 \u003cb>${-diff}명\u003c/b> 초과했습니다.`;\n  } else {\n    bar.className = 'total-bar ok';\n    msg += ` &nbsp;(남음 ${diff}명)`;\n  }\n  bar.innerHTML = msg;\n  schedulePreviewRefresh();\n}\n\nlet previewDebounceTimer = null;\nfunction schedulePreviewRefresh(){\n  if (previewDebounceTimer) clearTimeout(previewDebounceTimer);\n  previewDebounceTimer = setTimeout(refreshPreviewLive, 250);\n}\n\n/* ============================================================\n   4) 엑셀 생성\n============================================================ */\nfunction colLetter(n){\n  let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s;\n}\n\ndocument.getElementById('generateBtn').addEventListener('click', async ()=>{\n  const btn = document.getElementById('generateBtn');\n  const vendors = state.vendors.filter(v => v.name && v.count > 0);\n  if (vendors.length === 0){\n    showStatus('generateStatus', '급식처와 인원을 최소 1건 이상 입력해주세요.', 'error');\n    return;\n  }\n  btn.disabled = true; btn.textContent = '생성 중...';\n  try{\n    const buf = await buildWorkbook(vendors);\n    const blob = new Blob([buf], {type:'application/octet-stream'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `${state.year}. ${state.month}월 급식비 지급내역.xlsx`;\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n    showStatus('generateStatus', '엑셀 파일이 다운로드되었습니다.', 'success');\n  }catch(err){\n    console.error(err);\n    showStatus('generateStatus', '엑셀 생성 중 오류: ' + err.message, 'error');\n  }finally{\n    btn.disabled = false; btn.innerHTML = '\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\">\u003c/path>\u003cpath d=\"M7 10l5 5 5-5\">\u003c/path>\u003cpath d=\"M12 15V3\">\u003c/path>\u003c/svg> 정산 엑셀 다운로드';\n  }\n});\n\nasync function buildWorkbook(vendors){\n  const { year, month, daysInMonth, records } = state;\n  const vendorTotal = vendors.reduce((a,v)=>a+(v.count||0), 0);\n  const mealQualify = allocateMealSlots(vendorTotal); // 실제 지급 인원수만큼 날짜별로 배분된 O표시\n  const allEmployees = state.masterEmployees && state.masterEmployees.length ? state.masterEmployees : state.allEmployees;\n  const wb = new ExcelJS.Workbook();\n  wb.creator = '급식비 정산 생성기';\n\n  /* ---------- Sheet1 : 급식확인서 ---------- */\n  const ws1 = wb.addWorksheet('급식확인서', {views:[{showGridLines:false, view:'pageBreakPreview'}]});\n  ws1.columns = [{width:5.11},{width:20.34},{width:20.52},{width:9.99},{width:5.99},{width:14.87},{width:15.99},{width:0.76}];\n  ws1.getRow(1).height = 4.5;\n\n  ws1.mergeCells('A2:G2');\n  const t1 = ws1.getCell('A2');\n  t1.value = `${year}년 ${month}월 급식확인서`;\n  t1.font = {name:'맑은 고딕', size:20, bold:true};\n  t1.alignment = {horizontal:'center', vertical:'center'};\n  ws1.getRow(2).height = 28.5;\n\n  ws1.getCell('G3').value = '(단위 : 명/원)';\n  ws1.getCell('G3').font = {name:'맑은 고딕', size:12};\n  ws1.getCell('G3').alignment = {horizontal:'right', vertical:'center'};\n  ws1.getRow(3).height = 27;\n\n  const headers1 = ['연번','기간','급식처','급식인원','단가','지급액','비고'];\n  const hRow = ws1.getRow(4);\n  headers1.forEach((h,i)=>{\n    const c = hRow.getCell(i+1);\n    c.value = h;\n    c.font = {name:'맑은 고딕', size:12, bold:true};\n    c.alignment = {horizontal:'center', vertical:'center'};\n    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFF99'}};\n    c.border = {top:{style:'medium'}, bottom:{style:'double'}, left:{style:i===0?'medium':'thin'}, right:{style:i===6?'medium':'thin'}};\n  });\n  hRow.height = 35.1;\n\n  const vendorCount = vendors.length;\n  const lastDataRow = 5 + vendorCount;\n  const tRow = ws1.getRow(5);\n  const totalsVals = ['','계',{f:`COUNTA(C6:C${lastDataRow})`},{f:`SUM(D6:D${lastDataRow})`},'',{f:`SUM(F6:F${lastDataRow})`},''];\n  totalsVals.forEach((v,i)=>{\n    const c = tRow.getCell(i+1);\n    c.value = (v && v.f) ? {formula:v.f} : v;\n    c.font = {name:'맑은 고딕', size:12, bold:true};\n    c.alignment = {horizontal: i===5?'right':'center', vertical:'center'};\n    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFCCFFFF'}};\n    c.border = {top:{style:'double'}, bottom:{style:'medium'}, left:{style:i===0?'medium':'thin'}, right:{style:i===6?'medium':'thin'}};\n  });\n  tRow.height = 35.1;\n\n  vendors.forEach((v, idx)=>{\n    const r = 6+idx;\n    const row = ws1.getRow(r);\n    const vals = [idx+1, `${year}.${month}.`, v.name, v.count, 9000, {f:`D${r}*9000`}, ''];\n    vals.forEach((val,i)=>{\n      const c = row.getCell(i+1);\n      c.value = (val && val.f) ? {formula:val.f} : val;\n      c.font = {name:'맑은 고딕', size:12};\n      c.alignment = {horizontal: i===5?'right':'center', vertical:'center'};\n      const isLast = idx === vendorCount-1;\n      c.border = {top:{style:'thin'}, bottom:{style: isLast?'medium':'thin'}, left:{style:i===0?'medium':'thin'}, right:{style:i===6?'medium':'thin'}};\n    });\n    row.height = 35.1;\n  });\n\n  let r = 6+vendorCount;\n  const noteRow = r+1;\n  ws1.mergeCells(`A${noteRow}:G${noteRow}`);\n  const noteCell = ws1.getCell(`A${noteRow}`);\n  noteCell.value = '상기와 같이 식사를 제공하였음을 확인함.';\n  noteCell.font = {name:'맑은 고딕', size:14};\n  noteCell.alignment = {horizontal:'right', vertical:'center'};\n  ws1.getRow(noteRow).height = 24.75;\n\n  const dateRow = noteRow+2;\n  ws1.mergeCells(`B${dateRow}:G${dateRow}`);\n  ws1.getCell(`B${dateRow}`).value = `${year}.  ${month}.     .`;\n  ws1.getCell(`B${dateRow}`).font = {name:'맑은 고딕', size:14};\n  ws1.getCell(`B${dateRow}`).alignment = {horizontal:'center', vertical:'center'};\n  ws1.getRow(dateRow).height = 24.75;\n\n  const confirmerRow = dateRow+1;\n  ws1.mergeCells(`B${confirmerRow}:G${confirmerRow}`);\n  ws1.getCell(`B${confirmerRow}`).value = '확인자 : 일상경비출납원';\n  ws1.getCell(`B${confirmerRow}`).font = {name:'맑은 고딕', size:14};\n  ws1.getCell(`B${confirmerRow}`).alignment = {horizontal:'right', vertical:'center'};\n  ws1.getRow(confirmerRow).height = 29.25;\n\n  const officerRank = document.getElementById('officerRank').value.trim();\n  const officerName = document.getElementById('officerName').value.trim();\n  const signRow = confirmerRow+1;\n  ws1.mergeCells(`B${signRow}:G${signRow}`);\n  ws1.getCell(`B${signRow}`).value = ` ${officerRank} ${officerName} (인)`;\n  ws1.getCell(`B${signRow}`).font = {name:'맑은 고딕', size:14};\n  ws1.getCell(`B${signRow}`).alignment = {horizontal:'right', vertical:'center'};\n  ws1.getRow(signRow).height = 31.5;\n\n  /* ---------- Sheet2 : 급식지급 상세내역 ---------- */\n  const ws2 = wb.addWorksheet('급식지급 상세내역', {views:[{showGridLines:false, view:'pageBreakPreview'}]});\n  const firstDayCol = 4, lastDayCol = firstDayCol + daysInMonth - 1;\n  const totalCol = lastDayCol + 1, checkCol = totalCol + 1;\n\n  ws2.getColumn(1).width = 3.76;\n  ws2.getColumn(2).width = 8.5;\n  ws2.getColumn(3).width = 5.2;\n  for (let c=firstDayCol; c\u003c=lastDayCol; c++) ws2.getColumn(c).width = 3.3;\n  ws2.getColumn(totalCol).width = 5.2;\n  ws2.getColumn(checkCol).width = 9;\n\n  ws2.mergeCells(1,1,2,lastDayCol);\n  const t2 = ws2.getCell(1,1);\n  t2.value = `${year}년 ${month}월 급식지급 상세내역`;\n  t2.font = {name:'맑은 고딕', size:16, bold:true};\n  t2.alignment = {horizontal:'center', vertical:'center'};\n  ws2.getRow(1).height = 26.25;\n  ws2.getRow(2).height = 14.25;\n\n  const row3 = ws2.getRow(3);\n  row3.height = 39;\n  row3.getCell(1).value = '연번';\n  row3.getCell(2).value = '성명';\n  row3.getCell(3).value = '일자\\n계';\n  for (let day=1; day\u003c=daysInMonth; day++){\n    const cell = row3.getCell(firstDayCol+day-1);\n    cell.value = day;\n    let color = null;\n    if (isRedDay(day)) color = 'FFFF0000';\n    else if (isBlueDay(day)) color = 'FF0000FF';\n    cell.font = {name:'맑은 고딕', size:9, bold:true, color: color?{argb:color}:undefined};\n  }\n  for (let c=1; c\u003c=lastDayCol; c++){\n    const cell = row3.getCell(c);\n    if (!cell.font) cell.font = {name:'맑은 고딕', size:9, bold:true};\n    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFCCFFFF'}};\n    cell.alignment = {horizontal:'center', vertical:'center', wrapText: c===3};\n    cell.border = {top:{style:'medium'}, bottom:{style:'double'}, left:{style:c===1?'medium':'thin'}, right:{style:'thin'}};\n  }\n\n  const employees = allEmployees;\n  const lastEmployeeRow = 4 + employees.length;\n  const row4 = ws2.getRow(4);\n  row4.height = 27.75;\n  row4.getCell(1).value = '';\n  row4.getCell(2).value = {formula:`COUNTA(B5:B${lastEmployeeRow})&\"명\"`};\n  row4.getCell(3).value = {formula:`SUM(C5:C${lastEmployeeRow})`};\n  for (let day=1; day\u003c=daysInMonth; day++){\n    const c = firstDayCol+day-1;\n    const L = colLetter(c);\n    row4.getCell(c).value = {formula:`COUNTIF(${L}5:${L}${lastEmployeeRow},\"O\")`};\n  }\n  for (let c=1; c\u003c=lastDayCol; c++){\n    const cell = row4.getCell(c);\n    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFF99'}};\n    cell.font = {name:'맑은 고딕', size:9, bold:true};\n    cell.alignment = {horizontal:'center', vertical:'center'};\n    cell.border = {top:{style:'double'}, bottom:{style:'medium'}, left:{style:c===1?'medium':'thin'}, right:{style:'thin'}};\n  }\n  const lastDayColLetter = colLetter(lastDayCol);\n  const totalColLetter = colLetter(totalCol);\n  row4.getCell(totalCol).value = {formula:`SUM(D4:${lastDayColLetter}4)`};\n  row4.getCell(checkCol).value = {formula:`IF(${totalColLetter}4=C4,\"Ok\",\"안맞아요\")`};\n  row4.getCell(checkCol).font = {name:'맑은 고딕', size:9, bold:true, color:{argb:'FF0000FF'}};\n  row4.getCell(checkCol).alignment = {horizontal:'center', vertical:'center'};\n\n  employees.forEach((emp, idx)=>{\n    const rr = 5+idx;\n    const row = ws2.getRow(rr);\n    row.height = 20;\n    row.getCell(1).value = idx+1;\n    row.getCell(1).alignment = {horizontal:'center', vertical:'center'};\n    row.getCell(1).border = {top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'medium'}, right:{style:'thin'}};\n    row.getCell(2).value = emp;\n    row.getCell(2).alignment = {horizontal:'center', vertical:'center'};\n    row.getCell(2).border = {top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'}};\n    row.getCell(3).value = {formula:`COUNTIF(D${rr}:${lastDayColLetter}${rr},\"O\")`};\n    row.getCell(3).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFCCFFFF'}};\n    row.getCell(3).alignment = {horizontal:'center', vertical:'center'};\n    row.getCell(3).border = {top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'}};\n    const qualSet = mealQualify[emp] || new Set();\n    for (let day=1; day\u003c=daysInMonth; day++){\n      const c = firstDayCol+day-1;\n      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;\n      const cell = row.getCell(c);\n      cell.value = qualSet.has(dateStr) ? 'O' : '';\n      cell.font = {name:'맑은 고딕', size:9, bold:true, color:{argb:'FF2F6FED'}};\n      cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFFFF'}};\n      cell.alignment = {horizontal:'center', vertical:'center'};\n      cell.border = {top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style: c===lastDayCol?'medium':'thin'}};\n    }\n  });\n\n  /* ---------- Sheet3 : 초과근무내역 ---------- */\n  const ws3 = wb.addWorksheet('초과근무내역', {views:[{showGridLines:false, view:'pageBreakPreview'}]});\n  ws3.columns = [\n    {width:6.5}, {width:12}, {width:14}, {width:20}, {width:10},\n    {width:8}, {width:9}, {width:9}, {width:10}, {width:32}\n  ];\n  ws3.mergeCells('A1:J1');\n  const t3 = ws3.getCell('A1');\n  t3.value = `초과근무 내역(${year}. ${month}.)`;\n  t3.font = {name:'맑은 고딕', size:18, bold:true};\n  t3.alignment = {horizontal:'center', vertical:'center'};\n  ws3.getRow(1).height = 44.25;\n\n  const headers3 = ['No.','근무일자','부서','직급','성명','휴일구분','출근(실제)','퇴근(실제)','총초과(분)','근무내역'];\n  const hRow3 = ws3.getRow(2);\n  headers3.forEach((h,i)=>{\n    const c = hRow3.getCell(i+1);\n    c.value = h;\n    c.font = {name:'맑은 고딕', size:11, bold:true};\n    c.alignment = {horizontal:'center', vertical:'center'};\n    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFFCC'}};\n    c.border = {top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'}};\n  });\n  hRow3.height = 24;\n\n  const sortedRecords = records.slice().sort((a,b)=>{\n    if (a.dateStr \u003c b.dateStr) return -1;\n    if (a.dateStr > b.dateStr) return 1;\n    return 0;\n  });\n  sortedRecords.forEach((rec, idx)=>{\n    const rr = idx+3;\n    const row = ws3.getRow(rr);\n    row.height = 22.5;\n    const vals = [idx+1, rec.dateStr, rec.dept, rec.rank, rec.name, rec.holiday, rec.checkin, rec.checkout, rec.otmin, rec.detail];\n    const aligns = ['center','center','left','left','left','center','center','center','right','left'];\n    vals.forEach((val,i)=>{\n      const c = row.getCell(i+1);\n      c.value = val;\n      c.font = {name:'맑은 고딕', size:10};\n      c.alignment = {horizontal:aligns[i], vertical:'center'};\n      c.border = {bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'}};\n    });\n  });\n\n  return await wb.xlsx.writeBuffer();\n}\n\u003c/script>\n\n\n\n\u003cscript>\n/* 도구 페이지 ↔ 셸 연결 (빌드 때 각 도구 안에 끼워 넣습니다)\n   · 내용 높이를 셸에 알려 iframe 높이를 맞춘다\n   · 셸의 다크 모드 / 보고 있는 화면 영역(모달 위치)을 받아 적용한다\n   · 셸 '설정'에서 저장한 API 키를 도구가 읽을 수 있게 한다  → window.suiteKey('kakao') */\n(function(){\n  var TOOL = (document.querySelector('meta[name=\"tool-id\"]') || {}).content || '';\n  var root = document.documentElement;\n  document.body.classList.add('tool');\n\n  function applyTheme(dark){ root.classList.toggle('dark', !!dark); }\n  function applyViewport(v){\n    if(!v) return;\n    root.style.setProperty('--vp-top', Math.max(0, v.top) + 'px');\n    root.style.setProperty('--vp-h', Math.max(200, v.height) + 'px');\n  }\n  try{ applyTheme(window.parent.document.documentElement.classList.contains('dark')); }catch(e){}\n\n  window.addEventListener('message', function(e){\n    var d = e.data;\n    if(!d) return;\n    if('__theme' in d) applyTheme(d.__theme === 'dark');\n    if(d.__viewport) applyViewport(d.__viewport);\n  });\n\n  /* ---- 높이 알림 ---- */\n  var last = -1, raf = 0;\n  function post(){\n    raf = 0;\n    var b = document.body;\n    var h = Math.ceil(b.getBoundingClientRect().height + parseFloat(getComputedStyle(b).marginTop || 0) + parseFloat(getComputedStyle(b).marginBottom || 0));\n    if(h === last) return;\n    last = h;\n    try{ window.parent.postMessage({__tabHeight:h, __tabId:TOOL}, '* nter;cursor:pointer;\n    display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,background .15s,box-shadow .15s;\n  }\n  .dropzone:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}\n  .dropzone.active{border-color:var(--accent);background:var(--accent-soft);}\n  .drop-icon{\n    width:52px;height:52px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);\n    display:flex;align-items:center;justify-content:center;margin-bottom:4px;transition:transform .15s ease;\n  }\n  .dropzone:hover .drop-icon{transform:translateY(-2px);}\n  .scantrack{position:absolute;inset:0;pointer-events:none;overflow:hidden;}\n  .scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanmove 1.1s linear infinite;}\n  .droptext{font-size:14.5px;font-weight:600;color:var(--text);margin-top:2px;}\n  .dropsub{font-size:12.5px;color:var(--text-tertiary);}\n\n  /* ---------- 툴바 ---------- */\n  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;flex-wrap:wrap;gap:12px;}\n  .stats{display:flex;gap:8px;font-size:12.5px;font-weight:600;flex-wrap:wrap;}\n  .badge{padding:5px 11px;background:var(--surface-hover);border-radius:20px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;}\n  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}\n  .toolbtns{display:flex;gap:8px;flex-wrap:wrap;}\n\n  button{cursor:pointer;font:inherit;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-size:13px;\n    font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s ease,box-shadow .15s ease,transform .05s ease;}\n  button:active{transform:translateY(1px);}\n  button:disabled{opacity:.45;cursor:not-allowed;transform:none;}\n  .btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-xs);}\n  .btn-primary:hover:not(:disa o{margin-bottom:16px;}\nheader.hero .sub{margin:0;}\n\u003c/style>\n\u003cmeta name=\"tool-id\" content=\"utility\">\n\u003cstyle id=\"suite-theme\">\n/* ==========================================================================\n   서무 업무 자동화 — 공통 디자인 시스템\n   셸(index)과 모든 도구 페이지가 이 파일 하나를 공유합니다.\n   · 색/글꼴/모서리는 아래 토큰(:root)만 바꾸면 전체가 함께 바뀝니다.\n   · 도구마다 다르게 부르던 클래스 이름(.btn-primary / .run / .btn.outline …)도\n     여기서 한 모양으로 묶습니다. 도구 CSS 뒤에 불러오므로 같은 점수면 이 파일이 이깁니다.\n   ========================================================================== */\n\n/* ---------- 1. 토큰 ---------- */\n:root{\n  --bg:#F8FAFC;\n  --surface:#FFFFFF;\n  --surface-2:#F8FAFC;\n  --surface-3:#EEF1F5;\n  --hover:#F3F4F6;\n  --border:#E5E7EB;\n  --border-strong:#D5D9E0;\n\n  --text:#111827;\n  --text-2:#6B7280;\n  --text-3:#9CA3AF;\n\n  --primary:#2563EB;\n  --primary-hover:#1D4ED8;\n  --primary-tint:#EFF4FE;\n  --primary-tint-strong:#E1EAFD;\n  --primary-border:#C7D9FC;\n\n  --success:#16A34A;\n  --success-tint:#EAFBF2;\n  --warning:#D97706;\n  --warning-tint:#FDF1DE;\n  --danger:#DC2626;\n  --danger-hover:#B91C1C;\n  --danger-tint:#FDEEEE;\n\n  --radius-sm:8px;\n  --radius-btn:10px;\n  --radius-input:10px;\n  --radius-card:16px;\n  --radius-modal:20px;\n\n  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);\n  --shadow-pop:0 16px 40px rgba(17,24,39,.16), 0 2px 8px rgba(17,24,39,.06);\n\n  --font:'Noto Sans KR','Pretendard Variable','Segoe UI','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;\n  --mono:'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;\n\n  /* 보고 있는 화면 영역(iframe 안에서 모달·토스트 위치를 잡을 때 셸이 갱신) */\n  --vp-top:0px;\n  --vp-h:100vh;\n\n  color-scheme:light;\n}\nhtml.dark{\n  --bg:#111418;\n  --surface:#181C22;\n  --surface-2:#1C2128;\n  --surface-3:#242A33;\n  --hover:#20242B;\n  --border:#262B33;\n  --border-strong:#343B46;\n\n  --text:#E8EAED;\n  --text-2:#9AA2AD;\n  --text-3:#6B7280;\n\n  --primary:#3B82F6;\n  --primary-hover:#60A5FA;\n  --primary-tint:#152238;\n  --primary-tint-strong:#1B2B47;\n  --primary-border:#27406B;\n\n  --success:#22C55E;\n  --success-tint:#0F2A1D;\n  --warning:#F59E0B;\n  --warning-tint:#2E2410;\n  --danger:#EF4444;\n  --danger-hover:#F87171;\n  --danger-tint:#301616;\n\n  --shadow-card:0 1px 2px rgba(0,0,0,.4);\n  --shadow-pop:0 16px 40px rgba(0,0,0,.55);\n  color-scheme:dark;\n}\n\n/* ---------- 2. 바탕 ---------- */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-font-smoothing:antialiased;}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--text);\n  font-family:var(--font);\n  font-size:14px;\n  line-height:1.55;\n}\n::selection{background:var(--primary-tint-strong);color:var(--text);}\na{color:var(--primary);}\n:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}\nsvg{display:block;}\nhr{border:none;border-top:1px solid var(--border);}\ncode{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:5px;}\n::-webkit-scrollbar{width:10px;height:10px;}\n::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box;}\n::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:2px solid transparent;}\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}\n}\n\n/* 도구 페이지 공통 틀: 셸이 제목을 보여 주므로 도구는 본문만 가진다 */\nbody.tool{background:transparent;padding:0 0 40px;}\nbody.tool .wrap,\nbody.tool .page{max-width:none;margin:0;padding:0;}\n\n/* ---------- 3. 카드 / 패널 ---------- */\nbody .card,\nbody .panel,\nbody .step{\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:var(--radius-card);\n  box-shadow:var(--shadow-card);\n  padding:22px 24px;\n  margin-bottom:16px;\n}\nbody .card h2,\nbody .panel h2{\n  font-size:15px;font-weight:700;letter-spacing:-.01em;\n  text-transform:none;color:var(--text);margin:0 0 6px;\n}\nbody .card .sub,\nbody .panel .sub,\nbody .section-sub,\nbody .step-desc{color:var(--text-2);font-size:13px;line-height:1.65;}\nbody .card .sub{margin-bottom:16px;}\n\n/* ---------- 4. 버튼 ---------- */\nbody .btn,\nbody .btn-primary,\nbody .btn-secondary,\nbody .btn-outline,\nbody .btn-ghost,\nbody .btn-export,\nbody button.run{\n  --b-bg:var(--primary);--b-fg:#fff;--b-bd:var(--primary);--b-bg-h:var(--primary-hover);--b-bd-h:var(--primary-hover);\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  min-height:40px;padding:0 16px;\n  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;\n  border-radius:var(--radius-btn);\n  background:var(--b-bg);color:var(--b-fg);border:1px solid var(--b-bd);\n  box-shadow:none;text-decoration:none;cursor:pointer;\n  transition:background .15s ease,border-color .15s ease,color .15s ease,transform 60ms ease;\n}\nbody .btn:hover:not(:disabled):not(.disabled),\nbody .btn-primary:hover:not(:disabled),\nbody .btn-secondary:hover:not(:disabled),\nbody .btn-outline:hover:not(:disabled),\nbody .btn-ghost:hover:not(:disabled),\nbody .btn-export:hover:not(:disabled),\nbody button.run:hover:not(:disabled){background:var(--b-bg-h);border-color:var(--b-bd-h);color:var(--b-fg-h,var(--b-fg));box-shadow:none;}\nbody .btn:active:not(:disabled),\nbody .btn-primary:active:not(:disabled),\nbody button.run:active:not(:disabled){transform:translateY(1px);}\nbody .btn:disabled,body .btn[disabled],body .btn.disabled,\nbody .btn-primary:disabled,body .btn-secondary:disabled,body .btn-outline:disabled,\nbody .btn-ghost:disabled,body .btn-export:disabled,body button.run:disabled{\n  opacity:.5;cursor:not-allowed;\n}\n/* 보조(연한 파랑) */\nbody .btn.outline,\nbody .btn-secondary,\nbody .btn-outline{--b-bg:var(--primary-tint);--b-fg:var(--primary);--b-bd:transparent;--b-bg-h:var(--primary-tint-strong);--b-bd-h:transparent;}\n/* 낮은 우선순위(테두리) */\nbody .btn.ghost,\nbody .btn-ghost{--b-bg:var(--surface);--b-fg:var(--text-2);--b-bd:var(--border-strong);--b-bg-h:var(--hover);--b-bd-h:var(--border-strong);--b-fg-h:var(--text);}\n/* 되돌릴 수 없는 동작 */\nbody .btn.danger{--b-bg:var(--surface);--b-fg:var(--danger);--b-bd:var(--danger);--b-bg-h:var(--danger-tint);--b-bd-h:var(--danger);}\n/* 내려받기 완료형(초록) */\nbody .btn-export{--b-bg:var(--success);--b-fg:#fff;--b-bd:var(--success);--b-bg-h:var(--success);--b-bd-h:var(--success);}\nbody .btn-export:hover:not(:disabled){filter:brightness(.93);}\n/* 크기 */\nbody .btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;gap:5px;}\nbody .btn-lg,body button.run{min-height:46px;font-size:14.5px;}\nbody button.run{width:100%;}\nbody .btn svg,body button.run svg{flex:none;}\n\n/* 아이콘 단추 */\nbody .icon-btn,\nbody .btn-icon{\n  display:inline-flex;align-items:center;justify-content:center;flex:none;\n  width:32px;height:32px;min-height:0;padding:0;\n  border-radius:var(--radius-sm);border:1px solid transparent;\n  background:transparent;color:var(--text-2);cursor:pointer;box-shadow:none;\n  transition:background .15s ease,color .15s ease;\n}\nbody .icon-btn:hover,body .btn-icon:hover{background:var(--hover);color:var(--text);}\nbody .icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);}\n\n/* ---------- 5. 입력 ---------- */\nbody input[type=text],\nbody input[type=number],\nbody input[type=password],\nbody input[type=search],\nbody input[type=date],\nbody input[type=time],\nbody input[type=month],\nbody input[type=email],\nbody input[type=tel],\nbody input:not([type]),\nbody select,\nbody textarea{\n  font-family:inherit;font-size:13.5px;color:var(--text);\n  background-color:var(--surface);\n  border:1px solid var(--border-strong);\n  border-radius:var(--radius-input);\n  transition:border-color .15s ease,box-shadow .15s ease;\n}\nbody input::placeholder,body textarea::placeholder{color:var(--text-3);}\nbody input:hover:not(:focus):not([readonly]),body select:hover:not(:focus),body textarea:hover:not(:focus){border-color:var(--text-3);}\nbody input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-strong);}\nbody input[readonly]{background-color:var(--surface-2);color:var(--text-2);}\nbody select{\n  appearance:none;-webkit-appearance:none;\n  background-image:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpolyline points='6 9 12 15 18 9'/>\u003c/svg>\");\n  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;\n  padding-right:32px !important;cursor:pointer;\n}\nbody input[type=file]{display:none;}\nbody input[type=checkbox],body input[type=radio]{accent-color:var(--primary);}\nbody label{color:inherit;}\n\n/* ---------- 6. 표 ---------- */\nbody table{border-collapse:collapse;font-variant-numeric:tabular-nums;}\nbody th{\n  background:var(--surface-2);color:var(--text-2);\n  font-weight:600;font-size:12px;\n  border-bottom:1px solid var(--border-strong);\n}\nbody td{border-color:var(--border);}\nbody tbody tr:hover{background:var(--hover);}\nbody .tablewrap,\nbody .table-scroll,\nbody .preview-wrap{\n  border:1px solid var(--border);border-radius:var(--radius-input);background:var(--surface);\n}\nbody td input,body td select{background-color:transparent;}\nbody td input:focus,body td select:focus{background-color:var(--surface);}\n\n/* ---------- 7. 업로드 영역 ---------- */\nbody .dropzone,\nbody .drop-zone,\nbody .opt-dropzone{\n  border:1.5px dashed var(--border-strong);\n  border-radius:var(--radius-card);\n  background:var(--surface-2);\n  color:var(--text);\n  transition:border-color .15s ease,background .15s ease;\n}\nbody .dropzone:hover,body .drop-zone:hover,body .opt-dropzone:hover,\nbody .dropzone.drag,body .dropzone.dragover,body .dropzone.active,body .dropzone.hover,\nbody .drop-zone.drag,body .drop-zone.dragover,body .opt-dropzone.drag{\n  border-color:var(--primary);background:var(--primary-tint);box-shadow:none;\n}\n\n/* ---------- 8. 안내 / 칩 / 배지 ---------- */\nbody .hint,\nbody .callout,\nbody .note,\nbody .tpl-status,\nbody .rules-note{\n  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);\n  border-radius:var(--radius-input);\n}\nbody .hint-warn{background:var(--warning-tint);border-color:transparent;color:var(--warning);}\nbody .caption,body .small{color:var(--text-3);}\nbody .pill,body .opt-badge,body .step-badge,body .step-no{border-radius:999px;}\nbody .step-badge,body .step-no{background:var(--primary);color:#fff;}\nbody .opt-badge{background:var(--surface-3);color:var(--text-2);}\nbody .summary-box,body .summary-card{\n  background:var(--primary-tint);border:1px solid transparent;border-radius:var(--radius-input);\n}\nbody .summary-box .label,body .summary-card .lbl{color:var(--text-2);}\nbody .summary-box .val,body .summary-card .num{color:var(--primary);}\nbody .summary-card.highlight{background:var(--primary);}\nbody .summary-card.highlight .num,body .summary-card.highlight .lbl{color:#fff;}\n\n/* ---------- 9. 분할 버튼(세그먼트) ---------- */\nbody .typetabs,\nbody .segmented{\n  background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-btn);padding:3px;\n}\nbody .typebtn,\nbody .segmented-option span{color:var(--text-2);border-radius:8px;}\nbody .typebtn:hover{background:var(--hover);color:var(--text);}\nbody .typebtn.active,\nbody .segmented-option input:checked + span{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-card);font-weight:600;}\n\n/* ---------- 10. 모달 · 토스트 · 확대 보기 ----------\n   iframe이 내용 높이만큼 길어지므로, 중앙 정렬을 \"보고 있는 화면 영역\" 기준으로 잡는다. */\nbody .modal-bg,\nbody .lightbox{\n  position:fixed;left:0;right:0;inset-inline:0;\n  top:var(--vp-top);bottom:auto;height:var(--vp-h);\n  background:rgba(10,12,18,.5);backdrop-filter:blur(2px);\n}\nbody .modal{\n  max-height:calc(var(--vp-h) - 48px);\n  background:var(--surface);color:var(--text);\n  border-radius:var(--radius-modal);box-shadow:var(--shadow-pop);\n}\nbody .modal h3{border-bottom:1px solid var(--border);}\nbody .modal-actions{border-top:1px solid var(--border);}\nbody .toast{\n  top:calc(var(--vp-top) + var(--vp-h) - 76px);bottom:auto;\n  background:var(--text);color:var(--bg);border-radius:var(--radius-btn);box-shadow:var(--shadow-pop);\n}\n\n/* ---------- 11. 진행 표시 ---------- */\nbody .progress-track{background:var(--border);border-radius:999px;}\nbody .progress-fill{background:var(--primary);}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n\n  \u003cdiv class=\"topbar\">\n    \u003cdiv class=\"brand\">\n      \u003cdiv class=\"brand-mark\" aria-hidden=\"true\">\n        \u003csvg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 11l3 3L22 4\"/>\u003cpath d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>\u003c/svg>\n      \u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"brand-name\">고지서 인식기\u003c/div>\n        \u003cdiv class=\"brand-sub\">AI OCR → 거래처입력 양식\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"eyebrow\" id=\"eyebrowText\">익산시 상·하수도 요금 고지서 인식 · AI OCR → 거래처입력 양식\u003c/div>\n    \u003ch1 id=\"titleText\">상하수도요금 고지서 자동 인식기\u003c/h1>\n    \u003cp class=\"sub\" id=\"subText\">\u003c/p>\n  \u003c/header>\n\n  \u003cdiv class=\"panel\">\n    \u003ch2>고지서 종류\u003c/h2>\n    \u003cdiv class=\"typetabs\" id=\"typeTabs\">\u003c/div>\n    \u003cdiv class=\"type-hint\">종류를 바꾸면 표에 담긴 인식 결과가 초기화돼요. 먼저 필요한 종류를 고른 뒤 고지서를 올려주세요.\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\">\n    \u003ch2>AI 인식 설정\u003c/h2>\n    \u003cdiv class=\"field-row\">\n      \u003cdiv class=\"field\">\n        \u003clabel for=\"provider\">AI 공급자\u003c/label>\n        \u003cselect id=\"provider\">\n          \u003coption value=\"gemini\" selected>Google Gemini\u003c/option>\n          \u003coption value=\"claude\">Claude (Anthropic)\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"field\" id=\"geminiModelWrap\">\n        \u003clabel for=\"geminiModel\">Gemini 모델\u003c/label>\n        \u003cselect id=\"geminiModel\">\n          \u003coption value=\"gemini-3.6-flash\" selected>gemini-3.6-flash (권장, 최신)\u003c/option>\n          \u003coption value=\"gemini-3.1-flash-lite\">gemini-3.1-flash-lite (무료 한도 가장 넉넉함)\u003c/option>\n          \u003coption value=\"gemini-2.5-flash\">gemini-2.5-flash (2026-10 종료 예정)\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"field\" style=\"flex:1 1 260px;\">\n        \u003clabel for=\"apikey\">API 키\u003c/label>\n        \u003cinput type=\"password\" id=\"apikey\" placeholder=\"여기에 API 키를 붙여넣으세요\">\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"caption\">\n      키는 서버로 보내지 않아요. 왼쪽 메뉴 \u003cb>설정\u003c/b>에 저장해 두면 자동으로 채워지고, 저장하지 않으면 새로고침할 때 다시 입력해야 합니다.\n      \u003cb>Gemini 키는 \u003ca href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">Google AI Studio\u003c/a>\u003c/b>, \u003cb>Claude 키는 \u003ca href=\"https://platform.claude.com\" target=\"_blank\" rel=\"noopener\">Claude 개발자 콘솔\u003c/a>\u003c/b>에서 발급받을 수 있어요.\n    \u003c/div>\n\n    \u003cdetails class=\"advanced\" id=\"advancedDetails\">\n      \u003csummary>고급 설정 — 요청 간격 · 토큰 절약 · 정밀 확대 인식\u003c/summary>\n      \u003cdiv class=\"advanced-body\">\n        \u003cdiv class=\"advanced-row\">\n          \u003cdiv class=\"advanced-item\">\n            \u003clabel for=\"pacing\" style=\"font-size:12px;font-weight:600;color:var(--text-secondary);\">요청 간격(초)\u003c/label>\n            \u003cinput type=\"number\" id=\"pacing\" min=\"0.5\" step=\"0.5\" value=\"7\">\n            \u003cdiv class=\"caption\">Gemini 무료 등급은 분당 요청 수(RPM) 제한이 있어요. 간격을 늘릴수록 429 오류가 줄어듭니다.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"advanced-item\">\n            \u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" id=\"tokenSaver\">토큰 절약 모드\u003c/label>\n            \u003cdiv class=\"caption\">전체 페이지 이미지 해상도를 낮추고 확대 크롭도 줄여서, Gemini 무료 등급 사용량을 아껴요.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"advanced-item\">\n            \u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" id=\"useCrops\" checked>정밀 확대 인식 사용\u003c/label>\n            \u003cdiv class=\"caption\">계좌·금액 부분을 잘라 확대한 이미지를 함께 보내 숫자 인식 정확도를 높여요.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"advanced-item\">\n            \u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" id=\"verifyAcct\">계좌번호 2단계 재확인 (전기요금 · 장당 API 호출 +1회)\u003c/label>\n            \u003cdiv class=\"caption\">기본은 꺼짐(호출 1회). 켜면 계좌 부분만 고해상도로 한 번 더 읽어 비교합니다.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/details>\n\n    \u003cdiv class=\"callout\">\n      \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4M12 8h.01\"/>\u003c/svg>\n      \u003cspan id=\"accountNotice\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"dropzone\" class=\"dropzone\">\n    \u003cdiv class=\"scantrack\" id=\"scantrack\">\u003c/div>\n    \u003cdiv class=\"drop-icon\">\n      \u003csvg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text-secondary)\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12\"/>\u003c/svg>\n    \u003c/div>\n    \u003cdiv class=\"droptext\" id=\"dropText\">상하수도요금 고지서 이미지 또는 PDF를 끌어다 놓거나 클릭해서 선택하세요\u003c/div>\n    \u003cdiv class=\"dropsub\" id=\"dropSub\">여러 장 모은 PDF는 페이지별로 자동 분리됩니다 · JPG, PNG, PDF\u003c/div>\n    \u003cinput type=\"file\" id=\"fileInput\" accept=\"image/*,application/pdf\" multiple style=\"display:none\">\n  \u003c/div>\n  \u003cdiv class=\"caption\" id=\"pdfStatus\" style=\"display:none;margin-top:8px;\">\u003c/div>\n\n  \u003cdiv class=\"toolbar\" id=\"toolbar\" style=\"display:none;\">\n    \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n    \u003cdiv class=\"toolbtns\">\n      \u003cbutton class=\"btn-ghost\" id=\"clearBtn\">전체 지우기\u003c/button>\n      \u003cbutton class=\"btn-primary\" id=\"processBtn\">일괄 인식 시작\u003c/button>\n      \u003cbutton class=\"btn-export\" id=\"exportBtn\">엑셀 내보내기 (거래처입력 양식)\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"tablewrap\" id=\"tablewrap\" style=\"display:none;\">\n    \u003ctable>\n      \u003cthead>\n        \u003ctr id=\"headRow\">\u003c/tr>\n      \u003c/thead>\n      \u003ctbody id=\"bodyRows\">\u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\n  \u003cdiv class=\"empty\" id=\"emptyState\">\n    \u003cdiv class=\"empty-icon\">\n      \u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text-tertiary)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"/>\u003ccircle cx=\"9\" cy=\"9\" r=\"2\"/>\u003cpath d=\"M21 15l-5-5L5 21\"/>\u003c/svg>\n    \u003c/div>\n    \u003cp>아직 올라온 고지서가 없어요. 위 영역에 이미지나 PDF를 올려보세요.\u003c/p>\n  \u003c/div>\n\n\u003c/div>\n\n\u003cdiv class=\"lightbox\" id=\"lightbox\">\u003cimg id=\"lightboxImg\" src=\"\">\u003c/div>\n\n\u003cscript>\n// ===================== 거래처입력 헤더 (원본 양식과 100% 동일, 시트 구조 유지) =====================\n// 예금주명 10자 제한 (e호조 등 회계 시스템 호환용) ------------------------------------\n// 상하수도·전기·통신요금 모두 공통으로 적용: 기호를 포함해 10자를 넘는 예금주명은\n// 그대로 두면 회계 시스템에 넘어갈 때 잘리거나 반려될 수 있으므로, 이 도구 안에서 미리 10자 이내로 맞춘다.\nconst HOLDER_MAX_LEN = 10;\nfunction clampHolder(name){\n  const s = (name ?? \"\").toString();\n  return s.length > HOLDER_MAX_LEN ? s.slice(0, HOLDER_MAX_LEN) : s;\n}\n// \"한전(기관명)\" 형태는 기관명 길이가 들쭉날쭉해서 통째로 자르면 괄호가 깨질 수 있다.\n// 그래서 괄호는 항상 보존하고, 안쪽 기관명만 남는 자리만큼 줄인다.\n// e호조에 실제로 입력되는 예금주명은 \"한전(익산시청  )\"처럼 괄호 앞에서 항상 정확히 10자를 채운다.\n// (예: 익산시청=4자 → 뒤에 공백 2개, 익산시=3자 → 뒤에 공백 3개) 기관명이 짧으면 남는 자리를\n// 공백으로 채워서 항상 총 10자를 맞추고, 길면 지금처럼 자르기만 한다. 이 값을 그대로 엑셀에 쓰므로\n// 엑셀 출력에도 공백이 그대로 반영된다.\nfunction buildKepcoHolder(agency){\n  const prefix = \"한전(\", suffix = \")\";\n  const trimmedAgencyBudget = HOLDER_MAX_LEN - prefix.length - suffix.length;\n  if (!agency) return clampHolder(\"한국전력공사\");\n  const agencyStr = agency.toString();\n  const trimmedAgency = agencyStr.length > trimmedAgencyBudget\n    ? agencyStr.slice(0, trimmedAgencyBudget)\n    : agencyStr.padEnd(trimmedAgencyBudget, \" \"); // 짧으면 공백으로 채워 괄호 앞까지 항상 10자를 맞춘다\n  return `${prefix}${trimmedAgency}${suffix}`;\n}\n\nconst HEADERS = [\n  \"거래처명\\n(100자리이하)\\n(필수입력)\",\n  \"거래처구분\\n(필수입력)\",\n  \"사업자등록번호\\n(10자리)\",\n  \"생년월일\\n(8자리)\",\n  \"입금유형\\n(선택)\",\n  \"은행\\n(선택)\",\n  \"예금주명\\n(100자리이하)\",\n  \"계좌번호\\n(30자리이하)\",\n  \"공급가액\\n(17자리이하)\\n(필수입력)\",\n  \"부가세액\\n(17자리이하)\",\n  \"공제액\\n(금액 0원으로 고정)\",\n  \"지출액\\n(17자리이하)\",\n  \"지로번호\\n(19자리이하)\",\n  \"CMS번호\\n(20자리이하)\",\n  \"대표채주\\n(Y/N)\",\n  \"대표자명\\n(100자리)\",\n  \"우편번호\\n(5자리)\",\n  \"기본주소\\n(75자이하)\",\n  \"상세주소\\n(75자이하)\",\n  \"전화번호\\n(30자리이하)\",\n  \"휴대폰번호\\n(20자리이하)\",\n  \"입금명세(100자리)\"\n];\n// 내부 필드 키 (HEADERS와 같은 순서)\nconst FIELD_KEYS = [\"name\",\"type\",\"bizno\",\"birth\",\"paytype\",\"bank\",\"holder\",\"account\",\"supply\",\"vat\",\"deduct\",\"payout\",\"giro\",\"cms\",\"repFlag\",\"repName\",\"zip\",\"addr1\",\"addr2\",\"tel\",\"mobile\",\"memo\"];\nconst FIELD_WIDTH = { name:130, type:90, bizno:100, birth:80, paytype:90, bank:130, holder:110, account:150, supply:90, vat:80, deduct:70, payout:90, giro:90, cms:90, repFlag:60, repName:90, zip:70, addr1:130, addr2:130, tel:100, mobile:100, memo:150 };\n\n// ===================== 은행코드 참고자료 (원본 시트와 동일) =====================\nconst BANK_CODES = [\n\"001:한국은행\",\"002:산업은행\",\"003:기업은행\",\"004:국민은행\",\"007:수협은행\",\"008:수출입은행\",\n\"011:농협은행\",\"012:지역 농축협\",\"020:우리은행\",\"023:SC제일은행\",\"027:한국씨티은행\",\"031:대구은행\",\n\"032:부산은행\",\"034:광주은행\",\"035:제주은행\",\"037:전북은행\",\"039:경남은행\",\"045:새마을금고중앙회\",\n\"048:신협\",\"050:상호저축은행\",\"051:기타 외국계은행(중국 교통은행 등)\",\"052:모간스탠리은행\",\"054:HSBC은행\",\n\"055:도이치은행\",\"057:제이피모간체이스은행\",\"058:미즈호은행\",\"059:미쓰비시도쿄UFJ은행\",\"060:BOA은행\",\n\"061:비엔피파리바은행\",\"062:중국공상은행\",\"063:중국은행\",\"064:산림조합중앙회\",\"065:대화은행\",\"067:중국건설은행\",\n\"071:우체국\",\"076:신용보증기금\",\"077:기술보증기금\",\"081:KEB하나은행\",\"088:신한은행\",\"089:케이뱅크\",\n\"090:카카오뱅크\",\"092:토스뱅크\",\"093:한국주택금융공사\",\"094:서울보증보험\",\"209:유안타증권\",\"218:KB증권\",\n\"221:상상인증권\",\"223:리딩투자증권\",\"224:BNK투자증권\",\"225:IBK투자증권\",\"226:KB증권\",\"227:KTB투자증권\",\n\"238:미래에셋증권\",\"240:삼성증권\",\"243:한국투자증권\",\"247:NH투자증권\",\"261:교보증권\",\"262:하이투자증권\",\n\"263:현대차투자증권\",\"264:키움증권\",\"265:이베스트투자증권\",\"266:SK증권\",\"267:대신증권\",\"268:메리츠종합금융증권\",\n\"269:한화투자증권\",\"270:하나금융투자\",\"271:토스증권\",\"278:신한금융투자\",\"279:DB금융투자\",\"280:유진투자증권\",\n\"287:메리츠종합금융증권\",\"288:카카오페이증권\",\"289:NH투자증권\",\"290:부국증권\",\"291:신영증권\",\"292:케이프투자증권\",\n\"294:한국포스증권\"\n];\n\n// ===================== 거래처입력설명 시트 (원본과 동일) =====================\nconst DESC_ROWS = [\n  [null, \"거래처입력 엑셀 설명\", null, null, null, null, null, \"ver2.0\"],\n  [null, \"1. 입력폼을 기준으로 입력하십시요. (거래처입력 Sheet)\\n2. 1줄이상의 자료를 입력시 2번째줄의 입력폼을 복사하셔야 합니다.\\n3. 입금유형은 10:계좌이체 처럼 숫자:입금유형  으로 이루어지며 직접 입력하게 될 경우 숫자코드부분은 필히 입력이 되어야 합니다.\\n4. 은행정보는 011:농협(중앙회) 처럼 숫자:은행명  으로 이루어지며 직접 입력하게 될 경우 숫자 세자리 코드부분은 필히 입력이 되어야 합니다.\\n5. 사업자번호란에 주민등록번호를 입력할경우에 오류가 발생하며 주민등록번호자리수는 13자리를 초과할 수 없습니다.\\n6. 금액입력란에 -이 입력될 경우에 오류가 발생하게 되므로 회계서식으로 셀서식 변경 하셨을 경우에  -으로 표시된 부분은 금액을 삭제하여야 합니다.\\n7. 입금명세가 추가되었으며 거래처별로 입금명세를 입력하실 수 있으며 입력하지 않으셨을 경우에는 지출결의에 입력된 입금명세가 일괄적용됩니다.\\n8. 우편번호 점검 자리수가 6자리에서 5자리로 변경되었습니다.(ver1.6 -> ver1.7)\\n9. 거래처구분, 사업자등록번호, 생년월일 컬럼의 자리가 조정되었습니다.(ver1.7 -> ver1.8)\\n10. 차세대 적용으로 버전이 변경되었습니다.(ver1.8->ver2.0)\"],\n  [null, ...HEADERS]\n];\n\n// ===================== 고지서 종류별 설정 =====================\n// 각 고지서 종류는: 화면 문구, 회계상 고정값(거래처명/사업자번호/은행 등),\n// AI 인식 프롬프트, 그리고 AI 응답을 표의 열에 매핑하는 함수를 갖는다.\n// 세 시트(거래처입력 / 거래처입력설명 / 은행코드_참고자료)의 서식은 두 종류 모두 동일하다.\n\nconst WATER_PROMPT = `너는 전북 익산시가 발행하는 \"상·하수도 요금 고지서\"(상·하수도 사용료 및 음식물수수료 납입영수증 포함)를 읽고, 회계 프로그램 \"거래처입력\" 양식에 넣을 값을 정확히 추출하는 전문 OCR 보정 엔진이다.\n\n한 장의 고지서 안에는 같은 내용이 위쪽(고지서 본문)과 아래쪽(납부자보관용 영수증 / 수납은행보관용 영수증)에 중복 인쇄되어 있을 수 있다. 아래 정보를 찾아라.\n\n- 수전번호 (예: 134-1597, 140-1443 처럼 세 자리-네 자리 형식)\n- 수용가 정보의 성명 (개인/기관/시설명)\n- 사용기간 (예: 06/16~07/15)\n- \"가상계좌[농협]\"(또는 \"가상계좌[농 협]\")이라고 표시된 줄의 계좌번호 — 같은 표에 \"가상계좌[전북은행]\" 줄도 나란히 있는데, 그건 사용하지 말고 반드시 농협 줄만 추출해라.\n- 총납부금액 — \"수납은행보관용\" 표의 \"총납부금액\" 값. 이 값은 \"납부금액\" 표의 \"합계\"란 중 \"납기내\" 금액과 같아야 한다. (당월+체납) 고지서처럼 체납액이 섞여 있어도 이 총납부금액(합계, 납기내 기준) 한 값만 추출하면 된다. \"납기후\" 금액은 사용하지 마라.\n\n가장 중요한 규칙: 이 고지서는 전북은행 가상계좌와 농협 가상계좌가 나란히 인쇄되어 있다. 반드시 \"농협\"이라고 표기된 줄의 가상계좌번호만 추출하고, 전북은행 번호는 절대 다른 항목에 넣지 마라.\n\n아래 키를 모두 포함한 JSON 객체 하나만 출력해라. 다른 설명, 마크다운, 코드블록 표시(\\`\\`\\`json 등)는 절대 포함하지 마라.\n\n{\n  \"수전번호\": \"고지서의 수전번호. 원문 표기 그대로 (예: 134-1597)\",\n  \"수용가명\": \"수용가 정보의 성명. 못 찾으면 빈 문자열\",\n  \"은행별계좌\": [{\"은행\":\"표에 인쇄된 은행명 글자 그대로 (예: 농 협, 기업은행)\",\"계좌번호\":\"그 은행명 바로 옆 계좌번호, 하이픈 표기 원문 그대로\"}],\n  \"농협계좌번호\": \"가상계좌[농협] 표에 적힌 계좌번호만. 하이픈 표기 원문 그대로. 표에 농협 줄이 아예 없으면 빈 문자열\",\n  \"총납부금액\": \"수납은행보관용 표의 총납부금액(=합계, 납기내 기준) 숫자만. 콤마와 '원' 글자는 제거\",\n  \"사용기간\": \"사용기간 원문 그대로 (예: 06/16~07/15)\",\n  \"비고\": \"인식이 불확실한 항목, 농협 계좌를 못 찾은 경우, 이 문서가 상하수도 고지서가 아닌 경우 등을 짧게 메모. 문제 없으면 빈 문자열\"\n}\n\n규칙:\n- 확실하지 않으면 값을 지어내지 말고 빈 문자열로 두고 비고에 이유를 남겨라.\n- 계좌번호와 금액은 특히 정확하게, 숫자를 두 번 확인하는 마음으로 읽어라. 숫자 0과 O, 1과 7 등을 혼동하지 마라.\n- 이 이미지는 여러 장을 스캔한 PDF의 한 페이지일 수 있다. 표지, 안내문 등 고지서 본문이 아닌 페이지라면 모든 필드를 빈 문자열로 두고 비고에 \"고지서 본문 아님\"이라고 적어라.\n- 한 페이지 안에 같은 내용이 위/아래로 중복 인쇄되어 있어도 값은 한 번만 뽑으면 된다 (둘 다 같은 값이어야 정상).\n- [숫자 6과 8 구분] 6과 8을 자주 혼동한다. 8은 위·아래 두 개의 동그라미(고리)가 모두 완전히 닫혀 있고 가운데에서 잘록하게 만난다. 6은 아래쪽 고리만 닫혀 있고 위쪽은 오른쪽 위가 열린 채 굽어 내려오는 획이다. 0은 하나의 큰 타원이고, 3은 왼쪽이 열려 있다. 계좌번호의 6과 8은 위쪽 고리가 닫혀 있는지를 보고 한 자리씩 다시 확인해라. 5·6·8·0·3은 특히 두 번 확인해라.\n- \"은행별계좌\"에는 표에 보이는 모든 은행 줄(농협 포함, 기업은행 포함)을 은행명·계좌번호 쌍으로 빠짐없이 적어라. 프로그램이 이 목록에서 농협 줄만 골라 쓴다.\n- 출력은 반드시 위 키를 모두 포함한 JSON 객체 하나뿐이어야 한다.`;\n\nconst ACCOUNT_VERIFY_PROMPT = `이 이미지는 고지서에서 은행별 가상계좌번호 표 부분을 확대해 잘라낸 것이다. 여러 은행 줄이 보일 수 있다.\n\"농협\"(또는 \"농 협\", \"농협은행\") 표기가 있는 줄의 계좌번호만 읽어라. 농협 줄이 보이지 않으면 빈 문자열을 반환해라.\n농협 줄 바로 위나 아래에 \"기업은행\" 줄이 붙어 있는 경우가 많고 둘을 자주 혼동한다. 먼저 각 줄의 은행명을 읽고, 계좌번호는 자기 은행명 바로 옆에 붙은 것만 짝지어라. \"기업은행\" 줄의 번호는 \"기업은행계좌번호\"에 따로 적고, 절대 \"계좌번호\"(농협)에 넣지 마라. 계좌번호의 은행명 글자에 \"농\"이 직접 보이지 않으면 계좌번호는 빈 문자열로 둬라.\n숫자는 반드시 한 자리씩 끊어서 읽어라. 특히 5와 6을 조심해라: 5는 윗변이 평평하고 아래쪽 배가 열린 모양, 6은 아래쪽에 닫힌 고리가 있는 모양이다. 또 6과 8도 조심해라: 8은 위·아래 두 고리가 모두 닫혀 있고, 6은 아래 고리만 닫히고 위쪽은 열린 획이다. 0·3·5·6·8은 위쪽 고리와 아래쪽 배가 닫혔는지 한 자리씩 확인해라.\n아래 JSON 객체 하나만 출력해라. 다른 설명이나 코드블록 표시는 넣지 마라.\n{\"자리별\":\"각 자릿수를 쉼표로 구분 (예: 3,0,1,-,1,2,...)\",\"계좌번호\":\"농협 줄의 번호, 하이픈 표기 원문 그대로\",\"은행표기\":\"계좌번호 바로 옆에 인쇄된 은행명 글자 그대로\",\"기업은행계좌번호\":\"기업은행 줄의 번호. 없으면 빈 문자열\"}`;\n\nconst KEPCO_PROMPT = `너는 한국전력공사(한전)가 발행하는 전기요금 청구서를 읽고, 회계 프로그램 \"거래처입력\" 양식에 넣을 값을 정확히 추출하는 전문 OCR 보정 엔진이다.\n\n이 문서는 한전 전기요금 청구서/영수증이다. 고지서 중앙에는 \"전기요금청구 및 영수증\" 박스가 있고, 그 안에 아래와 같은 정보가 있다.\n- 고객 번호 (예: 12 0691 7576)\n- 청구 금액 / 납기일\n- 사용 기간\n- \"고객전용지정계좌 (예금주: 한국전력공사)\" 표 — 우리은행, 신한은행, 국민은행, 농협(농 협으로 띄어 쓴 경우도 있음), 하나은행, 기업은행, 우체국, 전북은행, 광주은행 등 여러 은행의 가상계좌번호가 한 줄씩 나란히 적혀 있다.\n\n가장 중요한 규칙: 이 여러 은행 중에서 반드시 \"농협\" 줄(농협, 농협은행, NH농협 등으로 표기됨. \"농 협\"처럼 사이에 공백이 있어도 농협이다)에 적힌 가상계좌번호만 추출해라. 우리은행·신한은행·국민은행·하나은행·기업은행·우체국·전북은행·광주은행 번호는 다른 항목에도 절대 사용하지 마라.\n\n[기업은행과 농협을 혼동하지 마라] 표에서 농협 줄과 기업은행 줄은 바로 붙어 있어 자주 헷갈린다. 반드시 아래 순서로 읽어라.\n1) 표의 모든 은행 줄을 위에서 아래로(또는 왼쪽에서 오른쪽으로) 은행명과 계좌번호를 짝지어 먼저 훑는다.\n2) 은행명 글자가 \"기업\" 또는 \"IBK\"인 줄의 번호는 \"기업은행계좌번호\"에 따로 적는다. 이 번호는 절대 농협계좌번호가 될 수 없다.\n3) 은행명 글자가 \"농협\"(또는 \"농 협\", \"농협은행\", \"NH\")인 줄의 번호만 \"농협계좌번호\"에 적는다. \"농\" 글자가 직접 확인되지 않으면 농협계좌번호는 빈 문자열이다.\n4) 농협계좌번호와 기업은행계좌번호는 서로 다른 번호여야 정상이다. 같다면 둘 중 하나를 잘못 읽은 것이니 은행명을 다시 확인해라.\n계좌번호는 자기 은행명 바로 옆(같은 칸)에 붙어 있는 것이 그 은행의 번호다. 위·아래 이웃 줄의 번호를 가져오지 마라.\n\n문서 최상단에는 \"OO시청 귀하\" 또는 \"OO시장 귀하\"처럼 청구서를 받는 기관명이 적혀 있다(반송처 주소 아래, \"귀하\" 앞부분). 이 기관명도 함께 읽어라.\n\n아래 키를 모두 포함한 JSON 객체 하나만 출력해라. 다른 설명, 마크다운, 코드블록 표시(\\`\\`\\`json 등)는 절대 포함하지 마라.\n\n{\n  \"수신기관\": \"청구서 상단의 받는사람 기관명. '귀하' 바로 앞 글자만 (예: 익산시청, 익산시장, 전주시청). 못 찾으면 빈 문자열\",\n  \"고객번호\": \"청구서의 고객 번호. 원문 표기(띄어쓰기 포함) 그대로\",\n  \"은행별계좌\": [{\"은행\":\"표에 인쇄된 은행명 글자 그대로 (예: 농 협, 기업은행)\",\"계좌번호\":\"그 은행명 바로 옆 계좌번호, 하이픈 표기 원문 그대로\"}],\n  \"농협계좌번호\": \"고객전용지정계좌 표에서 '농협' 줄의 가상계좌번호만. 하이픈 표기 원문 그대로. 표에 농협 줄이 아예 없으면 빈 문자열\",\n  \"농협_은행표기\": \"농협계좌번호 바로 옆에 실제로 인쇄된 은행명 글자 그대로 (예: 농 협). 확인 못하면 빈 문자열\",\n  \"기업은행계좌번호\": \"표에서 '기업은행' 줄의 가상계좌번호. 하이픈 표기 원문 그대로. 기업은행 줄이 없으면 빈 문자열\",\n  \"농협계좌_자리별\": \"계좌번호를 한 자리씩 쉼표로 끊어 적어라 (예: 3,0,1,-,5,6,...). 5와 6은 모양을 확인하고 적어라\",\n  \"농협계좌_위치\": {\"x\":0.0,\"y\":0.0,\"w\":0.0,\"h\":0.0},\n  \"청구금액\": \"이번 달 청구금액(당월요금계 / 청구금액). 숫자만 입력, 콤마와 '원' 글자는 제거\",\n  \"사용기간\": \"사용기간 원문 그대로 (예: 2026년 06월 12일 ~ 2026년 07월 11일)\",\n  \"비고\": \"인식이 불확실한 항목, 농협 계좌를 못 찾은 경우, 이 문서가 한전 고지서가 아닌 경우 등을 짧게 메모. 문제 없으면 빈 문자열\"\n}\n\n규칙:\n- 확실하지 않으면 값을 지어내지 말고 빈 문자열로 두고 비고에 이유를 남겨라.\n- 계좌번호와 금액은 특히 정확하게, 숫자를 두 번 확인하는 마음으로 읽어라. 숫자 0과 O, 1과 7 등을 혼동하지 마라.\n- 특히 숫자 5와 6을 자주 틀린다. 5는 윗변이 가로로 평평하고 아래쪽 배가 열린 모양이고, 6은 왼쪽 위에서 굽어 내려와 아래쪽에 닫힌 동그라미(고리)가 있는 모양이다. 계좌번호는 한 자리씩 끊어서 읽고, 5와 6이 나오면 한 번 더 모양을 확인해라.\n- \"농협계좌_위치\"에는 전체 이미지 기준(왼쪽 위가 0,0, 오른쪽 아래가 1,1)으로 농협 줄의 계좌번호 글자가 차지하는 사각형을 x,y,w,h(0~1 비율)로 적어라. 위치를 모르면 모두 0으로 둬라.\n- 이 이미지는 여러 장을 스캔한 PDF의 한 페이지일 수 있다. 표지, 봉투, 안내문, 이용약관 등 청구서 본문이 아닌 페이지라면 모든 필드를 빈 문자열로 두고 비고에 \"고지서 본문 아님\"이라고 적어라.\n- [숫자 6과 8 구분] 6과 8을 자주 혼동한다. 8은 위·아래 두 개의 동그라미(고리)가 모두 완전히 닫혀 있고 가운데에서 잘록하게 만난다. 6은 아래쪽 고리만 닫혀 있고 위쪽은 오른쪽 위가 열린 채 굽어 내려오는 획이다. 0은 하나의 큰 타원이고, 3은 왼쪽이 열려 있다. 계좌번호의 6과 8은 위쪽 고리가 닫혀 있는지를 보고 한 자리씩 다시 확인해라. 5·6·8·0·3은 특히 두 번 확인해라.\n- \"은행별계좌\"에는 표에 보이는 모든 은행 줄(농협 포함, 기업은행 포함)을 은행명·계좌번호 쌍으로 빠짐없이 적어라. 프로그램이 이 목록에서 농협 줄만 골라 쓴다.\n- 출력은 반드시 위 키를 모두 포함한 JSON 객체 하나뿐이어야 한다.`;\n\nconst TELECOM_PROMPT = `너는 SK텔레콤(SK Telecom) 또는 KT(케이티)가 발행하는 통신요금 청구서를 읽고, 회계 프로그램 \"거래처입력\" 양식에 넣을 값을 정확히 추출하는 전문 OCR 보정 엔진이다.\n\n이 문서는 아래 두 가지 템플릿 중 하나다.\n1) SK Telecom 요금안내서: 상단에 파란색 \"T\" 로고와 \"SK telecom\" 글자가 있고, \"이번 달 납부하실 금액은 총 OOO원 입니다\"라는 문구가 있으며, 왼쪽 아래쪽 \"입금전용계좌\" 표에 농협/카카오뱅크/신한은행/국민은행 계좌번호가 순서대로 나열된다.\n2) KT 명세서: 상단에 빨간 \"KT\" 로고가 있고, \"O월 납부하실 금액은 OOO원 입니다\"라는 빨간 테두리 박스가 있으며, 왼쪽의 \"01 전용 입금계좌\" 표에 케이뱅크/농협은행/신한은행/국민은행/카카오뱅크 계좌번호가 순서대로 나열된다.\n\n각 문서에는 확대된 참고 이미지가 추가로 제공될 수 있다(\"SK 요금안내서인 경우\"/\"KT 명세서인 경우\"라고 이름이 붙어 있음). 실제 문서가 둘 중 어느 쪽인지 먼저 판단한 다음, 해당하는 확대 이미지만 참고해서 값을 읽고 관련 없는 쪽의 확대 이미지는 무시해라.\n\n가장 중요한 규칙: 계좌 목록 중 반드시 \"농협\" 또는 \"농협은행\"이라고 표기된 줄의 계좌번호만 추출해라. 케이뱅크·카카오뱅크·신한은행·국민은행·우리은행 계좌번호는 절대 다른 항목에 넣지 마라.\n\n아래 키를 모두 포함한 JSON 객체 하나만 출력해라. 다른 설명, 마크다운, 코드블록 표시(\\`\\`\\`json 등)는 절대 포함하지 마라.\n\n{\n  \"발행사\": \"이 문서가 SK Telecom 청구서면 \\\\\"SK\\\\\", KT 청구서면 \\\\\"KT\\\\\". 둘 다 아니거나 확실하지 않으면 빈 문자열\",\n  \"대표상품명\": \"대표상품명 또는 대표서비스명 원문 그대로 (예: 인터넷 에센스, 일반전화, IoT 55(원격관제기타), LTE 베이직 등). 못 찾으면 빈 문자열\",\n  \"은행별계좌\": [{\"은행\":\"표에 인쇄된 은행명 글자 그대로 (예: 농 협, 기업은행)\",\"계좌번호\":\"그 은행명 바로 옆 계좌번호, 하이픈 표기 원문 그대로\"}],\n  \"농협계좌번호\": \"위 규칙에 따라 찾은 농협 계좌번호만. 하이픈 표기 원문 그대로. 못 찾으면 빈 문자열\",\n  \"납부금액\": \"이번 달(해당월) 납부하실 금액. 숫자만, 콤마와 '원' 글자는 제거\",\n  \"이용기간\": \"이용기간 원문 그대로 (예: 6월 1일 ~ 6월 30일 또는 26.6.1.~26.6.30.)\",\n  \"명세서번호\": \"명세서번호 또는 청구서 고유 식별번호 원문 그대로. 못 찾으면 빈 문자열\",\n  \"비고\": \"인식이 불확실한 항목, 농협 계좌를 못 찾은 경우, 이 문서가 통신요금 청구서 요약면이 아닌 경우(예: 통합금액 상세내역·이용상세내역·할인상세내역·서비스별 이용량 표 같은 상세 페이지) 등을 짧게 메모. 문제 없으면 빈 문자열\"\n}\n\n규칙:\n- 확실하지 않으면 값을 지어내지 말고 빈 문자열로 두고 비고에 이유를 남겨라.\n- 계좌번호와 금액은 특히 정확하게, 숫자를 두 번 확인하는 마음으로 읽어라. 숫자 0과 O, 1과 7 등을 혼동하지 마라.\n- 이 이미지는 여러 장을 스캔한 PDF의 한 페이지일 수 있다. 계좌·금액 요약이 없는 상세 내역 페이지(통합금액 상세내역, 이용상세내역, 할인상세내역, 서비스별 지난달 이용량 표 등)라면 모든 필드를 빈 문자열로 두고 비고에 \"고지서 요약 페이지 아님(상세내역)\"이라고 적어라.\n- [숫자 6과 8 구분] 6과 8을 자주 혼동한다. 8은 위·아래 두 개의 동그라미(고리)가 모두 완전히 닫혀 있고 가운데에서 잘록하게 만난다. 6은 아래쪽 고리만 닫혀 있고 위쪽은 오른쪽 위가 열린 채 굽어 내려오는 획이다. 0은 하나의 큰 타원이고, 3은 왼쪽이 열려 있다. 계좌번호의 6과 8은 위쪽 고리가 닫혀 있는지를 보고 한 자리씩 다시 확인해라. 5·6·8·0·3은 특히 두 번 확인해라.\n- \"은행별계좌\"에는 표에 보이는 모든 은행 줄(농협 포함, 기업은행 포함)을 은행명·계좌번호 쌍으로 빠짐없이 적어라. 프로그램이 이 목록에서 농협 줄만 골라 쓴다.\n- 출력은 반드시 위 키를 모두 포함한 JSON 객체 하나뿐이어야 한다.`;\n\n// 통신사(발행사)별 고정 회계 정보 — 청구서에서 SK/KT를 판별하면 이 값으로 거래처명/사업자번호/예금주명을 채운다.\nconst TELECOM_ISSUER_INFO = {\n  SK: { name: \"SK\", bizno: \"104-81-37225\", holder: \"SKT 익산시청\" },\n  KT: { name: \"KT\", bizno: \"102-81-42945\", holder: \"익산시청(KT)\" }\n};\n\nconst BILL_TYPES = {\n  water: {\n    id: \"water\",\n    label: \"상하수도요금\",\n    tag: \"익산시\",\n    eyebrow: \"익산시 상·하수도 요금 고지서 인식 · AI OCR → 거래처입력 양식\",\n    title: \"상하수도요금 고지서 자동 인식기\",\n    subHtml: `익산시 상·하수도 요금 고지서 PDF/이미지를 올리면 각 장의 \u003cb>농협 가상계좌번호\u003c/b>와 \u003cb>총납부금액(합계)\u003c/b>을 읽어서\n      회계 프로그램 \"거래처입력\" 양식(은행코드 참고자료 포함 3개 시트 그대로)에 맞춰 표로 정리합니다.\u003cbr>\n      여러 장을 모은 PDF 하나를 올려도 페이지별로 자동 분리해서 각각 인식합니다. 표에서 값은 언제든 직접 수정할 수 있습니다.`,\n    accountNoticeHtml: `고지서마다 \u003cb>전북은행\u003c/b>과 \u003cb>농협\u003c/b> 가상계좌가 나란히 표시되는데, 이 도구는 그중 \u003cb>농협 계좌번호만\u003c/b> 자동으로 골라 추출하도록 설계되어 있습니다.`,\n    dropText: \"상하수도요금 고지서 이미지 또는 PDF를 끌어다 놓거나 클릭해서 선택하세요\",\n    dropSub: \"여러 장 모은 PDF는 페이지별로 자동 분리됩니다 · JPG, PNG, PDF\",\n    prompt: WATER_PROMPT,\n    // 실제 고지서 샘플로 좌표를 측정해서 캘리브레이션한 확대 영역.\n    // \"가상계좌[농협]\" 셀과 \"총납부금액\" 셀 위치는 익산시 상하수도 고지서 양식에서 고정되어 있다.\n    focusRegions: [\n      { x: 0,    y: 0.63, w: 0.68, h: 0.05, label: \"지로번호·가상계좌 표 (농협 계좌번호가 오른쪽 칸에 있음)\" },\n      { x: 0.62, y: 0.78, w: 0.38, h: 0.07, label: \"수납은행보관용 표의 총납부금액\" }\n    ],\n    defaults: {\n      name: \"상수도문화유산과\",\n      type: \"10:법인사업자\",\n      bizno: \"403-83-00013\",\n      paytype: \"10:계좌이체\",\n      bank: \"011:농협은행\",\n      holder: \"상수도문화유산과\",\n      deduct: \"0\",\n      repFlag: \"N\"\n    },\n    mapResult(row, result){\n      // 예금주명은 고지서에서 인식한 수용가명(성명)을 그대로 쓰되, e호조 10자 제한에 맞춰 자른다.\n      // 수용가명을 못 찾은 경우에만 기본값(\"상수도문화유산과\")을 유지한다.\n      const holderName = (result.수용가명 || \"\").toString().trim();\n      row.data.holder = clampHolder(holderName || row.data.holder);\n      row.data.account = (result.농협계좌번호 || \"\").toString().trim();\n      row.data.supply = (result.총납부금액 || \"\").toString().replace(/[^0-9.-]/g, \"\");\n      row.data.memo = result.사용기간 ? `상하수도요금(${result.사용기간})` : \"상하수도요금\";\n      const memoBits = [];\n      if (result.수전번호) memoBits.push(`수전번호 ${result.수전번호}`);\n      if (result.수용가명) memoBits.push(result.수용가명);\n      if (result.비고) memoBits.push(result.비고);\n      row.aiMemo = memoBits.join(\" · \");\n      return {\n        checks: [\n          { ok: !!row.data.account, msg: \"농협 가상계좌번호를 찾지 못했습니다. 표를 직접 확인해 입력하거나 재인식하세요.\" },\n          { ok: !!row.data.supply, msg: \"총납부금액을 찾지 못했습니다. 직접 입력하거나 재인식하세요.\" },\n          { ok: !!holderName, msg: \"수용가명(예금주명)을 찾지 못해 기본값을 사용했습니다. 표를 직접 확인해 입력하세요.\" }\n        ]\n      };\n    },\n    exportPrefix: \"거래처입력_상하수도요금\"\n  },\n  kepco: {\n    id: \"kepco\",\n    label: \"전기요금\",\n    tag: \"한전\",\n    eyebrow: \"한국전력공사 전기요금 고지서 인식 · AI OCR → 거래처입력 양식\",\n    title: \"전기요금 고지서 자동 인식기\",\n    subHtml: `한전 전기요금 청구서 PDF/이미지를 올리면 각 장의 \u003cb>농협 가상계좌번호\u003c/b>와 \u003cb>청구금액\u003c/b>을 읽어서\n      회계 프로그램 \"거래처입력\" 양식(은행코드 참고자료 포함 3개 시트 그대로)에 맞춰 표로 정리합니다.\u003cbr>\n      여러 장을 모은 PDF 하나를 올려도 페이지별로 자동 분리해서 각각 인식합니다. 표에서 값은 언제든 직접 수정할 수 있습니다.`,\n    accountNoticeHtml: `고지서마다 우리·신한·국민·농협·하나·기업·우체국·전북·광주은행 가상계좌가 나란히 표시되는데, 이 도구는 그중 \u003cb>농협 계좌번호만\u003c/b> 자동으로 골라 추출하도록 설계되어 있습니다.`,\n    dropText: \"전기요금 고지서 이미지 또는 PDF를 끌어다 놓거나 클릭해서 선택하세요\",\n    dropSub: \"여러 장 모은 PDF는 페이지별로 자동 분리됩니다 · JPG, PNG, PDF\",\n    prompt: KEPCO_PROMPT,\n    verifyAccount: true, // 농협 계좌번호를 확대 크롭으로 한 번 더 읽어 교차 검증\n    defaults: {\n      name: \"한국전력공사\",\n      type: \"10:법인사업자\",\n      bizno: \"4038202334\",\n      paytype: \"10:계좌이체\",\n      bank: \"011:농협은행\",\n      deduct: \"0\",\n      repFlag: \"N\"\n    },\n    mapResult(row, result){\n      // e호조(회계 시스템)는 예금주명을 기호 포함 최대 10자까지만 인식하므로,\n      // \"한전(기관명)\" 형태를 조합할 때 괄호가 잘리지 않도록 기관명 쪽을 먼저 줄인다.\n      row.data.holder = buildKepcoHolder(result.수신기관);\n      row.data.account = (result.농협계좌번호 || \"\").toString().trim();\n      // 기업은행 줄을 농협으로 잘못 읽은 경우 방어: 같은 번호이거나 은행표기에 '농'이 없으면 비운다\n      const dgt = v => (v || \"\").toString().replace(/\\D/g, \"\");\n      const ibkDigits = dgt(result.기업은행계좌번호);\n      const lbl = (result.농협_은행표기 || \"\").toString();\n      const mixedUp = !!row.data.account && (\n        (ibkDigits && dgt(row.data.account) === ibkDigits) ||\n        (lbl && !/농|NH/i.test(lbl)));\n      if (mixedUp) row.data.account = \"\";\n      row.data.supply = (result.청구금액 || \"\").toString().replace(/[^0-9.-]/g, \"\");\n      row.data.memo = result.사용기간 ? `전기요금(${result.사용기간})` : \"전기요금\";\n      const memoBits = [];\n      if (result.비고) memoBits.push(result.비고);\n      if (result.고객번호) memoBits.push(`고객번호 ${result.고객번호}`);\n      row.aiMemo = memoBits.join(\" · \");\n      return {\n        checks: [\n          { ok: !mixedUp, msg: \"기업은행 줄을 농협으로 잘못 읽은 것 같아 계좌번호를 비웠습니다. 고지서의 농협 줄을 직접 확인해 입력하거나 재인식하세요.\" },\n          { ok: !!row.data.account, msg: \"농협 가상계좌번호를 찾지 못했습니다. 표를 직접 확인해 입력하거나 재인식하세요.\" },\n          { ok: !!row.data.supply, msg: \"청구금액을 찾지 못했습니다. 직접 입력하거나 재인식하세요.\" }\n        ]\n      };\n    },\n    exportPrefix: \"거래처입력_전기요금\"\n  },\n  telecom: {\n    id: \"telecom\",\n    label: \"통신요금\",\n    tag: \"SK·KT\",\n    eyebrow: \"SK텔레콤 · KT 통신요금 고지서 인식 · AI OCR → 거래처입력 양식\",\n    title: \"통신요금 고지서 자동 인식기\",\n    subHtml: `SK Telecom 요금안내서와 KT 명세서를 모두 올릴 수 있습니다. 각 장의 \u003cb>발행사(SK/KT)\u003c/b>를 자동으로 구분해서\n      \u003cb>농협 계좌번호\u003c/b>와 \u003cb>이번 달 납부금액\u003c/b>을 읽어온 뒤, 회계 프로그램 \"거래처입력\" 양식(은행코드 참고자료 포함 3개 시트 그대로)에 맞춰 표로 정리합니다.\u003cbr>\n      여러 장을 모은 PDF 하나를 올려도 페이지별로 자동 분리해서 각각 인식합니다. 표에서 값은 언제든 직접 수정할 수 있습니다.`,\n    accountNoticeHtml: `고지서마다 케이뱅크·농협·신한·국민·카카오뱅크 등 여러 은행 계좌가 나란히 표시되는데, 이 도구는 그중 \u003cb>농협(농협은행) 계좌번호만\u003c/b> 자동으로 골라 추출하도록 설계되어 있습니다. 같은 배치 안에 SK 요금안내서와 KT 명세서가 섞여 있어도 각 장마다 자동으로 구분해서 처리합니다.`,\n    dropText: \"SK Telecom 요금안내서 또는 KT 명세서 이미지·PDF를 끌어다 놓거나 클릭해서 선택하세요\",\n    dropSub: \"여러 장 모은 PDF는 페이지별로 자동 분리됩니다 · JPG, PNG, PDF\",\n    prompt: TELECOM_PROMPT,\n    // SK와 KT는 계좌 표 위치가 서로 다르므로 두 템플릿의 영역을 모두 잘라서 함께 제공한다.\n    // AI가 실제 어느 쪽 문서인지 먼저 판단한 뒤 해당하는 확대 영역만 참고하도록 프롬프트에 안내되어 있다.\n    focusRegions: [\n      { x: 0,    y: 0.72, w: 0.30, h: 0.16, label: \"SK 요금안내서인 경우: 입금전용계좌 박스 (농협 줄 포함)\" },\n      { x: 0,    y: 0.44, w: 0.60, h: 0.10, label: \"SK 요금안내서인 경우: 이번 달 납부하실 금액 박스\" },\n      { x: 0,    y: 0.34, w: 0.30, h: 0.16, label: \"KT 명세서인 경우: 전용 입금계좌 박스 (농협은행 줄 포함)\" },\n      { x: 0.25, y: 0.30, w: 0.75, h: 0.16, label: \"KT 명세서인 경우: 이번 달 납부하실 금액 박스\" }\n    ],\n    defaults: {\n      // 거래처명·사업자번호·예금주명은 SK/KT 판별 결과에 따라 mapResult에서 동적으로 채운다.\n      type: \"10:법인사업자\",\n      paytype: \"10:계좌이체\",\n      bank: \"011:농협은행\",\n      deduct: \"0\",\n      repFlag: \"N\"\n    },\n    mapResult(row, result){\n      const issuerRaw = (result.발행사 || \"\").toString().trim().toUpperCase();\n      const issuerKey = TELECOM_ISSUER_INFO[issuerRaw]\n        ? issuerRaw\n        : (issuerRaw.includes(\"SK\") ? \"SK\" : (issuerRaw.includes(\"KT\") ? \"KT\" : \"\"));\n      const info = TELECOM_ISSUER_INFO[issuerKey] || null;\n      if (info){\n        row.data.name = info.name;\n        row.data.bizno = info.bizno;\n        row.data.holder = info.holder;\n      }\n      row.data.account = (result.농협계좌번호 || \"\").toString().trim();\n      row.data.supply = (result.납부금액 || \"\").toString().replace(/[^0-9.-]/g, \"\");\n      const productBit = result.대표상품명 || \"\";\n      const periodBit = result.이용기간 || \"\";\n      row.data.memo = productBit || periodBit\n        ? `통신요금(${[productBit, periodBit].filter(Boolean).join(\" · \")})`\n        : \"통신요금\";\n      const memoBits = [];\n      if (result.명세서번호) memoBits.push(`명세서번호 ${result.명세서번호}`);\n      if (result.비고) memoBits.push(result.비고);\n      row.aiMemo = memoBits.join(\" · \");\n      return {\n        checks: [\n          { ok: !!info, msg: \"발행사(SK/KT)를 판별하지 못했습니다. 거래처명·사업자번호·예금주명을 직접 확인해 입력하세요.\" },\n          { ok: !!row.data.account, msg: \"농협 계좌번호를 찾지 못했습니다. 표를 직접 확인해 입력하거나 재인식하세요.\" },\n          { ok: !!row.data.supply, msg: \"납부금액을 찾지 못했습니다. 직접 입력하거나 재인식하세요.\" }\n        ]\n      };\n    },\n    exportPrefix: \"거래처입력_통신요금\"\n  }\n};\nconst TYPE_ORDER = [\"water\", \"kepco\", \"telecom\"];\n\n// ===================== 상태 =====================\nlet rows = [];\nlet idSeq = 0;\nlet currentTypeId = \"water\";\nfunction currentType(){ return BILL_TYPES[currentTypeId]; }\n\nconst $ = (sel) => document.querySelector(sel);\n\nwindow.addEventListener(\"error\", (e) => {\n  showFatalError(`스크립트 오류: ${e.message}`);\n});\nwindow.addEventListener(\"unhandledrejection\", (e) => {\n  showFatalError(`처리 중 오류: ${e.reason && e.reason.message ? e.reason.message : e.reason}`);\n});\nfunction showFatalError(msg){\n  let el = document.getElementById(\"fatalError\");\n  if (!el){\n    el = document.createElement(\"div\");\n    el.id = \"fatalError\";\n    el.style.cssText = \"position:sticky;top:0;z-index:50;background:#F5E2DB;color:#B5482F;border:1px solid #B5482F;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:600;white-space:pre-wrap;\";\n    document.querySelector(\".page\").prepend(el);\n  }\n  el.textContent = \"⚠ \" + msg;\n}\nconst dropzone = $(\"#dropzone\");\nconst fileInput = $(\"#fileInput\");\nconst scantrack = $(\"#scantrack\");\nconst toolbar = $(\"#toolbar\");\nconst tablewrap = $(\"#tablewrap\");\nconst emptyState = $(\"#emptyState\");\nconst headRow = $(\"#headRow\");\nconst bodyRows = $(\"#bodyRows\");\nconst statsEl = $(\"#stats\");\nconst providerSel = $(\"#provider\");\nconst geminiModelWrap = $(\"#geminiModelWrap\");\nconst geminiModelSelect = $(\"#geminiModel\");\nconst pacingInput = $(\"#pacing\");\nconst tokenSaverCheckbox = $(\"#tokenSaver\");\nconst useCropsCheckbox = $(\"#useCrops\");\nlet pacingTouchedByUser = false;\nlet tokenSaverTouchedByUser = false;\nlet cropsTouchedByUser = false;\npacingInput.addEventListener(\"input\", () => { pacingTouchedByUser = true; });\ntokenSaverCheckbox.addEventListener(\"change\", () => {\n  tokenSaverTouchedByUser = true;\n  // 절약모드를 켜면 확대 크롭도 기본적으로 끄고(비용 최소화), 끄면 다시 켜서 정확도를 우선한다.\n  // 단, 사용자가 \"정밀 확대 인식\"을 직접 건드린 적이 있으면 그 선택을 존중한다.\n  if (!cropsTouchedByUser) useCropsCheckbox.checked = !tokenSaverCheckbox.checked;\n});\nuseCropsCheckbox.addEventListener(\"change\", () => { cropsTouchedByUser = true; });\nconst lightbox = $(\"#lightbox\");\nconst lightboxImg = $(\"#lightboxImg\");\nconst typeTabs = $(\"#typeTabs\");\n\nfunction syncProviderUI(){\n  geminiModelWrap.style.display = providerSel.value === \"gemini\" ? \"inline-flex\" : \"none\";\n  const isGemini = providerSel.value === \"gemini\";\n\n  // 공급자별로 무료/기본 등급에서 안전한 요청 간격을 추천값으로 채워준다.\n  // Gemini는 모델에 따라서도 무료 한도(RPM)가 달라서 모델까지 반영한다.\n  // 사용자가 직접 값을 건드린 적이 있으면 자동으로 덮어쓰지 않는다.\n  if (!pacingTouchedByUser){\n    if (isGemini){\n      pacingInput.value = geminiModelSelect.value.includes(\"flash-lite\") ? \"4.5\" : \"7\";\n    } else {\n      pacingInput.value = \"1\";\n    }\n  }\n  // 토큰 절약 모드는 Gemini를 쓸 때만 의미가 있으므로 Gemini 선택 시 기본 ON, Claude는 기본 OFF.\n  if (!tokenSaverTouchedByUser){\n    tokenSaverCheckbox.checked = isGemini;\n    if (!cropsTouchedByUser) useCropsCheckbox.checked = !tokenSaverCheckbox.checked;\n  }\n}\nproviderSel.addEventListener(\"change\", syncProviderUI);\ngeminiModelSelect.addEventListener(\"change\", syncProviderUI);\nsyncProviderUI();\n\nlightbox.addEventListener(\"click\", () => { lightbox.style.display = \"none\"; });\n\n// ---- 고지서 종류 탭 ----\n// 종류별 세그먼트 컨트롤에 쓰는 간단한 모노라인 아이콘 (물방울 / 번개 / 신호 막대)\nconst TYPE_ICONS = {\n  water: `\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 2c-4 4.6-7 8.4-7 12a7 7 0 0 0 14 0c0-3.6-3-7.4-7-12z\"/>\u003c/svg>`,\n  kepco: `\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M13 2 4 14h7l-1 8 10-12h-7l1-8z\"/>\u003c/svg>`,\n  telecom: `\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M2 12h2M6 9v6M10 6v12M14 3v18M18 9v6M22 12h-2\"/>\u003c/svg>`\n};\n\nfunction buildTypeTabs(){\n  typeTabs.innerHTML = TYPE_ORDER.map(id => {\n    const t = BILL_TYPES[id];\n    return `\u003cbutton type=\"button\" class=\"typebtn${id===currentTypeId?\" active\":\"\"}\" data-type=\"${id}\">\n      ${TYPE_ICONS[id] || \"\"}${t.label}\u003cspan class=\"tag\">${t.tag}\u003c/span>\n    \u003c/button>`;\n  }).join(\"\");\n}\nfunction applyTypeUI(){\n  const t = currentType();\n  $(\"#eyebrowText\").textContent = t.eyebrow;\n  $(\"#titleText\").textContent = t.title;\n  $(\"#subText\").innerHTML = t.subHtml;\n  const zoomNote = (t.focusRegions && t.focusRegions.length)\n    ? ` 이 종류는 인식할 때 \u003cb>계좌·금액 부분을 자동으로 잘라 확대한 이미지\u003c/b>를 함께 분석에 사용해서 작은 숫자도 더 정확히 읽도록 되어 있습니다.`\n    : \"\";\n  $(\"#accountNotice\").innerHTML = t.accountNoticeHtml + zoomNote;\n  $(\"#dropText\").textContent = t.dropText;\n  $(\"#dropSub\").textContent = t.dropSub;\n  document.title = `${t.title} → 거래처입력 양식`;\n  buildTypeTabs();\n}\ntypeTabs.addEventListener(\"click\", (e) => {\n  const btn = e.target.closest(\"button[data-type]\");\n  if (!btn) return;\n  const newType = btn.dataset.type;\n  if (newType === currentTypeId) return;\n  if (rows.length > 0){\n    const ok = window.confirm(\"문서 종류를 바꾸면 지금까지 인식한 표 내용이 모두 지워집니다. 계속할까요?\");\n    if (!ok) return;\n  }\n  currentTypeId = newType;\n  rows = [];\n  applyTypeUI();\n  render();\n});\n\n// ---- 헤더 렌더 ----\nfunction buildHeader(){\n  let html = `\u003cth style=\"width:44px\">미리보기\u003c/th>\u003cth style=\"width:64px\">상태\u003c/th>`;\n  FIELD_KEYS.forEach((k,i)=>{\n    html += `\u003cth style=\"width:${FIELD_WIDTH[k]}px\">${HEADERS[i].split(\"\\n\")[0]}\u003c/th>`;\n  });\n  html += `\u003cth style=\"width:190px\">AI 비고 (검토용)\u003c/th>\u003cth style=\"width:56px\">\u003c/th>`;\n  headRow.innerHTML = html;\n}\nbuildHeader();\napplyTypeUI();\n\n// ---- 드롭존 ----\n[\"dragover\"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add(\"active\"); scantrack.innerHTML = '\u003cdiv class=\"scanline\">\u003c/div>'; }));\n[\"dragleave\",\"drop\"].forEach(ev => dropzone.addEventListener(ev, () => { dropzone.classList.remove(\"active\"); scantrack.innerHTML = \"\"; }));\ndropzone.addEventListener(\"drop\", e => { e.preventDefault(); addFiles(e.dataTransfer.files); });\ndropzone.addEventListener(\"click\", () => fileInput.click());\nfileInput.addEventListener(\"change\", e => { addFiles(e.target.files); e.target.value = \"\"; });\n\nconst pdfStatusEl = $(\"#pdfStatus\");\n\nfunction addFiles(fileList){\n  const files = Array.from(fileList);\n  const images = files.filter(f => f.type.startsWith(\"image/\"));\n  const pdfs = files.filter(f => f.type === \"application/pdf\" || f.name.toLowerCase().endsWith(\".pdf\"));\n\n  images.forEach(file => {\n    idSeq += 1;\n    rows.push({\n      id: idSeq,\n      fileName: file.name,\n      kind: \"image\",\n      file,\n      thumb: URL.createObjectURL(file),\n      status: \"대기\",\n      error: \"\",\n      data: defaultRowData(),\n      aiMemo: \"\"\n    });\n  });\n  if (images.length) render();\n\n  pdfs.forEach(file => addPdfFile(file));\n}\n\n// 스캔본 화질을 조금 더 높여 계좌번호·금액 같은 작은 숫자의 인식률을 올린다.\nfunction canvasToResizedBase64(canvas, maxDim = 1600, quality = 0.90){\n  let { width, height } = canvas;\n  let src = canvas;\n  if (width > maxDim || height > maxDim){\n    const scale = maxDim / Math.max(width, height);\n    const w2 = Math.round(width * scale), h2 = Math.round(height * scale);\n    const c2 = document.createElement(\"canvas\");\n    c2.width = w2; c2.height = h2;\n    c2.getContext(\"2d\").drawImage(canvas, 0, 0, w2, h2);\n    src = c2;\n  }\n  return src.toDataURL(\"image/jpeg\", quality).split(\",\")[1];\n}\n\nasync function addPdfFile(file){\n  if (typeof pdfjsLib === \"undefined\"){\n    pdfStatusEl.style.display = \"block\";\n    pdfStatusEl.textContent = `PDF 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요. (${file.name})`;\n    return;\n  }\n  if (!pdfjsLib.GlobalWorkerOptions.workerSrc){\n    pdfjsLib.GlobalWorkerOptions.workerSrc = \"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js\";\n  }\n  pdfStatusEl.style.display = \"block\";\n  pdfStatusEl.textContent = `${file.name} 페이지 분리 중…`;\n  try {\n    const buf = await file.arrayBuffer();\n    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;\n    for (let p = 1; p \u003c= pdf.numPages; p++){\n      pdfStatusEl.textContent = `${file.name} — ${p}/${pdf.numPages}쪽 변환 중…`;\n      const page = await pdf.getPage(p);\n      const viewport = page.getViewport({ scale: 2.5 });\n      const canvas = document.createElement(\"canvas\");\n      canvas.width = viewport.width; canvas.height = viewport.height;\n      await page.render({ canvasContext: canvas.getContext(\"2d\"), viewport }).promise;\n      const base64 = canvasToResizedBase64(canvas, 1600, 0.90);\n      const hiBase64 = canvasToResizedBase64(canvas, 3200, 0.92); // 계좌 재확인용 고해상도\n      idSeq += 1;\n      rows.push({\n        id: idSeq,\n        fileName: `${file.name} (${p}/${pdf.numPages}쪽)`,\n        kind: \"pdfpage\",\n        base64,\n        hiBase64,\n        thumb: canvas.toDataURL(\"image/jpeg\", 0.6),\n        status: \"대기\",\n        error: \"\",\n        data: defaultRowData(),\n        aiMemo: \"\"\n      });\n      render();\n    }\n  } catch (err){\n    pdfStatusEl.textContent = `${file.name} 처리 실패: ${err.message}`;\n    return;\n  }\n  pdfStatusEl.style.display = \"none\";\n}\n\nfunct
